<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование Aerolink API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        h2 { color: #a855f7; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #a855f7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 20px;
        }
        button:hover { background-color: #9333ea; }
        #response {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            min-height: 100px;
            margin-top: 15px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h2>Тест Aerolink API (Direct Call)</h2>

    <label for="apiKey">API Key Aerolink:</label>
    <input type="password" id="apiKey" placeholder="Вставьте ваш ключ (aero_...)">

    <label for="prompt">Ваш запрос (Prompt):</label>
    <textarea id="prompt" rows="4" placeholder="Напиши короткое приветствие и стих"></textarea>

    <button onclick="sendApiRequest()">Отправить запрос</button>

    <h3>Ответ от модели:</h3>
    <div id="response">Результат появится здесь...</div>

    <script>
        async function sendApiRequest() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const responseDiv = document.getElementById('response');

            if (!apiKey || !prompt) {
                alert('Пожалуйста, укажите API Key и введите запрос.');
                return;
            }

            responseDiv.innerText = 'Загрузка ответа от API...';

            try {
                // Использование OpenAI-совместимого эндпоинта Aerolink
                const response = await fetch('https://api.aerolink.lat/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'claude-3-5-sonnet-20241022',
                        messages: [
                            { role: 'user', content: prompt }
                        ]
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    responseDiv.innerText = data.choices[0].message.content;
                } else {
                    responseDiv.innerText = 'Ошибка API: ' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                responseDiv.innerText = 'Ошибка выполнения запроса: ' + error.message;
            }
        }
    </script>

</body>
</html>
