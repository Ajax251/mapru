    .custom-context-menu {

<script>
/* ==========================================================================
   1. СИСТЕМЫ КООРДИНАТ И ГЛОБАЛЬНОЕ СОСТОЯНИЕ
   ========================================================================== */
proj4.defs("EPSG:3857", "+proj=merc +a=6378137 +b=6378137 +lat_ts=0.0 +lon_0=0.0 +x_0=0.0 +y_0=0 +k=1.0 +units=m +nadgrids=@null +wktext +no_defs");
proj4.defs("EPSG:4326", "+proj=longlat +datum=WGS84 +no_defs");

let map;
let mapObjects = [];
let currentDisplayMode = 'simplified'; // 'simplified' или 'original'
let globalAbortController = null;
let currentSingleExportRecord = null;
let CadastralLabelLayout;

// Калибровка смещения Яндекс Карт относительно кадастра Росреестра
const mapOffsetX = -4.5;
const mapOffsetY = -1;

const PASTEL_PALETTE = [
    '#f4a261', '#e76f51', '#2a9d8f', '#e9c46a', '#a8dadc', 
    '#457b9d', '#b5838d', '#6d6875', '#84a59d', '#f28482',
    '#9b5de5', '#00bbf9', '#00f5d4', '#fee440', '#f15bb5'
];

function getRandomColor() {
    return PASTEL_PALETTE[Math.floor(Math.random() * PASTEL_PALETTE.length)];
}

/* ==========================================================================
   2. INDEXEDDB
   ========================================================================== */
const DB_NAME = 'SettlementsMunicipalDB';
const DB_VERSION = 1;
const STORE_NAME = 'regions';

function openDatabase() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
    });
}

async function dbSave(record) {
    const db = await openDatabase();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(record);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
    });
}

async function dbGetAll() {
    const db = await openDatabase();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
    });
}

async function dbDelete(id) {
    const db = await openDatabase();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
    });
}

async function dbClear() {
    const db = await openDatabase();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
    });
}

/* ==========================================================================
   3. АЛГОРИТМ УПРОЩЕНИЯ ДУГЛАСА — ПЕКЕРА
   ========================================================================== */
function simplifyPolygonRing(points, toleranceMeters = 20) {
    if (!points || points.length <= 4) return points;

    const refLat = points[0][0] * (Math.PI / 180);
    const kx = 111320 * Math.cos(refLat);
    const ky = 111320;

    function getSqSegDistMeters(p, p1, p2) {
        const x1 = p1[1] * kx, y1 = p1[0] * ky;
        const x2 = p2[1] * kx, y2 = p2[0] * ky;
        const px = p[1] * kx, py = p[0] * ky;

        let dx = x2 - x1, dy = y2 - y1;
        let nx = x1, ny = y1;
        if (dx !== 0 || dy !== 0) {
            const t = ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy);
            if (t > 1) { nx = x2; ny = y2; }
            else if (t > 0) { nx += dx * t; ny += dy * t; }
        }
        const distDx = px - nx, distDy = py - ny;
        return distDx * distDx + distDy * distDy;
    }

    function dpStep(first, last, sqTol, simplified) {
        let maxSqDist = sqTol;
        let index = -1;
        for (let i = first + 1; i < last; i++) {
            const sqDist = getSqSegDistMeters(points[i], points[first], points[last]);
            if (sqDist > maxSqDist) {
                index = i;
                maxSqDist = sqDist;
            }
        }
        if (index !== -1) {
            if (index - first > 1) dpStep(first, index, sqTol, simplified);
            simplified.push(points[index]);
            if (last - index > 1) dpStep(index, last, sqTol, simplified);
        }
    }

    const sqTolerance = toleranceMeters * toleranceMeters;
    const isClosed = (points[0][0] === points[points.length - 1][0] && points[0][1] === points[points.length - 1][1]);

    if (isClosed) {
        let maxDist = 0;
        let splitIdx = Math.floor(points.length / 2);
        for (let i = 1; i < points.length - 1; i++) {
            const d = getSqSegDistMeters(points[i], points[0], points[0]);
            if (d > maxDist) {
                maxDist = d;
                splitIdx = i;
            }
        }

        const arc1 = [points[0]];
        dpStep(0, splitIdx, sqTolerance, arc1);
        arc1.push(points[splitIdx]);

        const arc2 = [];
        dpStep(splitIdx, points.length - 1, sqTolerance, arc2);
        arc2.push(points[points.length - 1]);

        const result = arc1.concat(arc2);
        return result.length >= 4 ? result : points;
    } else {
        const simplified = [points[0]];
        dpStep(0, points.length - 1, sqTolerance, simplified);
        simplified.push(points[points.length - 1]);
        return simplified.length >= 4 ? simplified : points;
    }
}

function simplifyGeometryData(geomType, coordinates, toleranceMeters) {
    if (geomType === "Polygon") {
        return coordinates.map(ring => simplifyPolygonRing(ring, toleranceMeters));
    } else if (geomType === "MultiPolygon") {
        return coordinates.map(polygon => polygon.map(ring => simplifyPolygonRing(ring, toleranceMeters)));
    }
    return coordinates;
}

function countVerticesInGeometry(geomType, coordinates) {
    let count = 0;
    if (geomType === "Polygon") {
        coordinates.forEach(ring => { count += (ring ? ring.length : 0); });
    } else if (geomType === "MultiPolygon") {
        coordinates.forEach(polygon => {
            polygon.forEach(ring => { count += (ring ? ring.length : 0); });
        });
    }
    return count;
}

/* ==========================================================================
   4. ЗАПРОС К НСПД И ПАРСИНГ
   ========================================================================== */
const MAPRU_NSPD_PROXY = 'https://mapruapp.ru/api/sync';

function toEPSG3857(latitude, longitude) {
    const RADIUS = 6378137;
    const x = RADIUS * longitude * Math.PI / 180;
    const y = RADIUS * Math.log(Math.tan(Math.PI / 4 + latitude * Math.PI / 360));
    return { x: x, y: y };
}

async function queryNspdLayer(lat, lon, layerId, signal) {
    const centerPoint = toEPSG3857(lat, lon);
    const bboxSize = 0.15;
    const bbox = `${centerPoint.x - bboxSize / 2},${centerPoint.y - bboxSize / 2},${centerPoint.x + bboxSize / 2},${centerPoint.y + bboxSize / 2}`;
    const path = `/api/aeggis/v3/${layerId}/wms?REQUEST=GetFeatureInfo&QUERY_LAYERS=${layerId}&SERVICE=WMS&VERSION=1.3.0&FORMAT=image%2Fpng&STYLES=&TRANSPARENT=true&LAYERS=${layerId}&RANDOM=${Math.random()}&INFO_FORMAT=application%2Fjson&FEATURE_COUNT=10&I=256&J=256&WIDTH=512&HEIGHT=512&CRS=EPSG%3A3857&BBOX=${bbox}`;

    const proxyUrl = `${MAPRU_NSPD_PROXY}${path}`;
    const headers = new Headers();
    headers.set('x-sync-host', 'https://nspd.gov.ru');

    const res = await fetch(proxyUrl, { headers, signal });
    if (!res.ok) throw new Error(`HTTP error ${res.status}`);
    return await res.json();
}

function parseFeatureCoordinates(feature) {
    if (!feature || !feature.geometry) return null;
    const geomType = feature.geometry.type;
    const coords = feature.geometry.coordinates;

    function convertPoint(pt) {
        try {
            const p = proj4('EPSG:3857', 'EPSG:4326', pt);
            return [p[1] - mapOffsetY * 0.000008983, p[0] - mapOffsetX * 0.000008983];
        } catch (e) { return null; }
    }

    if (geomType === "Polygon") {
        const polygonRings = [];
        coords.forEach(ring => {
            const wgsRing = ring.map(convertPoint).filter(Boolean);
            if (wgsRing.length >= 3) polygonRings.push(wgsRing);
        });
        return { geomType: "Polygon", coordinates: polygonRings };
    } else if (geomType === "MultiPolygon") {
        const multiPolygons = [];
        coords.forEach(polygon => {
            const polyRings = [];
            polygon.forEach(ring => {
                const wgsRing = ring.map(convertPoint).filter(Boolean);
                if (wgsRing.length >= 3) polyRings.push(wgsRing);
            });
            if (polyRings.length > 0) multiPolygons.push(polyRings);
        });
        return { geomType: "MultiPolygon", coordinates: multiPolygons };
    }

    return null;
}

/* ==========================================================================
   5. ОБРАБОТКА И СОХРАНЕНИЕ ОБЪЕКТА В БД
   ========================================================================== */
async function handleSaveLayer(lat, lon, layerId, layerTitle) {
    if (globalAbortController) globalAbortController.abort();
    globalAbortController = new AbortController();
    const { signal } = globalAbortController;

    try {
        showLoader(`Запрос ${layerTitle} из НСПД...`);
        const data = await queryNspdLayer(lat, lon, layerId, signal);

        if (!data || !data.features || data.features.length === 0) {
            showNotification(`${layerTitle} в данной точке не найден`, 'warning');
            return;
        }

        const feature = data.features[0];
        const parsed = parseFeatureCoordinates(feature);
        if (!parsed) {
            showNotification('Не удалось прочитать геометрию объекта', 'error');
            return;
        }

        let name = feature.properties?.options?.name || 
                   feature.properties?.options?.name_by_doc || 
                   feature.properties?.name_by_doc || 
                   feature.properties?.label || 
                   feature.properties?.name || 
                   feature.properties?.descr || 'Без названия';
        
        const typeName = feature.properties?.type_name || feature.properties?.type || '';
        const fullName = `${typeName} ${name}`.trim();

        const toleranceMeters = parseInt(document.getElementById('tolerance-slider').value, 10) || 20;

        showLoader(`Упрощение геометрии...`);
        const origCount = countVerticesInGeometry(parsed.geomType, parsed.coordinates);
        const simplifiedCoordinates = simplifyGeometryData(parsed.geomType, parsed.coordinates, toleranceMeters);
        const simpCount = countVerticesInGeometry(parsed.geomType, simplifiedCoordinates);
        const savingsPercent = origCount > 0 ? Math.round((1 - (simpCount / origCount)) * 100) : 0;

        const objectId = feature.id ? `nspd_${feature.id}` : `obj_${Date.now()}`;
        const record = {
            id: objectId,
            name: fullName,
            typeName: typeName,
            layerId: layerId,
            layerTitle: layerTitle,
            color: getRandomColor(),
            geometryType: parsed.geomType,
            rawCoordinates: parsed.coordinates,
            simplifiedCoordinates: simplifiedCoordinates,
            origCount: origCount,
            simpCount: simpCount,
            savingsPercent: savingsPercent,
            toleranceMeters: toleranceMeters,
            properties: feature.properties || {},
            createdAt: new Date().toISOString()
        };

        await dbSave(record);
        await updateBadge();

        // Отрисовываем объект с центровкой только при первичном добавлении
        renderRecord(record, currentDisplayMode, true);
        showNotification(`Сохранено: ${fullName} (${origCount} ➔ ${simpCount} точек, -${savingsPercent}%)`, 'success');

    } catch (err) {
        if (err.name === 'AbortError') return;
        console.error(err);
        showNotification('Ошибка при сохранении объекта', 'error');
    } finally {
        hideLoader();
    }
}

/* ==========================================================================
   6. ОТРИСОВКА В КАРТЕ
   ========================================================================== */
function renderRecord(record, mode = 'simplified', shouldZoom = false) {
    const coordsToDraw = (mode === 'original') ? record.rawCoordinates : record.simplifiedCoordinates;
    if (!coordsToDraw || coordsToDraw.length === 0) return;

    const baseColor = record.color || '#3b82f6';
    const strokeWidth = (mode === 'original') ? 2 : 2.5;

    const polyOptions = {
        strokeColor: baseColor,
        strokeWidth: strokeWidth,
        fillColor: `${baseColor}44`,
        strokeOpacity: 0.9,
        zIndex: 250
    };

    const hint = `<b>${record.name}</b><br>Режим: <b>${mode === 'original' ? 'Исходный' : 'Упрощенный'}</b><br>Точек: ${mode === 'original' ? record.origCount : record.simpCount}`;

    let mapItem;

    if (record.geometryType === "MultiPolygon") {
        const collection = new ymaps.GeoObjectCollection({}, polyOptions);
        coordsToDraw.forEach(polygonRings => {
            const p = new ymaps.Polygon(polygonRings, { hintContent: hint, recordId: record.id }, polyOptions);
            attachPolygonEvents(p, record, collection);
            collection.add(p);
        });
        mapItem = collection;
    } else {
        const p = new ymaps.Polygon(coordsToDraw, { hintContent: hint, recordId: record.id }, polyOptions);
        attachPolygonEvents(p, record, p);
        mapItem = p;
    }

    map.geoObjects.add(mapItem);
    mapObjects.push(mapItem);

    // Добавляем центральную подпись (видна начиная с зума 11)
    const bounds = mapItem.getBounds ? mapItem.getBounds() : (mapItem.geometry ? mapItem.geometry.getBounds() : null);
    if (bounds) {
        const centerLat = (bounds[0][0] + bounds[1][0]) / 2;
        const centerLon = (bounds[0][1] + bounds[1][1]) / 2;
        const label = new ymaps.Placemark([centerLat, centerLon], {
            iconContent: record.name,
            zoomFontSize: 11
        }, {
            iconLayout: CadastralLabelLayout,
            visible: map.getZoom() >= 11,
            zIndex: 260
        });
        map.geoObjects.add(label);
        mapObjects.push(label);

        if (shouldZoom) {
            map.setBounds(bounds, { checkZoomRange: true, duration: 300 });
        }
    }
}

function attachPolygonEvents(polygonInstance, record, parentContainer) {
    polygonInstance.events.add('click', function (e) {
        highlightMapObject(parentContainer, record.color);

        map.balloon.open(e.get('coords'), `
            <div style="font-size:13px; line-height:1.5;">
                <b style="font-size:15px; color:#0f172a;">${record.name}</b><br>
                Тип: <i>${record.layerTitle || 'НП/МО'}</i><br>
                Оригинал: <b>${record.origCount.toLocaleString()}</b> точек<br>
                Упрощенный: <b>${record.simpCount.toLocaleString()}</b> точек (<b>-${record.savingsPercent}%</b>)<br>
                <div style="margin-top:8px; display:flex; gap:6px;">
                    <button onclick="quickExportSingle('${record.id}')" style="background:#10b981; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">
                        <i class="fas fa-download"></i> Скачать JSON
                    </button>
                </div>
            </div>
        `);
    });
}

function highlightMapObject(container, originalColor) {
    function applyStyle(target, strokeColor, strokeWidth, fillColor) {
        if (target.options) {
            target.options.set({ strokeColor, strokeWidth, fillColor });
        }
    }

    if (container.each) {
        container.each(child => applyStyle(child, '#FFE600', 4, `${originalColor}66`));
    } else {
        applyStyle(container, '#FFE600', 4, `${originalColor}66`);
    }
}

/**
 * Отрисовывает все объекты из БД
 * @param {boolean} preserveViewport - если true, центр и зум карты НЕ МЕНЯЮТСЯ!
 */
async function renderAllFromDatabase(preserveViewport = false) {
    clearMap();
    showLoader("Загрузка объектов...");
    try {
        const items = await dbGetAll();
        if (items.length === 0) {
            showNotification('В локальной базе пока нет сохраненных объектов', 'info');
            return;
        }

        let overallBounds = null;
        items.forEach(record => {
            renderRecord(record, currentDisplayMode, false);
        });

        // МЕНЯЕМ ЗУМ ТОЛЬКО ЕСЛИ ЭТО ЯВНОЕ НАЖАТИЕ КНОПКИ «ПОКАЗАТЬ ВСЕ»
        if (!preserveViewport) {
            items.forEach(record => {
                const coords = (currentDisplayMode === 'original' ? record.rawCoordinates : record.simplifiedCoordinates);
                const flatRing = (record.geometryType === "MultiPolygon") ? coords[0][0] : coords[0];
                if (flatRing) {
                    flatRing.forEach(pt => {
                        if (!overallBounds) {
                            overallBounds = [[pt[0], pt[1]], [pt[0], pt[1]]];
                        } else {
                            overallBounds[0][0] = Math.min(overallBounds[0][0], pt[0]);
                            overallBounds[0][1] = Math.min(overallBounds[0][1], pt[1]);
                            overallBounds[1][0] = Math.max(overallBounds[1][0], pt[0]);
                            overallBounds[1][1] = Math.max(overallBounds[1][1], pt[1]);
                        }
                    });
                }
            });

            if (overallBounds) {
                map.setBounds(overallBounds, { checkZoomRange: true, duration: 350 });
            }
        }

        showNotification(`Режим: ${currentDisplayMode === 'original' ? 'Исходный (полный)' : 'Упрощенный'}`, 'success');
    } catch (e) {
        console.error(e);
        showNotification('Ошибка отрисовки объектов', 'error');
    } finally {
        hideLoader();
    }
}

async function updateBadge() {
    const items = await dbGetAll();
    const badge = document.getElementById('db-count-badge');
    if (badge) badge.textContent = items.length;
}

async function exportFullDb() {
    const items = await dbGetAll();
    if (items.length === 0) {
        showNotification('База пуста, нечего экспортировать', 'warning');
        return;
    }

    const payload = {
        exportedAt: new Date().toISOString(),
        format: "NspdSettlementsFullExport",
        version: "2.0",
        count: items.length,
        features: items
    };

    downloadJsonFile(payload, `settlements_db_all_${new Date().toISOString().slice(0, 10)}.json`);
    showNotification('Вся база данных экспортирована в JSON', 'success');
}

async function importFullDb(file) {
    try {
        showLoader("Импорт базы данных...");
        const text = await file.text();
        const json = JSON.parse(text);
        const list = json.features || (Array.isArray(json) ? json : []);

        for (const item of list) {
            if (item.id && (item.rawCoordinates || item.simplifiedCoordinates)) {
                await dbSave(item);
            }
        }

        await updateBadge();
        hideLoader();
        openDbModal();
        showNotification(`Импортировано объектов: ${list.length}`, 'success');
    } catch (e) {
        hideLoader();
        console.error(e);
        showNotification('Ошибка чтения файла БД', 'error');
    }
}

window.quickExportSingle = async function(id) {
    const items = await dbGetAll();
    const item = items.find(x => x.id === id);
    if (!item) return;

    currentSingleExportRecord = item;
    document.getElementById('exportSingleTitle').textContent = `Экспорт: ${item.name}`;
    document.getElementById('exportSingleModal').classList.add('show');
};

function downloadJsonFile(obj, filename) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

function executeSingleExport(variant) {
    if (!currentSingleExportRecord) return;
    const r = currentSingleExportRecord;
    const safeName = r.name.replace(/[^a-zA-Zа-яА-Я0-9_-]/g, '_');

    let output;
    if (variant === 'both') {
        output = {
            format: "SingleSettlementExport",
            version: "2.0",
            exportedAt: new Date().toISOString(),
            feature: r
        };
        downloadJsonFile(output, `${safeName}_both.json`);
    } else if (variant === 'simplified') {
        output = {
            type: "Feature",
            properties: {
                id: r.id,
                name: r.name,
                type: r.layerTitle,
                version: "simplified",
                toleranceMeters: r.toleranceMeters,
                vertices: r.simpCount
            },
            geometry: {
                type: r.geometryType,
                coordinates: r.simplifiedCoordinates
            }
        };
        downloadJsonFile(output, `${safeName}_simplified.json`);
    } else if (variant === 'original') {
        output = {
            type: "Feature",
            properties: {
                id: r.id,
                name: r.name,
                type: r.layerTitle,
                version: "original_raw",
                vertices: r.origCount
            },
            geometry: {
                type: r.geometryType,
                coordinates: r.rawCoordinates
            }
        };
        downloadJsonFile(output, `${safeName}_original.json`);
    }

    document.getElementById('exportSingleModal').classList.remove('show');
    showNotification(`Объект ${r.name} сохранен`, 'success');
}

async function importSingleObject(file) {
    try {
        showLoader("Импорт объекта...");
        const text = await file.text();
        const json = JSON.parse(text);

        let recordToSave = null;

        if (json.feature && json.feature.rawCoordinates) {
            recordToSave = json.feature;
        } else if (json.type === "Feature" && json.geometry) {
            const geomType = json.geometry.type;
            const coords = json.geometry.coordinates;
            const tol = parseInt(document.getElementById('tolerance-slider').value, 10) || 20;

            const isRaw = json.properties?.version === 'original_raw' || !json.properties?.version;
            const rawCoords = isRaw ? coords : coords;
            const simplified = isRaw ? simplifyGeometryData(geomType, coords, tol) : coords;

            const origC = countVerticesInGeometry(geomType, rawCoords);
            const simpC = countVerticesInGeometry(geomType, simplified);

            recordToSave = {
                id: json.properties?.id || `imp_${Date.now()}`,
                name: json.properties?.name || 'Импортированный объект',
                typeName: '',
                layerId: 36281,
                layerTitle: json.properties?.type || 'Импорт',
                color: getRandomColor(),
                geometryType: geomType,
                rawCoordinates: rawCoords,
                simplifiedCoordinates: simplified,
                origCount: origC,
                simpCount: simpC,
                savingsPercent: origC > 0 ? Math.round((1 - (simpC / origC)) * 100) : 0,
                toleranceMeters: tol,
                properties: json.properties || {},
                createdAt: new Date().toISOString()
            };
        }

        if (recordToSave) {
            await dbSave(recordToSave);
            await updateBadge();
            hideLoader();
            openDbModal();
            renderRecord(recordToSave, currentDisplayMode, true);
            showNotification(`Импортирован объект: ${recordToSave.name}`, 'success');
        } else {
            throw new Error('Неизвестный формат файла');
        }
    } catch (e) {
        hideLoader();
        console.error(e);
        showNotification('Не удалось распознать JSON-файл объекта', 'error');
    }
}

async function recalculateAllSimplification() {
    const tol = parseInt(document.getElementById('tolerance-slider').value, 10) || 20;
    showLoader(`Пересчет (допуск ${tol} м)...`);
    try {
        const items = await dbGetAll();
        for (const item of items) {
            item.simplifiedCoordinates = simplifyGeometryData(item.geometryType, item.rawCoordinates, tol);
            item.toleranceMeters = tol;
            item.simpCount = countVerticesInGeometry(item.geometryType, item.simplifiedCoordinates);
            item.savingsPercent = item.origCount > 0 ? Math.round((1 - (item.simpCount / item.origCount)) * 100) : 0;
            await dbSave(item);
        }
        hideLoader();
        openDbModal();
        if (mapObjects.length > 0) renderAllFromDatabase(true); // СОХРАНЯЕМ ТЕКУЩИЙ ЗУМ
        showNotification(`Все объекты пересчитаны с допуском ${tol} м`, 'success');
    } catch (e) {
        hideLoader();
        console.error(e);
        showNotification('Ошибка пересчета геометрий', 'error');
    }
}

async function openDbModal() {
    const modal = document.getElementById('dbModal');
    const listEl = document.getElementById('db-items-list');
    const statsEl = document.getElementById('db-summary-stats');

    listEl.innerHTML = '';
    const items = await dbGetAll();

    let totalRaw = 0;
    let totalSimp = 0;

    if (items.length === 0) {
        listEl.innerHTML = '<div style="padding:30px; text-align:center; color:#94a3b8;">База пуста. Нажмите правой кнопкой мыши на карту, чтобы сохранить Населенный пункт или Муниципальный район.</div>';
    } else {
        items.forEach(item => {
            totalRaw += (item.origCount || 0);
            totalSimp += (item.simpCount || 0);

            const row = document.createElement('div');
            row.className = 'db-item';
            row.innerHTML = `
                <div class="db-item-color" style="background:${item.color};"></div>
                <div class="db-item-info">
                    <div class="db-item-title">${item.name}</div>
                    <div class="db-item-meta">
                        ${item.layerTitle} | Вершин: ${item.simpCount.toLocaleString()} из ${item.origCount.toLocaleString()} (сжатие: -${item.savingsPercent}%)
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn-icon btn-view" title="Показать на карте"><i class="fas fa-eye"></i></button>
                    <button class="btn-icon btn-exp" title="Экспорт этого объекта"><i class="fas fa-download"></i></button>
                    <button class="btn-icon btn-del" title="Удалить"><i class="fas fa-trash"></i></button>
                </div>
            `;

            row.querySelector('.btn-view').onclick = () => {
                modal.classList.remove('show');
                clearMap();
                renderRecord(item, currentDisplayMode, true);
            };

            row.querySelector('.btn-exp').onclick = () => {
                quickExportSingle(item.id);
            };

            row.querySelector('.btn-del').onclick = async () => {
                await dbDelete(item.id);
                await updateBadge();
                openDbModal();
            };

            listEl.appendChild(row);
        });
    }

    const overallSavings = totalRaw > 0 ? Math.round((1 - (totalSimp / totalRaw)) * 100) : 0;
    statsEl.innerHTML = `
        <span>Объектов: <b>${items.length}</b></span>
        <span>Сырых вершин: <b>${totalRaw.toLocaleString()}</b></span>
        <span>Упрощенных: <b>${totalSimp.toLocaleString()}</b></span>
        <span>Экономия: <b>-${overallSavings}%</b></span>
    `;

    modal.classList.add('show');
}

    const old = document.querySelector('.notification');
    if (old) old.remove();

/* ==========================================================================
   10. ИНИЦИАЛИЗАЦИЯ КАРТЫ
   ========================================================================== */
ymaps.ready(function () {
    CadastralLabelLayout = ymaps.templateLayoutFactory.createClass(
        '<div class="custom-placemark-label" style="font-size: {{properties.zoomFontSize}}px;">$[properties.iconContent]</div>', {
            build: function () {
                this.constructor.superclass.build.call(this);
                this.updateZoomFontSize();
                if (this.getData().geoObject) this.getData().geoObject.events.add('mapchange', this.onMapChange, this);
            },
            clear: function () {
                if (this.getData().geoObject) this.getData().geoObject.events.remove('mapchange', this.onMapChange, this);
                this.constructor.superclass.clear.call(this);
            },
            onMapChange: function () {
                if (this.getData().geoObject && this.getData().geoObject.getMap()) this.updateZoomFontSize();
            },
            updateZoomFontSize: function () {
                const geoObjectData = this.getData();
                if (!geoObjectData || !geoObjectData.geoObject || !geoObjectData.geoObject.getMap()) return;
                const zoom = geoObjectData.geoObject.getMap().getZoom();
                let fontSize = zoom > 14 ? 13 : (zoom > 12 ? 11 : 10);
                if (geoObjectData.properties && typeof geoObjectData.properties.set === 'function') {
                    geoObjectData.properties.set('zoomFontSize', fontSize);
                }
            }
        }
    );

    let initialCenter = [54.8492, 50.7910];
    let initialZoom = 9;
    const savedLat = localStorage.getItem('mapCenterLat');
    const savedLon = localStorage.getItem('mapCenterLon');
    const savedZoom = localStorage.getItem('mapZoom');
    if (savedLat && savedLon && savedZoom) {
        initialCenter = [parseFloat(savedLat), parseFloat(savedLon)];
        initialZoom = parseInt(savedZoom, 10);
    }

    map = new ymaps.Map('map', {
        center: initialCenter,
        zoom: initialZoom,
        type: 'yandex#map',
        controls: ['zoomControl', 'fullscreenControl', 'typeSelector']
    });

    map.events.add('boundschange', function (e) {
        const center = map.getCenter();
        localStorage.setItem('mapCenterLat', center[0]);
        localStorage.setItem('mapCenterLon', center[1]);
        localStorage.setItem('mapZoom', e.get('newZoom'));
    });

    // Контекстное меню
    const contextMenuEl = document.getElementById('customContextMenu');
    map.events.add('contextmenu', function (e) {
        e.preventDefault();
        const coords = e.get('coords');
        const pos = e.get('position');
        contextMenuEl.style.left = pos[0] + 'px';
        contextMenuEl.style.top = pos[1] + 'px';
        contextMenuEl.style.display = 'block';
        contextMenuEl.dataset.lat = coords[0].toFixed(8);
        contextMenuEl.dataset.lon = coords[1].toFixed(8);
    });

    document.addEventListener('click', function (e) {
        if (!contextMenuEl.contains(e.target)) contextMenuEl.style.display = 'none';
    });

    document.getElementById('ctx-menu-save-settlement').addEventListener('click', () => {
        contextMenuEl.style.display = 'none';
        handleSaveLayer(parseFloat(contextMenuEl.dataset.lat), parseFloat(contextMenuEl.dataset.lon), 36281, 'Населенный пункт');
    });

    document.getElementById('ctx-menu-save-municipal').addEventListener('click', () => {
        contextMenuEl.style.display = 'none';
        handleSaveLayer(parseFloat(contextMenuEl.dataset.lat), parseFloat(contextMenuEl.dataset.lon), 36278, 'Муниципальное образование');
    });

    // ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ: ЗУМ НЕ МЕНЯЕТСЯ (preserveViewport = true)
    const modeSimpBtn = document.getElementById('mode-simplified-btn');
    const modeOrigBtn = document.getElementById('mode-original-btn');

    modeSimpBtn.addEventListener('click', () => {
        if (currentDisplayMode === 'simplified') return;
        currentDisplayMode = 'simplified';
        modeSimpBtn.classList.add('active');
        modeOrigBtn.classList.remove('active');
        if (mapObjects.length > 0) renderAllFromDatabase(true);
    });

    modeOrigBtn.addEventListener('click', () => {
        if (currentDisplayMode === 'original') return;
        currentDisplayMode = 'original';
        modeOrigBtn.classList.add('active');
        modeSimpBtn.classList.remove('active');
        if (mapObjects.length > 0) renderAllFromDatabase(true);
    });

    // Слайдер допуска
    const tolSlider = document.getElementById('tolerance-slider');
    const tolValLabel = document.getElementById('tolerance-val-label');
    tolSlider.addEventListener('input', () => {
        tolValLabel.textContent = tolSlider.value;
    });

    document.getElementById('btn-recalculate-all').addEventListener('click', recalculateAllSimplification);

    // Верхняя панель: Показать все (ЗДЕСЬ центрирование включено специально)
    document.getElementById('btn-render-all-db').addEventListener('click', () => renderAllFromDatabase(false));
    document.getElementById('btn-open-db-manager').addEventListener('click', openDbModal);
    document.getElementById('closeDbModal').addEventListener('click', () => document.getElementById('dbModal').classList.remove('show'));
    document.getElementById('clear-map-button').addEventListener('click', clearMap);

    // Экспорт / импорт БД
    document.getElementById('btn-export-db-json').addEventListener('click', exportFullDb);
    const dbFileInput = document.getElementById('db-file-input');
    document.getElementById('btn-import-db-trigger').addEventListener('click', () => dbFileInput.click());
    dbFileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            importFullDb(e.target.files[0]);
            e.target.value = '';
        }
    });

    // Импорт 1 объекта
    const singleFileInput = document.getElementById('single-file-input');
    document.getElementById('btn-import-single-trigger').addEventListener('click', () => singleFileInput.click());
    singleFileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            importSingleObject(e.target.files[0]);
            e.target.value = '';
        }
    });

    // Очистка БД
    document.getElementById('btn-clear-db').addEventListener('click', async () => {
        if (confirm('Очистить всю локальную базу геометрий?')) {
            await dbClear();
            await updateBadge();
            openDbModal();
            clearMap();
            showNotification('База данных очищена', 'info');
        }
    });

    // Модальное окно экспорта 1 объекта
    document.getElementById('closeExportSingleModal').addEventListener('click', () => {
        document.getElementById('exportSingleModal').classList.remove('show');
    });
    document.getElementById('btn-export-single-both').addEventListener('click', () => executeSingleExport('both'));
    document.getElementById('btn-export-single-simplified').addEventListener('click', () => executeSingleExport('simplified'));
    document.getElementById('btn-export-single-original').addEventListener('click', () => executeSingleExport('original'));

    // Поиск
    const searchInput = document.getElementById('search-input');
    async function doSearch() {
        const val = searchInput.value.trim();
        if (!val) return;
        const parts = val.replace(',', '.').split(/\s+/);
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
            const coords = [parseFloat(parts[0]), parseFloat(parts[1])];
            map.setCenter(coords, 14);
            return;
        }
        showLoader("Поиск...");
        try {
            const res = await ymaps.geocode(val, { results: 1 });
            const obj = res.geoObjects.get(0);
            if (obj) {
                map.setCenter(obj.geometry.getCoordinates(), 13);
            } else {
                showNotification('Ничего не найдено', 'warning');
            }
        } catch (e) {
            showNotification('Ошибка поиска', 'error');
        } finally {
            hideLoader();
        }
    }
    document.getElementById('open-search-button').addEventListener('click', doSearch);
    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

    updateBadge();
});
</script>
</body>
</html>
