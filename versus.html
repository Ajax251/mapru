<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Versus AI — Сравнение</title>
<link rel="shortcut icon" href="img/vs.png" type="image/x-icon">
<script src="webfonts/chart.umd.min.js"></script>
<script src="webfonts/chartjs-plugin-datalabels@2.2.0.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="webfonts/all.min.css">
<style>
:root {
  --bg-color: #f4f6fb;
  --bg-grad: radial-gradient(1200px 600px at 10% -10%, #e0ecff 0%, transparent 60%),
             radial-gradient(900px 500px at 110% 10%, #ffe4f1 0%, transparent 55%),
             linear-gradient(180deg, #f7f9ff 0%, #eef2fb 100%);
  --card-bg: rgba(255,255,255,0.85);
  --card-solid: #ffffff;
  --text-color: #0f172a;
  --light-text: #64748b;
  --border-color: rgba(15,23,42,0.08);
  --accent-color: #6366f1;
  --accent-color-hover: #4f46e5;
  --accent-2: #ec4899;
  --accent-grad: linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);
  --success: #10b981;
  --warning: #f59e0b;
  --danger-color: #ef4444;
  --input-bg: rgba(255,255,255,0.7);
  --shadow-sm: 0 2px 8px rgba(15,23,42,0.06);
  --shadow: 0 10px 30px -10px rgba(15,23,42,0.15);
  --shadow-lg: 0 25px 50px -12px rgba(15,23,42,0.25);
  --border-radius: 18px;
  --radius-sm: 12px;
  --transition: all 0.28s cubic-bezier(0.22,1,0.36,1);
  --glass-blur: 18px;
  --settings-color-proxy-lite: #60a5fa;
  --settings-color-proxy-standard: #2563eb;
  --settings-color-direct-lite: #fb923c;
  --settings-color-direct-standard: #dc2626;
  --settings-color-claude: #10b981;
  --settings-color-other: #8b5cf6;
  --settings-color-mistral: #f97316;
  --settings-color-atria: #0ea5e9;
}
body.dark-theme {
  --bg-color: #07070c;
  --bg-grad: radial-gradient(1200px 600px at 10% -10%, #1e1b4b 0%, transparent 60%),
             radial-gradient(900px 500px at 110% 10%, #4c1d3d 0%, transparent 55%),
             linear-gradient(180deg, #08080f 0%, #0b0b14 100%);
  --card-bg: rgba(20,20,28,0.72);
  --card-solid: #14141c;
  --text-color: #f1f5f9;
  --light-text: #94a3b8;
  --border-color: rgba(255,255,255,0.08);
  --accent-color: #818cf8;
  --accent-color-hover: #a5b4fc;
  --accent-2: #f472b6;
  --accent-grad: linear-gradient(135deg,#818cf8 0%,#a78bfa 50%,#f472b6 100%);
  --input-bg: rgba(30,30,42,0.7);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
  --shadow: 0 10px 30px -10px rgba(0,0,0,0.6);
  --shadow-lg: 0 25px 50px -12px rgba(0,0,0,0.8);
  --settings-color-proxy-lite: #93c5fd;
  --settings-color-proxy-standard: #60a5fa;
  --settings-color-direct-lite: #fdba74;
  --settings-color-direct-standard: #f87171;
  --settings-color-claude: #6ee7b7;
  --settings-color-other: #c4b5fd;
  --settings-color-mistral: #fdba74;
  --settings-color-atria: #7dd3fc;
}
* { box-sizing: border-box; }
body, html {
  height: 100%; margin: 0; padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-color);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text-color);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-color); color: white; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--light-text); }

.app-container { display: flex; flex-direction: column; height: 100dvh; width: 100vw; }

/* ===== HEADER ===== */
.app-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 22px;
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
  background: var(--card-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  z-index: 50;
  gap: 14px;
}
.app-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.app-logo {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--accent-grad);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 18px;
  box-shadow: 0 6px 20px -6px var(--accent-color);
  flex-shrink: 0;
}
.app-title { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
.header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.action-btn {
  background: transparent; border: 1px solid transparent;
  color: var(--light-text); cursor: pointer; font-size: 15px;
  width: 38px; height: 38px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.action-btn:hover { background: var(--input-bg); color: var(--accent-color); border-color: var(--border-color); transform: translateY(-1px); }
.action-btn:active { transform: translateY(0) scale(0.97); }
#settings-btn { color: var(--accent-color); }
#settings-btn:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 18%, transparent); }

/* ===== MAIN ===== */
.main-content {
  flex-grow: 1; display: grid; gap: 16px; padding: 16px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  grid-template-rows: minmax(0, 1fr) auto;
  overflow: hidden;
  min-height: 0;
}
.panel {
  background: var(--card-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: var(--transition);
  min-height: 0;
}
.panel-header {
  padding: 12px 16px; font-size: 14px; font-weight: 600;
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent-color) 6%, transparent), transparent);
}
.panel-header i.ph-icon { color: var(--accent-color); font-size: 15px; }
.panel-header .ph-title { flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-tools { display: flex; gap: 4px; margin-left: auto; }
.ph-tool {
  background: transparent; border: 1px solid transparent;
  color: var(--light-text); cursor: pointer;
  width: 30px; height: 30px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; transition: var(--transition);
}
.ph-tool:hover { background: var(--input-bg); color: var(--accent-color); border-color: var(--border-color); }
.panel-content { flex-grow: 1; overflow: auto; padding: 14px; min-height: 0; }

#table-panel { grid-column: 1; grid-row: 1; }
#chart-panel { grid-column: 2; grid-row: 1; }
#insights-panel {
  grid-column: 1 / -1; grid-row: 2;
  max-height: 240px;
  transition: max-height 0.4s cubic-bezier(0.22,1,0.36,1);
}
#insights-panel.collapsed { max-height: 48px; }
#insights-panel.collapsed .panel-content { display: none; }

/* ===== TABLE ===== */
.table-controls {
  display: flex; gap: 8px; padding: 10px 14px;
  border-bottom: 1px solid var(--border-color);
  align-items: center; flex-wrap: wrap;
}
.search-wrap {
  flex-grow: 1; position: relative; min-width: 140px;
}
.search-wrap i {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--light-text); font-size: 12px; pointer-events: none;
}
.search-wrap input {
  width: 100%; padding: 9px 12px 9px 34px;
  border: 1px solid var(--border-color); border-radius: 10px;
  background: var(--input-bg); color: var(--text-color);
  font-size: 13px; font-family: inherit; transition: var(--transition);
}
.search-wrap input:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 15%, transparent); }
.chip {
  padding: 6px 12px; border-radius: 20px; font-size: 12px;
  background: var(--input-bg); border: 1px solid var(--border-color);
  color: var(--light-text); cursor: pointer; transition: var(--transition);
  display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { color: var(--accent-color); border-color: var(--accent-color); }
.chip.active { background: var(--accent-grad); color: #fff; border-color: transparent; box-shadow: 0 4px 12px -4px var(--accent-color); }

.comparison-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.comparison-table th, .comparison-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border-color); }
.comparison-table thead th {
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent-color) 12%, transparent), color-mix(in srgb, var(--accent-color) 4%, transparent));
  position: sticky; top: 0; z-index: 2;
  font-weight: 700; color: var(--text-color); font-size: 12.5px;
  text-transform: uppercase; letter-spacing: 0.3px;
  backdrop-filter: blur(6px);
}
.comparison-table tbody tr { transition: background 0.15s ease; }
.comparison-table tbody tr:hover { background: color-mix(in srgb, var(--accent-color) 5%, transparent); }
.comparison-table tbody th {
  font-weight: 600; color: var(--text-color);
  background: color-mix(in srgb, var(--text-color) 3%, transparent);
  position: sticky; left: 0; z-index: 1;
  min-width: 160px;
}
.comparison-table tbody th.clickable { cursor: pointer; color: var(--accent-color); }
.comparison-table tbody th.clickable:hover { background: color-mix(in srgb, var(--accent-color) 14%, transparent); }
.comparison-table tbody th.active { background: color-mix(in srgb, var(--accent-color) 20%, transparent); }
.comparison-table .cell-best {
  background: color-mix(in srgb, var(--success) 12%, transparent) !important;
  font-weight: 600; color: var(--success);
  position: relative;
}
.comparison-table .cell-worst {
  background: color-mix(in srgb, var(--danger-color) 10%, transparent) !important;
  color: var(--danger-color);
}
.winner-crown {
  display: inline-flex; align-items: center; justify-content: center;
  width: 19px; height: 19px; border-radius: 50%;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #422006; font-size: 9px;
  box-shadow: 0 2px 8px -2px #f59e0b;
  margin-left: 6px;
  vertical-align: middle;
  flex-shrink: 0;
}

/* ===== CHART ===== */
#chart-wrapper { position: relative; width: 100%; height: 100%; min-height: 300px; }
#chart-wrapper canvas { max-height: 100%; }
.chart-type-bar {
  display: flex; gap: 4px; padding: 8px 14px; overflow-x: auto;
  border-bottom: 1px solid var(--border-color);
  background: color-mix(in srgb, var(--accent-color) 3%, transparent);
}
.chart-type-bar::-webkit-scrollbar { display: none; }
.chart-type-btn {
  background: transparent; border: 1px solid transparent;
  color: var(--light-text); cursor: pointer;
  padding: 6px 10px; border-radius: 8px; font-size: 11px;
  display: inline-flex; align-items: center; gap: 5px; transition: var(--transition);
  white-space: nowrap; font-family: inherit;
}
.chart-type-btn:hover { background: var(--input-bg); color: var(--accent-color); }
.chart-type-btn.active {
  background: var(--accent-grad); color: #fff;
  box-shadow: 0 4px 12px -4px var(--accent-color);
}
.chart-type-btn i { font-size: 11px; }

/* ===== INSIGHTS ===== */
.insights-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
}
.insight-card {
  padding: 12px 14px; border-radius: 12px;
  background: var(--input-bg); border: 1px solid var(--border-color);
  transition: var(--transition);
}
.insight-card:hover { border-color: color-mix(in srgb, var(--accent-color) 40%, transparent); transform: translateY(-2px); }
.insight-card .ic-title {
  font-size: 11px; font-weight: 700; color: var(--light-text);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.insight-card .ic-title i { color: var(--accent-color); font-size: 12px; }
.insight-card .ic-body { font-size: 13px; line-height: 1.55; color: var(--text-color); }
.insight-card .ic-body ul { margin: 0; padding-left: 18px; }
.insight-card .ic-body li { margin-bottom: 4px; }
.winner-card {
  background: linear-gradient(135deg, color-mix(in srgb, #fbbf24 18%, transparent), color-mix(in srgb, #f59e0b 8%, transparent));
  border-color: #f59e0b40;
}
.winner-card .ic-body { font-size: 16px; font-weight: 700; color: #b45309; display: flex; align-items: center; gap: 8px; }
body.dark-theme .winner-card .ic-body { color: #fbbf24; }
.winner-card .ic-body .winner-crown {
  width: 22px; height: 22px; font-size: 10px; margin-left: 0;
}

/* ===== INPUT ===== */
.input-panel {
  flex-shrink: 0; display: flex; gap: 12px;
  padding: 14px 22px 18px;
  border-top: 1px solid var(--border-color);
  background: var(--card-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  align-items: center;
}
.input-capsule {
  flex-grow: 1; display: flex; align-items: center; gap: 8px;
  background: var(--input-bg); border: 1px solid var(--border-color);
  border-radius: 999px; padding: 4px 4px 4px 18px;
  transition: var(--transition);
}
.input-capsule:focus-within { border-color: var(--accent-color); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-color) 18%, transparent); }
#query-input {
  flex-grow: 1; height: 42px; border: none; background: transparent;
  font-size: 15px; color: var(--text-color); font-family: inherit;
  outline: none; min-width: 0;
}
#query-input::placeholder { color: var(--light-text); }
#send-btn {
  width: 46px; height: 46px; border-radius: 50%; border: none;
  background: var(--accent-grad); color: white; font-size: 17px;
  cursor: pointer; transition: var(--transition); flex-shrink: 0;
  box-shadow: 0 8px 20px -8px var(--accent-color);
  display: flex; align-items: center; justify-content: center;
}
#send-btn:hover:not(:disabled) { transform: scale(1.06); box-shadow: 0 12px 26px -8px var(--accent-color); }
#send-btn:disabled, #query-input:disabled { opacity: 0.55; cursor: not-allowed; }
#regenerate-btn {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border-color);
  background: var(--input-bg); color: var(--light-text); cursor: pointer;
  transition: var(--transition); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
#regenerate-btn:hover { color: var(--accent-color); border-color: var(--accent-color); }

/* ===== PLACEHOLDER / LOADER ===== */
.placeholder { text-align: center; color: var(--light-text); padding: 24px; margin: auto; max-width: 100%; }
.placeholder i { font-size: 44px; margin-bottom: 16px; opacity: 0.7; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.placeholder p { font-size: 15px; margin: 0 0 6px; }
.placeholder small { font-size: 12px; color: var(--light-text); }
.loader .fa-spinner { font-size: 44px; animation: fa-spin 1.4s linear infinite; }

/* ===== MODALS ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(2,6,23,0.55);
  display: none; justify-content: center; align-items: center;
  z-index: 1000; backdrop-filter: blur(6px); padding: 16px;
  animation: fadeIn 0.25s ease;
}
.modal-overlay.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  background: var(--card-solid); padding: 26px;
  border-radius: 20px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 480px; display: flex; flex-direction: column;
  border: 1px solid var(--border-color);
  animation: popIn 0.28s cubic-bezier(0.22,1,0.36,1);
  max-height: 88vh; overflow: auto;
}
@keyframes popIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-content h2 { margin: 0 0 8px; font-size: 19px; color: var(--text-color); text-align: center; font-weight: 700; }
.modal-content .modal-sub { color: var(--light-text); line-height: 1.55; text-align: center; font-size: 13px; margin: 0 0 8px; }
.modal-content a { color: var(--accent-color); text-decoration: none; font-weight: 500; }
.modal-content a:hover { text-decoration: underline; }
.settings-controls-wrapper { display: flex; flex-direction: column; gap: 16px; margin-top: 18px; }
.settings-control-group label {
  display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600;
  color: var(--light-text); text-transform: uppercase; letter-spacing: 0.4px;
}
.settings-control-group select, .settings-control-group input[type="password"] {
  width: 100%; padding: 11px 14px; border: 1px solid var(--border-color);
  border-radius: 11px; font-size: 14px; box-sizing: border-box;
  background: var(--input-bg); color: var(--text-color); font-family: inherit;
  transition: var(--transition);
}
.settings-control-group select:focus, .settings-control-group input:focus {
  outline: none; border-color: var(--accent-color);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 15%, transparent);
}
#api-key-input-group { display: none; }
#api-key-input-group.visible { display: block; }
.modal-btns { display: flex; gap: 10px; margin-top: 22px; }
.modal-btn {
  flex: 1; padding: 12px; border: none; border-radius: 12px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: var(--transition); font-family: inherit;
}
.modal-btn.primary { background: var(--accent-grad); color: #fff; box-shadow: 0 8px 20px -8px var(--accent-color); }
.modal-btn.primary:hover { transform: translateY(-1px); }
.modal-btn.secondary { background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); }
.modal-btn.secondary:hover { border-color: var(--accent-color); color: var(--accent-color); }

/* History */
.history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; max-height: 380px; overflow: auto; }
.history-item {
  padding: 11px 14px; border-radius: 11px; cursor: pointer;
  background: var(--input-bg); border: 1px solid var(--border-color);
  transition: var(--transition); display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.history-item:hover { border-color: var(--accent-color); transform: translateX(3px); }
.history-item .hi-title { font-weight: 600; font-size: 13px; color: var(--text-color); }
.history-item .hi-meta { font-size: 11px; color: var(--light-text); }
.history-item .hi-del { color: var(--light-text); font-size: 12px; padding: 4px 8px; border-radius: 6px; }
.history-item .hi-del:hover { color: var(--danger-color); background: color-mix(in srgb, var(--danger-color) 10%, transparent); }

/* Toast */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--text-color); color: var(--bg-color);
  padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 500;
  z-index: 9999; opacity: 0; transition: var(--transition); pointer-events: none;
  box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger-color); color: #fff; }
.toast.success { background: var(--success); color: #fff; }

/* Responsive */
@media (max-width: 900px) {
  .main-content {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
    overflow-y: auto;
  }
  #table-panel, #chart-panel, #insights-panel {
    grid-column: 1; grid-row: auto;
    max-height: 60vh;
  }
  #chart-wrapper { min-height: 280px; }
  .app-title { font-size: 17px; }
}
@media (max-width: 520px) {
  .app-header { padding: 10px 14px; }
  .header-actions .action-btn { width: 34px; height: 34px; font-size: 13px; }
  .comparison-table tbody th { min-width: 110px; font-size: 12px; }
  .comparison-table th, .comparison-table td { padding: 9px 10px; }
}
</style>
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <div class="app-brand">
      <div class="app-logo"><i class="fa-solid fa-scale-unbalanced-flip"></i></div>
      <h1 class="app-title">Versus AI</h1>
    </div>
    <div class="header-actions">
      <button id="history-btn" class="action-btn" title="История"><i class="fa-solid fa-clock-rotate-left"></i></button>
      <button id="share-btn" class="action-btn" title="Поделиться"><i class="fa-solid fa-share-nodes"></i></button>
      <button id="theme-toggle" class="action-btn" title="Переключить тему"><i class="fa-solid fa-circle-half-stroke"></i></button>
      <button id="fullscreen-btn" class="action-btn" title="Полный экран"><i class="fa-solid fa-expand"></i></button>
      <button id="save-png-btn" class="action-btn" title="Сохранить диаграмму"><i class="fa-solid fa-file-image"></i></button>
      <button id="settings-btn" class="action-btn" title="Настройки">
        <i class="fas fa-cog"></i>
        <i class="fas fa-key" style="display: none;"></i>
      </button>
    </div>
  </header>

  <main class="main-content" id="main-content">

      <button class="modal-btn secondary" id="clear-history-btn"><i class="fa-solid fa-trash"></i> Очистить</button>
      <button class="modal-btn primary" id="close-history-btn">Закрыть</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
Chart.register(ChartDataLabels);

const VERCEL_PROXY_BASE_URL = "https://ver-olive-delta.vercel.app";
const MAPRUAPP_PROXY_BASE_URL = "https://mapruapp.ru";

const MODELS = [
  { id: "gemini-2.5-flash-lite",  uiName: "Gemini 2.5 Flash Lite",  apiType: "gemini",  tier: "lite" },
  { id: "gemini-3.1-flash-lite",  uiName: "Gemini 3.1 Flash Lite",  apiType: "gemini",  tier: "lite" },
  { id: "gemini-3.5-flash-lite",  uiName: "Gemini 3.5 Flash Lite",  apiType: "gemini",  tier: "lite" },
  { id: "gemini-3.8-flash",       uiName: "Gemini 3.8 Flash",       apiType: "gemini",  tier: "standard" },
  { id: "Atria-Dawn-Preview",     uiName: "Atria Dawn Preview",     apiType: "atria",   tier: "standard" },
  { id: "mistral-large-2512",     uiName: "Mistral Large",          apiType: "mistral", tier: "standard" },
  { id: "mistral-medium-2508",    uiName: "Mistral Medium",         apiType: "mistral", tier: "standard" }
];

const API_MODES = {
  mapruapp: {
    uiName: 'Прокси (MapRuApp)',
    url: () => `${MAPRUAPP_PROXY_BASE_URL}/ai/api/v1/chat/completions`
  },
  vercel: {
    uiName: 'Прокси (Vercel)',
    geminiUrl: (modelId) => `${VERCEL_PROXY_BASE_URL}/v1beta/models/${modelId}:generateContent`
  },
  direct: {
    uiName: 'Прямой (Gemini)',
    geminiUrl: (modelId, key) =>
      `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${key}`
  },
  direct_mistral: {
    uiName: 'Прямой (Mistral)',
    url: () => 'https://api.mistral.ai/v1/chat/completions'
  }
};

const DEFAULT_MODEL_ID = "gemini-3.5-flash-lite";
const DEFAULT_API_MODE = "mapruapp";

/* ============================================================
   SYSTEM PROMPT
   ============================================================ */
const AI_SYSTEM_PROMPT = `
Ты — "VersusGPT", универсальный ИИ-аналитик для объективного сравнительного анализа.
Твоя задача — получить запрос на сравнение и вернуть исчерпывающий анализ в СТРОГО определённом формате JSON.

### КРИТИЧЕСКИ ВАЖНЫЕ ПРАВИЛА ВЫВОДА:
- **ТОЛЬКО JSON:** Ответ ДОЛЖЕН быть только одним валидным JSON объектом.
- **НИКАКИХ ЛИШНИХ СИМВОЛОВ** до \`{\` и после \`}\`.
- **НИКАКОГО MARKDOWN** вокруг JSON.
- **БЕЗ ВИСЯЧИХ ЗАПЯТЫХ.**
- Если значение не является чистым числом (диапазон '45-54' или текст) — **ОБЯЗАТЕЛЬНО в кавычках** как строка.

### АЛГОРИТМ:
1. Определи объекты для сравнения и категорию.
2. Составь 6–12 релевантных параметров.
3. Собери фактические данные ("н/д" при отсутствии).
4. Определи главный числовой KPI (поле \`primaryMetric\`).
5. Порекомендуй тип диаграммы: 'bar','line','pie','doughnut','polarArea','radar','horizontalBar','scatter','bubble'.
6. Определи победителя (объективное превосходство по большинству ключевых параметров). Если ничья — "Ничья".
7. Дай краткое резюме (2–3 предложения) и 3–5 инсайтов.

### СТРУКТУРА JSON (СТРОГО):
{
  "title": (string) "Краткий заголовок",
  "category": (string) "Категория",
  "objectNames": (array of strings) ["Объект 1", "Объект 2"],
  "primaryMetric": (string) "Название KPI",
  "suggestedChartType": (string) "bar|line|pie|doughnut|polarArea|radar|horizontalBar|scatter|bubble",
  "winner": (string) "Имя победителя или 'Ничья'",
  "summary": (string) "Резюме в 2–3 предложениях",
  "insights": (array of strings) ["Факт 1", "Факт 2", "Факт 3"],
  "comparisonData": [
    { "parameter": (string) "Название параметра", "values": (array of strings or numbers) ["Значение 1","Значение 2"] }
  ]
}

### ПРИМЕР:
{
  "title": "Сравнение: Лев против Тигра",
  "category": "Большие кошки",
  "objectNames": ["Африканский лев", "Амурский тигр"],
  "primaryMetric": "Максимальная масса тела, кг",
  "suggestedChartType": "bar",
  "winner": "Амурский тигр",
  "summary": "Амурский тигр превосходит льва по массе и силе укуса, уступая в скорости бега. По совокупности физических характеристик тигр является более мощным хищником.",
  "insights": [
    "Тигр тяжелее льва в среднем на 50 кг",
    "Лев быстрее на коротких дистанциях",
    "Сила укуса тигра выше на 60%"
  ],
  "comparisonData": [
    { "parameter": "Максимальная масса тела, кг", "values": [250, 300] },
    { "parameter": "Скорость бега, км/ч", "values": [80, 65] },
    { "parameter": "Сила укуса, PSI", "values": [650, 1050] }
  ]
}
`;

/* ============================================================
   CHART TYPES
   ============================================================ */
const CHART_TYPES = [
  { id: 'bar',          icon: 'fa-chart-column',  label: 'Столбцы' },
  { id: 'horizontalBar',icon: 'fa-bars',          label: 'Горизонт.' },
  { id: 'line',         icon: 'fa-chart-line',    label: 'Линия' },
  { id: 'pie',          icon: 'fa-chart-pie',     label: 'Пирог' },
  { id: 'doughnut',     icon: 'fa-circle-notch',  label: 'Кольцо' },
  { id: 'polarArea',    icon: 'fa-compact-disc',  label: 'Полярная' },
  { id: 'radar',        icon: 'fa-spider',        label: 'Радар' },
  { id: 'scatter',      icon: 'fa-braille',       label: 'Точки' },
  { id: 'bubble',       icon: 'fa-circle',        label: 'Пузыри' }
];

/* ============================================================
   STATE
   ============================================================ */
let apiKey = '';
let currentApiMode = DEFAULT_API_MODE;
let currentModelId = DEFAULT_MODEL_ID;
let currentApiType = 'gemini';
let currentChart = null;
let currentChartType = 'bar';
let comparisonData = null;
let objectNames = [];
let metaData = {};
let currentRequestController = null;
let highlightBest = true;
let sortMode = 'none';
let searchQuery = '';
let history = [];
const HISTORY_KEY = 'versus_history_v1';

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const queryInput = $('query-input');
const sendButton = $('send-btn');
const regenerateBtn = $('regenerate-btn');
const settingsBtn = $('settings-btn');
const settingsModalOverlay = $('settings-modal-overlay');
const saveSettingsBtn = $('save-settings-btn');
const cancelSettingsBtn = $('cancel-settings-btn');
const apiKeyInput = $('api-key-input');
const apiKeyInputGroup = $('api-key-input-group');
const apiKeyHint = $('api-key-hint');
const modelSelector = $('model-selector');
const apiModeSelector = $('api-mode-selector');
const themeToggle = $('theme-toggle');
const welcomePlaceholder = $('welcome-placeholder');
const tablePanel = $('table-panel');
const chartPanel = $('chart-panel');
const insightsPanel = $('insights-panel');
const tableContainer = $('table-container');
const tableTitleText = $('table-title-text');
const chartTitleText = $('chart-title-text');
const chartWrapper = $('chart-wrapper');
const chartTypeBar = $('chart-type-bar');
const insightsGrid = $('insights-grid');
const historyBtn = $('history-btn');
const historyModal = $('history-modal-overlay');
const historyList = $('history-list');
const shareBtn = $('share-btn');
const toast = $('toast');

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener('load', () => {
  populateModelSelector();
  populateApiModeSelector();
  buildChartTypeBar();
  setupEventListeners();
  loadSettings();
  loadHistory();
  applyInitialTheme();
  handleShareParam();
});

function applyInitialTheme() {
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const saved = localStorage.getItem('versus_theme');
  if (saved === 'dark' || (!saved && prefersDark)) document.body.classList.add('dark-theme');
}

function populateModelSelector() {
  modelSelector.innerHTML = '';
  MODELS.forEach(m => {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = m.uiName;
    o.dataset.apiType = m.apiType;
    o.dataset.tier = m.tier;
    modelSelector.appendChild(o);
  });
}

function populateApiModeSelector() {
  apiModeSelector.innerHTML = '';
  Object.entries(API_MODES).forEach(([key, val]) => {
    const o = document.createElement('option');
    o.value = key;
    o.textContent = val.uiName;
    apiModeSelector.appendChild(o);
  });
}

function buildChartTypeBar() {
  chartTypeBar.innerHTML = CHART_TYPES.map(t =>
    `<button class="chart-type-btn" data-type="${t.id}"><i class="fa-solid ${t.icon}"></i>${t.label}</button>`
  ).join('');
  chartTypeBar.querySelectorAll('.chart-type-btn').forEach(btn => {
    btn.onclick = () => {
      currentChartType = btn.dataset.type;
      updateChartTypeBarUI();
      if (comparisonData) redrawChart();
    };
  });
  updateChartTypeBarUI();
}

function updateChartTypeBarUI() {
  chartTypeBar.querySelectorAll('.chart-type-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.type === currentChartType));
}

/* ============================================================
   EVENTS
   ============================================================ */
function setupEventListeners() {
  sendButton.addEventListener('click', handleRequest);
  regenerateBtn.addEventListener('click', () => {
    if (metaData && metaData.lastQuery) {
      queryInput.value = metaData.lastQuery;
      handleRequest();
    }
  });
  queryInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleRequest(); }
  });

  settingsBtn.addEventListener('click', openSettingsModal);
  saveSettingsBtn.addEventListener('click', saveSettings);
  cancelSettingsBtn.addEventListener('click', closeSettingsModal);
  settingsModalOverlay.addEventListener('click', e => { if (e.target === settingsModalOverlay) closeSettingsModal(); });
  apiModeSelector.addEventListener('change', updateSettingsUI);
  modelSelector.addEventListener('change', updateSettingsUI);

  themeToggle.addEventListener('click', toggleTheme);
  $('fullscreen-btn').addEventListener('click', toggleFullscreen);
  $('save-png-btn').addEventListener('click', saveChartAsPNG);

  $('copy-table-btn').addEventListener('click', copyTableToClipboard);
  $('export-csv-btn').addEventListener('click', exportCSV);
  $('export-json-btn').addEventListener('click', exportJSON);
  $('export-html-btn').addEventListener('click', exportHTML);
  $('table-search').addEventListener('input', e => { searchQuery = e.target.value.toLowerCase(); renderTable(); });
  $('highlight-toggle').addEventListener('click', e => {
    highlightBest = !highlightBest;
    e.currentTarget.classList.toggle('active', highlightBest);
    renderTable();
  });
  $('sort-toggle').addEventListener('click', e => {
    sortMode = sortMode === 'none' ? 'desc' : (sortMode === 'desc' ? 'asc' : 'none');
    e.currentTarget.classList.toggle('active', sortMode !== 'none');
    e.currentTarget.querySelector('i').className =
      sortMode === 'desc' ? 'fa-solid fa-arrow-down-wide-short' :
      sortMode === 'asc'  ? 'fa-solid fa-arrow-up-wide-short' : 'fa-solid fa-arrow-down-wide-short';
    renderTable();
  });
  $('insights-toggle').addEventListener('click', () => {
    insightsPanel.classList.toggle('collapsed');
    const icon = insightsPanel.querySelector('#insights-toggle i');
    icon.className = insightsPanel.classList.contains('collapsed')
      ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down';
  });

  historyBtn.addEventListener('click', openHistoryModal);
  $('close-history-btn').addEventListener('click', () => historyModal.classList.remove('active'));
  $('clear-history-btn').addEventListener('click', clearHistory);
  historyModal.addEventListener('click', e => { if (e.target === historyModal) historyModal.classList.remove('active'); });

  shareBtn.addEventListener('click', shareComparison);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      settingsModalOverlay.classList.remove('active');
      historyModal.classList.remove('active');
    }
  });
}

function toggleTheme() {
  document.body.classList.toggle('dark-theme');
  localStorage.setItem('versus_theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
  if (currentChart) redrawChart();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

/* ============================================================
   SETTINGS
   ============================================================ */
function openSettingsModal() { settingsModalOverlay.classList.add('active'); updateSettingsUI(); }
function closeSettingsModal() { settingsModalOverlay.classList.remove('active'); }

function updateSettingsUI() {
  currentApiMode = apiModeSelector.value;
  const opt = modelSelector.options[modelSelector.selectedIndex];
  currentApiType = opt.dataset.apiType;

  const directGem = apiModeSelector.querySelector('option[value="direct"]');
  const directMis = apiModeSelector.querySelector('option[value="direct_mistral"]');
  const vercel = apiModeSelector.querySelector('option[value="vercel"]');

  if (currentApiType === 'gemini') {
    directGem.disabled = false; directMis.disabled = true; vercel.disabled = false;
    if (currentApiMode === 'direct_mistral') { apiModeSelector.value = 'mapruapp'; currentApiMode = 'mapruapp'; }
  } else if (currentApiType === 'mistral') {
    directGem.disabled = true; directMis.disabled = false; vercel.disabled = true;
    if (currentApiMode === 'direct' || currentApiMode === 'vercel') { apiModeSelector.value = 'mapruapp'; currentApiMode = 'mapruapp'; }
  } else {
    directGem.disabled = true; directMis.disabled = true; vercel.disabled = true;
    if (currentApiMode !== 'mapruapp') { apiModeSelector.value = 'mapruapp'; currentApiMode = 'mapruapp'; }
  }

  const needsKey = (currentApiMode === 'direct' || currentApiMode === 'direct_mistral');
  apiKeyInputGroup.classList.toggle('visible', needsKey);
  if (currentApiMode === 'direct') {
    apiKeyHint.innerHTML = 'Получить ключ: <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>';
  } else if (currentApiMode === 'direct_mistral') {
    apiKeyHint.innerHTML = 'Получить ключ: <a href="https://console.mistral.ai/api-keys/" target="_blank">Mistral Console</a>';
  }
  updateSettingsButtonVisuals();
}

function updateSettingsButtonVisuals() {
  const isDirect = currentApiMode === 'direct' || currentApiMode === 'direct_mistral';
  const cog = settingsBtn.querySelector('.fa-cog');
  const key = settingsBtn.querySelector('.fa-key');
  const m = MODELS.find(x => x.id === modelSelector.value) || MODELS[0];
  let colorVar = '--settings-color-proxy-lite';
  if (m.apiType === 'mistral') colorVar = '--settings-color-mistral';
  else if (m.apiType === 'atria') colorVar = '--settings-color-atria';
  else if (m.apiType === 'gemini') {
    if (isDirect) colorVar = m.tier === 'standard' ? '--settings-color-direct-standard' : '--settings-color-direct-lite';
    else colorVar = m.tier === 'standard' ? '--settings-color-proxy-standard' : '--settings-color-proxy-lite';
  }
  settingsBtn.style.color = `var(${colorVar})`;
  cog.style.display = isDirect ? 'none' : 'inline-block';
  key.style.display = isDirect ? 'inline-block' : 'none';
}

function saveSettings() {
  const key = apiKeyInput.value.replace(/\s/g, '');
  currentModelId = modelSelector.value;
  currentApiType = modelSelector.options[modelSelector.selectedIndex].dataset.apiType;
  currentApiMode = apiModeSelector.value;

  if ((currentApiMode === 'direct' || currentApiMode === 'direct_mistral') && !key) {
    showToast('Введите API-ключ для прямого режима', 'error');
    return;
  }
  apiKey = key;
  localStorage.setItem('versus_apiKey', key);
  localStorage.setItem('versus_modelId', currentModelId);
  localStorage.setItem('versus_apiMode', currentApiMode);
  closeSettingsModal();
  updateSettingsButtonVisuals();
  showToast('Настройки сохранены', 'success');
}

function loadSettings() {
  apiKey = localStorage.getItem('versus_apiKey') || '';
  apiKeyInput.value = apiKey;
  modelSelector.value = localStorage.getItem('versus_modelId') || DEFAULT_MODEL_ID;
  apiModeSelector.value = localStorage.getItem('versus_apiMode') || DEFAULT_API_MODE;
  updateSettingsUI();
}

/* ============================================================
   UI STATES
   ============================================================ */
function showLoading() {
  welcomePlaceholder.style.display = 'flex';
  welcomePlaceholder.innerHTML = `<div class="placeholder loader"><i class="fas fa-spinner"></i><p></p><small></small></div>`;
  tablePanel.style.display = 'none';
  chartPanel.style.display = 'none';
  insightsPanel.style.display = 'none';
  sendButton.disabled = true;
  queryInput.disabled = true;
}

function showResults() {
  welcomePlaceholder.style.display = 'none';
  tablePanel.style.display = 'flex';
  chartPanel.style.display = 'flex';
  insightsPanel.style.display = 'flex';
  insightsPanel.classList.remove('collapsed');
  sendButton.disabled = false;
  queryInput.disabled = false;
}

function showError(msg) {
  welcomePlaceholder.style.display = 'flex';
  welcomePlaceholder.innerHTML = `<div class="placeholder" style="color: var(--danger-color);"><i class="fas fa-exclamation-triangle"></i><p>Произошла ошибка</p><small style="max-width: 400px; display: inline-block;">${escapeHtml(msg)}</small></div>`;
  tablePanel.style.display = 'none';
  chartPanel.style.display = 'none';
  insightsPanel.style.display = 'none';
  sendButton.disabled = false;
  queryInput.disabled = false;
}

/* ============================================================
   REQUEST
   ============================================================ */
async function handleRequest() {
  const query = queryInput.value.trim();
  if (!query) return;
  const needsKey = (currentApiMode === 'direct' || currentApiMode === 'direct_mistral');
  if (needsKey && !apiKey) { openSettingsModal(); showToast('Введите API-ключ', 'error'); return; }

  metaData.lastQuery = query;
  showLoading();
  currentRequestController = new AbortController();

  try {
    const { url, options } = buildRequest(query);
    const res = await fetch(url, { ...options, signal: currentRequestController.signal });
    if (!res.ok) {
      const body = await res.text();
      throw new Error(`HTTP ${res.status}: ${body.slice(0, 200)}`);
    }
    const data = await res.json();
    const text = extractResponseText(data);
    if (!text) throw new Error('API вернул пустой ответ');
    const parsed = parseAIJson(text);
    processAiResponse(parsed, query);
  } catch (e) {
    if (e.name !== 'AbortError') { console.error(e); showError(e.message); }
  } finally {
    currentRequestController = null;
  }
}

function buildRequest(query) {
  if (currentApiMode === 'mapruapp') {
    return {
      url: API_MODES.mapruapp.url(),
      options: {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: currentModelId,
          messages: [
            { role: 'system', content: AI_SYSTEM_PROMPT },
            { role: 'user', content: query }
          ],
          max_tokens: 4096
        })
      }
    };
  }

  if (currentApiMode === 'vercel' && currentApiType === 'gemini') {
    return {
      url: API_MODES.vercel.geminiUrl(currentModelId),
      options: {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `${AI_SYSTEM_PROMPT}\n\nUser query: ${query}` }] }],
          generationConfig: { responseMimeType: 'application/json' }
        })
      }
    };
  }

  if (currentApiMode === 'direct' && currentApiType === 'gemini') {
    return {
      url: API_MODES.direct.geminiUrl(currentModelId, apiKey),
      options: {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `${AI_SYSTEM_PROMPT}\n\nUser query: ${query}` }] }],
          generationConfig: { responseMimeType: 'application/json' }
        })
      }
    };
  }

  if (currentApiMode === 'direct_mistral') {
    return {
      url: API_MODES.direct_mistral.url(),
      options: {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: currentModelId,
          messages: [
            { role: 'system', content: AI_SYSTEM_PROMPT },
            { role: 'user', content: query }
          ],
          max_tokens: 4096,
          response_format: { type: 'json_object' }
        })
      }
    };
  }

  throw new Error('Неподдерживаемая комбинация модели и режима');
}

function extractResponseText(data) {
  if (data.choices?.[0]?.message?.content) return data.choices[0].message.content;
  if (data.candidates?.[0]?.content?.parts?.[0]?.text) return data.candidates[0].content.parts[0].text;
  if (data.content?.[0]?.text) return data.content[0].text;
  return null;
}

function parseAIJson(text) {
  let s = text.trim();
  s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '');
  const firstBrace = s.indexOf('{');
  const lastBrace = s.lastIndexOf('}');
  if (firstBrace > 0 || lastBrace < s.length - 1) s = s.slice(firstBrace, lastBrace + 1);
  return JSON.parse(s);
}

/* ============================================================
   PROCESS RESPONSE
   ============================================================ */
function processAiResponse(data, query) {
  if (!data.comparisonData || !data.objectNames) {
    throw new Error('ИИ вернул неверный формат (нет comparisonData/objectNames)');
  }
  comparisonData = data.comparisonData;
  objectNames = data.objectNames;
  metaData = {
    title: data.title || 'Сравнительная таблица',
    category: data.category || '',
    primaryMetric: data.primaryMetric || '',
    winner: data.winner || '',
    summary: data.summary || '',
    insights: Array.isArray(data.insights) ? data.insights : [],
    suggestedChartType: data.suggestedChartType || '',
    lastQuery: query
  };

  tableTitleText.innerText = metaData.title;
  chartTitleText.innerText = metaData.title;

  if (metaData.suggestedChartType && CHART_TYPES.some(t => t.id === metaData.suggestedChartType)) {
    currentChartType = metaData.suggestedChartType;
  } else {
    currentChartType = 'bar';
  }
  updateChartTypeBarUI();

  renderTable();
  renderInsights();
  showResults();

  let primary = comparisonData.find(i => i.parameter === metaData.primaryMetric);
  if (!primary) primary = comparisonData.find(i => i.values.every(v => !isNaN(parseFloat(String(v).replace(/[^0-9.,-]/g, '').replace(',', '.')))));
  if (primary && chartWrapper) {
    drawParameterChart(primary.parameter);
  } else {
    chartWrapper.innerHTML = `<div class="placeholder"><i class="fa-solid fa-chart-line"></i><p>Нет числовых данных для диаграммы</p></div>`;
  }

  saveToHistory({ query, data: { ...data }, timestamp: Date.now() });
}

/* ============================================================
   TABLE
   ============================================================ */
function renderTable() {
  if (!comparisonData) return;

  let rows = comparisonData.slice();
  if (searchQuery) rows = rows.filter(r => r.parameter.toLowerCase().includes(searchQuery));

  if (sortMode !== 'none') {
    rows.sort((a, b) => {
      const av = parseFloat(String(a.values[0]).replace(/[^0-9.,-]/g, '').replace(',', '.')) || 0;
      const bv = parseFloat(String(b.values[0]).replace(/[^0-9.,-]/g, '').replace(',', '.')) || 0;
      return sortMode === 'desc' ? bv - av : av - bv;
    });
  }

  let html = `<table class="comparison-table"><thead><tr><th>Параметр</th>`;
  objectNames.forEach((n) => {
    const isWinner = metaData.winner && n.trim().toLowerCase() === String(metaData.winner).trim().toLowerCase();
    html += `<th>${escapeHtml(n)}${isWinner ? ' <span class="winner-crown" title="Победитель"><i class="fa-solid fa-crown"></i></span>' : ''}</th>`;
  });
  html += `</tr></thead><tbody>`;

  rows.forEach(row => {
    const nums = row.values.map(v => parseFloat(String(v).replace(/[^0-9.,-]/g, '').replace(',', '.')));
    const allNum = nums.every(n => !isNaN(n));
    const max = allNum ? Math.max(...nums) : null;
    const min = allNum ? Math.min(...nums) : null;
    const isClickable = allNum;
    const safeParam = escapeHtml(row.parameter).replace(/'/g, "\\'");

    html += `<tr><th class="${isClickable ? 'clickable' : ''}" ${isClickable ? `onclick="drawParameterChart('${safeParam.replace(/"/g, '&quot;')}')"` : ''} data-parameter="${escapeHtml(row.parameter)}">${escapeHtml(row.parameter)}</th>`;

    row.values.forEach((val, i) => {
      let cls = '';
      if (highlightBest && allNum && nums.length > 1) {
        if (nums[i] === max && max !== min) cls = 'cell-best';
        else if (nums[i] === min && max !== min) cls = 'cell-worst';
      }
      html += `<td class="${cls}">${escapeHtml(String(val))}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  tableContainer.innerHTML = html;

  const active = tableContainer.querySelector('.comparison-table th.active');
  if (!active && rows[0]) {
    const firstNumeric = rows.find(r => r.values.every(v => !isNaN(parseFloat(String(v).replace(/[^0-9.,-]/g, '').replace(',', '.')))));
    if (firstNumeric) markActiveRow(firstNumeric.parameter);
  }
}

function markActiveRow(param) {
  tableContainer.querySelectorAll('.comparison-table tbody th').forEach(t => {
    t.classList.toggle('active', t.dataset.parameter === param);
  });
}

/* ============================================================
   INSIGHTS
   ============================================================ */
function renderInsights() {
  const cards = [];

  if (metaData.winner) {
    cards.push(`
      <div class="insight-card winner-card">
        <div class="ic-title"><i class="fa-solid fa-crown"></i>Победитель</div>
        <div class="ic-body"><span class="winner-crown"><i class="fa-solid fa-crown"></i></span>${escapeHtml(metaData.winner)}</div>
      </div>
    `);
  }
  if (metaData.summary) {
    cards.push(`
      <div class="insight-card">
        <div class="ic-title"><i class="fa-solid fa-quote-left"></i>Резюме</div>
        <div class="ic-body">${escapeHtml(metaData.summary)}</div>
      </div>
    `);
  }
  if (metaData.insights && metaData.insights.length) {
    cards.push(`
      <div class="insight-card">
        <div class="ic-title"><i class="fa-solid fa-bolt"></i>Ключевые инсайты</div>
        <div class="ic-body"><ul>${metaData.insights.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul></div>
      </div>
    `);
  }
  if (metaData.category) {
    cards.push(`
      <div class="insight-card">
        <div class="ic-title"><i class="fa-solid fa-tag"></i>Категория</div>
        <div class="ic-body">${escapeHtml(metaData.category)}</div>
      </div>
    `);
  }
  if (metaData.primaryMetric) {
    cards.push(`
      <div class="insight-card">
        <div class="ic-title"><i class="fa-solid fa-bullseye"></i>KPI</div>
        <div class="ic-body">${escapeHtml(metaData.primaryMetric)}</div>
      </div>
    `);
  }
  insightsGrid.innerHTML = cards.join('') || '<div class="insight-card"><div class="ic-body">Нет данных для отображения.</div></div>';
}

/* ============================================================
   CHART
   ============================================================ */
function drawParameterChart(paramName) {
  if (!comparisonData) return;
  const row = comparisonData.find(i => i.parameter === paramName);
  if (!row) return;
  markActiveRow(paramName);

  const values = row.values.map(v => parseFloat(String(v).replace(/[^0-9.,-]/g, '').replace(',', '.')));
  if (values.some(v => isNaN(v))) {
    chartTitleText.innerText = paramName;
    chartWrapper.innerHTML = `<div class="placeholder"><i class="fa-solid fa-ban"></i><p>Нечисловые данные</p><small>Нельзя отобразить на диаграмме</small></div>`;
    if (currentChart) { currentChart.destroy(); currentChart = null; }
    return;
  }

  chartWrapper.innerHTML = `<canvas id="comparisonChart"></canvas>`;
  chartTitleText.innerText = paramName;
  drawChart(objectNames, values, paramName);
}

function redrawChart() {
  if (!comparisonData) return;
  const active = tableContainer.querySelector('.comparison-table th.active');
  const param = active ? active.dataset.parameter : metaData.primaryMetric || comparisonData[0].parameter;
  drawParameterChart(param);
}

function drawChart(labels, values, title) {
  const canvas = $('comparisonChart');
  if (!canvas) return;
  if (currentChart) currentChart.destroy();

  const isDark = document.body.classList.contains('dark-theme');
  const textColor = isDark ? '#e2e8f0' : '#0f172a';
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(15,23,42,0.08)';
  const bgColor = isDark ? '#0b0b14' : '#ffffff';

  const palette = isDark
    ? ['#818cf8','#f472b6','#34d399','#fbbf24','#60a5fa','#c084fc','#fb7185','#22d3ee']
    : ['#6366f1','#ec4899','#10b981','#f59e0b','#3b82f6','#8b5cf6','#ef4444','#06b6d4'];

  const chartColors = labels.map((_, i) => palette[i % palette.length]);
  const chartColorsAlpha = chartColors.map(c => c + 'CC');

  const baseOptions = {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 700, easing: 'easeOutQuart' },
    plugins: {
      legend: {
        display: ['pie','doughnut','polarArea','radar'].includes(currentChartType),
        position: 'bottom',
        labels: {
          color: textColor,
          font: { size: 12, weight: '600', family: 'Inter' },
          padding: 14,
          usePointStyle: true,
          pointStyle: 'circle'
        }
      },
      title: { display: false },
      tooltip: {
        backgroundColor: isDark ? '#1e1e28' : '#0f172a',
        titleColor: '#fff',
        bodyColor: '#e2e8f0',
        padding: 12,
        cornerRadius: 10,
        titleFont: { size: 13, weight: '700' },
        bodyFont: { size: 13 },
        borderColor: isDark ? '#334155' : '#1e293b',
        borderWidth: 1
      },
      datalabels: {
        color: textColor,
        font: { weight: '700', size: 12 },
        formatter: v => (typeof v === 'number' ? v.toLocaleString('ru-RU') : v),
        anchor: 'end',
        align: 'end',
        offset: 4,
        clamp: true
      }
    }
  };

  let type = currentChartType;
  let chartLabels = labels;
  let chartValues = values;

  if (type === 'horizontalBar') { type = 'bar'; }

  if (type === 'scatter') {
    chartValues = values.map((v, i) => ({ x: i, y: v }));
    baseOptions.plugins.datalabels.formatter = (v, ctx) => ctx.dataset.data[ctx.dataIndex].y.toLocaleString('ru-RU');
    baseOptions.scales = {
      x: {
        beginAtZero: true,
        ticks: { color: textColor, callback: v => labels[v] || '' },
        grid: { color: gridColor }
      },
      y: {
        beginAtZero: true,
        ticks: { color: textColor },
        grid: { color: gridColor }
      }
    };
  }
  if (type === 'bubble') {
    chartValues = values.map((v, i) => ({ x: i, y: v, r: Math.max(8, Math.min(30, Math.abs(v) / 10)) }));
    baseOptions.plugins.datalabels.formatter = (v, ctx) => ctx.dataset.data[ctx.dataIndex].y.toLocaleString('ru-RU');
    baseOptions.scales = {
      x: {
        beginAtZero: true,
        ticks: { color: textColor, callback: v => labels[v] || '' },
        grid: { color: gridColor }
      },
      y: {
        beginAtZero: true,
        ticks: { color: textColor },
        grid: { color: gridColor }
      }
    };
  }

  if (['bar','line','horizontalBar','radar'].includes(currentChartType)) {
    const maxVal = Math.max(...values);
    baseOptions.scales = {
      x: {
        beginAtZero: true,
        suggestedMax: currentChartType === 'radar' ? undefined : maxVal * 1.2,
        ticks: { color: textColor, font: { size: 11, weight: '600' } },
        grid: { color: gridColor, drawBorder: false }
      },
      y: {
        beginAtZero: true,
        suggestedMax: currentChartType === 'radar' ? undefined : maxVal * 1.2,
        ticks: { color: textColor, font: { size: 11, weight: '600' } },
        grid: { color: gridColor, drawBorder: false }
      }
    };
    if (currentChartType === 'radar') {
      delete baseOptions.scales;
      baseOptions.scales = {
        r: {
          angleLines: { color: gridColor },
          grid: { color: gridColor },
          pointLabels: { color: textColor, font: { size: 12, weight: '600' } },
          ticks: { color: textColor, backdropColor: 'transparent' },
          beginAtZero: true
        }
      };
      baseOptions.plugins.datalabels.display = false;
    }
    if (currentChartType === 'horizontalBar') {
      baseOptions.indexAxis = 'y';
      baseOptions.plugins.datalabels.anchor = 'end';
      baseOptions.plugins.datalabels.align = 'right';
    }
  }

  if (['pie','doughnut','polarArea'].includes(currentChartType)) {
    baseOptions.plugins.datalabels.color = '#ffffff';
    baseOptions.plugins.datalabels.textStrokeColor = isDark ? '#0b0b14' : '#000';
    baseOptions.plugins.datalabels.textStrokeWidth = 3;
    baseOptions.plugins.datalabels.anchor = 'center';
    baseOptions.plugins.datalabels.align = 'center';
    baseOptions.plugins.datalabels.font = { size: 13, weight: '800' };
  }

  const dataset = {
    label: title,
    data: chartValues,
    backgroundColor: chartColorsAlpha,
    borderColor: chartColors,
    borderWidth: 2,
    borderRadius: currentChartType === 'bar' ? 8 : 0,
    hoverOffset: 8,
    tension: 0.35,
    fill: currentChartType === 'radar'
  };
  if (currentChartType === 'line') {
    dataset.pointBackgroundColor = chartColors;
    dataset.pointBorderColor = '#fff';
    dataset.pointBorderWidth = 2;
    dataset.pointRadius = 6;
    dataset.pointHoverRadius = 9;
    dataset.backgroundColor = 'transparent';
    dataset.borderWidth = 3;
  }

  currentChart = new Chart(canvas.getContext('2d'), {
    type,
    data: { labels: chartLabels, datasets: [dataset] },
    options: baseOptions,
    plugins: [{
      id: 'bgFill',
      beforeDraw: (chart) => {
        const ctx = chart.ctx;
        ctx.save();
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, chart.width, chart.height);
        ctx.restore();
      }
    }]
  });
}

function saveChartAsPNG() {
  if (!currentChart) { showToast('Нет диаграммы для сохранения', 'error'); return; }
  const link = document.createElement('a');
  link.href = currentChart.toBase64Image('image/png', 1.0);
  const name = (tableTitleText.innerText || 'chart').replace(/\s+/g, '_').replace(/[^\wа-яА-Я\-_]/gi, '');
  link.download = `versus_${name}.png`;
  link.click();
  showToast('Диаграмма сохранена', 'success');
}

/* ============================================================
   EXPORT & SHARE
   ============================================================ */
function copyTableToClipboard() {
  if (!comparisonData) return;
  const lines = ['Параметр\t' + objectNames.join('\t')];
  comparisonData.forEach(r => lines.push(r.parameter + '\t' + r.values.join('\t')));
  navigator.clipboard.writeText(lines.join('\n')).then(() => showToast('Скопировано в буфер', 'success'));
}

function exportCSV() {
  if (!comparisonData) return;
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [['Параметр', ...objectNames].map(esc).join(',')];
  comparisonData.forEach(r => lines.push([r.parameter, ...r.values].map(esc).join(',')));
  downloadBlob(lines.join('\n'), `versus_${Date.now()}.csv`, 'text/csv;charset=utf-8');
  showToast('CSV сохранён', 'success');
}

function exportJSON() {
  if (!comparisonData) return;
  const payload = { meta: metaData, objectNames, comparisonData };
  downloadBlob(JSON.stringify(payload, null, 2), `versus_${Date.now()}.json`, 'application/json');
  showToast('JSON сохранён', 'success');
}

function exportHTML() {
  if (!comparisonData) return;
  const tableHtml = tableContainer.innerHTML;
  const html = `<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>${escapeHtml(metaData.title || 'Сравнение')}</title>
<style>
body{font-family:system-ui,sans-serif;padding:30px;background:#f4f6fb;color:#0f172a}
h1{font-size:24px;margin-bottom:6px}
h2{font-size:15px;color:#64748b;font-weight:500;margin-top:0}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08)}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid #e2e8f0}

function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

function shareComparison() {
  if (!comparisonData) { showToast('Нет данных для share', 'error'); return; }
  try {
    const payload = { meta: metaData, objectNames, comparisonData };
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    const url = `${location.origin}${location.pathname}#d=${encoded}`;
    navigator.clipboard.writeText(url).then(() => showToast('Ссылка скопирована', 'success'));
    history.replaceState(null, '', url);
  } catch (e) { showToast('Не удалось создать ссылку', 'error'); }
}

function handleShareParam() {
  if (!location.hash.startsWith('#d=')) return;
  try {
    const raw = decodeURIComponent(escape(atob(location.hash.slice(3))));
    const data = JSON.parse(raw);
    if (data.comparisonData && data.objectNames) {
      comparisonData = data.comparisonData;
      objectNames = data.objectNames;
      metaData = data.meta || {};
      tableTitleText.innerText = metaData.title || 'Сравнение';
      chartTitleText.innerText = metaData.title || 'Сравнение';
      if (metaData.suggestedChartType && CHART_TYPES.some(t => t.id === metaData.suggestedChartType)) currentChartType = metaData.suggestedChartType;
      updateChartTypeBarUI();
      renderTable();
      renderInsights();
      showResults();
      const primary = comparisonData.find(i => i.parameter === metaData.primaryMetric) || comparisonData[0];
      if (primary) drawParameterChart(primary.parameter);
    }
  } catch (e) { console.warn('Share parse error', e); }
}

/* ============================================================
   HISTORY
   ============================================================ */
function loadHistory() {
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { history = []; }
}

function saveToHistory(entry) {
  history.unshift({
    query: entry.query,
    timestamp: entry.timestamp,
    meta: {
      title: entry.data.title || 'Сравнение',
      objectNames: entry.data.objectNames,
      comparisonData: entry.data.comparisonData,
      category: entry.data.category,
      primaryMetric: entry.data.primaryMetric,
      winner: entry.data.winner,
      summary: entry.data.summary,
      insights: entry.data.insights,
      suggestedChartType: entry.data.suggestedChartType
    }
  });
  history = history.slice(0, 30);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
}

function openHistoryModal() {
  if (history.length === 0) {
    historyList.innerHTML = '<div class="placeholder" style="padding: 24px;"><i class="fa-solid fa-inbox"></i><p>История пуста</p></div>';
  } else {
    historyList.innerHTML = history.map((h, i) => `
      <div class="history-item" data-idx="${i}">
        <div>
          <div class="hi-title">${escapeHtml(h.meta.title || h.query)}</div>
          <div class="hi-meta">${new Date(h.timestamp).toLocaleString('ru-RU')} · ${escapeHtml((h.meta.objectNames || []).join(' vs '))}</div>
        </div>
        <span class="hi-del" data-del="${i}"><i class="fa-solid fa-xmark"></i></span>
      </div>
    `).join('');
    historyList.querySelectorAll('.history-item').forEach(el => {
      el.onclick = (ev) => {
        if (ev.target.closest('.hi-del')) return;
        const item = history[+el.dataset.idx];
        if (item) {
          comparisonData = item.meta.comparisonData;
          objectNames = item.meta.objectNames;
          metaData = { ...item.meta, lastQuery: item.query };
          tableTitleText.innerText = metaData.title || 'Сравнение';
          chartTitleText.innerText = metaData.title || 'Сравнение';
          if (metaData.suggestedChartType && CHART_TYPES.some(t => t.id === metaData.suggestedChartType)) currentChartType = metaData.suggestedChartType;
          updateChartTypeBarUI();
          renderTable(); renderInsights(); showResults();
          const p = comparisonData.find(i => i.parameter === metaData.primaryMetric) || comparisonData[0];
          if (p) drawParameterChart(p.parameter);
          historyModal.classList.remove('active');
        }
      };
    });
    historyList.querySelectorAll('[data-del]').forEach(el => {
      el.onclick = (ev) => {
        ev.stopPropagation();
        history.splice(+el.dataset.del, 1);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        openHistoryModal();
      };
    });
  }
  historyModal.classList.add('active');
}

function clearHistory() {
  if (!confirm('Очистить всю историю?')) return;
  history = [];
  localStorage.removeItem(HISTORY_KEY);
  openHistoryModal();
  showToast('История очищена', 'success');
}

/* ============================================================
   UTILS
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

let toastTimer = null;
function showToast(msg, type = '') {
  toast.textContent = msg;
  toast.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

window.drawParameterChart = drawParameterChart;
</script>
</body>
</html>
