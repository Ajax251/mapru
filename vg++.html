<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВидеоГид — Виртуальные путешествия по миру</title>

    <!-- Шрифты и иконки -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="img/videog.png" type="image/x-icon">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-glow: rgba(102, 126, 234, 0.5);
            --dark-bg: #070709;
            --card-bg: #121318;
            --glass-bg: rgba(22, 24, 32, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #667eea;
            --danger-color: #ef4444;
            --border-radius: 20px;
            --transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: #262936;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(102, 126, 234, 0.12), transparent 35%),
                radial-gradient(circle at 85% 20%, rgba(118, 75, 162, 0.12), transparent 35%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Шапка и панель управления --- */
        .hero-header {
            padding: 40px 32px 24px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
        }

        .brand-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .brand-text span {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .random-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            backdrop-filter: blur(12px);
        }

        .random-btn i {
            color: #a78bfa;
            transition: transform 0.4s ease;
        }

        .random-btn:hover {
            border-color: var(--accent-color);
            background: rgba(102, 126, 234, 0.15);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.25);
            transform: translateY(-2px);
        }

        .random-btn:hover i {
            transform: rotate(180deg);
        }

        /* --- Поиск и Фильтры --- */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 18px;
            backdrop-filter: blur(16px);
        }

        .filter-tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .filter-btn.active {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.35);
        }

        .filter-count {
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 2px 7px;
            border-radius: 20px;
        }

        .right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            justify-content: flex-end;
        }

        .type-select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .type-select:focus, .type-select:hover {
            border-color: var(--accent-color);
        }

        .type-select option {
            background: #161820;
            color: #fff;
        }

        .search-box {
            position: relative;
            min-width: 240px;
            max-width: 320px;
            width: 100%;
        }

        .search-box i.search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 36px 10px 38px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: none;
            padding: 4px;
        }

        .clear-search:hover {
            color: var(--text-primary);
        }

        /* --- Сетка карточек --- */
        main {
            flex-grow: 1;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 32px 60px;
        }

        .city-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 28px;
        }

        .city-card {
            position: relative;
            height: 270px;
            border-radius: var(--border-radius);
            overflow: hidden;
            cursor: pointer;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            animation: fadeInUp 0.45s ease-out forwards;
            opacity: 0;
            user-select: none;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.65s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: brightness(0.9);
        }

        .city-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(7, 7, 9, 0.95) 0%,
                rgba(7, 7, 9, 0.45) 45%,
                rgba(7, 7, 9, 0.15) 100%
            );
            transition: var(--transition);
        }

        .city-card:hover {
            transform: translateY(-8px);
            border-color: rgba(102, 126, 234, 0.6);
            box-shadow: 
                0 14px 34px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(102, 126, 234, 0.35);
        }

        .city-card:hover .card-img {
            transform: scale(1.08);
            filter: brightness(1.05);
        }

        /* Верхние элементы карточки */
        .card-top-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 3;
        }

        .region-badge {
            background: rgba(15, 17, 23, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 5px 11px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fav-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(15, 17, 23, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .fav-btn:hover {
            transform: scale(1.12);
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }

        .fav-btn.active {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
        }

        /* Центральная иконка Play при наведении */
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            opacity: 0;
            z-index: 3;
            transition: var(--transition);
            box-shadow: 0 0 25px rgba(102, 126, 234, 0.7);
        }

        .play-overlay i {
            margin-left: 3px;
        }

        .city-card:hover .play-overlay {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Нижний контент карточки */
        .city-card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .city-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .video-count {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .video-count i {
            color: var(--accent-color);
        }

        .mode-icons {
            display: flex;
            gap: 6px;
        }

        .mode-icon-pill {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Пустое состояние поиска */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            background: var(--glass-bg);
            border: 1px dashed var(--glass-border);
            border-radius: var(--border-radius);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 16px;
            opacity: 0.7;
        }

        .empty-state h3 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .reset-btn {
            background: var(--primary-gradient);
            border: none;
            color: #fff;
            padding: 10px 22px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
        }

        /* --- Модальное окно плеера --- */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            z-index: 1000;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #000;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            transform: scale(0.94);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        /* Верхняя плашка в плеере */
        .modal-top-bar {
            position: fixed;
            top: 20px;
            left: 24px;
            z-index: 1002;
            background: rgba(15, 17, 23, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 18px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .modal-top-bar h2 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .modal-top-bar span {
            font-size: 0.85rem;
            color: #a5b4fc;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-left: 12px;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
        }

        .video-player-wrapper {
            flex-grow: 1;
            background: #000;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .video-player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: relative;
            z-index: 2;
        }

        /* Спиннер загрузки видео */
        .video-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Боковая панель управления в плеере */
        .header-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1002;
        }

        .control-circle-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .close-button {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35);
        }

        .close-button:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 8px 28px rgba(239, 68, 68, 0.6);
        }

        .video-selector {
            position: relative;
        }

        .video-selector-trigger {
            background: var(--primary-gradient);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.35);
        }

        .video-selector-trigger:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 28px rgba(102, 126, 234, 0.6);
        }

        .video-selector-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #10b981;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #000;
        }

        .video-options-list {
            display: none;
            position: absolute;
            top: 50%;
            right: 62px;
            transform: translateY(-50%);
            background: rgba(20, 23, 32, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 8px;
            list-style: none;
            width: max-content;
            min-width: 210px;
            border: 1px solid rgba(102, 126, 234, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .video-selector.is-open .video-options-list {
            display: block;
            animation: fadeInLeft 0.2s ease-out forwards;
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translate(10px, -50%); }
            to { opacity: 1; transform: translate(0, -50%); }
        }

        .video-option {
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .video-option + .video-option {
            margin-top: 4px;
        }

        .video-option:hover {
            background: rgba(102, 126, 234, 0.15);
            color: var(--text-primary);
        }

        .video-option.active {
            background: var(--primary-gradient);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Адаптивность для мобильных устройств --- */
        @media (max-width: 768px) {
            .hero-header {
                padding: 24px 16px 16px;
            }
            main {
                padding: 12px 16px 40px;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .right-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box {
                max-width: 100%;
            }
            .header-controls {
                top: auto;
                bottom: 24px;
                right: 20px;
                transform: none;
                flex-direction: row;
            }
            .video-options-list {
                top: auto;
                bottom: 62px;
                right: 0;
                transform: none;
            }
            .modal-top-bar {
                top: 14px;
                left: 14px;
                right: 14px;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <header class="hero-header">
        <div class="top-bar">
            <a href="#" class="brand">
                <div class="brand-icon">
                    <i class="fas fa-globe-americas"></i>
                </div>
                <div class="brand-text">
                    <h1>ВидеоГид</h1>
                    <span>Виртуальные прогулки, 360° VR и аэросъемка городов</span>
                </div>
            </a>

            <button class="random-btn" id="random-city-btn" title="Открыть случайный город">
                <i class="fas fa-dice"></i>
                <span>Случайный город</span>
            </button>
        </div>

        <div class="controls-bar">
            <div class="filter-tabs" id="region-filters">
                <button class="filter-btn active" data-region="all">
                    Все <span class="filter-count" id="count-all">0</span>
                </button>
                <button class="filter-btn" data-region="ru">
                    Россия <span class="filter-count" id="count-ru">0</span>
                </button>
                <button class="filter-btn" data-region="world">
                    Мир <span class="filter-count" id="count-world">0</span>
                </button>
                <button class="filter-btn" data-region="fav">
                    <i class="fas fa-heart" style="color: #ef4444;"></i> Избранное <span class="filter-count" id="count-fav">0</span>
                </button>
            </div>

            <div class="right-controls">
                <select class="type-select" id="type-filter" title="Фильтр по формату видео">
                    <option value="all">Все форматы съемки</option>
                    <option value="air">🚁 Аэросъемка</option>
                    <option value="ground">🚗 Авто / Прогулка</option>
                    <option value="vr">🥽 360° VR</option>
                </select>

                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search-input" placeholder="Поиск города...">
                    <button class="clear-search" id="clear-search" title="Очистить"><i class="fas fa-times"></i></button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="city-grid" id="city-grid"></div>
    </main>

    <!-- Модальное окно с видеоплеером -->
    <div class="modal" id="video-modal">
        <div class="modal-top-bar">
            <h2 id="modal-city-name">Город</h2>
            <span id="modal-video-title"><i class="fas fa-video"></i> Просмотр</span>
        </div>

        <div class="modal-content">
            <div class="video-player-wrapper" id="video-player-wrapper"></div>
        </div>

        <div class="header-controls">
            <div id="video-selector-container"></div>
            <button class="control-circle-btn close-button" id="close-button" title="Закрыть (Esc)">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const citiesData = [
                // --- Города России ---
                { name: 'Аксубаево', region: 'ru', thumbnail: 'img/aks.jpg', videos: [{ title: 'Аэросъемка', videoId: 'eaeclBGlVFw', icon: 'fas fa-helicopter' }] },
                { name: 'Казань', region: 'ru', thumbnail: 'https://i.ytimg.com/vi/mGZ8OP1urIs/hqdefault.jpg', videos: [{ title: 'Аэросъемка', videoId: 'mGZ8OP1urIs', icon: 'fas fa-helicopter' }, { title: 'Аэросъемка', videoId: 'xUTL0-k8jOM', icon: 'fas fa-helicopter' }] },
                { name: 'Лениногорск', region: 'ru', thumbnail: 'img/len.jpg', videos: [{ title: 'Аэросъемка', videoId: 'jh6mqMypZUA', icon: 'fas fa-helicopter' }, { title: 'Аэросъемка', videoId: 'y6ZhRaFY6GE', icon: 'fas fa-helicopter' }] },
                { name: 'Москва', region: 'ru', thumbnail: 'https://i.ytimg.com/vi/Anvu-V-fWL8/hqdefault.jpg', videos: [{ title: 'Дневная поездка', videoId: 'Anvu-V-fWL8', icon: 'fas fa-sun' }, { title: 'Аэросъемка', videoId: 'n6jEjkxnH84', icon: 'fas fa-helicopter' }, { title: 'Аэросъемка', videoId: 'S_dfq9rFWAE', icon: 'fas fa-helicopter' }, { title: '360° VR Прогулка', videoId: 'JdPZgC4Uws8', icon: 'fas fa-vr-cardboard' }] },
                { name: 'Нурлат', region: 'ru', thumbnail: 'https://i.ytimg.com/vi/_3Bl-nMxjNE/hqdefault.jpg', videos: [{ title: 'Аэросъемка', videoId: '_3Bl-nMxjNE', icon: 'fas fa-helicopter' }] },
                { name: 'Самара', region: 'ru', thumbnail: 'https://i.ytimg.com/vi/HtkXJ1bztC4/hqdefault.jpg', videos: [{ title: 'Аэросъемка', videoId: 'HtkXJ1bztC4', icon: 'fas fa-helicopter' }] },
                { name: 'Санкт-Петербург', region: 'ru', thumbnail: 'https://i.ytimg.com/vi/-rKwD2UtwM8/hqdefault.jpg', videos: [{ title: 'Аэросъемка', videoId: '-rKwD2UtwM8', icon: 'fas fa-helicopter' }] },
                { name: 'Чистополь', region: 'ru', thumbnail: 'img/chis.jpg', videos: [{ title: 'Аэросъемка', videoId: 'FejI9ZWMsAg', icon: 'fas fa-helicopter' }, { title: 'Аэросъемка', videoId: '-f3OUuBt0tA', icon: 'fas fa-helicopter' }] },
                
                // --- Города мира ---
                { name: 'Барселона', region: 'world', thumbnail: 'https://i.ytimg.com/vi/8U_ff5DObNs/hqdefault.jpg', videos: [{ title: '360° VR Прогулка', videoId: '8U_ff5DObNs', icon: 'fas fa-vr-cardboard' }] },
                { name: 'Буэнос-Айрес', region: 'world', thumbnail: 'https://i.ytimg.com/vi/VZKuJcpgCA8/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'N0KMUzbaVp8', icon: 'fas fa-car' }] },
                { name: 'Дубай', region: 'world', thumbnail: 'https://i.ytimg.com/vi/6RPU08WoaxE/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: '6RPU08WoaxE', icon: 'fas fa-car' }] },
                { name: 'Йоханнесбург', region: 'world', thumbnail: 'https://i.ytimg.com/vi/PnJKV9vSvQQ/hqdefault.jpg', videos: [{ title: 'Аэросъемка', videoId: 'PnJKV9vSvQQ', icon: 'fas fa-helicopter' }] },
                { name: 'Лондон', region: 'world', thumbnail: 'https://i.ytimg.com/vi/QI4_dGvZ5yE/hqdefault.jpg', videos: [{ title: 'Вечерний тур', videoId: 'QI4_dGvZ5yE', icon: 'fas fa-moon' }, { title: 'Аэросъемка', videoId: 'mJlIWKqVOD0', icon: 'fas fa-helicopter' }, { title: '360° VR Поездка', videoId: 'KGerjHMa90s', icon: 'fas fa-vr-cardboard' }] },
                { name: 'Лос-Анджелес', region: 'world', thumbnail: 'https://i.ytimg.com/vi/LhugUvU7Zsk/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'LhugUvU7Zsk', icon: 'fas fa-car' }] },
                { name: 'Мадрид', region: 'world', thumbnail: 'https://i.ytimg.com/vi/C911U_Fo-QU/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'C911U_Fo-QU', icon: 'fas fa-car' }] },
                { name: 'Мехико', region: 'world', thumbnail: 'https://i.ytimg.com/vi/Km6KYN_6vmc/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'Km6KYN_6vmc', icon: 'fas fa-car' }] },
                { name: 'Нью-Йорк', region: 'world', thumbnail: 'https://i.ytimg.com/vi/7OgQjRn2x1w/hqdefault.jpg', videos: [{ title: 'Поездка по Манхэттену', videoId: '7OgQjRn2x1w', icon: 'fas fa-car' }, { title: 'Аэросъемка', videoId: 'hHMiBYXsYs4', icon: 'fas fa-helicopter' }] },
                { name: 'Париж', region: 'world', thumbnail: 'https://i.ytimg.com/vi/FBjjYw-xcdg/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'FBjjYw-xcdg', icon: 'fas fa-car' }, { title: 'Аэросъемка', videoId: 'mJlIWKqVOD0', icon: 'fas fa-helicopter' }, { title: '360° VR Тур', videoId: 'nbD8XYTw23Y', icon: 'fas fa-vr-cardboard' }] },
                { name: 'Рим', region: 'world', thumbnail: 'https://i.ytimg.com/vi/ytiM1nMv_xU/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'IT7KPqAZQLQ', icon: 'fas fa-car' }] },
                { name: 'Рио-де-Жанейро', region: 'world', thumbnail: 'https://i.ytimg.com/vi/q83bl_GcsCo/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'pdBnIhWmfYM', icon: 'fas fa-car' }, { title: 'Аэросъемка', videoId: 'n0NV8JaLBRw', icon: 'fas fa-helicopter' }] },
                { name: 'Сидней', region: 'world', thumbnail: 'https://i.ytimg.com/vi/wMu6Va5PhGY/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'wMu6Va5PhGY', icon: 'fas fa-car' }] },
                { name: 'Стамбул', region: 'world', thumbnail: 'https://i.ytimg.com/vi/LBjC1JVy9-0/hqdefault.jpg', videos: [{ title: 'Прогулка по городу', videoId: 'LBjC1JVy9-0', icon: 'fas fa-walking' }, { title: 'Аэросъемка', videoId: 'm6zEYnUUnGQ', icon: 'fas fa-helicopter' }] },
                { name: 'Ташкент', region: 'world', thumbnail: 'https://i.ytimg.com/vi/fz6rXEXk-Wg/hqdefault.jpg', videos: [{ title: 'Аэросъемка', videoId: 'fz6rXEXk-Wg', icon: 'fas fa-helicopter' }] },
                { name: 'Токио', region: 'world', thumbnail: 'https://i.ytimg.com/vi/qPgWV8Rxemo/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'qPgWV8Rxemo', icon: 'fas fa-car' }, { title: 'Аэросъемка', videoId: 'Ic_7K5Nk5gg', icon: 'fas fa-helicopter' }] },
                { name: 'Чикаго', region: 'world', thumbnail: 'https://i.ytimg.com/vi/KpwzLSnv0A8/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'KpwzLSnv0A8', icon: 'fas fa-car' }] },
                { name: 'Шанхай', region: 'world', thumbnail: 'https://i.ytimg.com/vi/MAiltiE8tgI/hqdefault.jpg', videos: [{ title: 'Поездка по городу', videoId: 'MAiltiE8tgI', icon: 'fas fa-car' }] }
            ];

            // Состояние фильтров и избранного
            let favorites = JSON.parse(localStorage.getItem('videoguide_favs') || '[]');
            let activeRegion = 'all';
            let activeType = 'all';
            let searchQuery = '';

            // Элементы DOM
            const cityGrid = document.getElementById('city-grid');
            const modal = document.getElementById('video-modal');
            const modalCityName = document.getElementById('modal-city-name');
            const modalVideoTitle = document.getElementById('modal-video-title');
            const videoPlayerWrapper = document.getElementById('video-player-wrapper');
            const videoSelectorContainer = document.getElementById('video-selector-container');
            const closeButton = document.getElementById('close-button');
            const searchInput = document.getElementById('search-input');
            const clearSearchBtn = document.getElementById('clear-search');
            const typeFilter = document.getElementById('type-filter');
            const randomBtn = document.getElementById('random-city-btn');

            // Обновление счетчиков на вкладках
            function updateCounters() {
                document.getElementById('count-all').textContent = citiesData.length;
                document.getElementById('count-ru').textContent = citiesData.filter(c => c.region === 'ru').length;
                document.getElementById('count-world').textContent = citiesData.filter(c => c.region === 'world').length;
                document.getElementById('count-fav').textContent = favorites.length;
            }

            // Проверка типа съемки
            function matchesVideoType(city, type) {
                if (type === 'all') return true;
                return city.videos.some(v => {
                    if (type === 'air') return v.icon.includes('helicopter');
                    if (type === 'vr') return v.icon.includes('vr-cardboard');
                    if (type === 'ground') return v.icon.includes('car') || v.icon.includes('walking') || v.icon.includes('sun') || v.icon.includes('moon');
                    return true;
                });
            }

            // Переключение избранного
            function toggleFavorite(cityName, btnElement) {
                if (favorites.includes(cityName)) {
                    favorites = favorites.filter(name => name !== cityName);
                    btnElement.classList.remove('active');
                } else {
                    favorites.push(cityName);
                    btnElement.classList.add('active');
                }
                localStorage.setItem('videoguide_favs', JSON.stringify(favorites));
                updateCounters();

                if (activeRegion === 'fav') {
                    renderCityCards();
                }
            }

            // Отрисовка карточек городов
            function renderCityCards() {
                cityGrid.innerHTML = '';

                const filtered = citiesData.filter(city => {
                    const matchRegion = 
                        activeRegion === 'all' ? true :
                        activeRegion === 'fav' ? favorites.includes(city.name) :
                        city.region === activeRegion;

                    const matchSearch = city.name.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchType = matchesVideoType(city, activeType);

                    return matchRegion && matchSearch && matchType;
                });

                if (filtered.length === 0) {
                    cityGrid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-compass"></i>
                            <h3>Города не найдены</h3>
                            <p>Попробуйте изменить параметры поиска или переключить фильтр</p>
                            <button class="reset-btn" id="reset-filters-btn">Сбросить фильтры</button>
                        </div>
                    `;
                    document.getElementById('reset-filters-btn')?.addEventListener('click', () => {
                        activeRegion = 'all';
                        activeType = 'all';
                        searchQuery = '';
                        searchInput.value = '';
                        typeFilter.value = 'all';
                        clearSearchBtn.style.display = 'none';
                        document.querySelectorAll('#region-filters .filter-btn').forEach(b => {
                            b.classList.toggle('active', b.dataset.region === 'all');
                        });
                        renderCityCards();
                    });
                    return;
                }

                filtered.forEach((city, i) => {
                    const card = document.createElement('div');
                    card.className = 'city-card';
                    card.style.animationDelay = `${Math.min(i * 0.03, 0.4)}s`;

                    const isFav = favorites.includes(city.name);
                    const fallbackThumb = `https://i.ytimg.com/vi/${city.videos[0].videoId}/hqdefault.jpg`;
                    const uniqueIcons = [...new Set(city.videos.map(v => v.icon))];

                    card.innerHTML = `
                        <img class="card-img" src="${city.thumbnail}" alt="${city.name}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackThumb}';">
                        <div class="card-top-bar">
                            <span class="region-badge">
                                <i class="fas ${city.region === 'ru' ? 'fa-map-marker-alt' : 'fa-globe'}"></i>
                                ${city.region === 'ru' ? 'Россия' : 'Мир'}
                            </span>
                            <button class="fav-btn ${isFav ? 'active' : ''}" title="В избранное">
                                <i class="fas fa-heart"></i>
                            </button>
                        </div>
                        <div class="play-overlay">
                            <i class="fas fa-play"></i>
                        </div>
                        <div class="city-card-content">
                            <div class="city-info">
                                <h3>${city.name}</h3>
                                <div class="video-count">
                                    <i class="fas fa-film"></i>
                                    <span>${city.videos.length} видео</span>
                                </div>
                            </div>
                            <div class="mode-icons">
                                ${uniqueIcons.map(icon => `<div class="mode-icon-pill"><i class="${icon}"></i></div>`).join('')}
                            </div>
                        </div>
                    `;

                    // Клик по кнопке "Избранное"
                    const favBtn = card.querySelector('.fav-btn');
                    favBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleFavorite(city.name, favBtn);
                    });

                    // Клик по карточке -> Открытие видео
                    card.addEventListener('click', () => openModal(city));

                    cityGrid.appendChild(card);
                });
            }

            // Форматирование названий видео (добавляет #1, #2, если названия одинаковые)
            function getFormattedVideos(videos) {
                const counts = {};
                videos.forEach(v => counts[v.title] = (counts[v.title] || 0) + 1);
                const currentIndex = {};

                return videos.map(v => {
                    if (counts[v.title] > 1) {
                        currentIndex[v.title] = (currentIndex[v.title] || 0) + 1;
                        return { ...v, displayTitle: `${v.title} #${currentIndex[v.title]}` };
                    }
                    return { ...v, displayTitle: v.title };
                });
            }

            // Открытие модального окна
            function openModal(city) {
                videoSelectorContainer.innerHTML = '';
                modalCityName.textContent = city.name;

                const formattedVideos = getFormattedVideos(city.videos);
                playVideo(formattedVideos[0]);

                if (formattedVideos.length > 1) {
                    const optionsHTML = formattedVideos.map((video, index) => `
                        <li class="video-option ${index === 0 ? 'active' : ''}" 
                            data-video-id="${video.videoId}" 
                            data-title="${video.displayTitle}" 
                            data-icon="${video.icon}">
                            <i class="${video.icon}"></i>
                            <span>${video.displayTitle}</span>
                        </li>
                    `).join('');

                    videoSelectorContainer.innerHTML = `
                        <div class="video-selector">
                            <button class="control-circle-btn video-selector-trigger" title="Выбрать ракурс / видео">
                                <i class="fas fa-layer-group"></i>
                                <span class="video-selector-badge">${formattedVideos.length}</span>
                            </button>
                            <ul class="video-options-list">${optionsHTML}</ul>
                        </div>
                    `;

                    const selector = videoSelectorContainer.querySelector('.video-selector');
                    const trigger = selector.querySelector('.video-selector-trigger');
                    const list = selector.querySelector('.video-options-list');

                    trigger.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selector.classList.toggle('is-open');
                    });

                    list.addEventListener('click', (e) => {
                        const target = e.target.closest('.video-option');
                        if (target && !target.classList.contains('active')) {
                            playVideo({
                                videoId: target.dataset.videoId,
                                displayTitle: target.dataset.title,
                                icon: target.dataset.icon
                            });
                            list.querySelectorAll('.video-option').forEach(opt => opt.classList.remove('active'));
                            target.classList.add('active');
                            selector.classList.remove('is-open');
                        }
                    });
                }

                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            // Закрытие модального окна
            function closeModal() {
                modal.classList.remove('active');
                document.body.style.overflow = 'auto';
                setTimeout(() => {
                    videoPlayerWrapper.innerHTML = '';
                    videoSelectorContainer.innerHTML = '';
                }, 400);
            }

            // Запуск YouTube видео
            function playVideo(videoObj) {
                modalVideoTitle.innerHTML = `<i class="${videoObj.icon}"></i> ${videoObj.displayTitle}`;
                videoPlayerWrapper.innerHTML = `
                    <div class="video-loader">
                        <div class="spinner"></div>
                        <span>Загрузка видеопотока...</span>
                    </div>
                    <iframe 
                        src="https://www.youtube.com/embed/${videoObj.videoId}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&fs=1&controls=1" 
                        allowfullscreen 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
                    </iframe>
                `;
            }

            // --- Слушатели событий фильтрации и поиска ---
            document.querySelectorAll('#region-filters .filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#region-filters .filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeRegion = btn.dataset.region;
                    renderCityCards();
                });
            });

            typeFilter.addEventListener('change', (e) => {
                activeType = e.target.value;
                renderCityCards();
            });

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                clearSearchBtn.style.display = searchQuery ? 'block' : 'none';
                renderCityCards();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearchBtn.style.display = 'none';
                searchInput.focus();
                renderCityCards();
            });

            randomBtn.addEventListener('click', () => {
                const randomIndex = Math.floor(Math.random() * citiesData.length);
                openModal(citiesData[randomIndex]);
            });

            closeButton.addEventListener('click', closeModal);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    closeModal();
                }
            });

            document.addEventListener('click', (e) => {
                const openSelector = document.querySelector('.video-selector.is-open');
                if (openSelector && !openSelector.contains(e.target)) {
                    openSelector.classList.remove('is-open');
                }
            });

            // Инициализация при старте
            updateCounters();
            renderCityCards();
        });
    </script>
</body>
</html>
