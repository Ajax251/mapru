<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101427">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E">
<title>Таймер</title>
<style>
  :root{
    --accent:#2ee59d;
    --accent-2:#19c37d;
    --danger:#ff5f56;
    --glass:rgba(255,255,255,.09);
    --stroke:rgba(255,255,255,.16);
    --text:#f4f6fb;
    --muted:rgba(244,246,251,.62);
    --radius:22px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:#101427;
    transition:background 1.2s ease;
    overflow:hidden;
  }
  body::before{
    content:''; position:fixed; inset:-20%;
    background:
      radial-gradient(closest-side, rgba(255,255,255,.20), transparent) 20% 25%/45% 45% no-repeat,
      radial-gradient(closest-side, rgba(255,255,255,.13), transparent) 80% 75%/50% 50% no-repeat;
    filter:blur(30px); pointer-events:none;
    animation:float 18s ease-in-out infinite alternate;
  }
  @keyframes float{from{transform:translate3d(-2%,-2%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}

  .card{
    position:relative; z-index:1;
    width:100%; max-width:420px;
    background:var(--glass);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid var(--stroke);
    border-radius:var(--radius);
    box-shadow:0 24px 70px rgba(0,0,0,.35);
    padding:22px 22px 26px;
  }

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .clock{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);letter-spacing:.5px}
  .icon-btn{
    width:38px;height:38px;border:1px solid var(--stroke);border-radius:12px;
    background:rgba(0,0,0,.18);color:var(--text);cursor:pointer;font-size:17px;
    display:grid;place-items:center;transition:.2s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
  .icon-btn.on{background:var(--accent-2);border-color:transparent;color:#04150e}

  .tabs{display:flex;gap:8px;margin:16px 0 14px;background:rgba(0,0,0,.22);padding:6px;border-radius:14px}
  .tab{
    flex:1;padding:11px 8px;border:none;border-radius:10px;cursor:pointer;
    background:transparent;color:var(--muted);font-size:14px;font-weight:600;transition:.25s;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .tab:hover{color:var(--text)}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04150e;box-shadow:0 6px 18px rgba(46,229,157,.28)}

  .pane{display:none}
  .pane.show{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  label{font-size:14px;color:var(--muted)}
  input{
    padding:12px 14px;font-size:18px;font-weight:600;text-align:center;
    border:1px solid var(--stroke);border-radius:12px;background:rgba(0,0,0,.24);
    color:var(--text);outline:none;width:110px;font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
  }
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,229,157,.18)}
  .hms{display:flex;gap:8px;justify-content:center}
  .hms .unit{display:flex;flex-direction:column;align-items:center;gap:6px}
  .hms .unit span{font-size:11px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase}
  .hms input{width:84px}

  .presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
  .chip{
    padding:7px 13px;border-radius:999px;border:1px solid var(--stroke);
    background:rgba(0,0,0,.18);color:var(--muted);font-size:13px;cursor:pointer;transition:.2s;
  }
  .chip:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px)}

  .dial{position:relative;width:250px;height:250px;margin:18px auto 6px}
  .dial svg{transform:rotate(-90deg);display:block}
  .track{stroke:rgba(255,255,255,.13)}
  .bar{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset .18s linear}
  .center{position:absolute;inset:0;display:grid;place-items:center;gap:2px;text-align:center}
  .time{font-size:50px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1.05}
  .sub{font-size:12.5px;color:var(--muted);max-width:170px}
  .dial.ringing{animation:pulse .9s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

  .controls{display:flex;gap:10px;margin-top:14px}
  .btn{
    flex:1;padding:15px 10px;border:none;border-radius:14px;cursor:pointer;
    font-size:17px;font-weight:700;color:#04150e;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 26px rgba(46,229,157,.26);transition:.2s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{
    flex:0 0 56px;background:rgba(0,0,0,.22);color:var(--text);
    border:1px solid var(--stroke);box-shadow:none;font-size:18px;
  }
  .btn.stop{background:linear-gradient(135deg,#ff7a70,var(--danger));color:#2b0a08;box-shadow:0 10px 26px rgba(255,95,86,.26)}

  .hint{margin-top:12px;font-size:11.5px;color:rgba(244,246,251,.42);text-align:center}
  .toast{
    position:fixed;top:20px;left:50%;transform:translate(-50%,-140%);
    background:rgba(20,24,40,.92);border:1px solid var(--stroke);color:#fff;
    padding:13px 20px;border-radius:14px;font-weight:600;z-index:99;
    box-shadow:0 14px 40px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,1.3,.4,1);
    backdrop-filter:blur(12px);
  }
  .toast.show{transform:translate(-50%,0)}

  @media(max-width:420px){
    .dial{width:210px;height:210px}
    .time{font-size:42px}
    .hms input{width:72px}
  }
</style>
</head>
<body>

<div class="card">
  <div class="top">
    <button class="icon-btn on" id="soundBtn" title="Звук вкл/выкл">🔔</button>
    <div class="clock" id="clock">--:--:--</div>
    <button class="icon-btn" id="fsBtn" title="Полный экран">⛶</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="interval">⏱️ Интервал</button>
    <button class="tab" data-mode="schedule">📅 Расписание</button>
  </div>

  <div class="pane show" id="pane-interval">
    <div class="hms">
      <div class="unit"><input id="hh" type="number" min="0" max="99" value="0" inputmode="numeric"><span>час</span></div>
      <div class="unit"><input id="mm" type="number" min="0" max="59" value="10" inputmode="numeric"><span>мин</span></div>
      <div class="unit"><input id="ss" type="number" min="0" max="59" value="0" inputmode="numeric"><span>сек</span></div>
    </div>
    <div class="presets">
      <button class="chip" data-sec="60">1 мин</button>
      <button class="chip" data-sec="300">5 мин</button>
      <button class="chip" data-sec="600">10 мин</button>
      <button class="chip" data-sec="1500">25 мин</button>
      <button class="chip" data-sec="2700">45 мин</button>
    </div>
    <div class="row" style="margin-top:14px;justify-content:center;gap:8px">
      <label for="loop">Повторять по кругу</label>
      <input type="checkbox" id="loop" style="width:auto;transform:scale(1.25)">
    </div>
  </div>

  <div class="pane" id="pane-schedule">
    <div class="row">
      <label for="startTime">Первый раз в</label>
      <input type="time" id="startTime" value="14:15">
    </div>
    <div class="row">
      <label for="repeatInterval">Повтор каждые (мин)</label>
      <input type="number" id="repeatInterval" min="1" value="15" inputmode="numeric">
    </div>
    <div class="row">
      <label for="repeatOn">Повторять</label>
      <input type="checkbox" id="repeatOn" checked style="width:auto;transform:scale(1.25)">
    </div>
  </div>

  <div class="dial" id="dial">
    <svg width="100%" height="100%" viewBox="0 0 220 220">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2ee59d"/>
          <stop offset="100%" stop-color="#4dd0ff"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="110" cy="110" r="98" fill="none" stroke-width="13"/>
      <circle class="bar" id="bar" cx="110" cy="110" r="98" fill="none" stroke-width="13"
              stroke-dasharray="615.75" stroke-dashoffset="615.75"/>
    </svg>
    <div class="center">
      <div class="time" id="time">00:00</div>
      <div class="sub" id="sub">готов к запуску</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="mainBtn">Старт</button>
    <button class="btn ghost" id="resetBtn" title="Сброс">⟲</button>
  </div>

  <div class="hint">Space — старт/пауза · R — сброс · F — полный экран</div>
</div>

<div class="toast" id="toast">⏰ Время вышло!</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const CIRC = 2 * Math.PI * 98;
  const TITLE = 'Таймер';

  let mode = 'interval';
  let state = 'idle';          // idle | running | paused
  let endAt = 0, total = 0, leftOnPause = 0;
  let nextTrigger = null;
  let tick = null, ringing = false;
  let soundOn = true;

  /* ---------- фон ---------- */
  (function bg(){
    const h = Math.floor(Math.random()*360);
    document.body.style.background =
      `linear-gradient(135deg, hsl(${h} 45% 16%), hsl(${(h+55)%360} 50% 28%))`;
  })();

  /* ---------- звук (Web Audio, без внешних файлов) ---------- */
  let ctx = null, alarmTimer = null;
  const audio = () => (ctx ||= new (window.AudioContext||window.webkitAudioContext)());
  function beep(freq, at, dur, vol=0.35){
    const c = audio(), o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(vol, at+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
    o.connect(g).connect(c.destination); o.start(at); o.stop(at+dur+0.05);
  }
  function playAlarm(){
    if(!soundOn) return;
    const c = audio(); if(c.state === 'suspended') c.resume();
    let n = 0;
    const burst = () => {
      const t = c.currentTime;
      [0,0.18,0.36].forEach((d,i)=>beep(i===2?1320:880, t+d, 0.16));
      if(++n < 4) alarmTimer = setTimeout(burst, 1100);
    };
    burst();
    if(navigator.vibrate) navigator.vibrate([250,120,250,120,400]);
  }
  function stopAlarm(){ clearTimeout(alarmTimer); ringing = false; $('dial').classList.remove('ringing'); }

  /* ---------- уведомления ---------- */
  function notify(text){
    if(!('Notification' in window)) return;
    if(Notification.permission === 'granted') new Notification(TITLE, {body:text, icon:''});
    else if(Notification.permission !== 'denied') Notification.requestPermission();
  }

  /* ---------- вывод ---------- */
  const fmt = ms => {
    if(ms < 0) ms = 0;
    const s = Math.round(ms/1000), h = (s/3600)|0, m = ((s%3600)/60)|0, x = s%60;
    return (h ? h + ':' + String(m).padStart(2,'0') : String(m).padStart(2,'0')) + ':' + String(x).padStart(2,'0');
  };
  function render(left, tot, sub){
    const txt = fmt(left);
    $('time').textContent = txt;
    if(sub !== undefined) $('sub').textContent = sub;
    const p = tot > 0 ? Math.min(1, Math.max(0, 1 - left/tot)) : 0;
    $('bar').style.strokeDashoffset = CIRC * (1 - p);
    document.title = state === 'running' ? `${txt} · ${TITLE}` : TITLE;
  }
  function reset(){
    clearInterval(tick); stopAlarm();
    state = 'idle'; endAt = total = leftOnPause = 0; nextTrigger = null;
    $('mainBtn').textContent = 'Старт'; $('mainBtn').classList.remove('stop');
    $('bar').style.strokeDashoffset = CIRC;
    $('time').textContent = '00:00'; $('sub').textContent = 'готов к запуску';
    document.title = TITLE;
  }
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 4000);
  }

  /* ---------- UI ---------- */
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    reset(); mode = b.dataset.mode;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x===b));
    $('pane-interval').classList.toggle('show', mode==='interval');
    $('pane-schedule').classList.toggle('show', mode==='schedule');
    save();
  });
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const s = +c.dataset.sec;
    $('hh').value = (s/3600)|0; $('mm').value = ((s%3600)/60)|0; $('ss').value = s%60;
    reset(); save();
  });
  $('soundBtn').onclick = e => {
    soundOn = !soundOn;
    e.currentTarget.classList.toggle('on', soundOn);
    e.currentTarget.textContent = soundOn ? '🔔' : '🔕';
    if(!soundOn) stopAlarm(); else audio().resume();
    save();
  };
  $('fsBtn').onclick = () => document.fullscreenElement
    ? document.exitFullscreen()
    : document.documentElement.requestFullscreen?.();
  $('resetBtn').onclick = reset;
  $('mainBtn').onclick = main;

  document.addEventListener('keydown', e => {
    if(/input/i.test(e.target.tagName)) return;
    if(e.code === 'Space'){ e.preventDefault(); main(); }
    if(e.key.toLowerCase() === 'r') reset();
    if(e.key.toLowerCase() === 'f') $('fsBtn').click();
  });

  /* ---------- логика ---------- */
  function main(){
    if(ringing){ stopAlarm(); return; }
    audio().resume?.();
    notify('');                                  // запрос разрешения при первом клике
    if(state === 'running'){ pause(); return; }
    if(state === 'paused'){ resume(); return; }
    mode === 'interval' ? startInterval() : startSchedule();
  }
  function running(){
    state = 'running';
    $('mainBtn').textContent = 'Пауза'; $('mainBtn').classList.add('stop');
  }
  function pause(){
    clearInterval(tick);
    leftOnPause = (mode==='interval' ? endAt : nextTrigger.getTime()) - Date.now();
    state = 'paused';
    $('mainBtn').textContent = 'Продолжить'; $('mainBtn').classList.remove('stop');
    render(leftOnPause, total, 'пауза');
  }
  function resume(){
    if(mode === 'interval'){ endAt = Date.now() + leftOnPause; running(); loopInterval(); }
    else { nextTrigger = new Date(Date.now() + leftOnPause); running(); loopSchedule(); }
  }

  function startInterval(){
    const h = +$('hh').value||0, m = +$('mm').value||0, s = +$('ss').value||0;
    total = ((h*3600)+(m*60)+s)*1000;
    if(total <= 0){ toast('Укажите время больше нуля'); return; }
    endAt = Date.now() + total; running(); loopInterval();
  }
  function loopInterval(){
    const step = () => {
      const left = endAt - Date.now();
      if(left <= 0){
        clearInterval(tick); render(0, total, 'время вышло');
        fire('Интервал завершён');
        if($('loop').checked){ endAt = Date.now() + total; running(); loopInterval(); }
        else { state = 'idle'; $('mainBtn').textContent = 'Старт'; $('mainBtn').classList.remove('stop'); document.title = TITLE; }
      } else {
        render(left, total, 'до сигнала');
      }
    };
    step(); tick = setInterval(step, 100);
  }

  function startSchedule(){
    const v = $('startTime').value, rep = +$('repeatInterval').value;
    if(!v){ toast('Укажите время первого срабатывания'); return; }
    const [h, m] = v.split(':').map(Number);
    const t = new Date(); t.setHours(h, m, 0, 0);
    if(t <= new Date()){
      if($('repeatOn').checked && rep > 0){
        while(t <= new Date()) t.setTime(t.getTime() + rep*60000);
        toast('Время прошло — перенесено на ' + t.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
      } else {
        t.setDate(t.getDate()+1);
        toast('Время прошло — запланировано на завтра');
      }
    }
    nextTrigger = t; total = Math.max(1, nextTrigger - Date.now());
    running(); loopSchedule();
  }
  function loopSchedule(){
    const step = () => {
      const rep = (+$('repeatInterval').value||0)*60000;
      let left = nextTrigger.getTime() - Date.now();
      if(left <= 0){
        fire('Срабатывание в ' + nextTrigger.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
        if($('repeatOn').checked && rep > 0){
          while(nextTrigger.getTime() <= Date.now()) nextTrigger = new Date(nextTrigger.getTime() + rep);
          total = rep;
        } else {
          clearInterval(tick); render(0, total, 'выполнено');
          state = 'idle'; $('mainBtn').textContent = 'Старт'; $('mainBtn').classList.remove('stop');
          return;
        }
        left = nextTrigger.getTime() - Date.now();
      }
      render(left, total, 'след. в ' + nextTrigger.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
    };
    step(); tick = setInterval(step, 250);
  }

  function fire(text){
    ringing = true; $('dial').classList.add('ringing');
    playAlarm(); notify(text); toast('⏰ ' + text);
    document.title = '⏰ Время вышло!';
  }

  /* ---------- часы ---------- */
  const clock = () => $('clock').textContent = new Date().toLocaleTimeString('ru-RU');
  clock(); setInterval(clock, 1000);

  /* ---------- сохранение настроек ---------- */
  const KEY = 'timer-settings-v2';
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({
      mode, soundOn, hh:$('hh').value, mm:$('mm').value, ss:$('ss').value,
      loop:$('loop').checked, startTime:$('startTime').value,
      rep:$('repeatInterval').value, repOn:$('repeatOn').checked
    })); }catch(e){}
  }
  (function load(){
    try{
      const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if(!d) return;
      $('hh').value = d.hh ?? 0; $('mm').value = d.mm ?? 10; $('ss').value = d.ss ?? 0;
      $('loop').checked = !!d.loop; $('startTime').value = d.startTime || '14:15';
      $('repeatInterval').value = d.rep || 15; $('repeatOn').checked = d.repOn !== false;
      soundOn = d.soundOn !== false;
      $('soundBtn').classList.toggle('on', soundOn);
      $('soundBtn').textContent = soundOn ? '🔔' : '🔕';
      if(d.mode === 'schedule') document.querySelector('[data-mode="schedule"]').click();
    }catch(e){}
  })();
  document.querySelectorAll('input').forEach(i => i.addEventListener('change', save));

  reset();
})();
</script>
</body>
</html>
