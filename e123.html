<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тест APMIX.AI API</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 650px; margin: 30px auto; padding: 0 15px; background: #0f172a; color: #e2e8f0; }
  .box { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #94a3b8; }
  input, select, textarea, button { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
  button { margin-top: 15px; background: #3b82f6; border: none; font-weight: 600; cursor: pointer; }
  button:hover { background: #2563eb; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  pre { background: #050811; padding: 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; font-size: 13px; color: #38bdf8; min-height: 50px; }
</style>
</head>
<body>

<div class="box">
  <h2>🧪 Тест APMIX.AI</h2>
  
  <label>API Key:</label>
  <input type="text" id="apiKey" value="">

  <label>Модель:</label>
  <select id="model">
    <option value="claude-sonnet-4-6-free">claude-sonnet-4-6-free</option>
    <option value="claude-opus-4-8-free">claude-opus-4-8-free</option>
    <option value="claude-opus-5-free">claude-opus-5-free</option>
  </select>

  <label>Запрос (Prompt):</label>
  <textarea id="prompt" rows="3">Скажи «Привет, всё работает!» и назови свою модель.</textarea>

  <button id="sendBtn" onclick="runTest()">Отправить тестовый запрос</button>

  <label>Ответ / Лог:</label>
  <pre id="output">Готов к отправке...</pre>
</div>

<script>
async function runTest() {
  const btn = document.getElementById('sendBtn');
  const output = document.getElementById('output');
  const key = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('model').value;
  const prompt = document.getElementById('prompt').value;

  btn.disabled = true;
  output.textContent = "⏳ Отправка запроса...";

  try {
    const res = await fetch("https://api.apmix.ai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${key}`
      },
      body: JSON.stringify({
        model: model,
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await res.json();
    if (!res.ok) {
      output.textContent = `❌ Ошибка (${res.status}):\n` + JSON.stringify(data, null, 2);
    } else {
      const text = data.choices?.[0]?.message?.content || JSON.stringify(data, null, 2);
      output.textContent = `✅ Успех!\n\n${text}`;
    }
  } catch (err) {
    output.textContent = `⚠️ Сетевая ошибка (возможен CORS в браузере при прямом вызове, через Python роутер будет работать гарантированно):\n${err.message}`;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
