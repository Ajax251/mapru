<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EML Инспектор и Извлечение файлов</title>
    <link id="favicon" rel="icon" href="https://img.icons8.com/?size=100&id=GoQbcSSHazaK&format=png&color=4f46e5" type="image/png">
    
    <script src="webfonts/jszip.min.js"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-subtle: #f1f5f9;
            --bg-hover: #eef2ff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-light: #e0e7ff;
            --border: #e2e8f0;
            --success-bg: #ecfdf5;
            --success-text: #065f46;
            --success-border: #a7f3d0;
            --error-bg: #fef2f2;
            --error-text: #991b1b;
            --error-border: #fecaca;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 30px 16px;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-title svg {
            width: 32px;
            height: 32px;
            color: var(--accent);
        }

        .app-title h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .btn-reset {
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn-reset:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
            background: var(--bg-subtle);
        }

        
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            padding: 28px;
            margin-bottom: 24px;
        }

        
        #dropZone {
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-md);
            padding: 44px 24px;
            text-align: center;
            background-color: var(--bg-main);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        #dropZone:hover, #dropZone.dragover {
            border-color: var(--accent);
            background-color: var(--bg-hover);
        }

        .dropzone-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            color: var(--accent);
            background: var(--accent-light);
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #dropZone p {
            margin: 0 0 4px 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        #dropZone span {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        #fileInput {
            display: none;
        }

        
        #status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #status:empty {
            display: none;
        }

        #status.processing {
            background-color: var(--bg-hover);
            color: var(--accent);
            border: 1px solid var(--accent-light);
        }

        #status.success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        #status.error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        
        .email-meta {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 10px 16px;
            font-size: 0.925rem;
            background: var(--bg-main);
            padding: 18px 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .meta-label {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .meta-value {
            color: var(--text-primary);
            word-break: break-word;
        }

        .meta-subject {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
        }

        
        .tabs-header {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .badge {
            background: var(--bg-subtle);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 700;
        }

        .tab-btn.active .badge {
            background: var(--accent-light);
            color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        
        .attachments-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .attachments-summary {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        
        .attachments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .file-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            transition: all 0.2s ease;
        }

        .file-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }

        .file-thumb {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: var(--bg-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            color: var(--accent);
        }

        .file-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-details {
            flex-grow: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            margin-bottom: 2px;
        }

        .file-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .file-download-btn {
            background: var(--bg-subtle);
            color: var(--text-secondary);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .file-download-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        
        .body-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .sub-tab-btn {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .sub-tab-btn.active {
            background: var(--text-primary);
            color: #fff;
            border-color: var(--text-primary);
        }

        #htmlViewer {
            width: 100%;
            min-height: 420px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: #fff;
        }

        .raw-box {
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            font-family: "JetBrains Mono", Consolas, Monaco, monospace;
            font-size: 0.82rem;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 450px;
            overflow-y: auto;
            margin: 0;
        }

        .empty-state {
            text-align: center;
            padding: 36px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            .email-meta {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .meta-label {
                margin-top: 6px;
            }
            .card {
                padding: 18px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="app-header">
        <div class="app-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
            <h1>EML Инспектор</h1>
        </div>
        <button id="resetBtn" class="btn-reset" title="Очистить и загрузить другой файл">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
            Сбросить
        </button>
    </header>

    <div class="card">
        <div id="dropZone">
            <div class="dropzone-icon">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
                </svg>
            </div>
            <p>Перетащите файл .eml сюда</p>
            <span>или нажмите для выбора на компьютере</span>
        </div>
        <input type="file" id="fileInput" accept=".eml,message/rfc822">
        <div id="status"></div>
    </div>

    
    <div id="resultContainer" class="card" style="display: none;">
        
        <div class="email-meta">
            <div class="meta-label">Тема:</div>
            <div id="infoSubject" class="meta-value meta-subject"></div>

            <div class="meta-label">От кого:</div>
            <div id="infoFrom" class="meta-value"></div>

            <div class="meta-label">Кому:</div>
            <div id="infoTo" class="meta-value"></div>

            <div id="rowCc" class="meta-label" style="display: none;">Копия:</div>
            <div id="infoCc" class="meta-value" style="display: none;"></div>

            <div class="meta-label">Дата:</div>
            <div id="infoDate" class="meta-value"></div>
        </div>

        
        <div class="tabs-header">
            <button class="tab-btn active" data-tab="tab-attachments">
                Вложения <span id="attBadge" class="badge">0</span>
            </button>
            <button class="tab-btn" data-tab="tab-body">
                Текст письма
            </button>
            <button class="tab-btn" data-tab="tab-headers">
                Технические заголовки
            </button>
        </div>

        
        <div id="tab-attachments" class="tab-content active">
            <div id="attachmentsToolbar" class="attachments-toolbar" style="display: none;">
                <span id="attachmentsSummary" class="attachments-summary"></span>
                <button id="downloadAllBtn" class="btn-primary">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0l-3-3m3 3l3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/>
                    </svg>
                    Скачать всё (ZIP)
                </button>
            </div>
            <div id="attachmentsList" class="attachments-grid"></div>
        </div>

        
        <div id="tab-body" class="tab-content">
            <div class="body-controls">
                <button id="btnShowHtml" class="sub-tab-btn active">HTML-версия</button>
                <button id="btnShowText" class="sub-tab-btn">Обычный текст</button>
            </div>
            <div id="htmlContainer">
                <iframe id="htmlViewer" sandbox="allow-same-origin"></iframe>
            </div>
            <div id="textContainer" style="display: none;">
                <pre id="textViewer" class="raw-box"></pre>
            </div>
        </div>

        
        <div id="tab-headers" class="tab-content">
            <pre id="rawHeadersViewer" class="raw-box"></pre>
        </div>
    </div>
</div>

<script>
    
    const koi8r = (function() {
        const M = [
            128,129,130,131,132,133,134,135,136,137,138,139,140,141,142,143,
            144,145,146,147,148,149,150,151,152,153,154,155,156,157,158,159,
            160,161,162,163,164,165,166,167,168,169,170,171,172,173,174,175,
            176,177,178,179,180,181,182,183,184,185,186,187,188,189,190,191,
            192,193,194,195,196,197,198,199,200,201,202,203,204,205,206,207,
            208,209,210,211,212,213,214,215,216,217,218,219,220,221,222,223,
            224,225,226,227,228,229,230,231,232,233,234,235,236,237,238,239,
            240,241,242,243,244,245,246,247,248,249,250,251,252,253,254,255
        ];
        const U = [
            9400,9401,9402,9403,9404,9405,9406,9407,9408,9409,9410,9411,9412,9413,9414,9415,
            9416,9417,9418,9419,9420,9421,9422,9423,9424,9425,9426,9427,9428,9429,9430,9431,
            9674,1118,1119,1168,9711,1169,8470,167,1025,1026,1027,1028,1029,1030,1031,
            176,8901,1032,1033,1034,1035,1036,1037,1038,1039,169,1040,1041,1042,1043,1044,
            1045,1046,1047,1048,1049,1050,1051,1052,1053,1054,1055,1056,1057,1058,1059,1060,
            1061,1062,1063,1064,1065,1066,1067,1068,1069,1070,1071,1072,1073,1074,1075,1076,
            1077,1078,1079,1080,1081,1082,1083,1084,1085,1086,1087,1088,1089,1090,1091,1092,
            1093,1094,1095,1096,1097,1098,1099,1100,1101,1102,1103,9632
        ];
        return {
            decode: function(bytes) {
                let res = '';
                for (let i = 0; i < bytes.length; i++) {
                    const code = bytes[i];
                    if (code < 128) {
                        res += String.fromCharCode(code);
                    } else {
                        const idx = M.indexOf(code);
                        res += String.fromCharCode(idx > -1 ? U[idx] : code);
                    }
                }
                return res;
            }
        };
    })();

    
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    const resultContainer = document.getElementById('resultContainer');
    const resetBtn = document.getElementById('resetBtn');

    const infoFrom = document.getElementById('infoFrom');
    const infoTo = document.getElementById('infoTo');
    const infoCc = document.getElementById('infoCc');
    const rowCc = document.getElementById('rowCc');
    const infoSubject = document.getElementById('infoSubject');
    const infoDate = document.getElementById('infoDate');

    const attBadge = document.getElementById('attBadge');
    const attachmentsToolbar = document.getElementById('attachmentsToolbar');
    const attachmentsSummary = document.getElementById('attachmentsSummary');
    const attachmentsList = document.getElementById('attachmentsList');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    const htmlViewer = document.getElementById('htmlViewer');
    const textViewer = document.getElementById('textViewer');
    const rawHeadersViewer = document.getElementById('rawHeadersViewer');
    const htmlContainer = document.getElementById('htmlContainer');
    const textContainer = document.getElementById('textContainer');
    const btnShowHtml = document.getElementById('btnShowHtml');
    const btnShowText = document.getElementById('btnShowText');

    let activeObjectUrls = [];
    let currentAttachments = [];
    let currentEmlName = 'email';

    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });

    
    btnShowHtml.addEventListener('click', () => {
        btnShowHtml.classList.add('active');
        btnShowText.classList.remove('active');
        htmlContainer.style.display = 'block';
        textContainer.style.display = 'none';
    });

    btnShowText.addEventListener('click', () => {
        btnShowText.classList.add('active');
        btnShowHtml.classList.remove('active');
        textContainer.style.display = 'block';
        htmlContainer.style.display = 'none';
    });

    
    resetBtn.addEventListener('click', () => {
        clearResults();
        statusDiv.textContent = '';
        statusDiv.className = '';
        resetBtn.style.display = 'none';
    });

    
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) processFile(e.target.files[0]);
        fileInput.value = '';
    });

    
    function clearResults() {
        activeObjectUrls.forEach(url => URL.revokeObjectURL(url));
        activeObjectUrls = [];
        currentAttachments = [];
        resultContainer.style.display = 'none';
        attachmentsList.innerHTML = '';
        htmlViewer.srcdoc = '';
        textViewer.textContent = '';
        rawHeadersViewer.textContent = '';
    }

    function updateStatus(message, type = '') {
        statusDiv.textContent = message;
        statusDiv.className = type;
    }

    
    function formatBytes(bytes) {
        if (bytes === 0) return '0 Б';
        const k = 1024;
        const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    
    function processFile(file) {
        if (!file.name.toLowerCase().endsWith('.eml')) {
            updateStatus('Пожалуйста, выберите файл с расширением .eml', 'error');
            return;
        }

        currentEmlName = file.name.replace(/\.eml$/i, '');
        updateStatus('Анализ структуры письма и извлечение данных...', 'processing');
        clearResults();

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const rawEml = e.target.result;
                const parsed = parseFullEml(rawEml);

                renderEmailHeaders(parsed.headers, parsed.rawHeaders);
                renderAttachments(parsed.attachments);
                renderBody(parsed.htmlBody, parsed.textBody);

                resultContainer.style.display = 'block';
                resetBtn.style.display = 'inline-flex';
                updateStatus(`Файл «${file.name}» успешно обработан. Найдено вложений: ${parsed.attachments.length}`, 'success');
            } catch (err) {
                console.error(err);
                updateStatus(`Ошибка при разборе EML: ${err.message}`, 'error');
            }
        };
        reader.onerror = () => updateStatus('Ошибка чтения файла с диска.', 'error');
        reader.readAsText(file);
    }

    
    function parseFullEml(emlContent) {
        const result = {
            rawHeaders: '',
            headers: {},
            htmlBody: '',
            textBody: '',
            attachments: []
        };

        const splitMatch = emlContent.match(/\r?\n\r?\n/);
        if (!splitMatch) {
            result.rawHeaders = emlContent;
            result.headers = parseHeaderBlock(emlContent);
            return result;
        }

        const headerPart = emlContent.substring(0, splitMatch.index);
        const bodyPart = emlContent.substring(splitMatch.index + splitMatch[0].length);

        result.rawHeaders = headerPart;
        result.headers = parseHeaderBlock(headerPart);

        
        function parseMimePart(rawHeadersStr, rawBodyStr) {
            const partHeaders = parseHeaderBlock(rawHeadersStr);
            const contentTypeFull = partHeaders['content-type'] || 'text/plain';
            const contentType = contentTypeFull.split(';')[0].trim().toLowerCase();
            const transferEncoding = (partHeaders['content-transfer-encoding'] || '').trim().toLowerCase();
            const contentDisposition = partHeaders['content-disposition'] || '';

            
            if (contentType.startsWith('multipart/')) {
                const boundary = extractBoundary(contentTypeFull);
                if (boundary) {
                    const delimiter = `--${boundary}`;
                    const segments = rawBodyStr.split(delimiter);
                    
                    for (let i = 1; i < segments.length; i++) {
                        let seg = segments[i];
                        if (seg.trim().startsWith('--')) break; 
                        seg = seg.replace(/^\r?\n/, '');
                        const subSplit = seg.match(/\r?\n\r?\n/);
                        if (subSplit) {
                            const subHeaders = seg.substring(0, subSplit.index);
                            const subBody = seg.substring(subSplit.index + subSplit[0].length);
                            parseMimePart(subHeaders, subBody);
                        }
                    }
                    return;
                }
            }

            
            const filename = extractFilename(contentDisposition, contentTypeFull);
            const isAttachment = /attachment/i.test(contentDisposition) || Boolean(filename);

            if (isAttachment && transferEncoding === 'base64') {
                const cleanBase64 = rawBodyStr.replace(/[\r\n\s]/g, '');
                if (cleanBase64.length > 0) {
                    const blob = base64ToBlob(cleanBase64, contentType);
                    result.attachments.push({
                        filename: filename || `attachment_${result.attachments.length + 1}`,
                        contentType: contentType,
                        blob: blob,
                        size: blob.size
                    });
                }
            } else if (contentType === 'text/html' && !result.htmlBody) {
                const charset = extractCharset(contentTypeFull);
                result.htmlBody = decodeBodyContent(rawBodyStr, transferEncoding, charset);
            } else if (contentType === 'text/plain' && !result.textBody) {
                const charset = extractCharset(contentTypeFull);
                result.textBody = decodeBodyContent(rawBodyStr, transferEncoding, charset);
            }
        }

        parseMimePart(headerPart, bodyPart);

        
        if (result.attachments.length === 0) {
            result.attachments = fallbackAttachmentSearch(emlContent);
        }

        return result;
    }

    
    function parseHeaderBlock(headerStr) {
        const headers = {};
        const lines = headerStr.split(/\r?\n/);
        let currentKey = null;

        for (const line of lines) {
            if (/^[ \t]+/.test(line) && currentKey) {
                headers[currentKey] += ' ' + line.trim();
            } else {
                const colonIdx = line.indexOf(':');
                if (colonIdx > 0) {
                    currentKey = line.substring(0, colonIdx).trim().toLowerCase();
                    const val = line.substring(colonIdx + 1).trim();
                    headers[currentKey] = headers[currentKey] ? headers[currentKey] + ', ' + val : val;
                }
            }
        }
        return headers;
    }

    function extractBoundary(contentTypeHeader) {
        const match = contentTypeHeader.match(/boundary=(?:"([^"]+)"|([^;\s]+))/i);
        return match ? (match[1] || match[2]) : null;
    }

    function extractCharset(contentTypeHeader) {
        const match = contentTypeHeader.match(/charset=(?:"([^"]+)"|([^;\s]+))/i);
        return match ? (match[1] || match[2]).toLowerCase() : 'utf-8';
    }

    
    function extractFilename(disposition, contentType) {
        const combined = `${disposition}; ${contentType}`;

        
        const rfc2231Match = combined.match(/filename\*=([^']*)'[^']*'([^;\s]+)/i);
        if (rfc2231Match) {
            try {
                return decodeURIComponent(rfc2231Match[2]);
            } catch (e) {}
        }

        
        const stdMatch = combined.match(/(?:filename|name)=(?:"([^"]+)"|([^;\s]+))/i);
        if (stdMatch) {
            const rawName = stdMatch[1] || stdMatch[2];
            return decodeHeaderValue(rawName);
        }
        return null;
    }

    
    function decodeBodyContent(rawBody, encoding, charset) {
        try {
            if (encoding === 'base64') {
                const clean = rawBody.replace(/[\r\n\s]/g, '');
                const binStr = atob(clean);
                const bytes = Uint8Array.from(binStr, c => c.charCodeAt(0));
                return decodeBytesWithCharset(bytes, charset);
            } else if (encoding === 'quoted-printable') {
                
                const cleaned = rawBody.replace(/=\r?\n/g, '');
                const bytes = [];
                for (let i = 0; i < cleaned.length; i++) {
                    if (cleaned[i] === '=' && /^[0-9A-Fa-f]{2}$/.test(cleaned.substring(i + 1, i + 3))) {
                        bytes.push(parseInt(cleaned.substring(i + 1, i + 3), 16));
                        i += 2;
                    } else {
                        bytes.push(cleaned.charCodeAt(i));
                    }
                }
                return decodeBytesWithCharset(new Uint8Array(bytes), charset);
            }
            return rawBody;
        } catch (e) {
            console.warn('Ошибка декодирования текста письма:', e);
            return rawBody;
        }
    }

    function decodeBytesWithCharset(bytes, charset) {
        charset = (charset || 'utf-8').toLowerCase();
        if (charset === 'koi8-r' || charset === 'koi8r') {
            return koi8r.decode(bytes);
        }
        try {
            return new TextDecoder(charset).decode(bytes);
        } catch (e) {
            return new TextDecoder('utf-8').decode(bytes);
        }
    }

    
    function decodeHeaderValue(value) {
        if (!value) return '';
        
        const normalized = value.replace(/\?=\s+=\?/g, '?==?');

        return normalized.replace(/=\?([^?]+)\?([BQbq])\?([^?]*)\?=/g, (match, charset, encoding, text) => {
            charset = charset.toLowerCase();
            encoding = encoding.toUpperCase();
            try {
                if (encoding === 'B') {
                    const bin = atob(text);
                    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
                    return decodeBytesWithCharset(bytes, charset);
                } else if (encoding === 'Q') {
                    const qText = text.replace(/_/g, ' ');
                    const bytes = [];
                    for (let i = 0; i < qText.length; i++) {
                        if (qText[i] === '=' && /^[0-9A-Fa-f]{2}$/.test(qText.substring(i + 1, i + 3))) {
                            bytes.push(parseInt(qText.substring(i + 1, i + 3), 16));
                            i += 2;
                        } else {
                            bytes.push(qText.charCodeAt(i));
                        }
                    }
                    return decodeBytesWithCharset(new Uint8Array(bytes), charset);
                }
                return match;
            } catch (e) {
                return match;
            }
        });
    }

    
    function renderEmailHeaders(headers, rawHeaders) {
        infoSubject.textContent = decodeHeaderValue(headers['subject']) || '(Без темы)';
        infoFrom.textContent = decodeHeaderValue(headers['from']) || 'Неизвестно';
        infoTo.textContent = decodeHeaderValue(headers['to']) || 'Неизвестно';
        infoDate.textContent = headers['date'] || 'Не указана';

        if (headers['cc']) {
            infoCc.textContent = decodeHeaderValue(headers['cc']);
            infoCc.style.display = 'block';
            rowCc.style.display = 'block';
        } else {
            infoCc.style.display = 'none';
            rowCc.style.display = 'none';
        }

        rawHeadersViewer.textContent = rawHeaders;
    }

    
    function renderBody(html, text) {
        if (html) {
            htmlViewer.srcdoc = html;
            btnShowHtml.style.display = 'inline-block';
            btnShowHtml.click();
        } else {
            htmlViewer.srcdoc = '<div style="font-family:sans-serif;color:#64748b;padding:20px;">HTML-версия отсутствует</div>';
            btnShowText.click();
        }

        textViewer.textContent = text || 'Текстовая версия письма отсутствует.';
    }

    
    function renderAttachments(attachments) {
        currentAttachments = attachments;
        attBadge.textContent = attachments.length;
        attachmentsList.innerHTML = '';

        if (attachments.length === 0) {
            attachmentsToolbar.style.display = 'none';
            attachmentsList.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">В этом письме нет прикрепленных файлов</div>';
            return;
        }

        const totalBytes = attachments.reduce((acc, item) => acc + item.size, 0);
        attachmentsSummary.textContent = `Всего файлов: ${attachments.length} (${formatBytes(totalBytes)})`;
        attachmentsToolbar.style.display = 'flex';

        attachments.forEach(att => {
            const url = URL.createObjectURL(att.blob);
            activeObjectUrls.push(url);

            const card = document.createElement('div');
            card.className = 'file-card';

            const thumb = document.createElement('div');
            thumb.className = 'file-thumb';

            if (att.contentType.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = url;
                img.alt = att.filename;
                thumb.appendChild(img);
            } else {
                thumb.innerHTML = getFileIconSvg(att.contentType);
            }

            const details = document.createElement('div');
            details.className = 'file-details';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'file-name';
            nameSpan.title = att.filename;
            nameSpan.textContent = att.filename;

            const metaSpan = document.createElement('span');
            metaSpan.className = 'file-meta';
            metaSpan.textContent = `${formatBytes(att.size)} • ${att.contentType.split('/')[1] || 'file'}`;

            details.appendChild(nameSpan);
            details.appendChild(metaSpan);

            const dlBtn = document.createElement('a');
            dlBtn.className = 'file-download-btn';
            dlBtn.href = url;
            dlBtn.download = att.filename;
            dlBtn.title = 'Скачать файл';
            dlBtn.innerHTML = `
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                </svg>
            `;

            card.appendChild(thumb);
            card.appendChild(details);
            card.appendChild(dlBtn);
            attachmentsList.appendChild(card);
        });
    }

    
    downloadAllBtn.addEventListener('click', async () => {
        if (currentAttachments.length === 0 || typeof JSZip === 'undefined') return;

        const originalText = downloadAllBtn.innerHTML;
        downloadAllBtn.disabled = true;
        downloadAllBtn.textContent = 'Упаковка в ZIP...';

        try {
            const zip = new JSZip();
            const usedNames = {};

            currentAttachments.forEach(att => {
                let name = att.filename;
                
                if (usedNames[name]) {
                    const dotIdx = name.lastIndexOf('.');
                    if (dotIdx > 0) {
                        name = `${name.substring(0, dotIdx)}_(${usedNames[name]})${name.substring(dotIdx)}`;
                    } else {
                        name = `${name}_(${usedNames[name]})`;
                    }
                    usedNames[att.filename]++;
                } else {
                    usedNames[name] = 1;
                }
                zip.file(name, att.blob);
            });

            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const zipUrl = URL.createObjectURL(zipBlob);

            const tempLink = document.createElement('a');
            tempLink.href = zipUrl;
            tempLink.download = `${currentEmlName}_attachments.zip`;
            document.body.appendChild(tempLink);
            tempLink.click();
            document.body.removeChild(tempLink);
            setTimeout(() => URL.revokeObjectURL(zipUrl), 5000);
        } catch (err) {
            console.error('Ошибка создания ZIP:', err);
            updateStatus('Не удалось упаковать файлы в ZIP.', 'error');
        } finally {
            downloadAllBtn.disabled = false;
            downloadAllBtn.innerHTML = originalText;
        }
    });

    
    function getFileIconSvg(mime) {
        if (mime.includes('pdf')) {
            return `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>`;
        }
        if (mime.includes('zip') || mime.includes('rar') || mime.includes('tar') || mime.includes('compressed')) {
            return `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>`;
        }
        return `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>`;
    }

    
    function base64ToBlob(base64, contentType = 'application/octet-stream') {
        try {
            const byteChars = atob(base64.split(',').pop());
            const byteArrays = [];
            const sliceSize = 1024;

            for (let offset = 0; offset < byteChars.length; offset += sliceSize) {
                const slice = byteChars.slice(offset, offset + sliceSize);
                const byteNumbers = new Uint8Array(slice.length);
                for (let i = 0; i < slice.length; i++) {
                    byteNumbers[i] = slice.charCodeAt(i);
                }
                byteArrays.push(byteNumbers);
            }
            return new Blob(byteArrays, { type: contentType });
        } catch (e) {
            console.error('Ошибка декодирования Base64:', e);
            return new Blob([], { type: contentType });
        }
    }

    
    function fallbackAttachmentSearch(emlContent) {
        const list = [];
        const blocks = emlContent.split(/\r?\n\r?\n/);
        for (let i = 0; i < blocks.length - 1; i++) {
            const headerCandidate = blocks[i];
            if (/Content-Transfer-Encoding:\s*base64/i.test(headerCandidate) && /(?:filename|name)=/i.test(headerCandidate)) {
                const fn = extractFilename(headerCandidate, headerCandidate) || `file_${list.length + 1}`;
                const ctMatch = headerCandidate.match(/Content-Type:\s*([^\s;]+)/i);
                const ct = ctMatch ? ctMatch[1].toLowerCase() : 'application/octet-stream';
                const b64 = blocks[i + 1].split(/\r?\n--/)[0].replace(/[\r\n\s]/g, '');
                if (b64.length > 10) {
                    const blob = base64ToBlob(b64, ct);
                    list.push({ filename: fn, contentType: ct, blob: blob, size: blob.size });
                }
            }
        }
        return list;
    }
