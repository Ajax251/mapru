<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест 3D Рельефа Google Maps</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        #map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Панель управления */
        #control-panel {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(15, 23, 42, 0.9); color: #f8fafc;
            padding: 16px 20px; border-radius: 12px; width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
        }
        
        h3 { font-size: 15px; margin-bottom: 12px; color: #60a5fa; display: flex; align-items: center; justify-content: space-between; }
        
        .control-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        
        select, button {
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #334155;
            background: #1e293b; color: #fff; font-size: 13px; cursor: pointer; outline: none;
            transition: all 0.2s;
        }
        select:hover, button:hover { border-color: #3b82f6; background: #334155; }
        
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569; transition: .3s; border-radius: 22px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Панель стоимости API */
        #api-info {
            margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 11px; line-height: 1.4; color: #cbd5e1;
        }
        .price-tag { color: #34d399; font-weight: bold; }

        /* Скрытие ненужных контейнеров */
        .hidden { display: none !important; }
    </style>

    <!-- Подгружаем Google Maps JS API (Alpha версия включает новейший модуль 3D Maps) -->
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDnDnljPCWG6b7t5YZBQu93VeLeqTJ5DFo&v=alpha&libraries=maps3d,places"></script>
</head>
<body>

    <div id="control-panel">
        <h3>
            <span>Рельеф Google Maps</span>
            <span id="fps-counter" style="font-size: 10px; color: #34d399;">60 FPS</span>
        </h3>

        <div class="control-group">
            <label for="mode-select">Метод рендеринга 3D:</label>
            <select id="mode-select">
                <option value="photorealistic">1. Photorealistic 3D Tiles (Google 3D)</option>
                <option value="vector-terrain">2. Google Vector Map + Terrain</option>
                <option value="satellite-tilt">3. Google Satellite + 3D Tilt</option>
            </select>
        </div>

        <div class="toggle-row">
            <label style="margin: 0;">Включить 3D / Наклон:</label>
            <label class="switch">
                <input type="checkbox" id="terrain-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div id="api-info">
            <b>Затраты по API:</b><br>
            <span id="cost-description">Загрузка...</span>
        </div>
    </div>

    <!-- Контейнер для отображения карт -->
    <div id="map-container">
        <!-- Режим 1: Официальный тег Google Photorealistic 3D Tiles -->
        <gmp-map-3d id="gmp-3d" center="54.8492, 50.7910, 800" tilt="65" heading="30" range="1500" class="hidden"></gmp-map-3d>
        
        <!-- Режим 2 и 3: Обычный 2D/3D JS API контейнер -->
        <div id="js-map" style="width:100%; height:100%;"></div>
    </div>

    <script>
        // Координаты центра (по умолчанию)
        const CENTER = { lat: 54.8492, lng: 50.7910 };
        let jsMap = null;

        const modeSelect = document.getElementById('mode-select');
        const terrainToggle = document.getElementById('terrain-toggle');
        const costDescription = document.getElementById('cost-description');
        const gmp3D = document.getElementById('gmp-3d');
        const jsMapDiv = document.getElementById('js-map');

        // Информация о ценах для каждого режима
        const COSTS = {
            'photorealistic': 'Сервис: <b style="color:#fff;">Map Tiles API (3D Tiles)</b><br>Цена: <span class="price-tag">$6.00</span> за 1 000 сессий.<br><i>Бесплатно: ~$200 лимит = ~33 000 просмотров/мес.</i>',
            'vector-terrain': 'Сервис: <b style="color:#fff;">Dynamic Maps (JS API)</b><br>Цена: <span class="price-tag">$7.00</span> за 1 000 загрузок.<br><i>Бесплатно: ~$200 лимит = ~28 500 просмотров/мес.</i>',
            'satellite-tilt': 'Сервис: <b style="color:#fff;">Dynamic Maps (Satellite)</b><br>Цена: <span class="price-tag">$7.00</span> за 1 000 загрузок.<br><i>Использует спутниковые тайлы с 3D-наклоном.</i>'
        };

        // Инициализация стандартной карты JS API
        function initJSMap() {
            if (!jsMap && window.google && window.google.maps) {
                jsMap = new google.maps.Map(jsMapDiv, {
                    center: CENTER,
                    zoom: 15,
                    mapTypeId: 'terrain',
                    tilt: 45,
                    heading: 30,
                    mapId: '90b8a35163a6e326' // Векторный Map ID
                });
            }
        }

        // Переключение режимов
        function updateMapMode() {
            const mode = modeSelect.value;
            const is3DEnabled = terrainToggle.checked;

            costDescription.innerHTML = COSTS[mode];

            if (mode === 'photorealistic') {
                // Показываем Google 3D Tiles Web Component
                jsMapDiv.classList.add('hidden');
                gmp3D.classList.remove('hidden');

                if (is3DEnabled) {
                    gmp3D.setAttribute('tilt', '65');
                    gmp3D.setAttribute('range', '1500');
                } else {
                    gmp3D.setAttribute('tilt', '0');
                    gmp3D.setAttribute('range', '3000');
                }
            } else {
                // Показываем стандартный JS API
                gmp3D.classList.add('hidden');
                jsMapDiv.classList.remove('hidden');

                initJSMap();

                if (!jsMap) return;

                if (mode === 'vector-terrain') {
                    jsMap.setMapTypeId(is3DEnabled ? 'terrain' : 'roadmap');
                    jsMap.setTilt(is3DEnabled ? 45 : 0);
                } else if (mode === 'satellite-tilt') {
                    jsMap.setMapTypeId(is3DEnabled ? 'hybrid' : 'satellite');
                    jsMap.setTilt(is3DEnabled ? 45 : 0);
                }
            }
        }

        // Слушатели событий
        modeSelect.addEventListener('change', updateMapMode);
        terrainToggle.addEventListener('change', updateMapMode);

        // Старт после загрузки API
        window.addEventListener('load', () => {
            setTimeout(() => {
                updateMapMode();
            }, 500);
        });

        // Простой счетчик FPS для оценки производительности
        let times = [];
        const fpsEl = document.getElementById('fps-counter');
        function refreshLoop() {
            window.requestAnimationFrame(() => {
                const now = performance.now();
                while (times.length > 0 && times[0] <= now - 1000) { times.shift(); }
                times.push(now);
                fpsEl.textContent = times.length + " FPS";
                refreshLoop();
            });
        }
        refreshLoop();
    </script>
</body>
</html>
