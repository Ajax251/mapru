<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Географическая Тепловая Карта (Treemap)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg-main: #0c0f17;
      --bg-panel: #141923;
      --bg-panel-alt: #1a2232;
      --border-color: #273142;
      --text-main: #f1f5f9;
      --text-muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --tile-border: #0a0d14;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Верхняя навигационная панель */
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand-badge {
      font-size: 11px;
      background: var(--bg-panel-alt);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 500;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2px;
      gap: 2px;
    }

    .btn-toggle {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-toggle:hover { color: var(--text-main); }
    .btn-toggle.active {
      background: var(--accent);
      color: #fff;
    }

    .select-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: var(--radius);
    }
    .select-wrap select {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Панель ИИ-запроса */
    .ai-bar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .ai-input-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .ai-input-wrap i.fa-wand-magic-sparkles {
      position: absolute;
      left: 12px;
      color: #8b5cf6;
      font-size: 13px;
    }
    .ai-input {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 13px;
      padding: 7px 12px 7px 34px;
      outline: none;
      transition: border-color 0.15s;
    }
    .ai-input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }
    .ai-submit {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 15px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .ai-submit:hover { filter: brightness(1.1); }
    .ai-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .quick-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      align-items: center;
    }
    .chip {
      background: var(--bg-panel-alt);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 11.5px;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:hover {
      background: var(--border-color);
      color: var(--text-main);
    }

    /* Холст тепловой карты (Treemap) */
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #090c12;
    }

    #treemap-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Стили родительской группы (Континент / Категория) */
    .parent-group rect.group-header-bg {
      fill: #141a26;
      stroke: var(--border-color);
      stroke-width: 1.5;
    }
    .parent-label {
      font-size: 11px;
      font-weight: 800;
      fill: #8b9bb4;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    /* Плитки карты */
    .tile {
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    .tile rect {
      stroke: var(--tile-border);
      stroke-width: 1.5px;
      shape-rendering: geometricPrecision;
    }
    .tile:hover rect {
      stroke: #ffffff;
      stroke-width: 2px;
      filter: brightness(1.15);
    }

    .tile-text {
      pointer-events: none;
      font-family: 'Inter', system-ui, sans-serif;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .tile-title {
      font-weight: 700;
      fill: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    }
    .tile-val {
      font-weight: 600;
      fill: rgba(255,255,255,0.92);
      font-size: 0.85em;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .tile-sub {
      font-weight: 500;
      fill: rgba(255,255,255,0.7);
      font-size: 0.72em;
    }

    /* Подсказка (Tooltip) */
    .tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      font-size: 12.5px;
      line-height: 1.5;
      display: none;
      z-index: 1000;
      min-width: 200px;
    }
    .tt-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #273142;
      padding-bottom: 4px;
    }
    .tt-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #94a3b8;
    }
    .tt-row b { color: #f1f5f9; }

    /* Нижняя строка состояния */
    footer {
      background: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      padding: 6px 18px;
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-bar {
      width: 140px;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
    }

    /* Модальное окно ошибки загрузки JSON (если открыт через file://) */
    .banner {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #b91c1c;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 2000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .banner button {
      background: #fff;
      color: #991b1b;
      border: none;
      padding: 4px 10px;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
    }
    .spinner { animation: spin 0.7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-layer-group"></i></div>
      <div class="brand-title">ГЕО-ТЕПЛОВАЯ КАРТА</div>
      <div class="brand-badge" id="stats-badge">Загрузка базы...</div>
    </div>

    <div class="controls-row">
      <!-- Режим сущностей -->
      <div class="btn-group" id="mode-group">
        <button class="btn-toggle active" data-mode="countries"><i class="fas fa-earth-americas"></i> Страны</button>
        <button class="btn-toggle" data-mode="cities"><i class="fas fa-city"></i> Города</button>
      </div>

      <!-- Метрика площади блоков -->
      <div class="select-wrap">
        <span>Размер:</span>
        <select id="size-metric">
          <option value="pop" selected>Население (чел.)</option>
          <option value="area">Площадь (км²)</option>
        </select>
      </div>

      <!-- Метрика цвета блоков -->
      <div class="select-wrap">
        <span>Цвет:</span>
        <select id="color-metric">
          <option value="density" selected>Плотность населения</option>
          <option value="continent">По Континентам</option>
        </select>
      </div>

      <!-- Лимит отображения (не более 50!) -->
      <div class="select-wrap">
        <span>Лимит:</span>
        <select id="limit-select">
          <option value="15">15 объектов</option>
          <option value="30">30 объектов</option>
          <option value="50" selected>50 объектов (макс)</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Панель запроса к ИИ -->
  <div class="ai-bar">
    <div class="ai-input-wrap">
      <i class="fas fa-wand-magic-sparkles"></i>
      <input type="text" id="ai-input" class="ai-input" 
             placeholder="Запрос к ИИ: например, «25 крупнейших городов Азии», «Страны Европы по площади» или «Самые густонаселенные столицы»">
    </div>
    <button class="ai-submit" id="ai-submit">
      <i class="fas fa-paper-plane"></i> <span>Сформировать</span>
    </button>
    <div class="quick-chips">
      <div class="chip" data-q="Топ-40 стран по населению">🌍 Топ стран</div>
      <div class="chip" data-q="Топ-30 мегаполисов мира с наибольшей плотностью">🏙 Мегаполисы</div>
      <div class="chip" data-q="25 крупнейших стран Америки и Европы по площади">📐 Страны по площади</div>
      <div class="chip" data-q="Топ 20 густонаселенных городов Азии">🌏 Города Азии</div>
    </div>
  </div>

  <div class="viewport" id="viewport">
    <svg id="treemap-svg"></svg>
    <div class="banner" id="cors-banner">
      <i class="fas fa-exclamation-triangle"></i>
      <span>Не удалось загрузить <b>world_data.json</b> (браузер заблокировал локальный fetch). Выберите файл вручную:</span>
      <input type="file" id="file-picker" accept=".json" style="display:none">
      <button onclick="document.getElementById('file-picker').click()">Обзор...</button>
    </div>
  </div>

  <footer>
    <div id="footer-info">Показано: 0 объектов</div>
    <div class="legend" id="legend-box">
      <span>Плотность населения:</span>
      <span style="color:#10b981;font-weight:600">Низкая</span>
      <div class="legend-bar"></div>
      <span style="color:#ef4444;font-weight:600">Высокая</span>
    </div>
  </footer>

  <div class="tooltip" id="tooltip"></div>

  <script>
    /* КОНФИГУРАЦИЯ ИНТЕГРАЦИИ ИИ */
    const PROXY_MAP = "https://mapruapp.ru/ai/api/v1/chat/completions";
    const AI_MODEL  = "gemini-3.5-flash-lite"; // Зафиксированная модель

    // Цвета регионов
    const CONTINENT_COLORS = {
      "Европа": "#3b82f6",
      "Азия": "#ec4899",
      "Северная Америка": "#10b981",
      "Южная Америка": "#f59e0b",
      "Африка": "#8b5cf6",
      "Океания": "#06b6d4",
      "Другое": "#64748b"
    };

    // Состояние приложения
    const state = {
      rawDataset: [],
      filteredItems: [],
      mode: 'countries',    // 'countries' | 'cities' | 'custom_ai'
      sizeMetric: 'pop',    // 'pop' | 'area'
      colorMetric: 'density', // 'density' | 'continent'
      limit: 50,
      currentTitle: 'Все страны'
    };

    // DOM-элементы
    const svg = d3.select("#treemap-svg");
    const viewport = document.getElementById("viewport");
    const tooltip = document.getElementById("tooltip");

    // Инициализация загрузки данных
    async function loadDataset() {
      try {
        const res = await fetch('./world_data.json');
        if (!res.ok) throw new Error("HTTP " + res.status);
        state.rawDataset = await res.json();
        onDataReady();
      } catch (err) {
        console.warn("Fetch failed, likely direct file:// opening. Waiting for manual upload or fallback.", err);
        document.getElementById("cors-banner").style.display = "flex";
      }
    }

    // Ручной выбор файла при блокировке file:// в браузере
    document.getElementById("file-picker").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          state.rawDataset = JSON.parse(ev.target.result);
          document.getElementById("cors-banner").style.display = "none";
          onDataReady();
        } catch(e) { alert("Ошибка парсинга JSON: " + e.message); }
      };
      reader.readAsText(file);
    });

    function onDataReady() {
      const countriesCount = state.rawDataset.filter(x => x.type === 'country').length;
      const citiesCount = state.rawDataset.filter(x => x.type === 'city').length;
      document.getElementById("stats-badge").textContent = `${countriesCount} стран, ${citiesCount} городов`;
      applyFiltersAndRender();
    }

    // Фильтрация и ограничение выборки
    function applyFiltersAndRender() {
      if (state.mode === 'custom_ai') {
        renderTreemap();
        return;
      }

      let items = state.rawDataset.filter(d => {
        if (state.mode === 'countries') return d.type === 'country';
        if (state.mode === 'cities') return d.type === 'city';
        return true;
      });

      // Сортировка по выбранной метрике размера
      items.sort((a, b) => (b[state.sizeMetric] || 0) - (a[state.sizeMetric] || 0));

      // Жесткое ограничение не более 50 (согласно ТЗ)
      const maxLimit = Math.min(state.limit, 50);
      state.filteredItems = items.slice(0, maxLimit);
      state.currentTitle = state.mode === 'countries' ? 'Крупнейшие страны' : 'Крупнейшие города';

      renderTreemap();
    }

    // Построение и отрисовка блочной тепловой карты через D3.js
    function renderTreemap() {
      const width = viewport.clientWidth;
      const height = viewport.clientHeight;
      svg.attr("width", width).attr("height", height);
      svg.selectAll("*").remove();

      if (!state.filteredItems || !state.filteredItems.length) {
        svg.append("text")
           .attr("x", width / 2).attr("y", height / 2)
           .attr("fill", "#64748b").attr("text-anchor", "middle").attr("font-size", 16)
           .text("Нет данных для отображения");
        return;
      }

      // Группировка данных по Континентам (двухуровневая иерархия)
      const nested = d3.groups(state.filteredItems, d => d.continent || "Другое");
      const rootData = {
        name: "World",
        children: nested.map(([continent, items]) => ({
          name: continent,
          children: items
        }))
      };

      const root = d3.hierarchy(rootData)
        .sum(d => d[state.sizeMetric] || 1)
        .sort((a, b) => b.value - a.value);

      // Алгоритм сквирификации (Squarified Treemap с золотым соотношением сторон)
      d3.treemap()
        .size([width, height])
        .paddingTop(22)
        .paddingInner(2)
        .paddingOuter(3)
        .round(true)
        .tile(d3.treemapSquarify.ratio(1.3))(root);

      // Цветовая шкала для плотности (Тепловая карта: Зеленый -> Янтарный -> Красный)
      const densities = state.filteredItems.map(d => d.density || (d.pop / (d.area || 1)));
      const minD = d3.min(densities) || 1;
      const maxD = d3.max(densities) || 1000;
      
      const densityColorScale = d3.scaleLog()
        .domain([Math.max(1, minD), d3.median(densities) || 50, maxD])
        .range(["#059669", "#d97706", "#dc2626"]);

      // 1. Отрисовка родительских категорий (Континенты)
      const parents = svg.selectAll(".parent-group")
        .data(root.children || [])
        .enter().append("g")
        .attr("class", "parent-group");

      parents.append("rect")
        .attr("class", "group-header-bg")
        .attr("x", d => d.x0)
        .attr("y", d => d.y0)
        .attr("width", d => Math.max(0, d.x1 - d.x0))
        .attr("height", d => Math.max(0, d.y1 - d.y0))
        .attr("rx", 4);

      parents.append("text")
        .attr("class", "parent-label")
        .attr("x", d => d.x0 + 8)
        .attr("y", d => d.y0 + 15)
        .text(d => `${d.data.name} (${d.children ? d.children.length : 0})`);

      // 2. Отрисовка конечных плиток (Листьев)
      const leaves = svg.selectAll(".tile")
        .data(root.leaves())
        .enter().append("g")
        .attr("class", "tile")
        .attr("transform", d => `translate(${d.x0},${d.y0})`);

      // Заливка цветом
      leaves.append("rect")
        .attr("width", d => Math.max(0, d.x1 - d.x0))
        .attr("height", d => Math.max(0, d.y1 - d.y0))
        .attr("rx", 3)
        .attr("fill", d => {
          if (state.colorMetric === 'continent') {
            return CONTINENT_COLORS[d.data.continent] || "#475569";
          }
          const dVal = d.data.density || (d.data.pop / (d.data.area || 1));
          return densityColorScale(dVal);
        })
        .on("mousemove", (event, d) => showTooltip(event, d.data))
        .on("mouseleave", hideTooltip);

      // 3. Адаптивные надписи внутри блоков
      leaves.each(function(d) {
        const w = d.x1 - d.x0;
        const h = d.y1 - d.y0;
        if (w < 28 || h < 20) return; // Слишком маленький блок

        const g = d3.select(this);
        const textG = g.append("g").attr("class", "tile-text");

        const flag = d.data.flag ? d.data.flag + " " : "";
        const title = flag + d.data.name;
        const valText = formatMetric(d.data[state.sizeMetric], state.sizeMetric);
        const dVal = Math.round(d.data.density || (d.data.pop / (d.data.area || 1))).toLocaleString('ru-RU');

        if (w >= 75 && h >= 48) {
          // Большой блок: Название, значение, плотность
          textG.append("text")
               .attr("class", "tile-title")
               .attr("x", w / 2).attr("y", h / 2 - 12)
               .attr("font-size", Math.min(14, w / 8))
               .text(truncate(title, w / 8));

          textG.append("text")
               .attr("class", "tile-val")
               .attr("x", w / 2).attr("y", h / 2 + 5)
               .text(valText);

          textG.append("text")
               .attr("class", "tile-sub")
               .attr("x", w / 2).attr("y", h / 2 + 19)
               .text(`${dVal} ч/км²`);
        } 
        else if (w >= 50 && h >= 32) {
          // Средний блок
          textG.append("text")
               .attr("class", "tile-title")
               .attr("x", w / 2).attr("y", h / 2 - 5)
               .attr("font-size", 11)
               .text(truncate(d.data.name, w / 7));

          textG.append("text")
               .attr("class", "tile-val")
               .attr("x", w / 2).attr("y", h / 2 + 9)
               .attr("font-size", 10)
               .text(valText);
        } 
        else {
          // Компактный блок
          textG.append("text")
               .attr("class", "tile-title")
               .attr("x", w / 2).attr("y", h / 2)
               .attr("font-size", 10)
               .text(truncate(d.data.name, w / 6));
        }
      });

      // Обновление строки статуса
      document.getElementById("footer-info").textContent = 
        `Показано: ${state.filteredItems.length} объектов | ${state.currentTitle} (Сортировка: по ${state.sizeMetric === 'pop' ? 'населению' : 'площади'})`;
      
      document.getElementById("legend-box").style.display = 
        state.colorMetric === 'density' ? 'flex' : 'none';
    }

    // Форматирование числовых значений
    function formatMetric(val, type) {
      if (!val) return "0";
      if (type === 'pop') {
        if (val >= 1e9) return (val / 1e9).toFixed(2) + " млрд";
        if (val >= 1e6) return (val / 1e6).toFixed(1) + " млн";
        if (val >= 1e3) return (val / 1e3).toFixed(0) + " тыс";
        return val.toLocaleString('ru-RU');
      } else {
        if (val >= 1e6) return (val / 1e6).toFixed(2) + " млн км²";
        return val.toLocaleString('ru-RU') + " км²";
      }
    }

    function truncate(str, maxChars) {
      if (!str) return "";
      return str.length > maxChars ? str.slice(0, Math.max(1, maxChars - 1)) + "…" : str;
    }

    // Подсказка при наведении
    function showTooltip(event, d) {
      const typeLabel = d.type === 'country' ? 'Страна' : 'Город';
      const flag = d.flag || '📍';
      const density = Math.round(d.density || (d.pop / (d.area || 1))).toLocaleString('ru-RU');
      const countryLine = d.country ? `<div class="tt-row"><span>Страна:</span> <b>${d.country}</b></div>` : '';

      tooltip.innerHTML = `
        <div class="tt-title"><span>${flag}</span> ${d.name} (${typeLabel})</div>
        ${countryLine}
        <div class="tt-row"><span>Континент:</span> <b>${d.continent}</b></div>
        <div class="tt-row"><span>Население:</span> <b>${Number(d.pop).toLocaleString('ru-RU')} чел.</b></div>
        <div class="tt-row"><span>Площадь:</span> <b>${Number(d.area).toLocaleString('ru-RU')} км²</b></div>
        <div class="tt-row"><span>Плотность:</span> <b>${density} чел./км²</b></div>
      `;
      tooltip.style.display = "block";
      
      const ttWidth = 240;
      let left = event.clientX + 14;
      let top = event.clientY + 14;
      if (left + ttWidth > window.innerWidth) left = event.clientX - ttWidth - 10;
      if (top + 160 > window.innerHeight) top = event.clientY - 160;

      tooltip.style.left = left + "px";
      tooltip.style.top = top + "px";
    }

    function hideTooltip() {
      tooltip.style.display = "none";
    }

    // -------------------------------------------------------------
    // ИНТЕГРАЦИЯ С ИИ (Gemini 3.5 Flash Lite через mapruapp.ru)
    // -------------------------------------------------------------
    async function sendAiQuery(userPrompt) {
      if (!userPrompt || !userPrompt.trim()) return;

      const submitBtn = document.getElementById("ai-submit");
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-circle-notch spinner"></i> <span>ИИ думает...</span>';

      const systemPrompt = `Ты — эксперт-географ и движок выборки данных для иерархической тепловой карты (treemap).
ТВОЯ ЗАДАЧА: проанализировать запрос пользователя и вернуть СТРОГО валидный сырой JSON-массив объектов без какого-либо Markdown, пояснений или кавычек \`\`\`json.
Максимум объектов: НЕ БОЛЕЕ 50!
Каждый объект ОБЯЗАН иметь структуру:
{
  "name": "Название на русском",
  "name_en": "English name",
  "country": "Страна (если это город)",
  "continent": "Европа" | "Азия" | "Северная Америка" | "Южная Америка" | "Африка" | "Океания",
  "type": "country" | "city",
  "pop": число_населения_целое,
  "area": площадь_в_км2_число,
  "density": плотность_чел_на_км2,
  "flag": "эмодзи_флаг"
}
Давай точные, проверенные энциклопедические данные! Никаких галлюцинаций.`;

      try {
        const messages = [
          { role: "system", content: systemPrompt },
          { role: "user", content: `Сделай выборку: ${userPrompt}. Строго JSON-массив до 50 элементов.` }
        ];

        const response = await fetch(PROXY_MAP, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: AI_MODEL,
            messages: messages,
            max_tokens: 8192
          })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        let rawContent = data.choices?.[0]?.message?.content || "";

        // Очистка ответа от Markdown, если модель вернула ```json
        rawContent = rawContent.replace(/```json/gi, '').replace(/```/g, '').trim();

        const parsedItems = JSON.parse(rawContent);
        if (!Array.isArray(parsedItems) || !parsedItems.length) {
          throw new Error("ИИ вернул неверный формат массива.");
        }

        // Применяем лимит 50
        state.filteredItems = parsedItems.slice(0, 50).map(item => ({
          ...item,
          pop: Number(item.pop) || 1,
          area: Number(item.area) || 1,
          density: Number(item.density) || Math.round((item.pop || 1) / (item.area || 1))
        }));

        state.mode = 'custom_ai';
        state.currentTitle = `Выборка ИИ: «${truncate(userPrompt, 35)}»`;
        
        // Снимаем подсветку со стандартных кнопок режимов
        document.querySelectorAll("#mode-group .btn-toggle").forEach(b => b.classList.remove("active"));

        renderTreemap();
      } catch (err) {
        alert("Ошибка генерации ИИ: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> <span>Сформировать</span>';
      }
    }

    // Слушатели интерфейса
    document.querySelectorAll("#mode-group .btn-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#mode-group .btn-toggle").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.mode = btn.dataset.mode;
        applyFiltersAndRender();
      });
    });

    document.getElementById("size-metric").addEventListener("change", e => {
      state.sizeMetric = e.target.value;
      renderTreemap();
    });

    document.getElementById("color-metric").addEventListener("change", e => {
      state.colorMetric = e.target.value;
      renderTreemap();
    });

    document.getElementById("limit-select").addEventListener("change", e => {
      state.limit = parseInt(e.target.value, 10);
      applyFiltersAndRender();
    });

    document.getElementById("ai-submit").addEventListener("click", () => {
      sendAiQuery(document.getElementById("ai-input").value);
    });

    document.getElementById("ai-input").addEventListener("keydown", e => {
      if (e.key === "Enter") sendAiQuery(e.target.value);
    });

    document.querySelectorAll(".quick-chips .chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const query = chip.dataset.q;
        document.getElementById("ai-input").value = query;
        sendAiQuery(query);
      });
    });

    window.addEventListener("resize", () => {
      renderTreemap();
    });

    // Старт приложения
    loadDataset();
  </script>
</body>
</html>
