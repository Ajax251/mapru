<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkMaster Pro — Анализ, фильтрация и выгрузка ссылок</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-page: #f8fafc;
            --surface: #ffffff;
            --surface-muted: #f1f5f9;
            --surface-hover: #e2e8f0;
            --border: #e2e8f0;
            --border-focus: #4f46e5;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-subtle: #94a3b8;

            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --emerald: #059669;
            --emerald-light: #ecfdf5;
            --rose: #e11d48;
            --rose-light: #fff1f2;
            --amber: #d97706;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            --shadow-subtle: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-card: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
            --shadow-float: 0 14px 28px -4px rgba(15, 23, 42, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            max-width: 100vw;
            overflow-x: hidden; /* Строго без горизонтального скролла */
            background-color: var(--bg-page);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            color: var(--text-main);
            line-height: 1.5;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.15rem;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            color: #fff;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .workspace-grid {
            max-width: 1400px;
            width: 100%;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 410px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .workspace-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .card-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
        }

        .card-title {
            font-size: 0.94rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-body { padding: 18px; }

        /* Выбор сервера */
        .server-selector-card {
            background: #fdfdfe;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 16px;
        }

        .server-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .server-badge.online { background: #dcfce7; color: #15803d; }
        .server-badge.checking { background: #fef3c7; color: #b45309; }
        .server-badge.error { background: #fee2e2; color: #b91c1c; }

        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            background: var(--surface-muted);
            padding: 4px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }

        .nav-tab-btn {
            border: none;
            background: transparent;
            padding: 8px 4px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .nav-tab-btn.active {
            background: #fff;
            color: var(--primary);
            box-shadow: var(--shadow-subtle);
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .form-group { margin-bottom: 14px; }
        .form-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="url"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.86rem;
            color: var(--text-main);
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        textarea {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            min-height: 120px;
            resize: vertical;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 15px;
            font-size: 0.84rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .btn:disabled { opacity: 0.55; cursor: not-allowed; pointer-events: none; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-emerald { background: var(--emerald); color: #fff; }
        .btn-emerald:hover { background: #047857; }
        .btn-outline { background: #fff; border-color: var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--surface-muted); }
        .btn-subtle { background: var(--surface-muted); color: var(--text-muted); }
        .btn-subtle:hover { background: var(--surface-hover); color: var(--text-main); }
        .btn-sm { padding: 5px 10px; font-size: 0.76rem; }
        .btn-block { width: 100%; }

        .file-dropzone {
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #fafbfc;
            transition: all 0.2s;
        }
        .file-dropzone:hover { border-color: var(--primary); background: var(--primary-light); }

        .stats-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-pill-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .stat-num { font-size: 1.15rem; font-weight: 700; line-height: 1; }
        .stat-desc { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .search-field { flex: 1; min-width: 200px; position: relative; }
        .search-field i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-subtle);
        }
        .search-field input { padding-left: 34px; }

        .view-mode-group {
            display: flex;
            background: var(--surface-muted);
            padding: 3px;
            border-radius: var(--radius-sm);
            gap: 2px;
        }

        .view-btn {
            border: none;
            background: transparent;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }
        .view-btn.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-subtle); }

        .filter-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .pill-filter {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .pill-filter.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* ВЕРТИКАЛЬНАЯ ЛЕНТА */
        .feed-container {
            max-height: 680px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .feed-container::-webkit-scrollbar { width: 6px; }
        .feed-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }

        .feed-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.15s ease;
        }

        .feed-card:hover { border-color: #cbd5e1; box-shadow: var(--shadow-subtle); }
        .feed-card.selected { background: var(--primary-light); border-color: #a5b4fc; }

        .feed-thumb-box {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: var(--surface-muted);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
        }

        .feed-thumb-box img { width: 100%; height: 100%; object-fit: cover; }

        .feed-info { flex: 1; min-width: 0; }

        .link-url-text {
            display: block;
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            overflow-wrap: anywhere;
            word-break: break-all;
            line-height: 1.35;
        }
        .link-url-text:hover { color: var(--primary); text-decoration: underline; }

        .feed-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .type-tag {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .type-tag.img { background: var(--emerald-light); color: var(--emerald); }
        .type-tag.vid { background: #fdf4ff; color: #a21caf; }
        .type-tag.aud { background: #fffbeb; color: var(--amber); }
        .type-tag.doc { background: var(--rose-light); color: var(--rose); }
        .type-tag.web { background: var(--primary-light); color: var(--primary); }

        .feed-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .btn-icon-action {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon-action:hover { background: var(--surface-muted); color: var(--primary); }

        /* РЕЖИМ: СЕТКА ЭСКИЗОВ */
        .feed-container.view-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
        }
        .feed-container.view-grid .feed-card {
            flex-direction: column;
            align-items: stretch;
            padding: 8px;
            position: relative;
        }
        .feed-container.view-grid .feed-thumb-box {
            width: 100%;
            height: 135px;
            border-radius: 6px;
        }
        .feed-container.view-grid .grid-checkbox {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 5;
        }

        .status-alert {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 12px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }
        .status-alert.show { display: flex; }
        .status-alert.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .status-alert.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-alert.error { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; }

        .batch-bar {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-float);
        }
        .modal-top {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-body {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="brand-box">
            <div class="brand-icon"><i class="fas fa-layer-group"></i></div>
            <span>LinkMaster <span style="font-size:0.75rem; background:var(--primary-light); color:var(--primary); padding:2px 8px; border-radius:999px;">PRO FEED</span></span>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-outline btn-sm" onclick="clearWorkspace()">
                <i class="fas fa-trash-can"></i> Сброс
            </button>
        </div>
    </header>

    <div class="workspace-grid">
        <!-- ЛЕВАЯ КОЛОНКА -->
        <aside>
            <!-- ВЫБОР СЕРВЕРА -->
            <div class="server-selector-card">
                <div class="form-label" style="margin-bottom:6px;">
                    <span><i class="fas fa-server"></i> Сервер для парсинга:</span>
                    <span id="apiStatusBadge" class="server-badge checking">Проверка...</span>
                </div>
                <select id="serverSelect" onchange="testServerHealth()">
                    <option value="https://mapruapp.ru/page-scraper" selected>Основной сервер (mapruapp.ru)</option>
                    <option value="https://linkextractor.vercel.app">Резервный сервер (Vercel)</option>
                </select>
            </div>

            <!-- ИСТОЧНИКИ ДАННЫХ -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-bolt" style="color:var(--primary);"></i> Источник данных</div>
                </div>
                <div class="card-body">
                    <div class="nav-tabs">
                        <button class="nav-tab-btn active" onclick="setSourceTab('url', this)"><i class="fas fa-globe"></i> URL</button>
                        <button class="nav-tab-btn" onclick="setSourceTab('html', this)"><i class="fas fa-code"></i> HTML</button>
                        <button class="nav-tab-btn" onclick="setSourceTab('file', this)"><i class="fas fa-file"></i> Файл</button>
                        <button class="nav-tab-btn" onclick="setSourceTab('list', this)"><i class="fas fa-list"></i> Список</button>
                    </div>

                    <!-- TAB 1: URL -->
                    <div id="tab-url" class="tab-panel active">
                        <div class="form-group">
                            <label class="form-label">Ссылка на страницу сайта</label>
                            <input type="url" id="targetUrlInput" placeholder="https://example.com/gallery">
                        </div>
                        <button class="btn btn-primary btn-block" onclick="runServerUrlExtraction()" id="btnScrapeUrl">
                            <i class="fas fa-magnifying-glass"></i> Извлечь ссылки через сервер
                        </button>
                    </div>

                    <!-- TAB 2: HTML/TEXT -->
                    <div id="tab-html" class="tab-panel">
                        <div class="form-group">
                            <label class="form-label">Базовый домен (для относительных путей)</label>
                            <input type="url" id="baseDomainInput" placeholder="https://example.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Исходный HTML или текст</label>
                            <textarea id="rawHtmlInput" placeholder="Вставьте HTML код страницы..."></textarea>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                            <button class="btn btn-emerald" onclick="runClientLocalHtml()"><i class="fas fa-laptop"></i> В браузере</button>
                            <button class="btn btn-primary" onclick="runServerTextExtraction()"><i class="fas fa-server"></i> На сервере</button>
                        </div>
                    </div>

                    <!-- TAB 3: FILE -->
                    <div id="tab-file" class="tab-panel">
                        <div class="form-group">
                            <label class="form-label">Базовый домен для файла</label>
                            <input type="url" id="fileBaseDomain" placeholder="https://example.com">
                        </div>
                        <div class="file-dropzone" onclick="document.getElementById('fileChooser').click()">
                            <i class="fas fa-cloud-arrow-up" style="font-size:1.8rem; color:var(--primary); margin-bottom:6px;"></i>
                            <div style="font-weight:600; font-size:0.84rem;" id="fileNameDisplay">Нажмите или перетащите файл</div>
                            <div style="font-size:0.72rem; color:var(--text-muted);">.html, .htm, .txt, .json, .css</div>
                        </div>
                        <input type="file" id="fileChooser" style="display:none;" onchange="onFileSelected(this.files)">
                        <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="runServerFileExtraction()">
                            <i class="fas fa-file-arrow-up"></i> Разобрать файл на сервере
                        </button>
                    </div>

                    <!-- TAB 4: LIST -->
                    <div id="tab-list" class="tab-panel">
                        <div class="form-group">
                            <label class="form-label">Список ссылок (по одной на строку)</label>
                            <textarea id="bulkUrlsInput" placeholder="https://site.com/img1.jpg&#10;https://site.com/doc.pdf"></textarea>
                        </div>
                        <button class="btn btn-emerald btn-block" onclick="importBulkList()">
                            <i class="fas fa-arrow-right-to-bracket"></i> Импорт в ленту
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ПРАВАЯ КОЛОНКА: ЛЕНТА И ЭСКИЗЫ -->
        <main>
            <div class="stats-strip">
                <div class="stat-pill">
                    <div class="stat-pill-icon" style="background:var(--primary-light); color:var(--primary);"><i class="fas fa-link"></i></div>
                    <div><div class="stat-num" id="statAll">0</div><div class="stat-desc">Всего</div></div>
                </div>
                <div class="stat-pill">
                    <div class="stat-pill-icon" style="background:var(--emerald-light); color:var(--emerald);"><i class="fas fa-image"></i></div>
                    <div><div class="stat-num" id="statImg">0</div><div class="stat-desc">Картинки</div></div>
                </div>
                <div class="stat-pill">
                    <div class="stat-pill-icon" style="background:#fdf4ff; color:#a21caf;"><i class="fas fa-video"></i></div>
                    <div><div class="stat-num" id="statMedia">0</div><div class="stat-desc">Медиа</div></div>
                </div>
                <div class="stat-pill">
                    <div class="stat-pill-icon" style="background:var(--rose-light); color:var(--rose);"><i class="fas fa-file-zipper"></i></div>
                    <div><div class="stat-num" id="statDocs">0</div><div class="stat-desc">Файлы</div></div>
                </div>
                <div class="stat-pill">
                    <div class="stat-pill-icon" style="background:var(--surface-muted); color:var(--text-main);"><i class="fas fa-globe"></i></div>
                    <div><div class="stat-num" id="statHosts">0</div><div class="stat-desc">Домены</div></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <span>Рабочая область</span>
                        <span id="filteredBadge" style="font-size:0.75rem; background:var(--surface-muted); color:var(--text-muted); padding:2px 8px; border-radius:999px;">0</span>
                    </div>

                    <div class="view-mode-group">
                        <button class="view-btn active" id="btnViewFeed" onclick="changeView('feed')"><i class="fas fa-bars-staggered"></i> Лента</button>
                        <button class="view-btn" id="btnViewGrid" onclick="changeView('grid')"><i class="fas fa-grip"></i> Эскизы</button>
                    </div>
                </div>

                <div class="card-body">
                    <div id="statusAlert" class="status-alert"><span id="statusAlertText">Готов к работе</span></div>

                    <div class="toolbar">
                        <div class="search-field">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Поиск по ссылке или расширению...">
                        </div>
                        <select id="selectDomain" style="width:auto; min-width:160px;" onchange="renderFeed()">
                            <option value="all">Все домены</option>
                        </select>
                        <select id="selectSort" style="width:auto;" onchange="renderFeed()">
                            <option value="none">Порядок добавления</option>
                            <option value="az">По алфавиту A → Z</option>
                            <option value="za">По алфавиту Z → A</option>
                        </select>
                    </div>

                    <div class="filter-badges">
                        <button class="pill-filter active" data-cat="all" onclick="setCategory('all')"><i class="fas fa-layer-group"></i> Все</button>
                        <button class="pill-filter" data-cat="images" onclick="setCategory('images')"><i class="fas fa-image"></i> Изображения</button>
                        <button class="pill-filter" data-cat="videos" onclick="setCategory('videos')"><i class="fas fa-video"></i> Видео</button>
                        <button class="pill-filter" data-cat="audio" onclick="setCategory('audio')"><i class="fas fa-music"></i> Аудио</button>
                        <button class="pill-filter" data-cat="docs" onclick="setCategory('docs')"><i class="fas fa-file-zipper"></i> Документы/Архивы</button>
                        <button class="pill-filter" data-cat="pages" onclick="setCategory('pages')"><i class="fas fa-code-branch"></i> Страницы</button>
                    </div>

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:0.8rem; color:var(--text-muted);">
                        <label style="cursor:pointer; display:flex; align-items:center; gap:6px; font-weight:600; color:var(--text-main);">
                            <input type="checkbox" id="chkMasterSelect" onchange="toggleSelectAll(this.checked)" style="accent-color:var(--primary);">
                            <span id="lblSelectCount">Выбрать отображаемые (0)</span>
                        </label>
                    </div>

                    <!-- ЛЕНТА / СЕТКА -->
                    <div id="feedStream" class="feed-container">
                        <div style="text-align:center; padding:50px 20px; color:var(--text-subtle);">
                            <i class="fas fa-compass" style="font-size:2.8rem; margin-bottom:10px;"></i>
                            <div style="font-weight:600;">Лента пуста</div>
                            <div style="font-size:0.8rem; margin-top:2px;">Запустите анализ по URL или загрузите файл слева.</div>
                        </div>
                    </div>

                    <div class="batch-bar">
                        <div style="display:flex; gap:8px;">
                            <button class="btn btn-primary btn-sm" onclick="copyPickedUrls()" id="btnBatchCopy" disabled>
                                <i class="fas fa-copy"></i> <span id="lblCopyBatch">Копировать</span>
                            </button>
                            <button class="btn btn-emerald btn-sm" onclick="downloadSmartZip()" id="btnBatchZip" disabled>
                                <i class="fas fa-file-zipper"></i> <span id="lblZipBatch">Скачать в ZIP</span>
                            </button>
                        </div>
                        <div style="display:flex; gap:4px; align-items:center;">
                            <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">Экспорт:</span>
                            <button class="btn btn-subtle btn-sm" onclick="exportData('txt')">TXT</button>
                            <button class="btn btn-subtle btn-sm" onclick="exportData('csv')">CSV</button>
                            <button class="btn btn-subtle btn-sm" onclick="exportData('json')">JSON</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- PREVIEW MODAL -->
    <div id="previewModal" class="modal-overlay" onclick="closeModalOnBg(event)">
        <div class="modal-content">
            <div class="modal-top">
                <div id="modalTitle" style="font-weight:600; font-size:0.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80%;">Предпросмотр</div>
                <div style="display:flex; gap:6px;">
                    <a id="modalExtLink" href="#" target="_blank" class="btn btn-outline btn-sm"><i class="fas fa-arrow-up-right-from-square"></i></a>
                    <button class="btn btn-subtle btn-sm" onclick="closePreviewModal()"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="modal-body" id="modalMediaContainer"></div>
        </div>
    </div>

    <script>
        let masterLinks = [];
        let filteredLinks = [];
        let pickedLinks = new Set();
        let activeCategory = 'all';
        let currentView = 'feed';

        const feedStream = document.getElementById('feedStream');
        const searchInput = document.getElementById('searchInput');
        const selectDomain = document.getElementById('selectDomain');
        const selectSort = document.getElementById('selectSort');
        const serverSelect = document.getElementById('serverSelect');
        const fileChooser = document.getElementById('fileChooser');

        searchInput.addEventListener('input', () => renderFeed());
        testServerHealth();

        function getActiveApiEndpoint() {
            return serverSelect.value.replace(/\/+$/, '');
        }

        async function testServerHealth() {
            const badge = document.getElementById('apiStatusBadge');
            const base = getActiveApiEndpoint();
            badge.className = 'server-badge checking';
            badge.textContent = 'Проверка...';

            try {
                const res = await fetch(`${base}/health`, { method: 'GET', signal: AbortSignal.timeout(4000) });
                if (res.ok) {
                    badge.className = 'server-badge online';
                    badge.textContent = 'Онлайн';
                } else {
                    throw new Error();
                }
            } catch {
                badge.className = 'server-badge error';
                badge.textContent = 'Офлайн';
            }
        }

        function setSourceTab(tabKey, btn) {
            document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tabKey}`).classList.add('active');
        }

        function notify(msg, type = 'info') {
            const el = document.getElementById('statusAlert');
            const txt = document.getElementById('statusAlertText');
            el.className = `status-alert show ${type}`;
            txt.innerHTML = msg;
        }

        function isImg(u) { return /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico|avif)(\?.*)?$/i.test(new URL(u).pathname); }
        function isVid(u) { return /\.(mp4|webm|mov|mkv|avi|wmv)(\?.*)?$/i.test(new URL(u).pathname); }
        function isAud(u) { return /\.(mp3|wav|ogg|flac|m4a|aac)(\?.*)?$/i.test(new URL(u).pathname); }
        function isDoc(u) { return /\.(pdf|docx?|xlsx?|pptx?|zip|rar|7z|tar|gz|txt|csv)(\?.*)?$/i.test(new URL(u).pathname); }

        function getCatData(u) {
            try {
                if (isImg(u)) return { key: 'images', name: 'IMG', css: 'img', icon: 'fa-image' };
                if (isVid(u)) return { key: 'videos', name: 'VID', css: 'vid', icon: 'fa-film' };
                if (isAud(u)) return { key: 'audio',  name: 'AUD', css: 'aud', icon: 'fa-music' };
                if (isDoc(u)) return { key: 'docs',   name: 'DOC', css: 'doc', icon: 'fa-file-zipper' };
            } catch {}
            return { key: 'pages', name: 'WEB', css: 'web', icon: 'fa-globe' };
        }

        function extractHost(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return 'unknown'; } }
        function extractName(u, idx = 0) {
            try {
                const p = new URL(u).pathname;
                let n = p.substring(p.lastIndexOf('/') + 1).split(/[?#]/)[0];
                return decodeURIComponent(n) || `file_${idx + 1}`;
            } catch { return `file_${idx + 1}`; }
        }

        function loadDataset(links, msg) {
            masterLinks = Array.from(new Set(links));
            pickedLinks.clear();

            const domains = new Map();
            masterLinks.forEach(l => {
                const h = extractHost(l);
                domains.set(h, (domains.get(h) || 0) + 1);
            });

            selectDomain.innerHTML = `<option value="all">Все домены (${domains.size})</option>`;
            Array.from(domains.entries()).sort((a,b) => b[1] - a[1]).forEach(([h, count]) => {
                const opt = document.createElement('option');
                opt.value = h;
                opt.textContent = `${h} (${count})`;
                selectDomain.appendChild(opt);
            });

            document.getElementById('statAll').textContent = masterLinks.length;
            document.getElementById('statImg').textContent = masterLinks.filter(u => { try { return isImg(u); } catch { return false; } }).length;
            document.getElementById('statMedia').textContent = masterLinks.filter(u => { try { return isVid(u) || isAud(u); } catch { return false; } }).length;
            document.getElementById('statDocs').textContent = masterLinks.filter(u => { try { return isDoc(u); } catch { return false; } }).length;
            document.getElementById('statHosts').textContent = domains.size;

            renderFeed();
            notify(msg, masterLinks.length ? 'success' : 'info');
        }

        function changeView(mode) {
            currentView = mode;
            document.getElementById('btnViewFeed').classList.toggle('active', mode === 'feed');
            document.getElementById('btnViewGrid').classList.toggle('active', mode === 'grid');
            feedStream.classList.toggle('view-grid', mode === 'grid');
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.pill-filter').forEach(p => p.classList.toggle('active', p.dataset.cat === cat));
            renderFeed();
        }

        function renderFeed() {
            const q = searchInput.value.trim().toLowerCase();
            const host = selectDomain.value;
            const sort = selectSort.value;

            filteredLinks = masterLinks.filter(u => {
                const cat = getCatData(u).key;
                if (activeCategory !== 'all' && cat !== activeCategory) return false;
                if (host !== 'all' && extractHost(u) !== host) return false;
                if (!q) return true;
                return u.toLowerCase().includes(q);
            });

            if (sort === 'az') filteredLinks.sort((a,b) => a.localeCompare(b));
            if (sort === 'za') filteredLinks.sort((a,b) => b.localeCompare(a));

            document.getElementById('filteredBadge').textContent = `${filteredLinks.length} из ${masterLinks.length}`;

            if (filteredLinks.length === 0) {
                feedStream.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">Ничего не найдено</div>`;
                updateBatchState();
                return;
            }

            feedStream.innerHTML = filteredLinks.map((url, idx) => {
                const cat = getCatData(url);
                const h = extractHost(url);
                const isSelected = pickedLinks.has(url);
                const safe = encodeURIComponent(url);
                const isImage = isImg(url);

                const thumb = isImage
                    ? `<img src="${url}" loading="lazy" alt="thumb" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\\'fas fa-image\\'></i>';">`
                    : `<i class="fas ${cat.icon}"></i>`;

                return `
                    <div class="feed-card ${isSelected ? 'selected' : ''}">
                        <input type="checkbox" class="grid-checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${safe}', this)" style="accent-color:var(--primary); cursor:pointer;">
                        <div class="feed-thumb-box" onclick="openPreview('${safe}')" title="Предпросмотр">
                            ${thumb}
                        </div>
                        <div class="feed-info">
                            <a href="${url}" target="_blank" rel="noopener noreferrer" class="link-url-text">${url}</a>
                            <div class="feed-meta">
                                <span class="type-tag ${cat.css}">${cat.name}</span>
                                <span><i class="fas fa-globe" style="font-size:0.65rem;"></i> ${h}</span>
                            </div>
                        </div>
                        <div class="feed-actions">
                            <button class="btn-icon-action" onclick="copyDirect('${safe}', this)" title="Копировать"><i class="fas fa-copy"></i></button>
                            <button class="btn-icon-action" onclick="downloadSingle('${safe}')" title="Скачать"><i class="fas fa-download"></i></button>
                        </div>
                    </div>
                `;
            }).join('');

            updateBatchState();
        }

        function toggleSelect(safeUrl, chk) {
            const url = decodeURIComponent(safeUrl);
            const card = chk.closest('.feed-card');
            if (chk.checked) { pickedLinks.add(url); card.classList.add('selected'); }
            else { pickedLinks.delete(url); card.classList.remove('selected'); }
            updateBatchState();
        }

        function toggleSelectAll(checked) {
            filteredLinks.forEach(u => checked ? pickedLinks.add(u) : pickedLinks.delete(u));
            feedStream.querySelectorAll('.feed-card').forEach(c => {
                c.classList.toggle('selected', checked);
                c.querySelector('input[type="checkbox"]').checked = checked;
            });
            updateBatchState();
        }

        function updateBatchState() {
            const count = pickedLinks.size > 0 ? pickedLinks.size : filteredLinks.length;
            const lbl = pickedLinks.size > 0 ? `(${pickedLinks.size})` : `(${filteredLinks.length})`;
            document.getElementById('lblSelectCount').textContent = pickedLinks.size > 0
                ? `Выбрано: ${pickedLinks.size} из ${filteredLinks.length}`
                : `Выбрать отображаемые (${filteredLinks.length})`;

            document.getElementById('chkMasterSelect').checked = filteredLinks.length > 0 && pickedLinks.size === filteredLinks.length;
            const disabled = count === 0;
            document.getElementById('btnBatchCopy').disabled = disabled;
            document.getElementById('btnBatchZip').disabled = disabled;
            document.getElementById('lblCopyBatch').textContent = `Копировать ${lbl}`;
            document.getElementById('lblZipBatch').textContent = `Скачать ZIP ${lbl}`;
        }

        function copyDirect(safe, btn) {
            navigator.clipboard.writeText(decodeURIComponent(safe)).then(() => {
                const old = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check" style="color:var(--emerald);"></i>';
                setTimeout(() => btn.innerHTML = old, 1000);
            });
        }

        function copyPickedUrls() {
            const targets = pickedLinks.size ? Array.from(pickedLinks) : filteredLinks;
            navigator.clipboard.writeText(targets.join('\n')).then(() => notify(`Скопировано ${targets.length} ссылок.`, 'success'));
        }

        function downloadSingle(safe) {
            const url = decodeURIComponent(safe);
            const a = document.createElement('a');
            a.href = url;
            a.download = extractName(url);
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Запросы к выбранному серверу
        async function runServerUrlExtraction() {
            const urlVal = document.getElementById('targetUrlInput').value.trim();
            if (!urlVal) return notify('Введите URL для анализа.', 'error');
            const apiBase = getActiveApiEndpoint();

            notify(`Анализ через сервер ${apiBase}...`, 'info');
            const fd = new FormData();
            fd.append('url_input', urlVal);

            try {
                const res = await fetch(`${apiBase}/extract-from-url/`, { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
                loadDataset(data.links || [], data.message || `Найдено ${data.count} ссылок.`);
            } catch (err) {
                notify(`Ошибка сервера: ${err.message}`, 'error');
            }
        }

        async function runServerTextExtraction() {
            const text = document.getElementById('rawHtmlInput').value.trim();
            const base = document.getElementById('baseDomainInput').value.trim();
            if (!text) return notify('Введите HTML или текст.', 'error');
            const apiBase = getActiveApiEndpoint();

            notify('Сервер выполняет парсинг текста...', 'info');
            const fd = new FormData();
            fd.append('text_input', text);
            if (base) fd.append('base_url', base);

            try {
                const res = await fetch(`${apiBase}/extract-from-text/`, { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
                loadDataset(data.links || [], data.message || `Найдено ${data.count} ссылок.`);
            } catch (err) {
                notify(`Ошибка сервера: ${err.message}`, 'error');
            }
        }

        function onFileSelected(files) {
            if (files && files[0]) document.getElementById('fileNameDisplay').textContent = files[0].name;
        }

        async function runServerFileExtraction() {
            const file = fileChooser.files[0];
            const base = document.getElementById('fileBaseDomain').value.trim();
            if (!file) return notify('Выберите файл для отправки.', 'error');
            const apiBase = getActiveApiEndpoint();

            notify(`Отправка файла «${file.name}» на сервер...`, 'info');
            const fd = new FormData();
            fd.append('file', file);
            if (base) fd.append('base_url', base);

            try {
                const res = await fetch(`${apiBase}/extract-from-file/`, { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
                loadDataset(data.links || [], data.message);
            } catch (err) {
                notify(`Ошибка обработки файла: ${err.message}`, 'error');
            }
        }

        function runClientLocalHtml() {
            const raw = document.getElementById('rawHtmlInput').value.trim();
            const base = document.getElementById('baseDomainInput').value.trim();
            if (!raw) return notify('Вставьте HTML-код.', 'error');

            const set = new Set();
            const doc = new DOMParser().parseFromString(raw, 'text/html');
            doc.querySelectorAll('a[href], img[src], video[src], audio[src], link[href], script[src]').forEach(el => {
                const val = el.getAttribute('href') || el.getAttribute('src');
                if (val && !val.startsWith('#') && !val.startsWith('javascript:')) {
                    try { set.add(base ? new URL(val, base).href : new URL(val).href); } catch {}
                }
            });
            loadDataset(Array.from(set), `Локально найдено ${set.size} ссылок.`);
        }

        function importBulkList() {
            const urls = document.getElementById('bulkUrlsInput').value.split('\n').map(l => l.trim()).filter(l => /^https?:\/\/.+/i.test(l));
            if (!urls.length) return notify('Список ссылок пуст.', 'error');
            loadDataset(urls, `Импортировано ${urls.length} ссылок.`);
        }

        // Скачивание файлов в ZIP с резервным каналом через mapruapp.ru при блокировке CORS
        async function fetchBlobSmart(url) {
            try {
                const res = await fetch(url);
                if (res.ok) return await res.blob();
            } catch {}

            // Если удаленный сайт блокирует CORS в браузере — качаем через бэкенд mapruapp.ru
            const proxyUrl = `https://mapruapp.ru/page-scraper/proxy-download?url=${encodeURIComponent(url)}`;
            const proxyRes = await fetch(proxyUrl);
            if (!proxyRes.ok) throw new Error('CORS blocked');
            return await proxyRes.blob();
        }

        async function downloadSmartZip() {
            const targets = pickedLinks.size ? Array.from(pickedLinks) : filteredLinks;
            if (!targets.length) return;
            const zip = new JSZip();
            let ok = 0, fail = 0;

            notify(`Упаковка файлов в ZIP (0/${targets.length})...`, 'info');

            for (let i = 0; i < targets.length; i++) {
                const u = targets[i];
                const fname = `${i + 1}_${extractName(u, i)}`;
                try {
                    const blob = await fetchBlobSmart(u);
                    zip.file(fname, blob);
                    ok++;
                } catch {
                    fail++;
                }
                notify(`Сборка ZIP: обработано ${i + 1} из ${targets.length}...`, 'info');
            }

            if (ok === 0) return notify('Не удалось скачать файлы из-за ограничений удаленных серверов.', 'error');

            const archive = await zip.generateAsync({ type: 'blob' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(archive);
            a.download = `LinkMaster_Files_${Date.now()}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
            notify(`Архив готов: упаковано ${ok} файлов (пропущено: ${fail}).`, 'success');
        }

        function exportData(fmt) {
            const targets = pickedLinks.size ? Array.from(pickedLinks) : filteredLinks;
            if (!targets.length) return notify('Список пуст.', 'error');

            let body = '', mime = 'text/plain;charset=utf-8', ext = fmt;
            if (fmt === 'txt') {
                body = targets.join('\n');
            } else if (fmt === 'json') {
                body = JSON.stringify(targets.map(u => ({ url: u, domain: extractHost(u), type: getCatData(u).name })), null, 2);
                mime = 'application/json;charset=utf-8';
            } else if (fmt === 'csv') {
                body = '\uFEFF"URL","Domain","Type"\n' + targets.map(u => `"${u}","${extractHost(u)}","${getCatData(u).name}"`).join('\n');
                mime = 'text/csv;charset=utf-8';
            }

            const blob = new Blob([body], { type: mime });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `export_${Date.now()}.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
            notify(`Экспортировано ${targets.length} ссылок в .${ext}`, 'success');
        }

        function openPreview(safe) {
            const url = decodeURIComponent(safe);
            const box = document.getElementById('modalMediaContainer');
            document.getElementById('modalTitle').textContent = extractName(url);
            document.getElementById('modalExtLink').href = url;
            box.innerHTML = '';

            if (isImg(url)) {
                box.innerHTML = `<img src="${url}" style="max-width:100%; max-height:75vh; border-radius:6px;" alt="preview">`;
            } else if (isVid(url)) {
                box.innerHTML = `<video controls autoplay style="max-width:100%; max-height:75vh;"><source src="${url}"></video>`;
            } else if (isAud(url)) {
                box.innerHTML = `<audio controls autoplay style="width:100%; max-width:400px;"><source src="${url}"></audio>`;
            } else {
                window.open(url, '_blank');
                return;
            }
            document.getElementById('previewModal').classList.add('open');
        }

        function closePreviewModal() {
            document.getElementById('previewModal').classList.remove('open');
            document.getElementById('modalMediaContainer').innerHTML = '';
        }

        function closeModalOnBg(e) {
            if (e.target.classList.contains('modal-overlay')) closePreviewModal();
        }

        function clearWorkspace() {
            masterLinks = [];
            filteredLinks = [];
            pickedLinks.clear();
            document.getElementById('targetUrlInput').value = '';
            document.getElementById('rawHtmlInput').value = '';
            document.getElementById('bulkUrlsInput').value = '';
            loadDataset([], 'Рабочая область очищена.');
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePreviewModal();
        });
    </script>
</body>
</html>
