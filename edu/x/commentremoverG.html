<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очиститель комментариев и Протокол</title>
    <!-- FontAwesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-panel: #1e293b;
            --bg-input: #0f172a;
            --border-color: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --tag-html: #e34c26;
            --tag-css: #264de4;
            --tag-js: #f7df1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .logo i {
            color: var(--accent);
            font-size: 1.5rem;
        }

        /* Главная рабочая область */
        main {
            flex: 1;
            display: flex;
            gap: 16px;
            padding: 16px;
            height: calc(100vh - 130px);
        }

        .editor-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .editor-header {
            background-color: #182234;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            flex: 1;
            background-color: var(--bg-input);
            color: #f1f5f9;
            border: none;
            padding: 16px;
            font-family: "Fira Code", Consolas, Monaco, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        /* Панель управления */
        .controls-bar {
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-success {
            background-color: #10b981;
            color: #fff;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        /* ========================================================= */
        /* ПОЛНОРАЗМЕРНОЕ МОДАЛЬНОЕ ОКНО ПРОТОКОЛА (90vw x 85vh)      */
        /* ========================================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(6px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            visibility: visible;
            transition: all 0.25s ease;
        }

        .modal-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .modal-window {
            width: 92vw;
            max-width: 1300px;
            height: 86vh;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка модалки */
        .modal-header {
            background-color: #0f172a;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .modal-title-group i {
            font-size: 1.6rem;
            color: var(--accent);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .stats-badges {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .badge {
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: #334155;
            color: #cbd5e1;
        }

        .badge-total { background: #2563eb; color: #fff; font-weight: bold; }
        .badge-html { background: rgba(227, 76, 38, 0.2); color: #f97316; }
        .badge-css { background: rgba(38, 77, 228, 0.2); color: #60a5fa; }
        .badge-js { background: rgba(247, 223, 30, 0.2); color: #facc15; }

        /* Панель фильтров модалки */
        .modal-toolbar {
            background-color: #182234;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            outline: none;
        }

        .filter-select {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }

        /* Список протокола */
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background-color: #0f172a;
        }

        .protocol-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: "Fira Code", Consolas, monospace;
            font-size: 0.875rem;
        }

        .protocol-row {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: background 0.15s;
        }

        .protocol-row:hover {
            background-color: #27354f;
        }

        .line-num {
            color: var(--text-muted);
            font-weight: bold;
            min-width: 110px;
            white-space: nowrap;
        }

        .type-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            min-width: 65px;
            text-align: center;
        }

        .type-html { background-color: rgba(227, 76, 38, 0.2); color: #f97316; border: 1px solid var(--tag-html); }
        .type-css { background-color: rgba(38, 77, 228, 0.2); color: #60a5fa; border: 1px solid var(--tag-css); }
        .type-js { background-color: rgba(247, 223, 30, 0.2); color: #facc15; border: 1px solid var(--tag-js); }

        .comment-content {
            flex: 1;
            color: #cbd5e1;
            word-break: break-all;
            white-space: pre-wrap;
        }

        /* Подвал модалки */
        .modal-footer {
            background-color: #182234;
            padding: 14px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <header>
        <div class="logo">
            <i class="fas fa-code"></i>
            <span>HTML & Code Comment Cleaner Pro</span>
        </div>
        <div id="status-text" style="color: var(--text-muted); font-size: 0.9rem;">
            Вставьте код и нажмите «Очистить от комментариев»
        </div>
    </header>

    <!-- Основной редактор -->
    <main>
        <div class="editor-box">
            <div class="editor-header">
                <span><i class="fas fa-file-code"></i> Исходный код (с комментариями)</span>
                <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="clearInput()">Очистить</button>
            </div>
            <textarea id="input-code" placeholder="Вставьте сюда ваш HTML / CSS / JS код..."></textarea>
        </div>

        <div class="editor-box">
            <div class="editor-header">
                <span><i class="fas fa-check-circle" style="color: #10b981;"></i> Очищенный код</span>
                <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="copyCleanCode()"><i class="fas fa-copy"></i> Копировать</button>
            </div>
            <textarea id="output-code" readonly placeholder="Здесь появится результат без комментариев..."></textarea>
        </div>
    </main>

    <!-- Панель управления -->
    <div class="controls-bar">
        <div class="checkbox-group">
            <label><input type="checkbox" id="chk-html" checked> HTML (<code>&lt;!-- --&gt;</code>)</label>
            <label><input type="checkbox" id="chk-css" checked> CSS (<code>/* */</code>)</label>
            <label><input type="checkbox" id="chk-js" checked> JS (<code>//</code> и <code>/* */</code>)</label>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="processCode()">
                <i class="fas fa-broom"></i> Очистить код от комментариев
            </button>
            <button class="btn btn-success" id="btn-open-protocol" onclick="openModal()" disabled>
                <i class="fas fa-list-alt"></i> Открыть протокол (<span id="btn-count">0</span>)
            </button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- ПОЛНОРАЗМЕРНОЕ ОКНО ПРОТОКОЛА УДАЛЕНИЯ                   -->
    <!-- ========================================================= -->
    <div id="protocol-modal" class="modal-overlay hidden">
        <div class="modal-window">
            
            <div class="modal-header">
                <div class="modal-title-group">
                    <i class="fas fa-clipboard-list"></i>
                    <div>
                        <div class="modal-title">Протокол удаленных комментариев</div>
                        <div class="stats-badges">
                            <span class="badge badge-total">ВСЕГО УДАЛЕНО: <span id="stat-total">0</span></span>
                            <span class="badge badge-html">HTML: <span id="stat-html">0</span></span>
                            <span class="badge badge-css">CSS: <span id="stat-css">0</span></span>
                            <span class="badge badge-js">JS: <span id="stat-js">0</span></span>
                        </div>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="closeModal()"><i class="fas fa-times"></i> Закрыть</button>
            </div>

            <div class="modal-toolbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="modal-search" placeholder="Поиск по тексту комментария или номеру строки..." oninput="renderProtocolList()">
                </div>
                <div>
                    <select id="modal-filter" class="filter-select" onchange="renderProtocolList()">
                        <option value="all">Все типы комментариев</option>
                        <option value="HTML">Только HTML</option>
                        <option value="CSS">Только CSS</option>
                        <option value="JS">Только JS</option>
                    </select>
                </div>
            </div>

            <div class="modal-body">
                <div id="protocol-list" class="protocol-list">
                    <!-- Записи протокола заполняются динамически -->
                </div>
            </div>

            <div class="modal-footer">
                <span style="color: var(--text-muted); font-size: 0.85rem;">
                    <i class="fas fa-info-circle"></i> Протокол содержит точные номера строк исходного документа
                </span>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="copyProtocolText()"><i class="fas fa-copy"></i> Скопировать весь протокол</button>
                    <button class="btn btn-primary" onclick="downloadProtocolFile()"><i class="fas fa-download"></i> Скачать протокол (.txt)</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Глобальное хранилище данных протокола
        let removedCommentsLog = [];

        function clearInput() {
            document.getElementById('input-code').value = '';
            document.getElementById('output-code').value = '';
            removedCommentsLog = [];
            updateStatsUI();
        }

        function copyCleanCode() {
            const output = document.getElementById('output-code');
            if (!output.value) return;
            navigator.clipboard.writeText(output.value);
            alert('Очищенный код скопирован в буфер обмена!');
        }

        // Вспомогательная функция определения номера строки по индексу символа
        function getLineNumber(text, index) {
            return text.substring(0, index).split('\n').length;
        }

        // =========================================================
        // ОСНОВНОЙ АЛГОРИТМ УДАЛЕНИЯ И ФИКСАЦИИ ПРОТОКОЛА
        // =========================================================
        function processCode() {
            const rawCode = document.getElementById('input-code').value;
            if (!rawCode.trim()) {
                alert('Пожалуйста, вставьте код для очистки!');
                return;
            }

            const cleanHTML = document.getElementById('chk-html').checked;
            const cleanCSS = document.getElementById('chk-css').checked;
            const cleanJS = document.getElementById('chk-js').checked;

            removedCommentsLog = [];
            let processedCode = rawCode;

            // РЕГУЛЯРНЫЕ ВЫРАЖЕНИЯ С СОХРАНЕНИЕМ СТРОК В КВЫЧКАХ (Чтобы не портить http:// и т.д.)
            
            // 1. Поиск HTML комментариев: <!-- ... -->
            if (cleanHTML) {
                const htmlRegex = /<!--[\s\S]*?-->/g;
                let match;
                while ((match = htmlRegex.exec(rawCode)) !== null) {
                    const line = getLineNumber(rawCode, match.index);
                    removedCommentsLog.push({
                        index: match.index,
                        line: line,
                        type: 'HTML',
                        content: match[0]
                    });
                }
                processedCode = processedCode.replace(htmlRegex, '');
            }

            // 2. Поиск CSS и JS многострочных/однострочных комментариев
            // Используем парсер с учётом кавычек, чтобы случайно не вырезать // внутри строк
            const combinedRegex = /("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])*')|(\/\*[\s\S]*?\*\/)|(\/\/[^\r\n]*)/g;

            let match;
            while ((match = combinedRegex.exec(rawCode)) !== null) {
                const strDouble = match[1];
                const strSingle = match[2];
                const blockComment = match[3]; // /* ... */
                const lineComment = match[4];  // // ...

                if (blockComment && (cleanCSS || cleanJS)) {
                    // Определяем типы CSS или JS
                    const line = getLineNumber(rawCode, match.index);
                    const isCssContext = blockComment.includes('{') || blockComment.includes('}') || cleanCSS;
                    const commentType = isCssContext ? 'JS/CSS' : 'CSS';

                    removedCommentsLog.push({
                        index: match.index,
                        line: line,
                        type: commentType,
                        content: blockComment
                    });
                } else if (lineComment && cleanJS) {
                    const line = getLineNumber(rawCode, match.index);
                    removedCommentsLog.push({
                        index: match.index,
                        line: line,
                        type: 'JS',
                        content: lineComment
                    });
                }
            }

            // Очищаем итоговый код от JS/CSS комментариев (сохраняя кавычки)
            processedCode = processedCode.replace(combinedRegex, (m, g1, g2, g3, g4) => {
                if (g1) return g1; // Двойные кавычки сохраняем
                if (g2) return g2; // Одинарные кавычки сохраняем
                if (g3 && (cleanCSS || cleanJS)) return ''; // Вырезаем /* */
                if (g4 && cleanJS) return ''; // Вырезаем //
                return m;
            });

            // Сортируем протокол по номеру строки
            removedCommentsLog.sort((a, b) => a.line - b.line);

            // Выводим очищенный код
            document.getElementById('output-code').value = processedCode;

            // Обновляем счетчики и кнопки
            updateStatsUI();
            
            // Автоматически открываем модальное окно протокола
            openModal();
        }

        // Обновление показателей UI
        function updateStatsUI() {
            const total = removedCommentsLog.length;
            const htmlCount = removedCommentsLog.filter(c => c.type === 'HTML').length;
            const cssCount = removedCommentsLog.filter(c => c.type === 'CSS').length;
            const jsCount = removedCommentsLog.filter(c => c.type === 'JS' || c.type === 'JS/CSS').length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-html').textContent = htmlCount;
            document.getElementById('stat-css').textContent = cssCount;
            document.getElementById('stat-js').textContent = jsCount;
            document.getElementById('btn-count').textContent = total;

            document.getElementById('btn-open-protocol').disabled = (total === 0);
            document.getElementById('status-text').textContent = `Успешно обработано! Удалено комментариев: ${total}`;
        }

        // Отрисовка списка протокола в модальном окне
        function renderProtocolList() {
            const listContainer = document.getElementById('protocol-list');
            const searchVal = document.getElementById('modal-search').value.toLowerCase();
            const filterVal = document.getElementById('modal-filter').value;

            const filtered = removedCommentsLog.filter(item => {
                const matchType = (filterVal === 'all') || (item.type.includes(filterVal));
                const matchSearch = item.content.toLowerCase().includes(searchVal) || 
                                    `строка ${item.line}`.includes(searchVal);
                return matchType && matchSearch;
            });

            listContainer.innerHTML = '';

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>Комментарии не найдены или список пуст</p>
                    </div>`;
                return;
            }

            filtered.forEach(item => {
                const row = document.createElement('div');
                row.className = 'protocol-row';

                let tagClass = 'type-html';
                if (item.type.includes('CSS')) tagClass = 'type-css';
                if (item.type === 'JS') tagClass = 'type-js';

                row.innerHTML = `
                    <div class="line-num">[Строка ${item.line}]</div>
                    <div class="type-tag ${tagClass}">${item.type}</div>
                    <div class="comment-content">${escapeHtml(item.content)}</div>
                `;
                listContainer.appendChild(row);
            });
        }

        // Формирование текстового отчета протокола (как в вашем файле)
        function generateProtocolText() {
            let text = `=== ВСЕГО УДАЛЕНО: ${removedCommentsLog.length} ===\n\n`;
            removedCommentsLog.forEach(item => {
                text += `[Строка ${item.line}] [${item.type}]: ${item.content}\n`;
            });
            return text;
        }

        function copyProtocolText() {
            const txt = generateProtocolText();
            navigator.clipboard.writeText(txt);
            alert('Протокол удаленных комментариев скопирован в буфер обмена!');
        }

        function downloadProtocolFile() {
            const txt = generateProtocolText();
            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `protocol_deleted_comments_${Date.now()}.txt`;
            link.click();
        }

        // Модальное окно
        function openModal() {
            renderProtocolList();
            document.getElementById('protocol-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('protocol-modal').classList.add('hidden');
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
