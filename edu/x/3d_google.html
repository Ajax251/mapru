<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Рельеф Земли (Любая локация)</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050a14; font-family: 'Segoe UI', system-ui, sans-serif; color: #f1f2f6; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* Панель управления */
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(10, 15, 26, 0.88); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
            padding: 20px; width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        h2 { font-size: 16px; font-weight: 700; color: #00d2ff; margin-bottom: 15px; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }

        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        input[type="text"], select, input[type="range"] {
            width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.06); color: #fff; font-size: 13px; outline: none; transition: all 0.2s;
        }
        input[type="text"]:focus, select:focus { border-color: #00d2ff; background: rgba(255,255,255,0.1); }
        select option { background: #0a0f1a; color: #fff; }

        .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-search {
            padding: 9px 16px; background: rgba(0, 210, 255, 0.18); border: 1px solid #00d2ff;
            color: #00d2ff; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px;
            transition: all 0.2s; white-space: nowrap;
        }
        .btn-search:hover { background: #00d2ff; color: #000; box-shadow: 0 0 15px rgba(0,210,255,0.4); }

        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155; transition: .3s; border-radius: 22px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #00d2ff; }
        input:checked + .slider:before { transform: translateX(22px); }

        #status-text { font-size: 11px; color: #ffa502; margin-top: 6px; min-height: 16px; font-family: monospace; }
        #hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 8px 18px; border-radius: 20px;
            font-size: 12px; color: rgba(255,255,255,0.7); pointer-events: none; border: 1px solid rgba(255,255,255,0.1);
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>3D РЕЛЬЕФ ЛЮБОЙ ЛОКАЦИИ</h2>

        <!-- Поиск любой точки -->
        <div class="control-group">
            <label for="search-input">Поиск города или Координат:</label>
            <div class="search-row">
                <input type="text" id="search-input" placeholder="например: Сочи или 43.58, 39.72">
                <button class="btn-search" id="search-btn">НАЙТИ</button>
            </div>
            <div id="status-text"></div>
        </div>

        <!-- Быстрые пресеты -->
        <div class="control-group">
            <label for="location-select">Быстрые пресеты:</label>
            <select id="location-select">
                <option value="custom">-- Выберите из списка --</option>
                <option value="elbrus">Гора Эльбрус</option>
                <option value="sochi">Сочи / Красная Поляна</option>
                <option value="grand_canyon">Гранд-Каньон (США)</option>
                <option value="alps">Монблан (Альпы)</option>
                <option value="kamchatka">Ключевская Сопка (Камчатка)</option>
            </select>
        </div>

        <!-- Множитель высоты рельефа -->
        <div class="control-group">
            <label for="scale-range">Множитель высоты: <span id="scale-val" style="color:#00d2ff;">1.5x</span></label>
            <input type="range" id="scale-range" min="0.1" max="3.5" step="0.1" value="1.5">
        </div>

        <!-- КНОПКА ВКЛ/ВЫКЛ РЕЛЬЕФ -->
        <div class="toggle-row">
            <label style="margin: 0; color: #fff;">3D Рельеф (Высоты):</label>
            <label class="switch">
                <input type="checkbox" id="terrain-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <!-- Сетка (Wireframe) -->
        <div class="toggle-row">
            <label style="margin: 0;">Сетка 3D каркаса:</label>
            <label class="switch">
                <input type="checkbox" id="wireframe-toggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div id="hint">ЛКМ — Вращение | ПКМ — Сдвиг | Скролл — Зуум</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const PRESETS = {
            elbrus: { lat: 43.355, lon: 42.439, name: "Гора Эльбрус" },
            sochi: { lat: 43.683, lon: 40.258, name: "Красная Поляна" },
            grand_canyon: { lat: 36.054, lon: -112.14, name: "Гранд-Каньон" },
            alps: { lat: 45.832, lon: 6.865, name: "Монблан" },
            kamchatka: { lat: 56.057, lon: 160.637, name: "Ключевская Сопка" }
        };

        let scene, camera, renderer, controls;
        let terrainGroup = new THREE.Group();
        let loadedTiles = new Map();

        let currentLat = 43.355;
        let currentLon = 42.439;
        let currentZoom = 12;

        let heightMultiplier = 1.5;
        let isTerrainEnabled = true;
        let isWireframeEnabled = false;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a101d);
            scene.fog = new THREE.FogExp2(0x0a101d, 0.000012);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 10, 500000);
            camera.position.set(0, 15000, 25000);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;

            const ambient = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 2.5);
            sun.position.set(20000, 40000, 10000);
            scene.add(sun);

            scene.add(terrainGroup);

            // Загрузка стартовой локации
            loadTerrainForLocation(currentLat, currentLon, currentZoom);

            // Обработчики управления
            document.getElementById('search-btn').addEventListener('click', handleSearch);
            document.getElementById('search-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleSearch();
            });

            document.getElementById('location-select').addEventListener('change', (e) => {
                if (e.target.value !== 'custom') {
                    const preset = PRESETS[e.target.value];
                    currentLat = preset.lat;
                    currentLon = preset.lon;
                    document.getElementById('search-input').value = `${currentLat}, ${currentLon}`;
                    loadTerrainForLocation(currentLat, currentLon, currentZoom);
                }
            });

            document.getElementById('scale-range').addEventListener('input', (e) => {
                heightMultiplier = parseFloat(e.target.value);
                document.getElementById('scale-val').textContent = heightMultiplier.toFixed(1) + 'x';
                loadTerrainForLocation(currentLat, currentLon, currentZoom);
            });

            // ТУМБЛЕР ВКЛ/ВЫКЛ РЕЛЬЕФ
            document.getElementById('terrain-toggle').addEventListener('change', (e) => {
                isTerrainEnabled = e.target.checked;
                loadTerrainForLocation(currentLat, currentLon, currentZoom);
            });

            document.getElementById('wireframe-toggle').addEventListener('change', (e) => {
                isWireframeEnabled = e.target.checked;
                loadedTiles.forEach(mesh => mesh.material.wireframe = isWireframeEnabled);
            });

            window.addEventListener('resize', onWindowResize);

            animate();
        }

        // Поиск любой локации (координаты или геокодинг)
        async function handleSearch() {
            const query = document.getElementById('search-input').value.trim();
            const statusEl = document.getElementById('status-text');
            if (!query) return;

            // Проверка: ввели точные координаты (например: 55.7558, 37.6173)
            const coordMatch = query.match(/^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/);
            if (coordMatch) {
                currentLat = parseFloat(coordMatch[1]);
                currentLon = parseFloat(coordMatch[2]);
                statusEl.textContent = "Загрузка координат...";
                loadTerrainForLocation(currentLat, currentLon, currentZoom);
                setTimeout(() => statusEl.textContent = "", 2000);
                return;
            }

            // Иначе геокодинг названия города/горы через OpenStreetMap Nominatim
            statusEl.textContent = "Поиск локации...";
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data && data.length > 0) {
                    currentLat = parseFloat(data[0].lat);
                    currentLon = parseFloat(data[0].lon);
                    statusEl.textContent = `Найдено: ${data[0].display_name.split(',')[0]}`;
                    document.getElementById('location-select').value = 'custom';
                    loadTerrainForLocation(currentLat, currentLon, currentZoom);
                    setTimeout(() => statusEl.textContent = "", 3000);
                } else {
                    statusEl.textContent = "Локация не найдена!";
                }
            } catch (err) {
                statusEl.textContent = "Ошибка поиска!";
            }
        }

        // Загрузка рельефа сеткой 5x5 тайлов
        function loadTerrainForLocation(lat, lon, zoom) {
            // Очистка старых тайлов
            loadedTiles.forEach(mesh => {
                terrainGroup.remove(mesh);
                mesh.geometry.dispose();
                if (mesh.material.map) mesh.material.map.dispose();
                mesh.material.dispose();
            });
            loadedTiles.clear();

            const centerTile = latLonToTile(lat, lon, zoom);
            const radius = 2; // Сетка 5х5 (25 тайлов)
            const tileSize = 15000;
            const segments = 64; // Детализация сетки 3D-рельефа

            for (let dx = -radius; dx <= radius; dx++) {
                for (let dy = -radius; dy <= radius; dy++) {
                    const tileX = centerTile.x + dx;
                    const tileY = centerTile.y + dy;
                    const key = `${zoom}_${tileX}_${tileY}`;

                    const geometry = new THREE.PlaneGeometry(tileSize, tileSize, segments, segments);
                    geometry.rotateX(-Math.PI / 2);

                    // Спутниковый снимок высокого разрешения (Esri World Imagery)
                    const satUrl = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${tileY}/${tileX}`;
                    const textureLoader = new THREE.TextureLoader();
                    const texture = textureLoader.load(satUrl);
                    texture.colorSpace = THREE.SRGBColorSpace;

                    const material = new THREE.MeshStandardMaterial({
                        map: texture,
                        roughness: 0.85,
                        metalness: 0.1,
                        wireframe: isWireframeEnabled
                    });

                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(dx * tileSize, 0, dy * tileSize);
                    terrainGroup.add(mesh);
                    loadedTiles.set(key, mesh);

                    // Если 3D Рельеф ВКЛЮЧЕН — загружаем высоты (AWS Terrarium RGB)
                    if (isTerrainEnabled) {
                        const elevUrl = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${zoom}/${tileX}/${tileY}.png`;
                        const img = new Image();
                        img.crossOrigin = 'Anonymous';
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = segments + 1;
                            canvas.height = segments + 1;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                            const posAttr = geometry.attributes.position;
                            for (let i = 0; i < posAttr.count; i++) {
                                const r = imgData[i * 4];
                                const g = imgData[i * 4 + 1];
                                const b = imgData[i * 4 + 2];
                                
                                // Декодирование высоты Terrarium RGB в метры
                                const heightMeters = (r * 256 + g + b / 256) - 32768;
                                posAttr.setY(i, Math.max(0, heightMeters * heightMultiplier));
                            }
                            posAttr.needsUpdate = true;
                            geometry.computeVertexNormals();
                        };
                        img.src = elevUrl;
                    }
                }
            }

            // Возвращаем камеру над центром новой точки
            controls.target.set(0, 0, 0);
            camera.position.set(0, 15000, 25000);
            controls.update();
        }

        function latLonToTile(lat, lon, zoom) {
            const x = Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
            const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom));
            return { x, y };
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
