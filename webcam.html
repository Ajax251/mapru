<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webcam & Microphone Test</title>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z'/></svg>" type="image/svg+xml">
<style>
*, *::before, *::after {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #08090d;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #f1f5f9;
}
#video-container {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #111827 0%, #05070a 100%);
    overflow: hidden;
    z-index: 1;
}
#webcamVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 2;
    display: none;
    transform-origin: center center;
    transition: filter 0.1s linear;
    will-change: transform, filter;
}
#gridOverlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    display: none;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
}
.grid-cell {
    border: 1px dashed rgba(255, 255, 255, 0.2);
}
#flash-effect {
    position: absolute;
    inset: 0;
    background-color: #ffffff;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity 0.05s ease-out;
}
#flash-effect.flash {
    opacity: 0.85;
    transition: none;
}
#top-badge {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 9999px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    font-size: 13px;
    font-weight: 500;
    transition: opacity 0.3s;
}
.live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #ef4444;
}
.live-dot.active {
    background-color: #10b981;
    box-shadow: 0 0 10px #10b981;
}
.stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: #94a3b8;
    font-variant-numeric: tabular-nums;
}
.stat-pill strong {
    color: #f8fafc;
}
#dock-container {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 96%;
    max-width: 980px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), bottom 0.35s ease;
}
#dock-container.collapsed {
    transform: translateX(-50%) translateY(calc(100% + 40px));
}
#expandToggleBtn {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 19;
    padding: 8px 18px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 30px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(16px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    gap: 6px;
}
#expandToggleBtn:hover {
    background: rgba(30, 41, 59, 0.95);
}
.glass-panel {
    width: 100%;
    background: rgba(15, 23, 42, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
#dock-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
}
#visualizer-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    height: 32px;
    background: rgba(0, 0, 0, 0.35);
    padding: 4px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}
#audioVisualizer {
    flex: 1;
    height: 100%;
    border-radius: 4px;
}
#micDbLabel {
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    min-width: 48px;
    text-align: right;
    font-variant-numeric: tabular-nums;
}
.dock-buttons {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;
    width: 100%;
}
button.btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.08);
    color: #f1f5f9;
    padding: 7px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
    line-height: 1;
}
button.btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.16);
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
}
button.btn:active:not(:disabled) {
    transform: translateY(0) scale(0.97);
}
button.btn:disabled {
    opacity: 0.38;
    cursor: not-allowed;
    transform: none !important;
}
button.btn svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
    flex-shrink: 0;
}
button.btn-primary {
    background: #2563eb;
    border-color: #3b82f6;
    box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
}
button.btn-primary:hover:not(:disabled) {
    background: #1d4ed8;
    border-color: #60a5fa;
}
button.btn-danger {
    background: #dc2626;
    border-color: #ef4444;
    box-shadow: 0 2px 10px rgba(220, 38, 38, 0.35);
}
button.btn-danger:hover:not(:disabled) {
    background: #b91c1c;
}
button.btn.active {
    background: #3b82f6;
    border-color: #60a5fa;
    color: #fff;
}
button.btn-record.recording {
    background: #dc2626;
    border-color: #ef4444;
    animation: pulseRecording 1.4s infinite;
}
@keyframes pulseRecording {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
#sub-panels {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 10px;
}
.sub-panel {
    display: none;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    align-items: center;
}
.control-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
}
.control-item-header {
    display: flex;
    justify-content: space-between;
    color: #94a3b8;
    font-weight: 500;
}
.control-item-header span.val {
    color: #38bdf8;
    font-weight: 600;
}
select.custom-select {
    width: 100%;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #f8fafc;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 12px;
    outline: none;
    cursor: pointer;
}
select.custom-select option {
    background: #0f172a;
    color: #f8fafc;
}
input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    outline: none;
    margin: 6px 0;
    cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
    cursor: pointer;
    border: 2px solid #0f172a;
}
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.modal-window {
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    width: 100%;
    max-width: 650px;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
.modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.modal-header h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
}
.modal-close {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
}
.modal-close:hover {
    color: #fff;
}
.modal-body {
    padding: 20px;
    overflow-y: auto;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.device-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 10px 12px;
}
.device-card strong {
    color: #38bdf8;
    font-size: 12px;
}
.device-card p {
    margin: 4px 0 0 0;
    word-break: break-all;
    font-family: monospace;
    font-size: 11px;
    color: #cbd5e1;
}
#previewMediaContainer {
    width: 100%;
    min-height: 120px;
    max-height: 380px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    padding: 10px;
}
#previewImage, #previewVideo {
    max-width: 100%;
    max-height: 360px;
    object-fit: contain;
}
#previewAudio {
    width: 100%;
    max-width: 480px;
    outline: none;
}
#toastNotification {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 12px 18px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 10px;
    transform: translateY(100px);
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
    pointer-events: none;
}
#toastNotification.show {
    transform: translateY(0);
    opacity: 1;
}
#toastNotification.err {
    border-color: #ef4444;
    color: #fca5a5;
}
#toastNotification.succ {
    border-color: #10b981;
    color: #6ee7b7;
}

.rec-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background-color: #ef4444;
    display: inline-block;
    box-shadow: 0 0 10px #ef4444;
    animation: pulseRecDot 1s infinite;
    flex-shrink: 0;
}
@keyframes pulseRecDot {
    0%, 100% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 14px #ef4444; }
}
#recIndicatorBadge {
    display: none;
    align-items: center;
    gap: 6px;
    color: #ef4444;
    font-weight: 700;
}


</style>
</head>
<body>

<div id="video-container">
    <video id="webcamVideo" playsinline autoplay muted></video>
    <div id="gridOverlay">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    </div>
    <div id="flash-effect"></div>
</div>

<div id="top-badge">
    <div class="live-dot" id="liveIndicator"></div>
    <div class="stat-pill"><span id="streamStatus">Standby</span></div>
    <div class="stat-pill" id="recIndicatorBadge">
        <span class="rec-dot"></span>
        <span id="lblRecIndicator">Идет запись</span>
        <strong id="recTopTime" style="color:#ef4444;">00:00</strong>
    </div>
    <div class="stat-pill" id="resolutionBadge" style="display:none;"><span id="lblRes">Res</span>: <strong id="resVal">-</strong></div>
    <div class="stat-pill" id="fpsBadge" style="display:none;">FPS: <strong id="fpsVal">0</strong></div>
</div>

<button id="expandToggleBtn">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 8l6 6H6z"/></svg> <span id="lblExpand">Panel</span>
</button>

<div id="dock-container">
    <div class="glass-panel">
        <div id="dock-top-row">
            <div id="visualizer-area">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="#94a3b8"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                <canvas id="audioVisualizer" width="300" height="26"></canvas>
                <span id="micDbLabel">-∞ dB</span>
            </div>
            <button class="btn" id="collapseDockBtn">
                <svg viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
            </button>
        </div>

        <div class="dock-buttons">
            <button class="btn btn-primary" id="startBtn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> <span id="lblStart">Start</span>
            </button>
            <button class="btn btn-danger" id="stopBtn" style="display:none;">
                <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg> <span id="lblStop">Stop</span>
            </button>
            <button class="btn" id="photoBtn" disabled>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg> <span id="lblPhoto">Photo</span>
            </button>
            <button class="btn btn-record" id="recordVideoBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg> <span id="lblRecVideo">Video</span>
            </button>
            <button class="btn btn-record" id="recordAudioBtn" disabled>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg> <span id="lblRecAudio">Audio</span>
            </button>
            <button class="btn" id="speakerTestBtn">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg> <span id="lblSound">Sound</span>
            </button>
            <button class="btn" id="flipHBtn">
                <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
            </button>
            <button class="btn" id="flipVBtn">
                <svg viewBox="0 0 24 24" style="transform: rotate(90deg);"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
            </button>
            <button class="btn" id="gridToggleBtn">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 4h8v4H8V4zm0 6h8v4H8v-4zm-2 4H4v-4h2v4zm10 0v-4h2v4h-2zm2-6h-2V4h2v4zm-14 0V4h2v4H4zm0 8h2v4H4v-4zm4 4v-4h8v4H8zm10 0v-4h2v4h-2z"/></svg>
            </button>
            <button class="btn" id="pipBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
            </button>
            <button class="btn" id="fullscreenBtn">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
            <button class="btn" id="toggleSettingsBtn">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg> <span id="lblDevices">Devices</span>
            </button>
            <button class="btn" id="toggleEffectsBtn">
                <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg> <span id="lblEffects">Image</span>
            </button>
            <button class="btn" id="infoBtn">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg> <span id="lblInfo">Info</span>
            </button>
           
        </div>

        <div id="sub-panels">
            <div class="sub-panel" id="devicesPanel">
                <div class="control-item">
                    <div class="control-item-header" id="lblSelCam">Camera</div>
                    <select id="cameraSelect" class="custom-select"></select>
                </div>
                <div class="control-item">
                    <div class="control-item-header" id="lblSelMic">Microphone</div>
                    <select id="micSelect" class="custom-select"></select>
                </div>
                <div class="control-item" id="speakerSelectContainer" style="display:none;">
                    <div class="control-item-header" id="lblSelSpk">Speakers</div>
                    <select id="speakerSelect" class="custom-select"></select>
                </div>
            </div>

function showToast(msg, type = 'info') {
    toastNotification.textContent = msg;
    toastNotification.className = 'show' + (type === 'error' ? ' err' : (type === 'success' ? ' succ' : ''));
    clearTimeout(toastNotification.toastTimer);
    toastNotification.toastTimer = setTimeout(() => {
        toastNotification.className = '';
    }, 3200);
}

function updateVisualTransform() {
    const zoom = isHardwareZoom ? 1 : parseFloat(zoomRange.value);
    const sx = (flipH ? -1 : 1) * zoom;
    const sy = (flipV ? -1 : 1) * zoom;
    video.style.transform = `scale(${sx}, ${sy})`;
    video.style.filter = `brightness(${brightRange.value}%) contrast(${contrastRange.value}%) saturate(${saturateRange.value}%)`;
}

function renderVisualizer() {
    if (!analyser) {
        visualizerCtx.clearRect(0, 0, audioVisualizer.width, audioVisualizer.height);
        micDbLabel.textContent = '-∞ dB';
        return;
    }
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);

    let sum = 0;
    for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
    const avg = sum / bufferLength;
    const db = avg > 0 ? Math.round(20 * Math.log10(avg / 255)) : -100;
    micDbLabel.textContent = isFinite(db) && db > -90 ? `${db} dB` : '-∞ dB';

    visualizerCtx.clearRect(0, 0, audioVisualizer.width, audioVisualizer.height);
    const barWidth = (audioVisualizer.width / bufferLength) * 2.2;
    let x = 0;

    for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * audioVisualizer.height;
        const grad = visualizerCtx.createLinearGradient(0, audioVisualizer.height, 0, 0);
        grad.addColorStop(0, '#10b981');
        grad.addColorStop(0.65, '#38bdf8');
        grad.addColorStop(1, '#ef4444');
        visualizerCtx.fillStyle = grad;
        visualizerCtx.fillRect(x, audioVisualizer.height - barHeight, barWidth - 1, barHeight);
        x += barWidth;
        if (x > audioVisualizer.width) break;
    }
    visualizerAnimId = requestAnimationFrame(renderVisualizer);
}

async function populateDevices() {
    try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        const mics = devices.filter(d => d.kind === 'audioinput');
        const spks = devices.filter(d => d.kind === 'audiooutput');

        const curCam = cameraSelect.value;
        const curMic = micSelect.value;
        const curSpk = speakerSelect.value;

        cameraSelect.innerHTML = '';
        cams.forEach((c, idx) => {
            const opt = document.createElement('option');
            opt.value = c.deviceId;
            opt.textContent = c.label || `${t('camera')} ${idx + 1}`;
            cameraSelect.appendChild(opt);
        });
        if (curCam && cams.some(c => c.deviceId === curCam)) cameraSelect.value = curCam;

        micSelect.innerHTML = '';
        mics.forEach((m, idx) => {
            const opt = document.createElement('option');
            opt.value = m.deviceId;
            opt.textContent = m.label || `${t('microphone')} ${idx + 1}`;
            micSelect.appendChild(opt);
        });
        if (curMic && mics.some(m => m.deviceId === curMic)) micSelect.value = curMic;

        if ('setSinkId' in HTMLMediaElement.prototype && spks.length > 0) {
            speakerSelectContainer.style.display = 'flex';
            speakerSelect.innerHTML = '';
            spks.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = s.deviceId;
                opt.textContent = s.label || `${t('speakers')} ${idx + 1}`;
                speakerSelect.appendChild(opt);
            });
            if (curSpk && spks.some(s => s.deviceId === curSpk)) speakerSelect.value = curSpk;
        } else {
            speakerSelectContainer.style.display = 'none';
        }
    } catch (e) {}
}

async function startStream(customConstraints = null) {
    stopCurrentTracks();
    streamStatus.textContent = t('connecting');
    try {
        const constraints = customConstraints || {
            video: cameraSelect.value ? { deviceId: { exact: cameraSelect.value }, width: { ideal: 1920 }, height: { ideal: 1080 } } : { width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: micSelect.value ? { deviceId: { exact: micSelect.value }, echoCancellation: true, noiseSuppression: true } : { echoCancellation: true, noiseSuppression: true }
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        video.style.display = 'block';

        await new Promise(res => {
            if (video.readyState >= 2) res();
            else video.onloadedmetadata = () => res();
        });
        await video.play();

        setupAudioEngine(currentStream);
        await populateDevices();
        setupHardwareZoom();

        liveIndicator.classList.add('active');
        streamStatus.textContent = t('live');
        resolutionBadge.style.display = 'inline-flex';
        fpsBadge.style.display = 'inline-flex';
        resVal.textContent = `${video.videoWidth}×${video.videoHeight}`;

        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-flex';
        photoBtn.disabled = false;
        recordVideoBtn.disabled = false;
        recordAudioBtn.disabled = currentStream.getAudioTracks().length === 0;
        pipBtn.disabled = !document.pictureInPictureEnabled;

        startFpsMeter();
        updateVisualTransform();
        showToast(t('streamActive'), 'success');
    } catch (err) {
        handleStreamError(err);
    }
}

function setupAudioEngine(stream) {
    const audioTracks = stream.getAudioTracks();
    if (!audioTracks.length) return;

    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.8;
    sourceNode = audioCtx.createMediaStreamSource(stream);
    sourceNode.connect(analyser);

    if (visualizerAnimId) cancelAnimationFrame(visualizerAnimId);
    renderVisualizer();
}

function setupHardwareZoom() {
    const vTrack = currentStream?.getVideoTracks()[0];
    if (!vTrack) return;
    try {
        const caps = vTrack.getCapabilities ? vTrack.getCapabilities() : {};
        if (caps.zoom) {
            isHardwareZoom = true;
            zoomRange.min = caps.zoom.min;
            zoomRange.max = caps.zoom.max;
            zoomRange.step = caps.zoom.step || 0.1;
            zoomRange.value = vTrack.getSettings().zoom || caps.zoom.min;
            zoomVal.textContent = `${parseFloat(zoomRange.value).toFixed(1)}x`;
            return;
        }
    } catch (e) {}
    isHardwareZoom = false;
    zoomRange.min = 1;
    zoomRange.max = 4;
    zoomRange.step = 0.1;
    zoomRange.value = 1;
    zoomVal.textContent = '1.0x';
}

function startFpsMeter() {
    frameCount = 0;
    lastFpsTime = performance.now();
    if (fpsIntervalId) clearInterval(fpsIntervalId);

    const onFrame = () => {
        frameCount++;
        if (video.requestVideoFrameCallback) {
            video.requestVideoFrameCallback(onFrame);
        }
    };
    if (video.requestVideoFrameCallback) {
        video.requestVideoFrameCallback(onFrame);
    }

    fpsIntervalId = setInterval(() => {
        const now = performance.now();
        const delta = (now - lastFpsTime) / 1000;
        const currentFps = Math.round(frameCount / delta);
        fpsVal.textContent = currentFps;
        frameCount = 0;
        lastFpsTime = now;
        if (video.videoWidth && video.videoHeight) {
            resVal.textContent = `${video.videoWidth}×${video.videoHeight}`;
        }
    }, 1000);
}

function stopCurrentTracks() {
    if (visualizerAnimId) {
        cancelAnimationFrame(visualizerAnimId);
        visualizerAnimId = null;
    }
    if (fpsIntervalId) {
        clearInterval(fpsIntervalId);
        fpsIntervalId = null;
    }
    if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
    }
    if (analyser) {
        analyser = null;
    }
    if (videoRecorder && videoRecorder.state !== 'inactive') {
        videoRecorder.stop();
    }
    if (audioRecorder && audioRecorder.state !== 'inactive') {
        audioRecorder.stop();
    }
    videoDrawLoopActive = false;

    if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
    }
    video.srcObject = null;
    video.style.display = 'none';
    recIndicatorBadge.style.display = 'none';
    liveIndicator.classList.remove('active');
    streamStatus.textContent = t('stopped');
    resolutionBadge.style.display = 'none';
    fpsBadge.style.display = 'none';
    renderVisualizer();
}

function stopAll() {
    stopCurrentTracks();
    startBtn.style.display = 'inline-flex';
    stopBtn.style.display = 'none';
    photoBtn.disabled = true;
    recordVideoBtn.disabled = true;
    recordAudioBtn.disabled = true;
    pipBtn.disabled = true;
    if (recordVideoBtn.classList.contains('recording')) {
        clearInterval(videoTimer);
        recordVideoBtn.classList.remove('recording');
        lblRecVideo.textContent = t('recVideo');
    }
    if (recordAudioBtn.classList.contains('recording')) {
        clearInterval(audioTimer);
        recordAudioBtn.classList.remove('recording');
        lblRecAudio.textContent = t('recAudio');
    }
}

function handleStreamError(err) {
    stopAll();
    let msg = t('error') + ': ' + err.name;
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        msg = t('accessBlocked');
    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        msg = t('notFound');
    } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
        msg = t('inUse');
    }
    streamStatus.textContent = t('error');
    showToast(msg, 'error');
}

function takePhoto() {
    if (!currentStream || !video.videoWidth) return;
    flashEffect.classList.add('flash');
    setTimeout(() => flashEffect.classList.remove('flash'), 120);

    snapshotCanvas.width = video.videoWidth;
    snapshotCanvas.height = video.videoHeight;
    const ctx = snapshotCanvas.getContext('2d');

    ctx.save();
    ctx.filter = `brightness(${brightRange.value}%) contrast(${contrastRange.value}%) saturate(${saturateRange.value}%)`;
    ctx.translate(snapshotCanvas.width / 2, snapshotCanvas.height / 2);
    const zoom = isHardwareZoom ? 1 : parseFloat(zoomRange.value);
    ctx.scale((flipH ? -1 : 1) * zoom, (flipV ? -1 : 1) * zoom);
    ctx.drawImage(video, -snapshotCanvas.width / 2, -snapshotCanvas.height / 2, snapshotCanvas.width, snapshotCanvas.height);
    ctx.restore();

    const dataUrl = snapshotCanvas.toDataURL('image/png');
    previewTitle.textContent = `${t('snapshot')} (${snapshotCanvas.width}×${snapshotCanvas.height})`;
    previewMediaContainer.innerHTML = `<img id="previewImage" src="${dataUrl}" alt="${t('snapshot')}">`;
    downloadMediaBtn.href = dataUrl;
    downloadMediaBtn.download = `photo-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
    previewModal.style.display = 'flex';
}

function renderVideoCanvasFrame() {
    if (!videoDrawLoopActive || !video.videoWidth) return;
    videoCanvasCtx.save();
    videoCanvasCtx.clearRect(0, 0, videoCanvas.width, videoCanvas.height);
    videoCanvasCtx.filter = `brightness(${brightRange.value}%) contrast(${contrastRange.value}%) saturate(${saturateRange.value}%)`;
    videoCanvasCtx.translate(videoCanvas.width / 2, videoCanvas.height / 2);
    const zoom = isHardwareZoom ? 1 : parseFloat(zoomRange.value);
    videoCanvasCtx.scale((flipH ? -1 : 1) * zoom, (flipV ? -1 : 1) * zoom);
    videoCanvasCtx.drawImage(video, -videoCanvas.width / 2, -videoCanvas.height / 2, videoCanvas.width, videoCanvas.height);
    videoCanvasCtx.restore();

    if (video.requestVideoFrameCallback) {
        video.requestVideoFrameCallback(renderVideoCanvasFrame);
    } else {
        requestAnimationFrame(renderVideoCanvasFrame);
    }
}

function toggleVideoRecording() {
    if (!currentStream) return;
    if (audioRecorder && audioRecorder.state === 'recording') {
        toggleAudioRecording();
    }
    if (videoRecorder && videoRecorder.state === 'recording') {
        videoRecorder.stop();
        return;
    }

    videoChunks = [];
    videoCanvas = document.createElement('canvas');
    videoCanvas.width = video.videoWidth || 1280;
    videoCanvas.height = video.videoHeight || 720;
    videoCanvasCtx = videoCanvas.getContext('2d');

    videoDrawLoopActive = true;
    renderVideoCanvasFrame();

    const canvasStream = videoCanvas.captureStream(30);
    const processedVideoTrack = canvasStream.getVideoTracks()[0];
    const recStream = new MediaStream([processedVideoTrack]);

    const audioTracks = currentStream.getAudioTracks();
    if (audioTracks.length > 0) {
        recStream.addTrack(audioTracks[0]);
    }

    const preferredTypes = [
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
    ];
    let mimeType = preferredTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';

    try {
        videoRecorder = new MediaRecorder(recStream, mimeType ? { mimeType } : {});
    } catch (e) {
        videoDrawLoopActive = false;
        showToast(e.message, 'error');
        return;
    }

    videoRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) videoChunks.push(e.data);
    };

    videoRecorder.onstart = () => {
    videoStartTime = Date.now();
    recordVideoBtn.classList.add('recording');
    recordAudioBtn.disabled = true;

    recIndicatorBadge.style.display = 'inline-flex';
    lblRecIndicator.textContent = t('recInProgress');
    recTopTime.textContent = '00:00';

    videoTimer = setInterval(() => {
        const sec = Math.floor((Date.now() - videoStartTime) / 1000);
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        lblRecVideo.textContent = `${m}:${s}`;
        recTopTime.textContent = `${m}:${s}`;
    }, 500);
    showToast(t('recVideoStarted'), 'info');
};

  videoRecorder.onstop = () => {
    clearInterval(videoTimer);
    videoDrawLoopActive = false;
    recordVideoBtn.classList.remove('recording');
    recIndicatorBadge.style.display = 'none';
    lblRecVideo.textContent = t('recVideo');
        recordAudioBtn.disabled = currentStream ? currentStream.getAudioTracks().length === 0 : true;

        const rawType = videoRecorder.mimeType || 'video/mp4';
        const blob = new Blob(videoChunks, { type: rawType });
        const videoUrl = URL.createObjectURL(blob);

        previewTitle.textContent = `${t('videoRec')} (${(blob.size / 1024 / 1024).toFixed(2)} MB)`;
        previewMediaContainer.innerHTML = `<video id="previewVideo" src="${videoUrl}" controls autoplay></video>`;
        downloadMediaBtn.href = videoUrl;
        downloadMediaBtn.download = `video-${new Date().toISOString().replace(/[:.]/g, '-')}.mp4`;
        previewModal.style.display = 'flex';

        processedVideoTrack.stop();
    };

    videoRecorder.start(250);
}

async function encodeAudioBlobToMp3(blob) {
    if (typeof lamejs === 'undefined') {
        return blob;
    }
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const arrayBuffer = await blob.arrayBuffer();
    const audioBuffer = await actx.decodeAudioData(arrayBuffer);
    const channels = audioBuffer.numberOfChannels;
    const sampleRate = audioBuffer.sampleRate;
    const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
    const mp3Data = [];
    const sampleBlockSize = 1152;

    const left = audioBuffer.getChannelData(0);
    const leftInt16 = new Int16Array(left.length);
    for (let i = 0; i < left.length; i++) {
        const s = Math.max(-1, Math.min(1, left[i]));
        leftInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }

    let rightInt16 = null;
    if (channels > 1) {
        const right = audioBuffer.getChannelData(1);
        rightInt16 = new Int16Array(right.length);
        for (let i = 0; i < right.length; i++) {
            const s = Math.max(-1, Math.min(1, right[i]));
            rightInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
    }

    for (let i = 0; i < leftInt16.length; i += sampleBlockSize) {
        const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
        let mp3buf;
        if (channels === 1) {
            mp3buf = mp3encoder.encodeBuffer(leftChunk);
        } else {
            const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);
            mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
        }
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
    }
    const end = mp3encoder.flush();
    if (end.length > 0) mp3Data.push(end);

    actx.close();
    return new Blob(mp3Data, { type: 'audio/mp3' });
}

function toggleAudioRecording() {
    if (!currentStream) return;
    if (videoRecorder && videoRecorder.state === 'recording') {
        toggleVideoRecording();
    }
    if (audioRecorder && audioRecorder.state === 'recording') {
        audioRecorder.stop();
        return;
    }

    const audioTracks = currentStream.getAudioTracks();
    if (!audioTracks.length) {
        showToast(t('notFound'), 'error');
        return;
    }

    audioChunks = [];
    const audioStream = new MediaStream([audioTracks[0]]);

    const preferredTypes = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/mp4',
        'audio/ogg;codecs=opus'
    ];
    let mimeType = preferredTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';

    try {
        audioRecorder = new MediaRecorder(audioStream, mimeType ? { mimeType } : {});
    } catch (e) {
        showToast(e.message, 'error');
        return;
    }

    audioRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };
    
audioRecorder.onstart = () => {
    audioStartTime = Date.now();
    recordAudioBtn.classList.add('recording');
    recordVideoBtn.disabled = true;

    recIndicatorBadge.style.display = 'inline-flex';
    lblRecIndicator.textContent = t('recInProgress');
    recTopTime.textContent = '00:00';

    audioTimer = setInterval(() => {
        const sec = Math.floor((Date.now() - audioStartTime) / 1000);
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        lblRecAudio.textContent = `${m}:${s}`;
        recTopTime.textContent = `${m}:${s}`;
    }, 500);
    showToast(t('recAudioStarted'), 'info');
};

audioRecorder.onstop = async () => {
    clearInterval(audioTimer);
    recordAudioBtn.classList.remove('recording');
    recIndicatorBadge.style.display = 'none';
    lblRecAudio.textContent = t('recAudio');
        recordVideoBtn.disabled = false;

        const rawBlob = new Blob(audioChunks, { type: audioRecorder.mimeType || 'audio/webm' });
        const mp3Blob = await encodeAudioBlobToMp3(rawBlob);
        const audioUrl = URL.createObjectURL(mp3Blob);

        previewTitle.textContent = `${t('audioRec')} (${(mp3Blob.size / 1024).toFixed(1)} KB)`;
        previewMediaContainer.innerHTML = `
            <div style="font-size:40px; margin-bottom:12px;">🎙️</div>
            <audio id="previewAudio" src="${audioUrl}" controls autoplay></audio>
        `;
        downloadMediaBtn.href = audioUrl;
        downloadMediaBtn.download = `audio-${new Date().toISOString().replace(/[:.]/g, '-')}.mp3`;
        previewModal.style.display = 'flex';
    };

    audioRecorder.start(250);
}

function playStereoTestSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;

    const playChime = (freq, start, pan) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, start);

        gain.gain.setValueAtTime(0.001, start);
        gain.gain.exponentialRampToValueAtTime(0.3, start + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.6);

        if (panner) {
            panner.pan.setValueAtTime(pan, start);
            osc.connect(gain).connect(panner).connect(ctx.destination);
        } else {
            osc.connect(gain).connect(ctx.destination);
        }

        osc.start(start);
        osc.stop(start + 0.65);
    };

    playChime(523.25, now, -0.8);
    playChime(659.25, now + 0.2, 0);
    playChime(783.99, now + 0.4, 0.8);
    showToast(t('stereoTest'), 'info');
}

async function showDetailedDiagnostics() {
    infoModalBody.innerHTML = '...';
    infoModal.style.display = 'flex';
    try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        let html = '';

        const vTrack = currentStream?.getVideoTracks()[0];
        const aTrack = currentStream?.getAudioTracks()[0];

        if (vTrack) {
            const vSet = vTrack.getSettings();
            html += `<div class="device-card">
                <strong>${t('curVideo')}</strong>
                <p>${t('res')}: ${vSet.width || 'N/A'}×${vSet.height || 'N/A'}<br>
                ${t('fps')}: ${vSet.frameRate ? Math.round(vSet.frameRate) + ' fps' : 'N/A'}<br>
                ID: ${vSet.deviceId || 'N/A'}</p>
            </div>`;
        }

        if (aTrack) {
            const aSet = aTrack.getSettings();
            html += `<div class="device-card">
                <strong>${t('curAudio')}</strong>
                <p>${t('sampleRate')}: ${aSet.sampleRate || 'N/A'} Hz<br>
                ${t('channels')}: ${aSet.channelCount || 'N/A'}<br>
                ${t('echo')}: ${aSet.echoCancellation ? t('yes') : t('no')}<br>
                ${t('noise')}: ${aSet.noiseSuppression ? t('yes') : t('no')}</p>
            </div>`;
        }

        html += `<h4 style="margin:10px 0 4px 0; color:#94a3b8;">${t('allDevs')}</h4>`;
        devices.forEach(d => {
            const kindText = d.kind === 'videoinput' ? t('camera') : (d.kind === 'audioinput' ? t('microphone') : t('speakers'));
            html += `<div class="device-card">
                <strong>${kindText}: ${d.label || 'N/A'}</strong>
                <p>ID: ${d.deviceId}</p>
            </div>`;
        });
        infoModalBody.innerHTML = html;
    } catch (e) {
        infoModalBody.innerHTML = `<div class="device-card"><p>${t('error')}: ${e.message}</p></div>`;
    }
}

startBtn.onclick = () => startStream();
stopBtn.onclick = () => stopAll();
photoBtn.onclick = takePhoto;
recordVideoBtn.onclick = toggleVideoRecording;
recordAudioBtn.onclick = toggleAudioRecording;
speakerTestBtn.onclick = playStereoTestSound;
infoBtn.onclick = showDetailedDiagnostics;

flipHBtn.onclick = () => {
    flipH = !flipH;
    flipHBtn.classList.toggle('active', flipH);
    updateVisualTransform();
};
flipVBtn.onclick = () => {
    flipV = !flipV;
    flipVBtn.classList.toggle('active', flipV);
    updateVisualTransform();
};
gridToggleBtn.onclick = () => {
    const isVisible = gridOverlay.style.display === 'grid';
    gridOverlay.style.display = isVisible ? 'none' : 'grid';
    gridToggleBtn.classList.toggle('active', !isVisible);
};

pipBtn.onclick = async () => {
    try {
        if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
        } else if (video !== document.pictureInPictureElement && video.readyState >= 2) {
            await video.requestPictureInPicture();
        }
    } catch (e) {
        showToast(e.message, 'error');
    }
};

fullscreenBtn.onclick = () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
};

toggleSettingsBtn.onclick = () => {
    const isOpen = devicesPanel.style.display === 'grid';
    devicesPanel.style.display = isOpen ? 'none' : 'grid';
    toggleSettingsBtn.classList.toggle('active', !isOpen);
    if (!isOpen) {
        effectsPanel.style.display = 'none';
        toggleEffectsBtn.classList.remove('active');
    }
};

toggleEffectsBtn.onclick = () => {
    const isOpen = effectsPanel.style.display === 'grid';
    effectsPanel.style.display = isOpen ? 'none' : 'grid';
    toggleEffectsBtn.classList.toggle('active', !isOpen);
    if (!isOpen) {
        devicesPanel.style.display = 'none';
        toggleSettingsBtn.classList.remove('active');
    }
};

collapseDockBtn.onclick = () => {
    dockContainer.classList.add('collapsed');
    expandToggleBtn.style.display = 'inline-flex';
};
expandToggleBtn.onclick = () => {
    dockContainer.classList.remove('collapsed');
    expandToggleBtn.style.display = 'none';
};

cameraSelect.onchange = () => {
    if (currentStream) startStream();
};
micSelect.onchange = () => {
    if (currentStream) startStream();
};
speakerSelect.onchange = async () => {
    if ('setSinkId' in HTMLMediaElement.prototype && speakerSelect.value) {
        try {
            await video.setSinkId(speakerSelect.value);
            showToast(t('spkChanged'), 'success');
        } catch (e) {
            showToast(t('spkError') + e.message, 'error');
        }
    }
};

zoomRange.oninput = async e => {
    const val = parseFloat(e.target.value);
    zoomVal.textContent = `${val.toFixed(1)}x`;
    if (isHardwareZoom && currentStream) {
        const vTrack = currentStream.getVideoTracks()[0];
        try {
            await vTrack.applyConstraints({ advanced: [{ zoom: val }] });
        } catch (err) {}
    } else {
        updateVisualTransform();
    }
};
brightRange.oninput = e => {
    brightVal.textContent = `${e.target.value}%`;
    updateVisualTransform();
};
contrastRange.oninput = e => {
    contrastVal.textContent = `${e.target.value}%`;
    updateVisualTransform();
};
saturateRange.oninput = e => {
    saturateVal.textContent = `${e.target.value}%`;
    updateVisualTransform();
};
resetEffectsBtn.onclick = () => {
    zoomRange.value = 1;
    brightRange.value = 100;
    contrastRange.value = 100;
    saturateRange.value = 100;
    zoomVal.textContent = '1.0x';
    brightVal.textContent = '100%';
    contrastVal.textContent = '100%';
    saturateVal.textContent = '100%';
    if (isHardwareZoom && currentStream) {
        const vTrack = currentStream.getVideoTracks()[0];
        try {
            vTrack.applyConstraints({ advanced: [{ zoom: 1 }] });
        } catch (err) {}
    }
    updateVisualTransform();
};

document.querySelectorAll('[data-close]').forEach(btn => {
    btn.onclick = () => {
        const targetId = btn.getAttribute('data-close');
        const modal = document.getElementById(targetId);
        if (modal) {
            modal.style.display = 'none';
            const vid = modal.querySelector('video');
            if (vid) vid.pause();
            const aud = modal.querySelector('audio');
            if (aud) aud.pause();
        }
    };
});

window.onclick = e => {
    if (e.target.classList.contains('modal-backdrop')) {
        e.target.style.display = 'none';
        const vid = e.target.querySelector('video');
        if (vid) vid.pause();
        const aud = e.target.querySelector('audio');
        if (aud) aud.pause();
    }
};

window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') {
        e.preventDefault();
        if (currentStream) stopAll();
        else startStream();
    } else if (e.key.toLowerCase() === 's' && !photoBtn.disabled) {
        takePhoto();
    } else if (e.key.toLowerCase() === 'v' && !recordVideoBtn.disabled) {
        toggleVideoRecording();
    } else if (e.key.toLowerCase() === 'a' && !recordAudioBtn.disabled) {
        toggleAudioRecording();
    } else if (e.key.toLowerCase() === 'f') {
        fullscreenBtn.click();
    } else if (e.key.toLowerCase() === 'g') {
        gridToggleBtn.click();
    }
});

navigator.mediaDevices?.addEventListener('devicechange', () => {
    populateDevices();
    showToast(t('devChanged'), 'info');
});

if (window.location.protocol !== 'https:' && !['localhost', '127.0.0.1'].includes(window.location.hostname)) {
    showToast(t('httpsWarning'), 'error');
}

updateUILanguage();
window.addEventListener('beforeunload', () => stopCurrentTracks());
</script>
</body>
</html>
