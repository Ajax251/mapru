<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Энциклопедия Татарстана — Районы, Города, Аналитика</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --primary: #008744;
      --primary-dark: #006834;
      --primary-light: #e8f5e9;
      --accent-red: #d62828;
      --accent-blue: #0284c7;
      --accent-amber: #d97706;
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --sidebar-width: 350px;
      --header-height: 64px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.07);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-flag-bar {
      height: 4px;
      width: 100%;
      background: linear-gradient(to bottom, #008744 40%, #ffffff 40%, #ffffff 60%, #d62828 60%);
      flex-shrink: 0;
    }

    header {
      height: var(--header-height);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: var(--shadow-sm);
      z-index: 20;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 20px;
      box-shadow: 0 3px 8px rgba(0, 135, 68, 0.3);
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .brand-text p { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f1f5f9;
      color: var(--text-main);
      user-select: none;
    }

    .btn:hover { background: #e2e8f0; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 2px 8px rgba(0,135,68,0.3); }
    .btn-outline { background: transparent; border-color: var(--border-color); color: var(--text-muted); }
    .btn-outline:hover { border-color: var(--text-muted); color: var(--text-main); }
    .btn-danger { background: #fee2e2; color: #991b1b; }
    .btn-danger:hover { background: #fca5a5; }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-main);
      padding: 4px;
    }

    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - var(--header-height) - 4px);
      overflow: hidden;
      position: relative;
    }

    
    aside.sidebar {
      width: var(--sidebar-width);
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s ease;
      z-index: 15;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fbfcfd;
    }

    .search-box { position: relative; }

    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      background: white;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 135, 68, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 15px;
      height: 15px;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-pill {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.74rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: white;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .filter-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .district-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .category-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      padding: 12px 8px 4px;
    }

    .district-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      margin-bottom: 2px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      text-align: left;
      background: transparent;
      width: 100%;
    }

    .district-item:hover { background: #f1f5f9; }

    .district-item.active {
      background: var(--primary-light);
      border-color: rgba(0, 135, 68, 0.2);
    }

    .district-item.active .dist-name {
      font-weight: 700;
      color: var(--primary-dark);
    }

    .dist-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow: hidden;
    }

    .dist-name {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dist-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .storage-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .storage-pill.cached { color: var(--primary); }
    .storage-pill.not-cached { color: #cbd5e1; }

    
    main.content-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 28px 60px;
      background: var(--bg-main);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content-wrapper {
      max-width: 960px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    
    .app-main-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }

    .main-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: none;
      background: white;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s;
    }

    .main-tab-btn.active {
      background: var(--primary);
      color: white;
    }

    
    .hero-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 20px 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      gap: 20px;
      align-items: flex-start;
      position: relative;
    }

    .hero-image-wrap {
      width: 105px;
      height: 105px;
      border-radius: var(--radius-md);
      background: #f8fafc;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .hero-image-wrap img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .hero-details { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .hero-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
    }

    .badge-type { background: #f1f5f9; color: #475569; }
    .badge-cached { background: #dcfce7; color: #166534; }
    .badge-online { background: #e0f2fe; color: #0369a1; }
    .badge-link {
      background: #eff6ff;
      color: #1d4ed8;
      cursor: pointer;
      border: 1px solid #bfdbfe;
    }

    .hero-title { font-size: 1.6rem; font-weight: 800; color: var(--text-main); line-height: 1.2; }
    .hero-subtitle { font-size: 0.95rem; color: var(--primary); font-weight: 600; }

    .hero-facts {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 4px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .hero-fact-item { display: flex; align-items: center; gap: 5px; }

    .tab-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      padding: 6px;
      box-shadow: var(--shadow-sm);
    }

    .subtab-buttons { display: flex; gap: 6px; }

    .subtab-btn {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      font-weight: 600;
      font-size: 0.83rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .subtab-btn.active {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .content-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 26px;
      box-shadow: var(--shadow-sm);
      min-height: 350px;
    }

    .summary-text { font-size: 1.02rem; line-height: 1.75; color: #334155; }

    
    .wiki-html { font-size: 0.94rem; line-height: 1.7; color: #334155; }
    .wiki-html h2 { font-size: 1.25rem; font-weight: 700; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
    .wiki-html h3 { font-size: 1.05rem; font-weight: 600; margin: 18px 0 8px; color: var(--text-main); }
    .wiki-html p { margin-bottom: 12px; }
    .wiki-html ul, .wiki-html ol { margin: 10px 0 14px 22px; }
    .wiki-html img { max-width: 100%; height: auto; border-radius: 6px; }
    .wiki-html .infobox { float: right; margin: 0 0 14px 16px; background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 10px; font-size: 0.8rem; width: 280px; }
    .wiki-html .infobox table { width: 100%; border-collapse: collapse; }
    .wiki-html .infobox td, .wiki-html .infobox th { padding: 5px; border-bottom: 1px solid #f1f5f9; }
    .wiki-html table.wikitable { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 0.84rem; }
    .wiki-html table.wikitable th, .wiki-html table.wikitable td { border: 1px solid var(--border-color); padding: 6px 10px; }
    .wiki-html table.wikitable th { background: #f1f5f9; font-weight: 600; }
    .wiki-html a { color: var(--primary); text-decoration: none; }
    .wiki-html .mw-editsection, .wiki-html .navbox, .wiki-html .ambox, .wiki-html .noprint, .wiki-html .hatnote { display: none !important; }

    
    .heatmap-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }

    .heatmap-btn-group { display: flex; gap: 6px; }

    .heatmap-toggle-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: white;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .heatmap-toggle-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .treemap-container {
      width: 100%;
      height: 560px;
      background: #0f172a;
      border-radius: var(--radius-md);
      position: relative;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
    }

    .treemap-tile {
      position: absolute;
      box-sizing: border-box;
      border: 1.5px solid rgba(15, 23, 42, 0.85);
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #ffffff;
      user-select: none;
      transition: filter 0.15s ease, border-color 0.15s ease;
    }

    .treemap-tile:hover {
      filter: brightness(1.22);
      border-color: #ffffff;
      z-index: 5;
    }

    .tile-title {
      font-weight: 700;
      line-height: 1.15;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      pointer-events: none;
      word-break: break-word;
    }

    .tile-value {
      opacity: 0.92;
      margin-top: 2px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
      pointer-events: none;
      white-space: nowrap;
    }

    .tile-percent {
      opacity: 0.8;
      font-weight: 600;
      pointer-events: none;
    }

    
    .treemap-hover-card {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 50;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      min-width: 220px;
      max-width: 300px;
      transform: translate(-50%, -115%);
      transition: opacity 0.1s ease;
    }

    .hover-card-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .hover-card-sub {
      font-size: 0.78rem;
      color: #93c5fd;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .hover-card-metric {
      font-size: 0.9rem;
      font-weight: 700;
      color: #34d399;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 6px;
      margin-top: 4px;
    }

    .hover-card-hint {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 8px;
      text-align: right;
    }

    
    .timeline-filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .timeline-container {
      position: relative;
      padding: 20px 0 20px 30px;
    }

    .timeline-container::before {
      content: '';
      position: absolute;
      left: 12px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, var(--primary), var(--accent-amber), var(--accent-blue));
      border-radius: 3px;
    }

    .timeline-node {
      position: relative;
      margin-bottom: 24px;
      cursor: pointer;
    }

    .timeline-dot {
      position: absolute;
      left: -24px;
      top: 10px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: white;
      border: 3px solid var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
      transition: transform 0.2s;
    }

    .timeline-node:hover .timeline-dot {
      transform: scale(1.3);
      border-color: var(--accent-amber);
    }

    .timeline-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .timeline-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateX(4px);
    }

    .timeline-year-badge {
      background: #f1f5f9;
      color: var(--primary-dark);
      font-weight: 800;
      font-size: 0.95rem;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(3px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open { display: flex; }

    .modal-window {
      background: white;
      border-radius: var(--radius-lg);
      max-width: 500px;
      width: 100%;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .modal-header h3 { font-size: 1.15rem; font-weight: 700; }

    .btn-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .storage-stat-box {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .storage-stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .storage-stat-val { font-weight: 700; color: var(--text-main); }

    .modal-actions-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-btn-row {
      display: flex;
      gap: 10px;
    }

    .modal-btn-row .btn { flex: 1; justify-content: center; }

    .file-input-hidden { display: none; }

    .toast-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      color: white;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 120;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast-box.show { transform: translateY(0); opacity: 1; }

    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-text { height: 16px; margin-bottom: 12px; width: 100%; }

    @media (max-width: 900px) {
      .menu-toggle { display: block; }
      aside.sidebar {
        position: fixed;
        top: calc(var(--header-height) + 4px);
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
      }
      aside.sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      main.content-area { padding: 12px; }
      .hero-card { flex-direction: column; align-items: center; text-align: center; }
      .hero-badges, .hero-facts { justify-content: center; }
      .treemap-container { height: 420px; }
    }
  </style>
</head>
<body>

  <div class="top-flag-bar"></div>

  <header>
    <div class="brand">
      <button class="menu-toggle" id="menuToggle" title="Открыть меню">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="brand-logo">Т</div>
      <div class="brand-text">
        <h1>Энциклопедия Татарстана</h1>
        <p>Районы, Города, Аналитика и История</p>
      </div>
    </div>

    const DB_NAME = 'TatarstanEncyclopediaDB_v3';
    const STORE_NAME = 'encyclopedia_items';
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    class AppStorage {
      constructor() { this.db = null; }

      async init() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
          };
          req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
          req.onerror = (e) => reject(e.target.error);
        });
      }

      async get(id) {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          const tx = this.db.transaction([STORE_NAME], 'readonly');
          const req = tx.objectStore(STORE_NAME).get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      }

      async set(data) {
        if (!this.db) await this.init();
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction([STORE_NAME], 'readwrite');
          const req = tx.objectStore(STORE_NAME).put(data);
          req.onsuccess = () => resolve(true);
          req.onerror = (e) => reject(e.target.error);
        });
      }

      async getAll() {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          const tx = this.db.transaction([STORE_NAME], 'readonly');
          const req = tx.objectStore(STORE_NAME).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      }

      async clear() {
        if (!this.db) await this.init();
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction([STORE_NAME], 'readwrite');
          const req = tx.objectStore(STORE_NAME).clear();
          req.onsuccess = () => resolve(true);
          req.onerror = (e) => reject(e.target.error);
        });
      }

      async calculateSize() {
        const all = await this.getAll();
        const jsonString = JSON.stringify(all);
        const bytes = new Blob([jsonString]).size;
        if (bytes === 0) return '0 КБ';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
        return (bytes / (1024 * 1024)).toFixed(2) + ' МБ';
      }
    }

    const storage = new AppStorage();
    

    class WikiService {
      static async safeFetch(url, retries = 3) {
        for (let i = 0; i <= retries; i++) {
          try {
            const res = await fetch(url);
            if (res.status === 429) {
              if (i === retries) throw new Error('Превышен лимит запросов к серверу');
              await sleep(1500 * (i + 1));
              continue;
            }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res;
          } catch (e) {
            if (i === retries) throw e;
            await sleep(1000 * (i + 1));
          }
        }
      }

      static async fetchSummary(title) {
        const res = await this.safeFetch(`https://ru.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
        return await res.json();
      }

      static async fetchFullHtml(title) {
        
        const url = `https://ru.wikipedia.org/w/api.php?action=parse&format=json&origin=*&redirects=1&page=${encodeURIComponent(title)}&prop=text&disabletoc=1`;
        const res = await this.safeFetch(url);
        const json = await res.json();
        if (json.error) throw new Error(json.error.info || 'Ошибка Википедии');

        let html = json.parse?.text?.['*'] || '';
        html = html.replace(/href="\/wiki\//g, 'target="_blank" rel="noopener noreferrer" href="https://ru.wikipedia.org/wiki/');
        html = html.replace(/src="\/\//g, 'src="https://');
        html = html.replace(/srcset="\/\//g, 'srcset="https://');
        return html;
      }
    }

      });

      if (filtered.length === 0) {
        districtListEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Ничего не найдено</div>';
        return;
      }

      const rayons = filtered.filter(d => d.group === 'rayons');
      const towns = filtered.filter(d => d.group === 'towns');

      if (rayons.length > 0 && (currentFilter === 'all' || currentFilter === 'rayons')) {
        const cat = document.createElement('div');
        cat.className = 'category-title';
        cat.textContent = 'Районы и городские округа';
        districtListEl.appendChild(cat);
        rayons.forEach(d => districtListEl.appendChild(createListItem(d)));
      }

      if (towns.length > 0 && (currentFilter === 'all' || currentFilter === 'towns')) {
        const cat = document.createElement('div');
        cat.className = 'category-title';
        cat.textContent = 'Города и административные центры';
        districtListEl.appendChild(cat);
        towns.forEach(d => districtListEl.appendChild(createListItem(d)));
      }
    }

    function createListItem(item) {
      const isCached = cachedSet.has(item.id);
      const isActive = item.id === currentId;

      const btn = document.createElement('button');
      btn.className = `district-item ${isActive ? 'active' : ''}`;
      btn.dataset.id = item.id;

      btn.innerHTML = `
        <div class="dist-info">
          <span class="dist-name">${item.name}</span>
          <span class="dist-sub">${item.tatName} • ${item.parentInfo}</span>
        </div>
        <div class="storage-pill ${isCached ? 'cached' : 'not-cached'}" title="${isCached ? 'Сохранено для офлайн-доступа' : 'Будет загружено из сети'}">
          ${isCached 
            ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>` 
            : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`}
        </div>
      `;

      btn.addEventListener('click', () => {
        currentId = item.id;
        document.querySelectorAll('.district-item').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        
        
        switchMainTab('article');
        loadEntity(item.id);

        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
      });

      return btn;
    }

    async function loadEntity(id, forceRefresh = false) {
      const entity = ENTITIES.find(e => e.id === id);
      if (!entity) return;

      heroTitle.textContent = entity.name;
      heroTatarTitle.textContent = entity.tatName;
      heroTypeBadge.textContent = entity.typeName;
      factParent.querySelector('span').textContent = entity.parentInfo;
      factStats.querySelector('span').textContent = `Население: ${entity.population.toLocaleString('ru-RU')} чел. | Площадь: ${entity.area} км²`;
      btnWikiLink.href = `https://ru.wikipedia.org/wiki/${encodeURIComponent(entity.wikiTitle)}`;

      if (entity.relatedId) {
        const related = ENTITIES.find(x => x.id === entity.relatedId);
        if (related) {
          heroRelatedBadge.style.display = 'inline-flex';
          heroRelatedBadge.textContent = `👉 ${related.name}`;
          heroRelatedBadge.onclick = () => {
            currentId = related.id;
            renderSidebar();
            loadEntity(related.id);
          };
        } else {
          heroRelatedBadge.style.display = 'none';
        }
      } else {
        heroRelatedBadge.style.display = 'none';
      }

      let cachedData = null;
      if (!forceRefresh) {
        cachedData = await storage.get(id);
      }

      if (cachedData) {
        renderContent(cachedData, true);
        return;
      }

      renderSkeletons();

      try {
        const [summary, fullHtml] = await Promise.all([
          WikiService.fetchSummary(entity.wikiTitle),
          WikiService.fetchFullHtml(entity.wikiTitle)
        ]);

        const record = {
          id: entity.id,
          name: entity.name,
          tatName: entity.tatName,
          wikiTitle: entity.wikiTitle,
          extract: summary.extract || 'Краткая справка отсутствует.',
          thumbnail: summary.thumbnail?.source || summary.originalimage?.source || null,
          fullHtml: fullHtml,
          savedDate: new Date().toLocaleDateString('ru-RU')
        };

        await storage.set(record);
        await updateCacheInfo();
        renderSidebar();
        renderContent(record, false);
      } catch (err) {
        console.error(err);
        tabSummaryContent.innerHTML = `
          <div style="text-align: center; padding: 40px; color: #ef4444;">
            <p style="font-weight: 600; font-size: 1.1rem;">Не удалось загрузить данные</p>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Проверьте интернет-соединение или повторите попытку через пару секунд.</p>
          </div>
        `;
        tabFullContent.innerHTML = '';
        heroStorageBadge.className = 'badge badge-online';
        heroStorageBadge.textContent = 'Ошибка загрузки';
      }
    }

    function renderContent(data, fromCache) {
      heroStorageBadge.className = fromCache ? 'badge badge-cached' : 'badge badge-online';
      heroStorageBadge.textContent = fromCache ? 'В памяти устройства' : 'Загружено из сети';

      if (data.thumbnail) {
        heroImageWrap.innerHTML = `<img src="${data.thumbnail}" alt="${data.name}" />`;
      } else {
        heroImageWrap.innerHTML = `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#008744" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
      }

      tabSummaryContent.innerHTML = `
        <div style="font-size: 1.05rem; line-height: 1.8; color: #1e293b;">
          ${data.extract.replace(/\n/g, '<br><br>')}
        </div>
      `;

      tabFullContent.innerHTML = data.fullHtml || '<p>Текст статьи не найден.</p>';
    }

    function renderSkeletons() {
      heroStorageBadge.className = 'badge badge-online';
      heroStorageBadge.textContent = 'Загрузка...';
      heroImageWrap.innerHTML = `<div class="skeleton" style="width: 100%; height: 100%;"></div>`;
      tabSummaryContent.innerHTML = `
        <div class="skeleton skeleton-text" style="width: 90%;"></div>
        <div class="skeleton skeleton-text" style="width: 100%;"></div>
        <div class="skeleton skeleton-text" style="width: 80%;"></div>
      `;
      tabFullContent.innerHTML = `<div class="skeleton skeleton-text" style="width: 50%; height: 24px; margin-bottom: 16px;"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text"></div>`;
    }

    
   
    const TILE_PALETTE = [
      '#0284c7', '#0d9488', '#16a34a', '#b45309', '#d97706',
      '#dc2626', '#e11d48', '#7c3aed', '#4f46e5', '#2563eb',
      '#059669', '#0891b2', '#c026d3', '#9333ea', '#ea580c',
      '#65a30d', '#0284c7', '#475569', '#047857', '#b91c1c',
      '#6d28d9', '#0369a1', '#0f766e', '#15803d', '#a16207',
      '#be123c', '#4338ca', '#334155', '#1e40af', '#065f46',
      '#854d0e', '#991b1b', '#86198f', '#3730a3', '#1e3a8a',
      '#134e4a', '#14532d', '#78350f', '#701a75', '#312e81',
      '#1e293b', '#0c4a6e', '#064e3b', '#713f12', '#831843'
    ];

    function renderTreemap() {
      const container = document.getElementById('treemapContainer');
      const hoverCard = document.getElementById('treemapHoverCard');
      container.innerHTML = '';

      const width = container.clientWidth || 880;
      const height = container.clientHeight || 560;

      
      const data = ENTITIES.filter(x => x.group === 'rayons').map((item, idx) => ({
        id: item.id,
        name: item.name,
        tatName: item.tatName,
        parentInfo: item.parentInfo,
        value: activeMetric === 'population' ? item.population : item.area,
        unit: activeMetric === 'population' ? 'чел.' : 'км²',
        color: TILE_PALETTE[idx % TILE_PALETTE.length]
      }));

      const totalValue = data.reduce((acc, d) => acc + d.value, 0);
      data.sort((a, b) => b.value - a.value);

      function layoutTreemap(items, x, y, w, h) {
        if (items.length === 0) return;
        if (items.length === 1) {
          createTile(items[0], x, y, w, h);
          return;
        }

        const currentTotal = items.reduce((acc, d) => acc + d.value, 0);
        let half = 0;
        let splitIdx = 0;

        for (let i = 0; i < items.length; i++) {
          half += items[i].value;
          if (half >= currentTotal / 2 || i === items.length - 1) {
            splitIdx = i + 1;
            break;
          }
        }

        const leftGroup = items.slice(0, splitIdx);
        const rightGroup = items.slice(splitIdx);
        const leftTotal = leftGroup.reduce((acc, d) => acc + d.value, 0);
        const ratio = leftTotal / currentTotal;

        if (w > h) {
          const leftW = w * ratio;
          layoutTreemap(leftGroup, x, y, leftW, h);
          layoutTreemap(rightGroup, x + leftW, y, w - leftW, h);
        } else {
          const topH = h * ratio;
          layoutTreemap(leftGroup, x, y, w, topH);
          layoutTreemap(rightGroup, x, y + topH, w, h - topH);
        }
      }

      
      function getShortLabel(name, w, h) {
        const clean = name.replace(' район', '').replace(' район (Татарстан)', '');
        if (w >= 100 && h >= 55) {
          return `<div class="tile-title" style="font-size: 0.85rem;">${clean}</div>`;
        }
        if (w >= 65 && h >= 40) {
          const shortName = clean.length > 8 ? clean.slice(0, 7) + '.' : clean;
          return `<div class="tile-title" style="font-size: 0.76rem;">${shortName}</div>`;
        }
        if (w >= 38 && h >= 28) {
          
          const letters = clean.slice(0, 3).toUpperCase();
          return `<div class="tile-title" style="font-size: 0.72rem; letter-spacing: 0.5px;">${letters}</div>`;
        }
        
        const tiny = clean.slice(0, 2).toUpperCase();
        return `<div class="tile-title" style="font-size: 0.65rem;">${tiny}</div>`;
      }

      function createTile(item, x, y, w, h) {
        if (w < 4 || h < 4) return;

        const tile = document.createElement('div');
        tile.className = 'treemap-tile';
        tile.style.left = `${x}px`;
        tile.style.top = `${y}px`;
        tile.style.width = `${w}px`;
        tile.style.height = `${h}px`;
        tile.style.backgroundColor = item.color;

        const percent = ((item.value / totalValue) * 100).toFixed(1);
        const titleHtml = getShortLabel(item.name, w, h);

        
        let numbersHtml = '';
        if (w >= 75 && h >= 55) {
          numbersHtml = `
            <div class="tile-value" style="font-size: 0.72rem;">${item.value.toLocaleString('ru-RU')} ${item.unit}</div>
            <div class="tile-percent" style="font-size: 0.68rem;">${percent}%</div>
          `;
        } else if (w >= 50 && h >= 42) {
          numbersHtml = `<div class="tile-percent" style="font-size: 0.7rem;">${percent}%</div>`;
        }

        tile.innerHTML = titleHtml + numbersHtml;

        
        tile.addEventListener('mouseenter', (e) => {
          hoverCard.style.display = 'block';
          hoverCard.innerHTML = `
            <div class="hover-card-title">${item.name}</div>
            <div class="hover-card-sub">${item.tatName} • ${item.parentInfo}</div>
            <div class="hover-card-metric">
              <span>${activeMetric === 'population' ? 'Население:' : 'Площадь:'}</span>
              <span>${item.value.toLocaleString('ru-RU')} ${item.unit}</span>
            </div>
            <div class="hover-card-metric" style="color: #60a5fa;">
              <span>Доля в республике:</span>
              <span>${percent}%</span>
            </div>
            <div class="hover-card-hint">Нажмите для перехода к статье →</div>
          `;
        });

        tile.addEventListener('mousemove', (e) => {
          const rect = container.getBoundingClientRect();
          let posX = e.clientX - rect.left;
          let posY = e.clientY - rect.top;

          
          if (posX < 140) posX = 140;
          if (posX > rect.width - 140) posX = rect.width - 140;
          if (posY < 120) posY = posY + 140;

          hoverCard.style.left = `${posX}px`;
          hoverCard.style.top = `${posY}px`;
        });

        tile.addEventListener('mouseleave', () => {
          hoverCard.style.display = 'none';
        });

        tile.addEventListener('click', () => {
          hoverCard.style.display = 'none';
          currentId = item.id;
          switchMainTab('article');
          renderSidebar();
          loadEntity(item.id);
        });

        container.appendChild(tile);
      }

      layoutTreemap(data, 0, 0, width, height);
    }

    
    function renderTimeline() {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      const items = ENTITIES.filter(x => {
        if (activeTimelineFilter === 'towns') return x.group === 'towns' || x.id === 'kazan' || x.id === 'chelny';
        return x.group === 'rayons' && x.id !== 'kazan' && x.id !== 'chelny';
      });

      items.sort((a, b) => a.foundedYear - b.foundedYear);

      items.forEach(item => {
        const node = document.createElement('div');
        node.className = 'timeline-node';

        node.innerHTML = `
          <div class="timeline-dot"></div>
          <div class="timeline-card">
            <div>
              <div style="font-weight: 700; font-size: 1rem; color: var(--text-main);">${item.name}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">${item.tatName} • ${item.typeName}</div>
            </div>
            <div class="timeline-year-badge">${item.foundedYear} год</div>
          </div>
        `;

        node.addEventListener('click', () => {
          currentId = item.id;
          switchMainTab('article');
          renderSidebar();
          loadEntity(item.id);
        });

        container.appendChild(node);
      });
    }

    
    async function exportToZip() {
      const all = await storage.getAll();
      if (all.length === 0) {
        showToast('Архив пуст. Сначала скачайте статьи.');
        return;
      }

      showToast('Создание ZIP-архива...');
      const zip = new JSZip();

      
      zip.file('encyclopedia_meta.json', JSON.stringify({
        project: 'Tatarstan Encyclopedia',
        version: '3.0',
        exportedAt: new Date().toISOString(),
        count: all.length
      }, null, 2));

      zip.file('data.json', JSON.stringify(all));

      const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 9 } });
      
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `tatarstan_encyclopedia_${new Date().toISOString().slice(0,10)}.zip`;
      link.click();
      URL.revokeObjectURL(link.href);

      showToast('ZIP-архив успешно скачан!');
    }

    async function importFromZip(file) {
      if (!file) return;
      showToast('Распаковка и чтение ZIP-архива...');
      try {
        const zip = await JSZip.loadAsync(file);
        const dataFile = zip.file('data.json');
        if (!dataFile) {
          throw new Error('Некорректный формат архива');
        }

        const jsonText = await dataFile.async('text');
        const records = JSON.parse(jsonText);

        for (const record of records) {
          await storage.set(record);
        }

        await updateCacheInfo();
        renderSidebar();
        loadEntity(currentId);
        showToast(`Успешно импортировано: ${records.length} статей!`);
      } catch (err) {
        console.error(err);
        showToast('Ошибка при импорте ZIP-файла.');
      }
    }

    
    async function toggleBatchDownload() {
      if (isBatchRunning) {
        shouldStopBatch = true;
        btnModalBatchText.textContent = 'Останавливаем...';
        return;
      }

      isBatchRunning = true;
      shouldStopBatch = false;
      btnModalBatchDownload.className = 'btn btn-danger';
      btnModalBatchText.textContent = '⏹ Остановить сохранение';

      showToast('Сохранение энциклопедии в память устройства...');

      let count = 0;
      for (const item of ENTITIES) {
        if (shouldStopBatch) break;

        const exists = await storage.get(item.id);
        if (exists) {
          count++;
          btnModalBatchText.textContent = `Загружено: ${count} из ${ENTITIES.length}...`;
          continue;
        }

        try {
          btnModalBatchText.textContent = `Скачиваем: ${item.name} (${count + 1}/${ENTITIES.length})`;
          const [summary, fullHtml] = await Promise.all([
            WikiService.fetchSummary(item.wikiTitle),
            WikiService.fetchFullHtml(item.wikiTitle)
          ]);

          const record = {
            id: item.id,
            name: item.name,
            tatName: item.tatName,
            wikiTitle: item.wikiTitle,
            extract: summary.extract || 'Краткое описание отсутствует.',
            thumbnail: summary.thumbnail?.source || summary.originalimage?.source || null,
            fullHtml: fullHtml,
            savedDate: new Date().toLocaleDateString('ru-RU')
          };

          await storage.set(record);
        } catch (e) {
          console.warn(`Пропуск ${item.name}:`, e);
        }

        count++;
        await updateCacheInfo();
        await sleep(350);
      }

      await updateCacheInfo();
      renderSidebar();
      loadEntity(currentId);

      isBatchRunning = false;
      btnModalBatchDownload.className = 'btn btn-primary';
      btnModalBatchText.textContent = '⚡ Сохранить все 89 статей для офлайн-доступа';
      showToast(shouldStopBatch ? 'Сохранение приостановлено' : '🎉 Все 89 объектов сохранены в память!');
    }

    function switchMainTab(tabName) {
      document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-main-tab="${tabName}"]`)?.classList.add('active');

      document.getElementById('sectionArticle').style.display = tabName === 'article' ? 'flex' : 'none';
      document.getElementById('sectionHeatmap').style.display = tabName === 'heatmap' ? 'flex' : 'none';
      document.getElementById('sectionTimeline').style.display = tabName === 'timeline' ? 'flex' : 'none';

      if (tabName === 'heatmap') renderTreemap();
      if (tabName === 'timeline') renderTimeline();
    }

    
    function setupEvents() {
      searchInput.addEventListener('input', () => renderSidebar());

      document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentFilter = pill.dataset.filter;
          renderSidebar();
        });
      });

      
      document.querySelectorAll('.main-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchMainTab(btn.dataset.mainTab));
      });

      
      document.querySelectorAll('.subtab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const isSummary = btn.dataset.subtab === 'summary';
          tabSummaryContent.style.display = isSummary ? 'block' : 'none';
          tabFullContent.style.display = isSummary ? 'none' : 'block';
        });
      });

      
      document.querySelectorAll('.heatmap-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.heatmap-toggle-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeMetric = btn.dataset.metric;
          renderTreemap();
        });
      });

      
      document.querySelectorAll('[data-timeline-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-timeline-filter]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeTimelineFilter = btn.dataset.timelineFilter;
          renderTimeline();
        });
      });

      btnRefreshCurrent.addEventListener('click', () => {
        loadEntity(currentId, true);
        showToast('Обновление страницы из Википедии...');
      });

      
      btnOpenModal.addEventListener('click', async () => {
        await updateCacheInfo();
        storageModal.classList.add('open');
      });

      btnCloseModal.addEventListener('click', () => storageModal.classList.remove('open'));
      storageModal.addEventListener('click', (e) => {
        if (e.target === storageModal) storageModal.classList.remove('open');
      });

      btnModalBatchDownload.addEventListener('click', toggleBatchDownload);
      btnExportZip.addEventListener('click', exportToZip);
      btnImportZip.addEventListener('click', () => zipFileInput.click());
      zipFileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) importFromZip(e.target.files[0]);
      });

      btnClearArchive.addEventListener('click', async () => {
        if (confirm('Очистить сохранённую память приложения?')) {
          await storage.clear();
          await updateCacheInfo();
          renderSidebar();
          loadEntity(currentId);
          showToast('Память приложения очищена');
        }
      });

      
      document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
      });

      document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
      });

      window.addEventListener('resize', () => {
        if (document.getElementById('sectionHeatmap').style.display === 'flex') {
          renderTreemap();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
