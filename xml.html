<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Просмотр файлов</title>
<link rel="icon" href="https://img.icons8.com/?size=100&id=9Za2qWr0pN0J&format=png&color=000000" type="image/png">

<!-- CodeMirror стили -->
<link rel="stylesheet" href="webfonts/codemirror.min.css">
<link rel="stylesheet" href="webfonts/dracula.min.css">
<link rel="stylesheet" href="webfonts/monokai.min.css">
<link rel="stylesheet" href="webfonts/material.min.css">
<link rel="stylesheet" href="webfonts/solarized.min.css">
<link rel="stylesheet" href="webfonts/idea.min.css">
<link rel="stylesheet" href="webfonts/xq-light.min.css">
<link rel="stylesheet" href="webfonts/neo.min.css">
<link rel="stylesheet" href="webfonts/eclipse.min.css">

<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --text:#1f2933; --muted:#6b7785; --border:#dde3ea;
  --input:#ffffff; --hover:#eef2f6; --accent:#2f80ed; --accent-h:#1f6fd8;
  --green:#27ae60; --green-h:#219150; --danger:#e5484d; --warn:#f5a623;
  --shadow:0 6px 24px rgba(15,23,42,.12); --radius:8px;
}
body.dark{
  --bg:#1e1f29; --panel:#262835; --text:#e8e9ef; --muted:#9aa0b4; --border:#3a3d4f;
  --input:#2f3242; --hover:#343748; --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background:var(--bg);color:var(--text);transition:background-color .25s,color .25s}
.container{display:flex;flex-direction:column;height:100vh}
.editor-container{flex:1;min-height:0;position:relative;border-bottom:1px solid var(--border)}
#editor{height:100%}
.CodeMirror{height:100%!important;font-size:14px;font-family:Consolas,'JetBrains Mono','Courier New',monospace}
.cm-hl{background:rgba(255,213,0,.45);border-radius:2px}
body.dark .cm-hl{background:rgba(255,200,0,.35)}
.CodeMirror.filtered .CodeMirror-gutters{background:rgba(229,72,77,.08)}
.CodeMirror.filtered .CodeMirror-linenumber{color:var(--danger)}

/* Панель */
.control-panel{flex:0 0 auto;background:var(--panel);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.group.search{flex:1 1 420px;min-width:260px}
.sep{width:1px;align-self:stretch;background:var(--border)}
.search-box{position:relative;flex:1;min-width:160px}
.search-box i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.search-box input{width:100%;padding-left:30px;padding-right:30px}
.search-box .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--muted);
  height:26px;min-width:26px;padding:0;cursor:pointer;display:none}
.search-box.has-text .clear{display:block}
input[type=text],select{height:34px;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--input);color:var(--text);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
input[type=text]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,128,237,.18)}
button.btn{height:34px;min-width:34px;padding:0 11px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--input);color:var(--text);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;transition:background-color .15s,border-color .15s,transform .05s}
button.btn:hover{background:var(--hover)}
button.btn:active{transform:translateY(1px)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.primary:hover{background:var(--accent-h)}
button.btn.success{background:var(--green);border-color:var(--green);color:#fff}
button.btn.success:hover{background:var(--green-h)}
button.btn.active{background:var(--danger);border-color:var(--danger);color:#fff}
button.btn:disabled{opacity:.5;cursor:not-allowed}
.toggle{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);
  cursor:pointer;user-select:none;font-size:13px;background:var(--input)}
.toggle input{margin:0;width:15px;height:15px;cursor:pointer;accent-color:var(--accent)}
.toggle:has(input:checked){border-color:var(--accent);color:var(--accent)}
.status-bar{flex:0 0 auto;padding:5px 14px;background:var(--panel);border-top:1px solid var(--border);font-size:12px;color:var(--muted);
  display:flex;gap:14px;flex-wrap:wrap}
.status-bar b{color:var(--text);font-weight:600}
.status-bar .flt{color:var(--danger);font-weight:600}
.hint{color:var(--muted);font-size:12px}

/* Модальные окна */
.modal-back{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:center;justify-content:center;z-index:2000;padding:14px}
.modal-back.show{display:flex}
.modal{background:var(--panel);color:var(--text);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(1200px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600}
.modal-head button{border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.modal-body{padding:14px 16px;overflow:auto;flex:1;min-height:0}
.modal-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px}
.list-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .meta{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:20px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);max-height:58vh}
table.preview{border-collapse:collapse;font-size:12px;min-width:100%}
table.preview th,table.preview td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:4px 8px;text-align:left;
  white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
table.preview th{position:sticky;top:0;background:var(--hover);font-weight:600;z-index:1}
table.preview td.num{text-align:right;font-variant-numeric:tabular-nums}
table.preview tr:hover td{background:var(--hover)}
.info{font-size:13px;color:var(--muted);margin-bottom:8px}

/* Тосты */
#toasts{position:fixed;right:16px;bottom:90px;display:flex;flex-direction:column;gap:8px;z-index:3000;pointer-events:none}
.toast{background:var(--panel);color:var(--text);border-left:4px solid var(--accent);box-shadow:var(--shadow);border-radius:8px;
  padding:10px 14px;font-size:13px;max-width:360px;animation:tin .2s ease-out}
.toast.error{border-color:var(--danger)} .toast.ok{border-color:var(--green)} .toast.warn{border-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Drag & drop */
#dropZone{position:fixed;inset:0;background:rgba(47,128,237,.12);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;
  font-size:22px;color:var(--accent);z-index:2500;pointer-events:none;font-weight:600}
#dropZone.show{display:flex}

@media (max-width:768px){
  .btn .txt{display:none}
  .sep{display:none}
  .group.search{flex-basis:100%}
  .control-panel{gap:8px}
  .toggle{padding:0 8px}
}
@media print{.control-panel,.status-bar{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="container">
  <div class="editor-container"><div id="editor"></div></div>

  <div class="control-panel">
    <div class="group search">
      <div class="search-box" id="searchBox">

        <input type="text" id="searchInput" placeholder='Поиск / фильтр: слова через пробел, "фраза", -исключить' autocomplete="off">
        <button class="clear" id="clearSearch" title="Очистить"><i class="fas fa-times"></i></button>
      </div>
      <button class="btn" onclick="searchText(false)" title="Предыдущее (Shift+F3)"><i class="fas fa-chevron-up"></i></button>
      <button class="btn" onclick="searchText(true)" title="Следующее (F3)"><i class="fas fa-chevron-down"></i></button>
      <button class="btn" id="filterButton" onclick="toggleFilter('any')" title="Фильтр строк: все слова в любом порядке (Enter)">
        <i class="fas fa-filter"></i><span class="txt">Фильтр</span></button>
      <button class="btn" id="filterButtonSort" onclick="toggleFilter('ordered')" title="Фильтр строк: слова строго по порядку">
        <i class="fas fa-sort-amount-down"></i><span class="txt">Фильтр →</span></button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <label class="toggle" title="Форматировать XML (выкл. — показать только текст без тегов)"><input type="checkbox" id="tagToggle" checked>XML</label>
      <label class="toggle" title="Форматировать JSON построчно"><input type="checkbox" id="jsonToggle">JSON</label>
      <label class="toggle" title="Перенос строк"><input type="checkbox" id="wrapToggle">Перенос</label>
      <select id="themeSelector" title="Тема">
        <option value="eclipse">Eclipse</option><option value="idea">Idea</option><option value="xq-light">XQ Light</option>
        <option value="neo">Neo</option><option value="neat">Neat</option><option value="mdn-like">MDN</option>
        <option value="dracula">Dracula</option><option value="monokai">Monokai</option><option value="material">Material</option>
        <option value="solarized dark">Solarized Dark</option>
      </select>
    </div>

    <div class="sep"></div>

    <div class="group">
      <button class="btn primary" onclick="document.getElementById('fileInput').click()" title="Открыть файл (Ctrl+O)">
        <i class="fas fa-folder-open"></i><span class="txt">Открыть</span></button>
      <button class="btn" onclick="pasteFromClipboard(true)" title="Вставить из буфера"><i class="fas fa-paste"></i><span class="txt">Буфер</span></button>
      <button class="btn" onclick="copyToClipboard()" title="Копировать видимый текст"><i class="fas fa-copy"></i></button>
      <button class="btn" onclick="saveToFile()" title="Сохранить видимый текст (Ctrl+S)"><i class="fas fa-save"></i><span class="txt">Сохранить</span></button>
      <button class="btn success" id="xlsxButton" onclick="openExport()" title="JSON → таблица Excel"><i class="fas fa-file-excel"></i><span class="txt">XLSX</span></button>
      <button class="btn" onclick="openDbModal()" title="Локальная база (IndexedDB)"><i class="fas fa-database"></i><span class="txt">База</span></button>
      <input type="file" id="fileInput" accept=".xml,.zip,.txt,.log,.csv,.json,.geojson,.ndjson,.ini,.conf,.md" style="display:none">
      <input type="file" id="indexedDBFileInput" accept=".xml,.zip,.txt,.log,.csv,.json,.geojson,.ndjson,.ini,.conf,.md" style="display:none">
    </div>
  </div>
  <div class="status-bar" id="statusBar"></div>
</div>

<!-- Экспорт XLSX -->
<div class="modal-back" id="exportModal">
  <div class="modal wide">
    <div class="modal-head"><span><i class="fas fa-file-excel"></i> Экспорт JSON в таблицу</span><button onclick="closeModal('exportModal')">×</button></div>
    <div class="modal-body">
      <div class="opts">
        <label class="toggle"><input type="checkbox" id="optShort" checked>Короткие заголовки</label>
        <label class="toggle"><input type="checkbox" id="optCenter" checked>Центр геометрии (lon/lat)</label>
        <label class="toggle"><input type="checkbox" id="optCoords">Координаты геометрии</label>
        <label class="toggle"><input type="checkbox" id="optFilter">Только записи, подходящие под фильтр</label>
        <select id="optSource" title="Массив записей"></select>
      </div>
      <div class="info" id="exportInfo"></div>
      <div class="table-wrap"><table class="preview" id="previewTable"></table></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="exportCsv()"><i class="fas fa-file-csv"></i>CSV</button>
      <button class="btn success" onclick="exportXlsx()"><i class="fas fa-file-excel"></i>Скачать XLSX</button>
    </div>
  </div>
</div>

<!-- База данных -->
<div class="modal-back" id="dbModal">
  <div class="modal">
    <div class="modal-head"><span><i class="fas fa-database"></i> Локальная база</span><button onclick="closeModal('dbModal')">×</button></div>
    <div class="modal-body" id="dbList"></div>
    <div class="modal-foot">
      <button class="btn" onclick="openFileForIndexedDB()"><i class="fas fa-file-upload"></i>Сохранить файл…</button>
      <button class="btn primary" onclick="saveCurrentToDb()"><i class="fas fa-save"></i>Сохранить текущий</button>
    </div>
  </div>
</div>

<!-- Выбор файла в ZIP -->
<div class="modal-back" id="zipModal">
  <div class="modal">
    <div class="modal-head"><span><i class="fas fa-file-archive"></i> Выберите файл из архива</span><button onclick="closeModal('zipModal')">×</button></div>
    <div class="modal-body" id="zipList"></div>
  </div>
</div>

<div id="toasts"></div>
<div id="dropZone"><span><i class="fas fa-file-import"></i> Отпустите файл для открытия</span></div>

<script src="webfonts/codemirror.min.js"></script>
<script src="webfonts/xml.min.js"></script>
<script src="webfonts/javascript.min.js"></script>
<script src="webfonts/markdown.min.js"></script>
<script src="webfonts/csv.min.js"></script>
<script src="webfonts/searchcursor.min.js"></script>
<script src="webfonts/jszip.min.js"></script>
<script>
'use strict';
/* ============================ Состояние ============================ */
const $ = id => document.getElementById(id);
const state = {
  source: '',          // исходный текст (как загружен / отредактирован)
  base: '',            // отформатированный текст (то, что видно без фильтра)
  baseLines: [],
  name: 'Нет файла', size: null, modified: null,
  filterMode: null,    // null | 'any' | 'ordered'
  lineMap: null,       // номера исходных строк для отфильтрованного вида
  programmatic: false,
  jsonCache: null      // {text, data, repaired}
};
const DARK = ['dracula','monokai','material','solarized dark'];
const TEXT_EXT = ['.xml','.txt','.log','.csv','.json','.geojson','.ndjson','.ini','.conf','.md'];

/* ============================ Редактор ============================ */
const editor = CodeMirror($('editor'), {
  lineNumbers: true, mode: 'xml', theme: 'eclipse', lineWrapping: false, matchBrackets: true,
  lineNumberFormatter: n => state.lineMap ? String((state.lineMap[n - 1] ?? n - 1) + 1) : String(n)
});

const savedTheme = localStorage.getItem('xmlViewerTheme') || 'eclipse';
const savedWrap = localStorage.getItem('xmlViewerWrapToggle') === 'true';
$('themeSelector').value = savedTheme;
$('wrapToggle').checked = savedWrap;
$('jsonToggle').checked = false;
editor.setOption('theme', savedTheme);
editor.setOption('lineWrapping', savedWrap);
applyThemeColors(savedTheme);

function setEditorText(text) {
  state.programmatic = true;
  editor.setValue(text);
  editor.clearHistory();
  state.programmatic = false;
}

editor.on('change', (cm, ch) => {
  if (state.programmatic || state.filterMode) return;
  // Пользователь отредактировал текст — он становится новым источником
  state.base = cm.getValue();
  state.source = state.base;
  state.baseLines = state.base.split(/\r?\n/);
  state.jsonCache = null;
  scheduleStatus();
});

/* ============================ Уведомления ============================ */
function toast(msg, type = 'info', ms = 3200) {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }
document.querySelectorAll('.modal-back').forEach(m => m.addEventListener('mousedown', e => { if (e.target === m) m.classList.remove('show'); }));

/* ============================ JSON: определение, форматирование, разбор ============================ */
function stripBom(s) { return s && s.charCodeAt(0) === 0xFEFF ? s.slice(1) : s; }
function looksLikeJson(text) {
  const t = (text || '').trimStart();
  return t[0] === '{' || t[0] === '[';
}

// Устойчивое форматирование: работает даже с обрезанным / невалидным JSON и сохраняет числа как есть
function prettyJson(src, ind = '  ') {
  const out = [], n = src.length; let lvl = 0, i = 0;
  const nl = () => out.push('\n' + ind.repeat(lvl));
  while (i < n) {
    const c = src[i];
    if (c === '"') {
      let j = i + 1;
      while (j < n) { const d = src[j]; if (d === '\\') { j += 2; continue; } if (d === '"') break; j++; }
      out.push(src.slice(i, j + 1)); i = j + 1; continue;
    }
    if (c === '{' || c === '[') {
      if (lvl === 0 && out.length) out.push('\n');
      let j = i + 1; while (j < n && (src[j] === ' ' || src[j] === '\n' || src[j] === '\r' || src[j] === '\t')) j++;
      if (src[j] === (c === '{' ? '}' : ']')) { out.push(c + src[j]); i = j + 1; continue; }
      out.push(c); lvl++; nl(); i++; continue;
    }
    if (c === '}' || c === ']') { lvl = Math.max(0, lvl - 1); nl(); out.push(c); i++; continue; }
    if (c === ',') { out.push(','); nl(); i++; continue; }
    if (c === ':') { out.push(': '); i++; continue; }
    if (c === ' ' || c === '\n' || c === '\r' || c === '\t') { i++; continue; }
    let j = i + 1;
    while (j < n && !'"{}[],: \n\r\t'.includes(src[j])) j++;
    out.push(src.slice(i, j)); i = j;
  }
  return out.join('');
}

// Попытка починить обрезанный JSON (например, скопированный кусок без конца).
// Сначала отрезаем по границе между объектами в массиве (неполная последняя запись отбрасывается).
function repairJson(s) {
  const close = st => st.split('').reverse().map(c => c === '{' ? '}' : ']').join('');
  const stack = []; const commas = []; const recCut = {}; let inStr = false, prev = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inStr) { if (c === '\\') i++; else if (c === '"') { inStr = false; prev = '"'; } continue; }
    if (c === ' ' || c === '\n' || c === '\r' || c === '\t') continue;
    if (c === '"') inStr = true;
    else if (c === '{' || c === '[') stack.push(c);
    else if (c === '}' || c === ']') stack.pop();
    else if (c === ',') {
      const st = stack.join('');
      if (prev === '}' && stack[stack.length - 1] === '[') recCut[stack.length] = [i, st];
      commas.push([i, st]); if (commas.length > 400) commas.shift();
    }
    prev = c;
  }
  const tryParse = t => { try { return { ok: true, v: JSON.parse(t) }; } catch (e) { return { ok: false }; } };
  for (const d of Object.keys(recCut).map(Number).sort((a, b) => a - b)) {
    const [pos, st] = recCut[d]; const r = tryParse(s.slice(0, pos) + close(st)); if (r.ok) return r.v;
  }
  if (!inStr && stack.length) { const r = tryParse(s.replace(/[\s,]+$/, '') + close(stack.join(''))); if (r.ok) return r.v; }
  for (let k = commas.length - 1; k >= 0; k--) {
    const [pos, st] = commas[k]; const r = tryParse(s.slice(0, pos) + close(st)); if (r.ok) return r.v;
  }
  throw new Error('JSON не удалось разобрать');
}

function parseJsonLoose(text) {
  const t = stripBom(text || '').trim();
  if (state.jsonCache && state.jsonCache.text === t) return state.jsonCache;
  let res;
  try { res = { data: JSON.parse(t), repaired: false }; }
  catch (e1) {
    const lines = t.split(/\r?\n/).filter(l => l.trim());
    let nd = null;
    if (lines.length > 1) { try { nd = lines.map(l => JSON.parse(l)); } catch (e) { nd = null; } }
    if (nd) res = { data: nd, repaired: false, ndjson: true };
    else res = { data: repairJson(t), repaired: true };
  }
  res.text = t; state.jsonCache = res;
  return res;
}

/* ============================ Форматирование содержимого ============================ */
function formatContent(content, showTags, showJson) {
  if (!content) return '';
  try {
    if (showJson) return prettyJson(stripBom(content).trim());
    if (showTags) {
      const lines = content.replace(/(>)\s*(<)(\/*)/g, '$1\n$2$3').split(/\r?\n/);
      let pad = 0; const res = [];
      for (const raw of lines) {
        const line = raw.trim(); if (!line) continue;
        let indent = 0;
        if (/.+<\/\w[^>]*>$/.test(line)) indent = 0;
        else if (/^<\/\w/.test(line) && pad > 0) pad--;
        else if (/^<\w[^>]*[^\/]>.*$/.test(line) && !/^<\?/.test(line)) indent = 1;
        res.push('  '.repeat(pad) + line); pad += indent;
      }
      return res.join('\n');
    }
    const only = content.replace(/<[^>]+>/g, '').split(/\r?\n/).filter(l => l.trim()).join('\n');
    return only || content;
  } catch (e) { console.error('Ошибка форматирования:', e); return content; }
}

function rebuildView() {
  const showTags = $('tagToggle').checked, showJson = $('jsonToggle').checked;

function loadContent(text, name, meta = {}) {

  state.source = text; state.name = name || 'Без имени';
  state.size = meta.size ?? new Blob([text]).size; state.modified = meta.modified ?? null;

/* ============================ Чтение файлов ============================ */
function decodeBuffer(buf) {
  const a = new Uint8Array(buf);
  if (a[0] === 0xEF && a[1] === 0xBB && a[2] === 0xBF) return new TextDecoder('utf-8').decode(a.subarray(3));
  if (a[0] === 0xFF && a[1] === 0xFE) return new TextDecoder('utf-16le').decode(a.subarray(2));
  if (a[0] === 0xFE && a[1] === 0xFF) return new TextDecoder('utf-16be').decode(a.subarray(2));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(a); }
  catch (e) { return new TextDecoder('windows-1251').decode(a); }
}
const isSupported = n => TEXT_EXT.some(ext => n.toLowerCase().endsWith(ext));

async function openFile(file) {
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    if (file.name.toLowerCase().endsWith('.zip')) {
      if (typeof JSZip === 'undefined') return toast('JSZip не загружен', 'error');
      const zip = await JSZip.loadAsync(buf);
      const files = Object.keys(zip.files).filter(f => !zip.files[f].dir && isSupported(f));
      if (!files.length) return toast('В архиве нет поддерживаемых файлов', 'error');
      const openEntry = async f => {
        const data = await zip.file(f).async('arraybuffer');
        loadContent(decodeBuffer(data), f, { size: data.byteLength, modified: file.lastModified });
        closeModal('zipModal'); toast('Открыт ' + f, 'ok');
      };
      if (files.length === 1) return openEntry(files[0]);
      const list = $('zipList'); list.innerHTML = '';
      files.forEach(f => {
        const row = document.createElement('div'); row.className = 'list-item';
        row.innerHTML = '<i class="fas fa-file-alt"></i><span class="name"></span>';
        row.querySelector('.name').textContent = f;
        const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = 'Открыть'; b.onclick = () => openEntry(f);
        row.appendChild(b); list.appendChild(row);
      });
      openModal('zipModal');
    } else {
      loadContent(decodeBuffer(buf), file.name, { size: file.size, modified: file.lastModified });
    }
  } catch (e) { console.error(e); toast('Ошибка чтения файла: ' + e.message, 'error'); }
}

/* ============================ Поиск ============================ */
function parseQuery(q) {
  const inc = [], exc = []; const re = /(-?)"([^"]+)"|(-?)(\S+)/g; let m;
  while ((m = re.exec(q))) {
    const neg = m[1] || m[3]; const term = (m[2] ?? m[4] ?? '').toLowerCase();
    if (!term || (neg && !m[2] && term === '')) continue;
    if (neg && term) exc.push(term); else if (term) inc.push(term);
  }
  // одиночный "-" считаем обычным словом
  return { inc, exc };
}
function makeMatcher(q, ordered) {
  const { inc, exc } = parseQuery(q);
  if (!inc.length && !exc.length) return null;
  return text => {
    const s = text.toLowerCase();
    for (const t of exc) if (s.includes(t)) return false;
    if (ordered) { let idx = 0; for (const t of inc) { idx = s.indexOf(t, idx); if (idx < 0) return false; idx += t.length; } return true; }
    for (const t of inc) if (!s.includes(t)) return false;
    return true;
  };
}

let searchCursor = null, lastQuery = '';
function searchText(forward) {
  const { inc } = parseQuery($('searchInput').value);
  const query = inc[0] ? $('searchInput').value.trim().replace(/^"|"$/g, '') : '';
  if (!query) return;
  const term = state.filterMode ? inc[0] : query;
  if (!searchCursor || lastQuery !== term) {
    searchCursor = editor.getSearchCursor(term, editor.getCursor(forward ? 'to' : 'from'), { caseFold: true });
    lastQuery = term;
  }
  let found = forward ? searchCursor.findNext() : searchCursor.findPrevious();
  if (!found) {
    searchCursor = editor.getSearchCursor(term, forward ? CodeMirror.Pos(0, 0) : CodeMirror.Pos(editor.lastLine()), { caseFold: true });
    found = forward ? searchCursor.findNext() : searchCursor.findPrevious();
    if (found) toast('Поиск продолжен с ' + (forward ? 'начала' : 'конца'), 'info', 1500);
  }
  if (found) {
    editor.setSelection(searchCursor.from(), searchCursor.to());
    editor.scrollIntoView({ from: searchCursor.from(), to: searchCursor.to() }, 80);
  } else toast('Не найдено: ' + term, 'warn', 1800);
}

// Подсветка совпадений
let overlay = null;
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function updateHighlight() {
  if (overlay) { editor.removeOverlay(overlay); overlay = null; }
  const { inc } = parseQuery($('searchInput').value);
  const terms = inc.filter(t => t.length >= 1);
  if (!terms.length) return;
  const re = new RegExp(terms.sort((a, b) => b.length - a.length).map(escRe).join('|'), 'gi');
  overlay = { token(stream) {
    re.lastIndex = stream.pos; const m = re.exec(stream.string);
    if (m && m.index === stream.pos) { stream.pos += m[0].length || 1; return 'hl'; }
    if (m) stream.pos = m.index; else stream.skipToEnd();
    return null;
  } };

}

/* ============================ JSON → таблица ============================ */
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);

function findArrays(data) {
  const found = [];
  if (Array.isArray(data)) found.push({ path: '(корень)', arr: data });
  const walk = (o, path, depth) => {
    if (depth > 5 || !isObj(o)) return;
    for (const k of Object.keys(o)) {
      const v = o[k], p = path ? path + '.' + k : k;
      if (Array.isArray(v) && v.length && v.filter(isObj).length >= v.length / 2) found.push({ path: p, arr: v });
      else if (isObj(v)) walk(v, p, depth + 1);
    }
  };
  walk(data, '', 0);
  if (!found.length) found.push({ path: '(корень)', arr: [data] });
  // приоритет: features GeoJSON, затем самый большой массив
  found.sort((a, b) => (b.path === 'features') - (a.path === 'features') || b.arr.length - a.arr.length);
  return found;
}

function flatten(val, prefix, out) {
  if (val === null || val === undefined) { out[prefix || 'value'] = ''; return; }
  if (Array.isArray(val)) {
    out[prefix || 'value'] = val.every(v => v === null || typeof v !== 'object') ? val.map(v => v ?? '').join('; ') : JSON.stringify(val);
    return;
  }
  if (isObj(val)) {
    const keys = Object.keys(val);
    if (!keys.length) { if (prefix) out[prefix] = ''; return; }
    for (const k of keys) flatten(val[k], prefix ? prefix + '.' + k : k, out);
    return;
  }
  out[prefix || 'value'] = val;
}

function geomPoints(c, acc) {
  if (!Array.isArray(c)) return acc;
  if (typeof c[0] === 'number') { acc.push(c); return acc; }
  c.forEach(x => geomPoints(x, acc)); return acc;
}
function mercToLonLat(x, y) {
  const R = 6378137;
  return [x / R * 180 / Math.PI, (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI];
}

function recordToRow(rec, opts) {
  const row = {};
  if (isObj(rec) && rec.type === 'Feature') {
    if (rec.id !== undefined) row.id = rec.id;
    flatten(rec.properties || {}, 'properties', row);
    const g = rec.geometry;
    if (g) {
      row['geometry.type'] = g.type || '';
      const crs = g.crs?.properties?.name || rec.crs?.properties?.name || '';
      if (crs) row['geometry.crs'] = crs;
      if (opts.center && g.coordinates) {
        const pts = geomPoints(g.coordinates, []);
        if (pts.length) {
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          for (const [x, y] of pts) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
          let cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
          if (/3857|900913|3395/.test(crs) || Math.abs(cx) > 180 || Math.abs(cy) > 90) [cx, cy] = mercToLonLat(cx, cy);
          row['geometry.center_lon'] = +cx.toFixed(7); row['geometry.center_lat'] = +cy.toFixed(7);
        }
      }
      if (opts.coords && g.coordinates) row['geometry.coordinates'] = JSON.stringify(g.coordinates);
    }
    for (const k of Object.keys(rec)) if (!['type', 'id', 'properties', 'geometry'].includes(k)) flatten(rec[k], k, row);
  } else flatten(rec, '', row);
  return row;
}

function buildTable() {
  let parsed;
  try { parsed = parseJsonLoose(state.source); }
  catch (e) { throw new Error('Текст не является корректным JSON'); }
  const arrays = findArrays(parsed.data);
  const sel = $('optSource');
  const prev = sel.value;
  sel.innerHTML = arrays.map((a, i) => `<option value="${i}">${esc(a.path)} — ${a.arr.length} зап.</option>`).join('');
  if (prev && +prev < arrays.length) sel.value = prev;
  const src = arrays[+sel.value || 0];
  const opts = { center: $('optCenter').checked, coords: $('optCoords').checked };
  let rows = src.arr.map(r => recordToRow(r, opts));
  const total = rows.length;
  if ($('optFilter').checked) {
    const m = makeMatcher($('searchInput').value, state.filterMode === 'ordered');
    if (m) rows = rows.filter(r => m(Object.entries(r).map(([k, v]) => k + ': ' + v).join('\n')));
  }
  const cols = []; const seen = new Set();
  for (const r of rows) for (const k of Object.keys(r)) if (!seen.has(k)) { seen.add(k); cols.push(k); }
  let headers = cols.slice();
  if ($('optShort').checked) {
    const short = cols.map(c => c.replace(/^properties\.options\./, '').replace(/^properties\./, ''));
    const cnt = {}; short.forEach(s => cnt[s] = (cnt[s] || 0) + 1);
    headers = short.map((s, i) => cnt[s] > 1 ? cols[i] : s);
  }
  return { cols, headers, rows, total, repaired: parsed.repaired, path: src.path };
}

function xmlEsc(s) {

async function exportXlsx() {

<dimension ref="A1:${last}"/>
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>

<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
</Types>`);
  zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
</Relationships>`);
  zip.file('docProps/core.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
<dc:title>${xmlEsc(baseName())}</dc:title><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0, 19)}Z</dcterms:created>
</cp:coreProperties>`);
  zip.file('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="Данные" sheetId="1" r:id="rId1"/></sheets>
<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'Данные'!$A$1:$${letters[letters.length - 1]}$${rows.length + 1}</definedName></definedNames>
</workbook>`);
  zip.file('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`);
  zip.file('xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF2F80ED"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>
<border><left style="thin"><color rgb="FFD0D7E2"/></left><right style="thin"><color rgb="FFD0D7E2"/></right><top style="thin"><color rgb="FFD0D7E2"/></top><bottom style="thin"><color rgb="FFD0D7E2"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>

  zip.file('xl/worksheets/sheet1.xml', sheet);
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  download(blob, `${baseName()}_${stamp()}.xlsx`);
  toast(`XLSX: ${rows.length} строк, ${cols.length} столбцов`, 'ok');
}

function exportCsv() {
  const t = lastTable; if (!t || !t.rows.length) return toast('Нет записей для экспорта', 'warn');
  const q = v => { const s = v == null ? '' : String(v); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [t.headers.map(q).join(';')].concat(t.rows.map(r => t.cols.map(c => {
    const v = r[c]; return typeof v === 'number' ? String(v).replace('.', ',') : q(v);
  }).join(';')));
  download(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), `${baseName()}_${stamp()}.csv`);
}

/* ============================ IndexedDB ============================ */
let db;
(function initIndexedDB() {
  const req = indexedDB.open('xmlDB', 1);
  req.onerror = e => toast('Ошибка IndexedDB: ' + e.target.error, 'error');
  req.onupgradeneeded = e => { const d = e.target.result; const os = d.createObjectStore('xmlStore', { keyPath: 'id' }); os.createIndex('id', 'id', { unique: true }); };
  req.onsuccess = e => { db = e.target.result; };
})();
function store(mode) { return db.transaction(['xmlStore'], mode).objectStore('xmlStore'); }

function openDbModal() {
  if (!db) return toast('IndexedDB не инициализирована', 'error');
  const list = $('dbList'); list.innerHTML = '<div class="empty">Загрузка…</div>';
  const req = store('readonly').getAll();
  req.onsuccess = e => {
    const items = e.target.result;
    if (!items.length) { list.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i> База пуста</div>'; return; }
    list.innerHTML = '';
    items.forEach(it => {
      const row = document.createElement('div'); row.className = 'list-item';
      row.innerHTML = `<i class="fas fa-file-alt"></i><span class="name" title="${esc(it.id)}">${esc(it.id)}</span><span class="meta">${fmtSize(new Blob([it.xml || '']).size)}</span>`;
      const lb = document.createElement('button'); lb.className = 'btn primary'; lb.innerHTML = '<i class="fas fa-download"></i>';
      lb.title = 'Загрузить'; lb.onclick = () => { if (state.filterMode) clearFilter(); loadContent(it.xml, it.id); closeModal('dbModal'); toast('Загружено: ' + it.id, 'ok'); };
      const db_ = document.createElement('button'); db_.className = 'btn'; db_.innerHTML = '<i class="fas fa-trash"></i>'; db_.title = 'Удалить';
      db_.onclick = () => {
        if (!confirm('Удалить «' + it.id + '» из базы?')) return;
        const r = store('readwrite').delete(it.id);
        r.onsuccess = () => { toast('Удалено: ' + it.id, 'ok'); openDbModal(); };
        r.onerror = ev => toast('Ошибка удаления: ' + ev.target.error, 'error');
      };
      row.append(lb, db_); list.appendChild(row);
    });
  };
  req.onerror = e => toast('Ошибка чтения базы: ' + e.target.error, 'error');
  openModal('dbModal');
}
function saveDataToIndexDB(content, name) {
  if (!db) return toast('IndexedDB не инициализирована', 'error');
  const r = store('readwrite').put({ id: name, xml: content });
  r.onsuccess = () => { toast('Сохранено в базу: ' + name, 'ok'); if ($('dbModal').classList.contains('show')) openDbModal(); };
  r.onerror = e => toast('Ошибка сохранения: ' + e.target.error, 'error');
}
function saveCurrentToDb() {
  if (!state.source) return toast('Нет данных для сохранения', 'warn');
  const name = prompt('Имя записи в базе:', state.name && state.name !== 'Буфер обмена' ? state.name : 'документ_' + stamp());
  if (name) saveDataToIndexDB(state.source, name);
}
function openFileForIndexedDB() { if (!db) return toast('IndexedDB не инициализирована', 'error'); $('indexedDBFileInput').click(); }
$('indexedDBFileInput').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  const name = prompt('Имя записи в базе:', file.name); if (!name) return;
  try { saveDataToIndexDB(decodeBuffer(await file.arrayBuffer()), name); } catch (err) { toast('Ошибка чтения файла', 'error'); }
});

/* ============================ Горячие клавиши ============================ */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); saveToFile(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'o') { e.preventDefault(); $('fileInput').click(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'f') { e.preventDefault(); $('searchInput').focus(); $('searchInput').select(); }
  else if (e.key === 'F3') { e.preventDefault(); searchText(!e.shiftKey); }
  else if (e.key === 'Escape') document.querySelectorAll('.modal-back.show').forEach(m => m.classList.remove('show'));
});

/* ============================ Старт ============================ */
updateStatusBar();
pasteFromClipboard(false);
</script>
