<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Кадастровый Навигатор</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=dde71a0e-b612-44b7-b53b-82533420240f&lang=ru_RU" type="text/javascript"></script>
    <script src="webfonts/proj4.js"></script>
    <link rel="stylesheet" href="webfonts/all.min.css">
    <link rel="icon" href="img/nav.png" type="image/png">
    <style>
        :root {
            --bg-glass: rgba(255, 255, 255, 0.92);
            --bg-glass-strong: rgba(255, 255, 255, 0.97);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: rgba(203, 213, 225, 0.8);
            --primary: #10b981;
            --primary-dark: #059669;
            --accent-blue: #3b82f6;
            --danger: #ef4444;
            --shadow-lg: 0 10px 30px -5px rgba(15, 23, 42, 0.18);
            --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            touch-action: manipulation;
        }

        #map {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Скрываем лишние стандартные копирайты/кнопки Яндекса, чтобы не перекрывались */
        .ymaps-2-1-79-controls__control_toolbar,
        .ymaps-2-1-79-gotoymaps {
            display: none !important;
        }

        /* Верхняя карточка объекта */
        .object-card-overlay {
            position: fixed;
            top: calc(14px + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: var(--bg-glass-strong);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 20px;
            padding: 14px 16px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            width: calc(100% - 28px);
            max-width: 540px;
            border: 1px solid var(--border-color);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
            opacity: 0;
            pointer-events: none;
        }

        .object-card-overlay.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .card-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .object-card-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .object-card-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-distance {
            background: #e0f2fe;
            color: #0284c7;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            white-space: nowrap;
            display: none;
        }

        .object-card-subtitle {
            font-size: 12px;
            color: var(--text-sub);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 3px;
            line-height: 1.35;
        }

        .card-actions-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .navigator-btn-card {
            background: linear-gradient(135deg, #ff334b, #d91438);
            color: #ffffff;
            border: none;
            border-radius: 13px;
            padding: 11px 16px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 20, 56, 0.3);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .navigator-btn-card:active {
            transform: scale(0.95);
        }

        /* Панель быстрых кнопок в карточке */
        .card-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
            border-top: 1px solid #e2e8f0;
            gap: 6px;
        }

        .chip-btn {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            padding: 6px 10px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .chip-btn:hover {
            background: #e2e8f0;
        }

        .chip-btn:active {
            transform: scale(0.96);
        }

        /* Раскрывающийся блок деталей НСПД */
        .card-details {
            display: none;
            flex-direction: column;
            gap: 6px;
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 12px;
            border: 1px solid #e2e8f0;
            max-height: 190px;
            overflow-y: auto;
        }

        .card-details.open {
            display: flex;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 5px;
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .detail-val {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
            word-break: break-word;
        }

        /* Правая плавающая панель инструментов карты */
        .map-controls-right {
            position: fixed;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 900;
        }

        .fab-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            color: var(--text-main);
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .fab-btn:active {
            transform: scale(0.92);
        }

        .fab-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
        }

        .fab-badge {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: #0f172a;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 5px;
            text-transform: uppercase;
        }

        /* Плавающая нижняя панель поиска */
        .bottom-search-wrapper {
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 28px);
            max-width: 540px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Выпадающий список истории */
        .history-dropdown {
            background: var(--bg-glass-strong);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 18px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: none;
            flex-direction: column;
            max-height: 220px;
            overflow-y: auto;
        }

        .history-dropdown.open {
            display: flex;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            background: rgba(241, 245, 249, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .history-clear-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .history-item {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
            transition: background 0.15s;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: rgba(59, 130, 246, 0.08);
        }

        .history-item-main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .history-item-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-sub {
            font-size: 11px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Капсула поиска */
        #bottom-bar {
            height: 58px;
            width: 100%;
            background: var(--bg-glass-strong);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            padding: 6px 6px 6px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            gap: 8px;
        }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        #search-input {
            width: 100%;
            height: 44px;
            padding: 0 32px 0 4px;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            background: transparent;
            border: none;
            outline: none;
        }

        #search-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        #clear-input-btn {
            position: absolute;
            right: 4px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: #e2e8f0;
            color: #475569;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .bar-button {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #ffffff;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .bar-button:active {
            transform: scale(0.92);
        }

        #search-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        #clear-map-button {
            background: #f1f5f9;
            color: #475569;
            width: 42px;
            height: 42px;
        }

        /* Кастомный маркер на карте */
        .custom-placemark-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -100%);
            cursor: grab;
            user-select: none;
        }

        .placemark-chip {
            background: #0f172a;
            color: #ffffff;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .placemark-chip-btn {
            background: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .pin-dot {
            width: 16px;
            height: 16px;
            background: #ef4444;
            border: 2.5px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .pin-dot::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 2px solid #ef4444;
            animation: pulse 1.8s infinite;
            opacity: 0;
        }

        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* Модальное окно настроек сдвига */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-window {
            background: #ffffff;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            padding: 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .modal-row input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
        }

        /* Загрузчик */
        .loader-container {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.55);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            backdrop-filter: blur(4px);
            flex-direction: column;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #ffffff;
            font-size: 15px;
            margin-top: 14px;
            font-weight: 600;
        }

        /* Уведомления */
        .notification {
            position: fixed;
            bottom: 92px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 10px 18px;
            color: white;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            pointer-events: none;
            white-space: nowrap;
        }

        .notification.success { background: linear-gradient(135deg, #10b981, #059669); }
        .notification.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .notification.warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .notification.info { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 480px) {
            .object-card-overlay { padding: 12px 14px; }
            .navigator-btn-card span { display: none; }
            .navigator-btn-card { padding: 11px 13px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Верхняя карточка объекта -->
    <div id="objectCard" class="object-card-overlay">
        <div class="card-main-row">
            <div class="object-card-info">
                <div class="title-row">
                    <span id="cardTitle" class="object-card-title">Объект</span>
                    <span id="cardDistance" class="badge-distance"></span>
                </div>
                <span id="cardSubtitle" class="object-card-subtitle">Адрес</span>
            </div>
            <div class="card-actions-right">
                <button id="cardNaviBtn" class="navigator-btn-card" title="Построить маршрут в Яндекс Навигаторе">
                    <i class="fas fa-location-arrow"></i>
                    <span>Маршрут</span>
                </button>
            </div>
        </div>

        <div class="card-toolbar">
            <div style="display: flex; gap: 6px; overflow-x: auto;">
                <button id="toggleDetailsBtn" class="chip-btn" style="display: none;">
                    <i class="fas fa-info-circle"></i> Детали
                </button>
                <button id="copyTitleBtn" class="chip-btn" title="Скопировать номер или название">
                    <i class="far fa-copy"></i> Номер
                </button>
                <button id="copyCoordsBtn" class="chip-btn" title="Скопировать координаты">
                    <i class="fas fa-crosshairs"></i> Коорд.
                </button>
            </div>
            <button id="closeCardBtn" class="chip-btn" style="padding: 6px 9px;" title="Скрыть карточку">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div id="cardDetails" class="card-details"></div>
    </div>

    <!-- Боковая панель управления картой -->
    <div class="map-controls-right">
        <button id="layerSwitchBtn" class="fab-btn" title="Переключить слой карты (Схема / Гибрид / Спутник)">
            <i class="fas fa-layer-group"></i>
            <span id="layerBadge" class="fab-badge">Схм</span>
        </button>
        <button id="gpsTrackBtn" class="fab-btn" title="Моё местоположение">
            <i class="fas fa-location-crosshairs"></i>
        </button>
        <button id="multiModeBtn" class="fab-btn" title="Мульти-режим: не очищать карту при новом поиске">
            <i class="fas fa-object-group"></i>
        </button>
        <button id="offsetSettingsBtn" class="fab-btn" title="Коррекция сдвига координат">
            <i class="fas fa-sliders-h"></i>
        </button>
    </div>

    <!-- Нижняя плавающая панель поиска и истории -->
    <div class="bottom-search-wrapper">
        <div id="historyDropdown" class="history-dropdown">
            <div class="history-header">
                <span>Недавние поиски</span>
                <button id="clearHistoryBtn" class="history-clear-btn">Очистить</button>
            </div>
            <div id="historyList"></div>
        </div>

        <div id="bottom-bar">
            <div class="input-wrapper">
                <input type="text" id="search-input" placeholder="Кадастровый номер, координаты или адрес" autocomplete="off">
                <button id="clear-input-btn" title="Стереть текст">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <button id="clear-map-button" class="bar-button" title="Очистить карту">
                <i class="fas fa-trash-alt"></i>
            </button>
            <button id="search-button" class="bar-button" title="Найти">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </div>

    <!-- Модальное окно коррекции сдвига -->
    <div id="offsetModal" class="modal-backdrop">
        <div class="modal-window">
            <div class="modal-title">
                <span>Поправка координат (НСПД)</span>
                <button id="closeModalBtn" class="chip-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-row">
                <div style="display:flex; justify-content:space-between;">
                    <span>Сдвиг Долготы (X):</span>
                    <strong id="valOffsetX">-4.5 м</strong>
                </div>
                <input type="range" id="rangeOffsetX" min="-15" max="15" step="0.5" value="-4.5">
            </div>
            <div class="modal-row">
                <div style="display:flex; justify-content:space-between;">
                    <span>Сдвиг Широты (Y):</span>
                    <strong id="valOffsetY">-1.0 м</strong>
                </div>
                <input type="range" id="rangeOffsetY" min="-15" max="15" step="0.5" value="-1">
            </div>
            <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:4px;">
                <button id="resetOffsetBtn" class="chip-btn">Сбросить (-4.5 / -1)</button>
            </div>
        </div>
    </div>

    <!-- Экран загрузки -->
    <div class="loader-container" id="loaderContainer">
        <div class="spinner"></div>
        <div class="loading-text" id="loaderText">Поиск...</div>
    </div>

    <script>
        const sevenDigitsRegions = [
            '06', '07', '09', '10', '11', '12', '13', '14', '17', '23',
            '24', '27', '31', '32', '35', '36', '41', '42', '47', '48',
            '50', '52', '53', '56', '57', '58', '59', '60', '61', '62',
            '63', '64', '65', '66', '67', '69', '70', '71', '72', '74',
            '77', '78', '79'
        ];

        proj4.defs("EPSG:3857", "+proj=merc +a=6378137 +b=6378137 +lat_ts=0.0 +lon_0=0.0 +x_0=0.0 +y_0=0 +k=1.0 +units=m +nadgrids=@null +wktext +no_defs");
        proj4.defs("EPSG:4326", "+proj=longlat +datum=WGS84 +no_defs");

        let mapOffsetX = parseFloat(localStorage.getItem('nav_offsetX') ?? -4.5);
        let mapOffsetY = parseFloat(localStorage.getItem('nav_offsetY') ?? -1.0);

        let map = null;
        let currentMapObjects = [];
        let currentPolygons = [];
        let currentTargetCoords = null;
        let userCoords = null;
        let userPlacemark = null;
        let multiMode = false;
        let useMapruProxy = (sessionStorage.getItem('useMapruProxy') === 'true');

        const mapTypes = [
            { id: 'yandex#map', badge: 'Схм', name: 'Схема', isDark: false },
            { id: 'yandex#hybrid', badge: 'Гиб', name: 'Гибрид', isDark: true },
            { id: 'yandex#satellite', badge: 'Спт', name: 'Спутник', isDark: true }
        ];
        let currentMapTypeIdx = 0;

        function showLoader(text = "Загрузка...") {
            const el = document.getElementById('loaderContainer');
            const txt = document.getElementById('loaderText');
            if (txt) txt.textContent = text;
            if (el) el.style.display = 'flex';
        }

        function hideLoader() {
            const el = document.getElementById('loaderContainer');
            if (el) el.style.display = 'none';
        }

        function showNotification(message, type = 'info') {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            const n = document.createElement('div');
            n.className = `notification ${type}`;
            let icon = 'info-circle';
            if (type === 'success') icon = 'check-circle';
            if (type === 'error') icon = 'exclamation-circle';
            if (type === 'warning') icon = 'exclamation-triangle';

            n.innerHTML = `<i class="fas fa-${icon}"></i> <span>${message}</span>`;
            document.body.appendChild(n);

            setTimeout(() => n.classList.add('show'), 10);
            setTimeout(() => {
                n.classList.remove('show');
                setTimeout(() => n.remove(), 350);
            }, 3500);

        function getTrueWgs84(mapLat, mapLon) {
            const lat = mapLat + (mapOffsetY * 0.000008983);
            const lon = mapLon + (mapOffsetX * 0.000008983);
            return [lat, lon];
        }

        function getMapCoordsFromWgs(wgsLat, wgsLon) {
            const lat = wgsLat - (mapOffsetY * 0.000008983);
            const lon = wgsLon - (mapOffsetX * 0.000008983);
            return [lat, lon];
        }

        // Расчет расстояния по прямой (в метрах / км)
        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const p1 = lat1 * Math.PI / 180;
            const p2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180;
            const dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
            const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return d < 1000 ? `${Math.round(d)} м` : `${(d / 1000).toFixed(1)} км`;
        }

        function updateDistanceBadge() {
            const badge = document.getElementById('cardDistance');
            if (userCoords && currentTargetCoords) {
                badge.textContent = calcDistance(userCoords[0], userCoords[1], currentTargetCoords.lat, currentTargetCoords.lon);
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        function fetchViaMapru(path, options = {}) {
            const proxyUrl = `https://mapruapp.ru/api/sync${path}`;
            const newOptions = { ...options };
            const headers = new Headers(newOptions.headers || {});
            headers.set('x-sync-host', 'https://nspd.gov.ru');
            newOptions.headers = headers;
            return fetch(proxyUrl, newOptions);
        }

        async function fetchNspd(path, options = {}) {
            if (useMapruProxy) {
                return fetchViaMapru(path, options);
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                const reqOptions = { ...options, signal: controller.signal };
                const res = await fetch(`https://nspd.gov.ru${path}`, reqOptions);
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error(`Direct failed: ${res.status}`);
                return res;
            } catch (err) {
                const proxyRes = await fetchViaMapru(path, options);
                if (proxyRes && proxyRes.ok) {
                    useMapruProxy = true;
                    sessionStorage.setItem('useMapruProxy', 'true');
                }
                return proxyRes;
            }
        }

        // Умное автоформатирование: не ломает ввод координат с точкой/запятой/минусом
        function formatPotentialCadastralNumber(value) {
            const trimmed = value.trim();
            if (/[a-zA-Zа-яА-ЯЁё.,\-]/.test(trimmed)) return value;
            if (/^\d{1,2}\s+\d/.test(trimmed)) return value;

            let cleaned = value.replace(/\D/g, '');
            const firstTwo = cleaned.slice(0, 2);
            const isSeven = sevenDigitsRegions.includes(firstTwo);
            const thirdBlockLen = isSeven ? 7 : 6;

            let formatted = '';
            if (cleaned.length > 0) formatted += cleaned.slice(0, 2);
            if (cleaned.length > 2) formatted += ':' + cleaned.slice(2, 4);
            if (cleaned.length > 4) {
                const rem = cleaned.slice(4);
                if (rem.length <= thirdBlockLen) {
                    formatted += ':' + rem;
                } else {
                    formatted += ':' + rem.slice(0, thirdBlockLen) + ':' + rem.slice(thirdBlockLen);
                }
            }
            return formatted;
        }

        function isValidCadastralNumber(text) {
            return /^\d{2}:\d{2}:\d{6,7}:\d+$/.test(text.trim());
        }

        function isCadastralQuarter(text) {
            return /^\d{2}:\d{2}:\d{6,7}$/.test(text.trim());
        }

        function parseCoordinates(text) {
            if (!text || typeof text !== 'string') return null;
            const normalized = text.trim().replace(/,/g, '.').replace(/\s+/g, ' ');
            const parts = normalized.split(' ');
            if (parts.length !== 2) return null;
            const lat = parseFloat(parts[0]);
            const lon = parseFloat(parts[1]);
            if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
                return [lat, lon];
            }
            return null;
        }

        function clearMap() {
            if (!map) return;
            currentMapObjects.forEach(obj => map.geoObjects.remove(obj));
            currentMapObjects = [];
            currentPolygons = [];
            currentTargetCoords = null;
            hideObjectCard();
        }

        function hideObjectCard() {
            const card = document.getElementById('objectCard');
            const details = document.getElementById('cardDetails');
            if (card) card.classList.remove('active');
            if (details) details.classList.remove('open');

        function showObjectCard(title, subtitle, trueLat, trueLon, metadataList = []) {

        function openYandexNavigator(destLat, destLon) {
            showLoader("Подготовка маршрута...");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        hideLoader();
                        launchNavigatorUrl(pos.coords.latitude, pos.coords.longitude, destLat, destLon);
                    },
                    () => {
                        hideLoader();
                        launchNavigatorUrl(null, null, destLat, destLon);
                    },
                    { enableHighAccuracy: true, timeout: 4000, maximumAge: 10000 }
                );
            } else {
                hideLoader();
                launchNavigatorUrl(null, null, destLat, destLon);
            }
        }

        function launchNavigatorUrl(startLat, startLon, destLat, destLon) {
            let webUrl = `https://yandex.ru/maps/?rtext=~${destLat},${destLon}&rtt=auto`;
            if (startLat && startLon) {
                webUrl = `https://yandex.ru/maps/?rtext=${startLat},${startLon}~${destLat},${destLon}&rtt=auto`;
            }

            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            if (isMobile) {
                const appUrl = `yandexnavi://build_route_on_map?lat_to=${destLat}&lon_to=${destLon}`;
                const fallbackTimer = setTimeout(() => {
                    window.location.href = webUrl;
                }, 1500);

                window.addEventListener('blur', () => clearTimeout(fallbackTimer), { once: true });
                window.location.href = appUrl;
            } else {
                window.open(webUrl, '_blank');
            }
        }

        async function searchNspdCadastral(query, thematicSearchId = 1) {
            const path = `/api/geoportal/v2/search/geoportal?thematicSearchId=${thematicSearchId}&query=${encodeURIComponent(query)}`;
            const response = await fetchNspd(path);
            if (!response.ok) throw new Error(response.status);
            const data = await response.json();
            if (data?.data?.features?.length > 0) {
                return data.data.features[0];
            }
            return null;
        }

        function extractMetadata(opts) {
            const meta = [];
            if (!opts) return meta;

            const area = opts.specified_area || opts.build_record_area || opts.area || opts.land_record_area;
            if (area) meta.push({ label: 'Площадь', value: `${Number(area).toLocaleString('ru-RU')} м²` });

            if (opts.land_record_category_type) {
                meta.push({ label: 'Категория', value: opts.land_record_category_type });
            }
            if (opts.permitted_use_established_by_document) {
                meta.push({ label: 'ВРИ', value: opts.permitted_use_established_by_document });
            }
            if (opts.purpose) {
                meta.push({ label: 'Назначение', value: opts.purpose });
            }
            if (opts.cost_value) {
                meta.push({ label: 'Кад. стоимость', value: `${Number(opts.cost_value).toLocaleString('ru-RU')} ₽` });
            }
            if (opts.status || opts.PreviouslyPosted) {
                meta.push({ label: 'Статус', value: opts.status || opts.PreviouslyPosted });
            }
            return meta;
        }

        function getPolygonColors() {
            const isDark = mapTypes[currentMapTypeIdx].isDark;
            return isDark
                ? { stroke: '#facc15', fill: '#facc1533' } // Ярко-желтый для спутника
                : { stroke: '#10b981', fill: '#10b98126' }; // Изумрудный для схемы
        }

        function updatePolygonsStyle() {
            const colors = getPolygonColors();
            currentPolygons.forEach(poly => {
                poly.options.set({
                    strokeColor: colors.stroke,
                    fillColor: colors.fill
                });
            });
        }

        function drawCadastralFeature(feature) {
            if (!feature?.geometry?.coordinates) return null;

            const geomType = feature.geometry.type;
            const props = feature.properties || {};
            const opts = props.options || {};
            const cn = props.descr || opts.cad_num || opts.cad_number || 'Объект';
            const address = opts.readable_address || 'Адрес не указан';
            const meta = extractMetadata(opts);

            let rawPolygons = [];
            if (geomType === "Polygon") {
                rawPolygons = [feature.geometry.coordinates];
            } else if (geomType === "MultiPolygon") {
                rawPolygons = feature.geometry.coordinates;
            }

            const colors = getPolygonColors();
            let allBounds = null;

            rawPolygons.forEach(polygonRings => {
                const convertedRings = polygonRings.map(ring => {
                    return ring.map(coord => {
                        const p = proj4('EPSG:3857', 'EPSG:4326', coord);
                        return getMapCoordsFromWgs(p[1], p[0]);
                    });
                });

                const polyObj = new ymaps.Polygon(convertedRings, {
                    hintContent: `${cn} (перетащите маркер для выбора точки подъезда)`
                }, {
                    strokeColor: colors.stroke,
                    strokeWidth: 3,
                    strokeOpacity: 0.95,
                    fillColor: colors.fill
                });

                map.geoObjects.add(polyObj);
                currentMapObjects.push(polyObj);
                currentPolygons.push(polyObj);

                const b = polyObj.geometry.getBounds();
                if (b) {
                    if (!allBounds) {
                        allBounds = [[...b[0]], [...b[1]]];
                    } else {
                        allBounds[0][0] = Math.min(allBounds[0][0], b[0][0]);
                        allBounds[0][1] = Math.min(allBounds[0][1], b[0][1]);
                        allBounds[1][0] = Math.max(allBounds[1][0], b[1][0]);
                        allBounds[1][1] = Math.max(allBounds[1][1], b[1][1]);
                    }
                }
            });

            if (allBounds) {
                map.setBounds(allBounds, { checkZoomRange: true, duration: 400, zoomMargin: 60 });

                const centerMapLat = (allBounds[0][0] + allBounds[1][0]) / 2;
                const centerMapLon = (allBounds[0][1] + allBounds[1][1]) / 2;
                const [trueLat, trueLon] = getTrueWgs84(centerMapLat, centerMapLon);

                createMarkerWithNavi(centerMapLat, centerMapLon, cn, trueLat, trueLon);
                showObjectCard(cn, address, trueLat, trueLon, meta);
                saveToHistory(cn, address);
            }
        }

        function createMarkerWithNavi(mapLat, mapLon, labelText, trueLat, trueLon) {
            const layout = ymaps.templateLayoutFactory.createClass(`
                <div class="custom-placemark-container" title="Можно перетащить на нужный съезд">
                    <div class="placemark-chip">
                        <span>$[properties.labelText]</span>
                        <button class="placemark-chip-btn" onclick="openYandexNavigator($[properties.trueLat], $[properties.trueLon]); event.stopPropagation();">
                            <i class="fas fa-location-arrow"></i>
                        </button>
                    </div>
                    <div class="pin-dot"></div>
                </div>
            `);

            const placemark = new ymaps.Placemark([mapLat, mapLon], {
                labelText: labelText,
                trueLat: trueLat,
                trueLon: trueLon
            }, {
                iconLayout: layout,
                iconShape: {
                    type: 'Rectangle',
                    coordinates: [[-70, -48], [70, 5]]
                },
                draggable: true,
                zIndex: 1000
            });

            // При перетаскивании маркера обновляем точку назначения для навигатора
            placemark.events.add('dragend', () => {
                const newMapCoords = placemark.geometry.getCoordinates();
                const [newTrueLat, newTrueLon] = getTrueWgs84(newMapCoords[0], newMapCoords[1]);
                placemark.properties.set('trueLat', newTrueLat);
                placemark.properties.set('trueLon', newTrueLon);
                if (currentTargetCoords) {
                    currentTargetCoords.lat = newTrueLat;
                    currentTargetCoords.lon = newTrueLon;
                    updateDistanceBadge();
                    showNotification(`Точка маршрута смещена: ${newTrueLat.toFixed(5)}, ${newTrueLon.toFixed(5)}`, 'info');
                }
            });

            map.geoObjects.add(placemark);
            currentMapObjects.push(placemark);
        }

        async function handleSearch(query) {
            const raw = query.trim();
            if (!raw) return;

            document.getElementById('historyDropdown').classList.remove('open');
            if (!multiMode) clearMap();
            showLoader("Поиск объекта...");

            try {
                // 1. Поиск по координатам
                const coords = parseCoordinates(raw);
                if (coords) {
                    const [trueLat, trueLon] = coords;
                    const [mapLat, mapLon] = getMapCoordsFromWgs(trueLat, trueLon);

                    map.setCenter([mapLat, mapLon], 17, { duration: 300 });

                    let addressText = `${trueLat.toFixed(6)}, ${trueLon.toFixed(6)}`;
                    try {
                        const geoRes = await ymaps.geocode([mapLat, mapLon]);
                        const firstObj = geoRes.geoObjects.get(0);
                        if (firstObj) addressText = firstObj.getAddressLine();
                    } catch (e) {}

                    createMarkerWithNavi(mapLat, mapLon, "Точка", trueLat, trueLon);
                    showObjectCard(`${trueLat.toFixed(5)}, ${trueLon.toFixed(5)}`, addressText, trueLat, trueLon);
                    saveToHistory(`${trueLat.toFixed(6)} ${trueLon.toFixed(6)}`, addressText);
                    hideLoader();
                    showNotification("Координаты найдены", "success");
                    return;
                }

                // 2. Поиск по кадастровому номеру (параллельно проверяем ЗУ и ОКС)
                if (isValidCadastralNumber(raw)) {
                    let feature = await searchNspdCadastral(raw, 1);
                    if (!feature) feature = await searchNspdCadastral(raw, 2);
                    if (!feature) feature = await searchNspdCadastral(raw, 5);

                    if (feature) {
                        drawCadastralFeature(feature);
                        hideLoader();
                        showNotification("Объект найден", "success");
                        return;
                    }
                    throw new Error("Кадастровый номер не найден в базе НСПД");
                }

                // 3. Поиск кадастрового квартала
                if (isCadastralQuarter(raw)) {
                    const quarterFeature = await searchNspdCadastral(raw, 2);
                    if (quarterFeature) {
                        drawCadastralFeature(quarterFeature);
                        hideLoader();
                        showNotification("Кадастровый квартал найден", "success");
                        return;
                    }
                    throw new Error("Квартал не найден");
                }

                // 4. Поиск по обычному адресу через геокодер Яндекса
                const res = await ymaps.geocode(raw, { results: 1 });
                const firstGeoObject = res.geoObjects.get(0);
                if (firstGeoObject) {
                    const mapCoords = firstGeoObject.geometry.getCoordinates();
                    const [trueLat, trueLon] = getTrueWgs84(mapCoords[0], mapCoords[1]);

                    map.setCenter(mapCoords, 17, { duration: 300 });

                    const fullAddress = firstGeoObject.getAddressLine();
                    createMarkerWithNavi(mapCoords[0], mapCoords[1], "Адрес", trueLat, trueLon);
                    showObjectCard("Адрес", fullAddress, trueLat, trueLon);
                    saveToHistory(raw, fullAddress);
                    hideLoader();
                    showNotification("Адрес найден", "success");
                    return;
                }

                throw new Error("Объект или адрес не найден");

            } catch (err) {
                hideLoader();
                showNotification(err.message || "Ошибка поиска", "error");
            }
        }

            const btn = document.getElementById('clear-input-btn');
            btn.style.display = input.value.length > 0 ? 'flex' : 'none';
        }

            map = new ymaps.Map('map', {
                center: [55.751244, 37.618423],
                zoom: 10,

                controls: []
            }, {

            });

                showNotification("Карта очищена", "info");

            // Переключение слоев Схема / Гибрид / Спутник
            document.getElementById('layerSwitchBtn').addEventListener('click', () => {

                const nextType = mapTypes[currentMapTypeIdx];

            // Геолокация пользователя
            document.getElementById('gpsTrackBtn').addEventListener('click', () => {
                if (!navigator.geolocation) {
                    showNotification("Геолокация не поддерживается", "error");
                    return;
                }
                showLoader("Определение геопозиции...");
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        hideLoader();
                        userCoords = [pos.coords.latitude, pos.coords.longitude];
                        const [mapLat, mapLon] = getMapCoordsFromWgs(userCoords[0], userCoords[1]);

                        if (userPlacemark) map.geoObjects.remove(userPlacemark);
                        userPlacemark = new ymaps.Placemark([mapLat, mapLon], {
                            hintContent: "Вы здесь"
                        }, {
                            preset: 'islands#blueCircleDotIcon'
                        });
                        map.geoObjects.add(userPlacemark);
                        map.setCenter([mapLat, mapLon], 16, { duration: 300 });
                        document.getElementById('gpsTrackBtn').classList.add('active');
                        updateDistanceBadge();
                    },
                    () => {
                        hideLoader();
                        showNotification("Нет доступа к GPS", "error");
                    },
                    { enableHighAccuracy: true, timeout: 6000 }
                );
            });

            // Мульти-режим
            const multiBtn = document.getElementById('multiModeBtn');
            multiBtn.addEventListener('click', () => {
                multiMode = !multiMode;
                multiBtn.classList.toggle('active', multiMode);
                showNotification(
                    multiMode ? "Мульти-режим включен (объекты сохраняются)" : "Мульти-режим выключен",
                    "info"
                );
            });

            // Настройки сдвига координат
            const offsetModal = document.getElementById('offsetModal');
            const rangeX = document.getElementById('rangeOffsetX');
            const rangeY = document.getElementById('rangeOffsetY');
            const valX = document.getElementById('valOffsetX');
            const valY = document.getElementById('valOffsetY');

            rangeX.value = mapOffsetX;
            rangeY.value = mapOffsetY;
            valX.textContent = `${mapOffsetX} м`;
            valY.textContent = `${mapOffsetY} м`;

            document.getElementById('offsetSettingsBtn').addEventListener('click', () => {
                offsetModal.classList.add('open');
            });

            document.getElementById('closeModalBtn').addEventListener('click', () => {
                offsetModal.classList.remove('open');
            });

            rangeX.addEventListener('input', () => {
                mapOffsetX = parseFloat(rangeX.value);
                valX.textContent = `${mapOffsetX} м`;
                localStorage.setItem('nav_offsetX', mapOffsetX);
            });

            rangeY.addEventListener('input', () => {
                mapOffsetY = parseFloat(rangeY.value);
                valY.textContent = `${mapOffsetY} м`;
                localStorage.setItem('nav_offsetY', mapOffsetY);
            });

            document.getElementById('resetOffsetBtn').addEventListener('click', () => {
                mapOffsetX = -4.5;
                mapOffsetY = -1.0;
                rangeX.value = mapOffsetX;
                rangeY.value = mapOffsetY;
                valX.textContent = `${mapOffsetX} м`;
                valY.textContent = `${mapOffsetY} м`;
                localStorage.setItem('nav_offsetX', mapOffsetX);
                localStorage.setItem('nav_offsetY', mapOffsetY);
                showNotification("Сдвиг сброшен по умолчанию", "info");
            });

            // Клик по карте: скрывает историю или ставит точку по свободному месту
            map.events.add('click', async (e) => {
                document.getElementById('historyDropdown').classList.remove('open');
                const target = e.get('target');
                if (target === map) {
                    const clickedMapCoords = e.get('coords');
                    const [trueLat, trueLon] = getTrueWgs84(clickedMapCoords[0], clickedMapCoords[1]);

                    if (!multiMode) clearMap();

                    let addr = `${trueLat.toFixed(6)}, ${trueLon.toFixed(6)}`;
                    try {
                        const geoRes = await ymaps.geocode(clickedMapCoords);
                        const firstObj = geoRes.geoObjects.get(0);
                        if (firstObj) addr = firstObj.getAddressLine();
                    } catch (err) {}

                    createMarkerWithNavi(clickedMapCoords[0], clickedMapCoords[1], "Точка", trueLat, trueLon);
                    showObjectCard(`${trueLat.toFixed(5)}, ${trueLon.toFixed(5)}`, addr, trueLat, trueLon);
                }
            });
        });
    </script>
</body>
</html>
