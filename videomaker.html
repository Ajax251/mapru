<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipForge Studio Pro — Видеоредактор</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --panel-border: #e2e8f0;
      --panel-hover: #f1f5f9;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.1);
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 10px;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 13px;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }

    button, input, select { font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; background: none; }

    .app {
      display: grid;
      grid-template-rows: 56px 1fr;
      height: 100vh;
    }

    /* Header */
    .topbar {
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: var(--shadow);
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: #fff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .select, .btn-ghost, .btn-primary {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      transition: all 0.2s ease;
      color: var(--ink);
    }
    .select { background: var(--bg); outline: none; }
    .btn-ghost:hover { background: var(--panel-hover); border-color: var(--line); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled, .btn-ghost:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Workspace layout */
    .workspace {
      display: grid;
      grid-template-columns: 320px 1fr 300px;
      min-height: 0;
    }

    /* Sidebar */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .tabs {
      display: flex;
      background: var(--bg);
      border-bottom: 1px solid var(--panel-border);
      padding: 6px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      border-radius: 6px;
      text-align: center;
      transition: all 0.2s;
    }
    .tab.active { background: var(--panel); color: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .tab:hover:not(.active) { color: var(--ink); }
    .pane { padding: 16px; overflow-y: auto; flex: 1; }

    /* Dropzone & Assets */
    .dropzone {
      border: 2px dashed var(--line);
      border-radius: 12px;
      padding: 24px 12px;
      text-align: center;
      color: var(--muted);
      background: var(--bg);
      cursor: pointer;
      transition: all 0.2s;
    }
    .dropzone:hover, .dropzone.drag {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .media-buttons { display: flex; gap: 8px; margin: 12px 0; }
    .media-buttons button { flex: 1; }
    .asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .asset-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .asset-card img { width: 100%; height: 75px; object-fit: cover; display: block; }
    .asset-card .name { padding: 6px 8px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
    .asset-card .btn-remove {
      position: absolute; top: 4px; right: 4px;
      background: rgba(15, 23, 42, 0.7); color: #fff;
      border-radius: 50%; width: 20px; height: 20px;
      display: grid; place-items: center; font-size: 11px;
      opacity: 0; transition: opacity 0.2s;
    }
    .asset-card:hover .btn-remove { opacity: 1; }

    /* Transitions & Filters Chips */
    .chip-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .chip {
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }
    .chip:hover { border-color: var(--accent); background: var(--panel-hover); }
    .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .hint { font-size: 11px; color: var(--muted); background: var(--bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; line-height: 1.4; }

    /* Main Area */
    .main {
      display: grid;
      grid-template-rows: minmax(0, 1fr) 300px;
      background: #f1f5f9;
      min-width: 0;
    }
    .preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    .canvas-wrap {
      height: min(56vh, 480px);
      aspect-ratio: 16/9;
      background: #0f172a;
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--panel-border);
      position: relative;
    }
    .canvas-wrap canvas { width: 100%; height: 100%; display: block; }
    .player-controls {
      width: min(760px, 100%);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      background: var(--panel);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
    }
    .player-controls .ctrl-btn { padding: 6px; border-radius: 8px; color: var(--muted); }
    .player-controls .ctrl-btn:hover { background: var(--panel-hover); color: var(--ink); }
    .time-display { font-family: monospace; font-size: 12px; color: var(--muted); min-width: 45px; }
    .range-input {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 5px;
    }

    /* Timeline */
    .timeline {
      background: var(--panel);
      border-top: 1px solid var(--panel-border);
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }
    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .timeline-title { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--ink); }
    .timeline-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .timeline-actions .btn-ghost { padding: 6px 10px; font-size: 12px; }

    .track-scroll { overflow-x: auto; overflow-y: hidden; position: relative; }
    .track-container {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px;
      min-height: 96px;
      position: relative;
      width: max-content;
      min-width: 100%;
    }
    .clip-node {
      height: 66px;
      min-width: 100px;
      background: #e2e8f0;
      border-radius: 8px;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
      cursor: grab;
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
    }
    .clip-node.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .clip-node.playing {
      border-color: var(--success);
      box-shadow: 0 0 0 3px rgba(5,150,105,0.25), 0 8px 20px rgba(5,150,105,0.35);
      transform: translateY(-3px) scale(1.03);
      z-index: 3;
    }
    .clip-node.dragging { opacity: 0.4; }
    .clip-node.drag-over { border-color: var(--warning); box-shadow: 0 0 0 3px rgba(217,119,6,0.25); }
    .clip-node img { width: 100%; height: 100%; object-fit: cover; }
    .clip-node .badge {
      position: absolute; bottom: 4px; left: 4px; right: 4px;
      background: rgba(15, 23, 42, 0.75); color: #fff;
      font-size: 9px; padding: 2px 4px; border-radius: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .clip-node .dur {
      position: absolute; top: 4px; right: 4px;
      background: var(--accent); color: #fff;
      font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 4px;
    }
    .clip-node .kb-tag {
      position: absolute; top: 4px; left: 4px;
      background: rgba(5,150,105,0.85); color: #fff;
      font-size: 8px; font-weight: 700; padding: 1px 4px; border-radius: 4px;
    }
    /* per-clip live progress bar */
    .clip-node .clip-prog {
      position: absolute; bottom: 0; left: 0; height: 3px;
      background: var(--success); width: 0%;
    }

    /* Transition Node on Timeline */
    .trans-node {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--panel);
      border: 2px solid var(--line);
      margin: 0 6px;
      display: grid;
      place-items: center;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
      position: relative;
      z-index: 2;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .trans-node:hover, .trans-node.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: scale(1.15);
      box-shadow: 0 0 12px var(--accent-soft);
    }
    .trans-node.active-trans {
      background: var(--success); border-color: var(--success); color: #fff;
      transform: scale(1.25);
      box-shadow: 0 0 14px rgba(5,150,105,0.5);
    }
    .trans-node .label {
      position: absolute; top: -18px; font-size: 9px;
      font-weight: 700; color: var(--accent);
      white-space: nowrap; text-transform: uppercase;
    }

    /* Playhead line */
    .playhead {
      position: absolute;
      top: 6px; bottom: 6px;
      width: 2px;
      background: var(--danger);
      z-index: 5;
      pointer-events: none;
      display: none;
    }
    .playhead::before {
      content: '';
      position: absolute; top: -6px; left: -5px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--danger);
    }

    /* Audio track bar */
    .audio-track-bar {
      height: 40px;
      background: rgba(5, 150, 105, 0.08);
      border: 1px solid rgba(5, 150, 105, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      color: var(--success);
      font-size: 11px;
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }
    .audio-track-bar .audio-prog {
      position: absolute; top: 0; left: 0; bottom: 0;
      background: rgba(5,150,105,0.12); width: 0%;
      pointer-events: none;
    }
    .audio-track-bar .rm-audio { margin-left: auto; color: var(--danger); font-weight: 700; z-index: 1; }

    /* Right Inspector */
    .inspector {
      background: var(--panel);
      border-left: 1px solid var(--panel-border);
      padding: 16px;
      overflow-y: auto;
    }
    .section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .field { margin-bottom: 14px; }
    .field label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input[type=text], .field input[type=number], .field select {
      width: 100%; background: var(--bg); border: 1px solid var(--panel-border);
      padding: 8px; border-radius: 8px; color: var(--ink); outline: none;
    }
    .field input[type=range] { width: 100%; accent-color: var(--accent); }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 12px; color: var(--muted); }
    .inspector-actions { display: flex; gap: 8px; margin-top: 8px; }
    .inspector-actions button { flex: 1; font-size: 12px; padding: 8px; }
    .btn-danger { border: 1px solid rgba(220,38,38,0.3); color: var(--danger); border-radius: 8px; background: rgba(220,38,38,0.05); font-weight: 600; }
    .btn-danger:hover { background: rgba(220,38,38,0.12); }

    /* Modals */
    .modal {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4);
      display: none; place-items: center; z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal.show { display: grid; }
    .modal-box {
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 16px; padding: 24px; width: min(420px, 90vw);
      box-shadow: var(--shadow);
    }
    .progress-bar {
      height: 8px; background: var(--bg); border-radius: 10px;
      overflow: hidden; margin: 16px 0 8px; border: 1px solid var(--panel-border);
    }
    .progress-bar i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width 0.1s; }

    .empty-state { text-align: center; color: var(--muted); padding: 20px; font-size: 12px; }
    .svg-icon { display: inline-block; vertical-align: middle; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 30px;
      font-size: 13px; font-weight: 600; z-index: 200; opacity: 0;
      transition: all 0.3s; pointer-events: none; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="app">
    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <div class="logo-icon"><span id="ic-clapperboard"></span></div>
        <span>ClipForge Pro</span>
      </div>
      <div class="top-actions">
        <select id="aspectRatio" class="select">
          <option value="16:9">16:9 YouTube</option>
          <option value="9:16">9:16 Shorts / Reels</option>
          <option value="1:1">1:1 Square</option>
          <option value="4:3">4:3 Classic</option>
        </select>
        <select id="quality" class="select">
          <option value="720">720p HD</option>
          <option value="1080" selected>1080p Full HD</option>
        </select>
        <button id="snapshotBtn" class="btn-ghost" title="Сохранить текущий кадр как PNG">
          <span id="ic-camera"></span> Кадр
        </button>
        <button id="exportBtn" class="btn-primary">
          <span id="ic-download"></span> Экспорт WebM
        </button>
      </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="tabs">
          <button class="tab active" data-tab="media">Медиа</button>
          <button class="tab" data-tab="transitions">Переходы</button>
          <button class="tab" data-tab="effects">Фильтры</button>
          <button class="tab" data-tab="text">Текст</button>
          <button class="tab" data-tab="audio">Аудио</button>
        </div>
        <div id="sidePane" class="pane"></div>
      </aside>

      <!-- Main Canvas & Timeline -->
      <main class="main">
        <section class="preview-area">
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="canvas"></canvas>
          </div>
          <div class="player-controls">
            <button id="prevBtn" class="ctrl-btn" title="Предыдущий кадр"><span id="ic-prev"></span></button>
            <button id="playBtn" title="Воспроизвести (Пробел)"><span id="ic-play"></span></button>
            <button id="nextBtn" class="ctrl-btn" title="Следующий кадр"><span id="ic-next"></span></button>
            <span id="currentTime" class="time-display">00:00</span>
            <input id="seekbar" class="range-input" type="range" min="0" max="1" step="0.01" value="0">
            <span id="totalTime" class="time-display">00:00</span>
          </div>
        </section>

        <!-- Timeline -->
        <section class="timeline">
          <div class="timeline-header">
            <div class="timeline-title">
              <span id="ic-layers" style="color: var(--accent)"></span>
              Монтажный стол
            </div>
            <div class="timeline-actions">
              <button id="magicBtn" class="btn-ghost" style="color: var(--accent); border-color: var(--accent-soft)">
                <span id="ic-sparkles"></span> Авто-переходы
              </button>
              <button id="shuffleBtn" class="btn-ghost">Перемешать</button>
              <button id="reverseBtn" class="btn-ghost">Обратный порядок</button>
              <button id="setTotalDurBtn" class="btn-ghost">
                <span id="ic-clock"></span> Общее время
              </button>
              <button id="fitAudioBtn" class="btn-ghost">
                <span id="ic-music"></span> Под аудио
              </button>
              <button id="clearBtn" class="btn-ghost" style="color: var(--danger)">Очистить</button>
            </div>
          </div>

          <!-- Track Container -->
          <div class="track-scroll" id="trackScroll">
            <div id="trackContainer" class="track-container">
              <div class="empty-state">Загрузите фотографии в левую панель, чтобы собрать ролик</div>
              <div class="playhead" id="playhead"></div>
            </div>
          </div>

          <!-- Audio track -->
          <div class="audio-track-bar" id="audioBar">
            <div class="audio-prog" id="audioProg"></div>
            <span id="ic-music2"></span>
            <span id="audioTrackName">Аудиодорожка не добавлена</span>
          </div>
        </section>
      </main>

      <!-- Right Inspector -->
      <aside class="inspector">
        <div class="section-title">Инспектор</div>
        <div id="inspectorContent">
          <div class="empty-state">Выберите кадр или переход на таймлайне для настройки.</div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Export Modal -->
  <div id="exportModal" class="modal">
    <div class="modal-box">
      <div class="section-title">Рендеринг видео</div>
      <div id="exportStatus" style="font-size: 13px; color: var(--muted)">Подготовка кадра...</div>
      <div class="progress-bar"><i id="progressBar"></i></div>
      <div id="exportPercent" style="text-align: right; font-weight: bold; font-size: 12px">0%</div>
      <a id="downloadLink" class="btn-primary" style="display: none; width: 100%; margin-top: 16px; justify-content: center;" download="clipforge-video.webm">
        <span id="ic-filevideo"></span> Скачать готовый клип
      </a>
      <button id="closeExport" class="btn-ghost" style="display:none; width:100%; margin-top:8px; justify-content:center;">Закрыть</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <input id="imgInput" type="file" accept="image/*" multiple hidden>
  <input id="audioInput" type="file" accept="audio/*" hidden>

  <script>
    // ===================== Icons =====================
    const SVGs = {
      clapperboard: `<svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.2 6 3 11l-.4-1.8a2 2 0 0 1 1.2-2.3l13.5-4a2 2 0 0 1 2.5 1.1Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>`,
      download: `<svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>`,
      uploadCloud: `<svg class="svg-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>`,

    const $ = s => document.querySelector(s);

    // ===================== State =====================
    const state = {

    const fmt = s => {
      s = Math.max(0, s || 0);
      return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
    };
    const getTotalDuration = () => state.items.reduce((acc, x) => acc + x.duration, 0);

    const getCSSFilter = filter => ({
      normal: 'none',
      grayscale: 'grayscale(1)',
      sepia: 'sepia(1)',
      vintage: 'sepia(0.35) contrast(1.2) saturate(1.2)',
      noir: 'grayscale(1) contrast(1.5) brightness(0.9)',
      cyberpunk: 'hue-rotate(180deg) contrast(1.3) saturate(1.4)',
      warm: 'sepia(0.2) saturate(1.3) brightness(1.05)',
      cool: 'hue-rotate(30deg) saturate(0.9) brightness(1.02)',

    let toastTimer = null;
    function toast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2200);

    // ===================== Canvas resize =====================
    function resizeCanvas() {
      let q = +$('#quality').value, r = $('#aspectRatio').value;
      let w = q, h = q * 9 / 16;
      if (r === '9:16') { w = q * 9 / 16; h = q; }
      if (r === '1:1') { w = q; h = q; }
      if (r === '4:3') { w = q; h = q * 3 / 4; }
      canvas.width = Math.round(w);
      canvas.height = Math.round(h);
      $('#canvasWrap').style.aspectRatio = r.replace(':', '/');
      drawFrame(state.currentTime);
    }

    // ===================== Sidebar =====================
    function renderSidebar() {
      const pane = $('#sidePane');
      if (state.tab === 'media') {
        pane.innerHTML = `
          <div class="dropzone" id="dropzone">
            <div style="margin-bottom: 6px; color: var(--accent)">${SVGs.uploadCloud}</div>
            <div><strong>Перетащите файлы сюда</strong></div>
            <div style="font-size: 11px">JPG, PNG, WEBP или MP3</div>
          </div>
          <div class="media-buttons">

            <button class="btn-ghost" id="addAudioBtn">${SVGs.music} Музыка</button>
          </div>
          <div class="hint">Совет: перетаскивайте кадры на таймлайне мышью, чтобы менять их порядок. Клик по кадру — перемотка видео на его начало.</div>
          <div class="asset-grid" id="assetGrid"></div>

        renderAssets();
      } else if (state.tab === 'transitions') {
        pane.innerHTML = `
          <div class="hint">Выберите переход (кружок) на таймлайне, затем нажмите нужный тип. Или примените ко всем стыкам сразу.</div>
          <div class="section-title">Переходы</div>
          <div class="chip-grid">
            ${Object.entries(transitionTypes).map(([k, v]) => `
              <div class="chip" data-trans-key="${k}">${SVGs.zap} ${v}</div>

          </div>
          <div class="field" style="margin-top:16px">
            <label>Длительность перехода <b>${state.transDur.toFixed(1)} с</b></label>
            <input id="globalTransDur" type="range" min="0.2" max="2" step="0.1" value="${state.transDur}">
          </div>
          <div class="chip-grid" style="grid-template-columns:1fr">

          c.onclick = () => {
            if (state.selectedType === 'transition' && state.selectedIndex >= 0) {
              state.transitions[state.selectedIndex] = c.dataset.transKey;
              renderTimeline(); renderInspector(); drawFrame(state.currentTime);
              toast('Переход применён');

              toast('Сначала выберите переход на таймлайне');
            }

          };

          state.transDur = +e.target.value;

          drawFrame(state.currentTime);
        };
        $('#applyTransAll').onclick = () => {
          let key = 'crossfade';
          const active = $('[data-trans-key].active');
          if (active) key = active.dataset.transKey;
          else if (state.selectedType === 'transition' && state.selectedIndex >= 0) key = state.transitions[state.selectedIndex];
          state.transitions = state.transitions.map(() => key);
          renderTimeline(); drawFrame(state.currentTime);
          toast('Переход применён ко всем стыкам');
        };
      } else if (state.tab === 'effects') {
        pane.innerHTML = `
          <div class="hint">Выберите кадр на таймлайне, затем нажмите фильтр. Кнопкой ниже можно применить фильтр ко всем кадрам.</div>
          <div class="section-title">Фильтры для выбр. кадра</div>
          <div class="chip-grid">
            ${Object.entries(filters).map(([k, v]) => `
              <div class="chip" data-filter-key="${k}">${v}</div>
            `).join('')}
          </div>
          <button id="applyFilterAll" class="btn-primary" style="width:100%; margin-top:16px; justify-content:center;">Применить ко всем кадрам</button>
        `;

        $$('[data-filter-key]').forEach(c => {
          c.onclick = () => {
            if (state.selectedType === 'clip' && state.items[state.selectedIndex]) {
              state.items[state.selectedIndex].filter = c.dataset.filterKey;
              renderTimeline(); drawFrame(state.currentTime); markActiveChips();
              toast('Фильтр применён');

        markActiveChips();
        $('#applyFilterAll').onclick = () => {
          let key = 'normal';
          const active = $('[data-filter-key].active');
          if (active) key = active.dataset.filterKey;
          else if (state.selectedType === 'clip' && state.items[state.selectedIndex]) key = state.items[state.selectedIndex].filter;
          state.items.forEach(x => x.filter = key);
          renderTimeline(); drawFrame(state.currentTime);
          toast('Фильтр применён ко всем');
        };
      } else if (state.tab === 'text') {
        pane.innerHTML = `
          <div class="section-title">Титры</div>
          <div class="field"><label>Заголовок</label>
            <input id="txtTitle" type="text" value="${state.text.title}" placeholder="Введите заголовок"></div>
          <div class="field"><label>Подпись</label>
            <input id="txtSubtitle" type="text" value="${state.text.subtitle}" placeholder="Короткое описание"></div>
          <div class="field"><label>Размер текста <b>${state.text.size}px</b></label>
            <input id="txtSize" type="range" min="16" max="120" value="${state.text.size}"></div>
          <div class="field"><label>Позиция по вертикали <b>${Math.round(state.text.pos*100)}%</b></label>
            <input id="txtPos" type="range" min="0.1" max="0.95" step="0.01" value="${state.text.pos}"></div>
          <div class="field"><label>Цвет</label>
            <input id="txtColor" type="color" value="${state.text.color}" style="height: 38px; padding:2px;"></div>
          <label class="toggle-row"><input id="txtBg" type="checkbox" ${state.text.bg?'checked':''}> Подложка под текстом</label>
          <label class="toggle-row"><input id="txtAnim" type="checkbox" ${state.text.anim?'checked':''}> Анимация появления</label>
        `;
        $('#txtTitle').oninput = e => { state.text.title = e.target.value; drawFrame(state.currentTime); };
        $('#txtSubtitle').oninput = e => { state.text.subtitle = e.target.value; drawFrame(state.currentTime); };
        $('#txtSize').oninput = e => { state.text.size = +e.target.value; $('#txtSize').previousElementSibling.querySelector('b').textContent = state.text.size+'px'; drawFrame(state.currentTime); };
        $('#txtPos').oninput = e => { state.text.pos = +e.target.value; $('#txtPos').previousElementSibling.querySelector('b').textContent = Math.round(state.text.pos*100)+'%'; drawFrame(state.currentTime); };
        $('#txtColor').oninput = e => { state.text.color = e.target.value; drawFrame(state.currentTime); };
        $('#txtBg').onchange = e => { state.text.bg = e.target.checked; drawFrame(state.currentTime); };
        $('#txtAnim').onchange = e => { state.text.anim = e.target.checked; drawFrame(state.currentTime); };
      } else if (state.tab === 'audio') {
        pane.innerHTML = `
          <div class="section-title">Аудиодорожка</div>
          ${state.audio ? `
            <div class="hint">Файл: <b>${state.audio.name}</b><br>Длительность: ${fmt(state.audio.duration)}</div>
            <div class="field"><label>Громкость <b>${Math.round(state.audioSettings.volume*100)}%</b></label>
              <input id="audVol" type="range" min="0" max="1" step="0.05" value="${state.audioSettings.volume}"></div>
            <div class="field"><label>Появление (fade in) <b>${state.audioSettings.fadeIn.toFixed(1)}с</b></label>
              <input id="audFadeIn" type="range" min="0" max="5" step="0.1" value="${state.audioSettings.fadeIn}"></div>
            <div class="field"><label>Затухание (fade out) <b>${state.audioSettings.fadeOut.toFixed(1)}с</b></label>
              <input id="audFadeOut" type="range" min="0" max="5" step="0.1" value="${state.audioSettings.fadeOut}"></div>
            <button id="rmAudioBtn" class="btn-danger" style="width:100%;padding:10px;">Удалить аудио</button>
          ` : `
            <div class="empty-state">Аудио не добавлено.</div>
            <button class="btn-ghost" id="addAudioBtn2" style="width:100%;justify-content:center;">${SVGs.music} Добавить музыку</button>
          `}
        `;
        if (state.audio) {
          $('#audVol').oninput = e => { state.audioSettings.volume = +e.target.value; if (audioEl) audioEl.volume = state.audioSettings.volume; $('#audVol').previousElementSibling.querySelector('b').textContent = Math.round(state.audioSettings.volume*100)+'%'; };
          $('#audFadeIn').oninput = e => { state.audioSettings.fadeIn = +e.target.value; $('#audFadeIn').previousElementSibling.querySelector('b').textContent = state.audioSettings.fadeIn.toFixed(1)+'с'; };
          $('#audFadeOut').oninput = e => { state.audioSettings.fadeOut = +e.target.value; $('#audFadeOut').previousElementSibling.querySelector('b').textContent = state.audioSettings.fadeOut.toFixed(1)+'с'; };
          $('#rmAudioBtn').onclick = removeAudio;
        } else {
          $('#addAudioBtn2').onclick = () => $('#audioInput').click();
        }
      }
    }

    function markActiveChips() {

      $$('[data-trans-key]').forEach(c => c.classList.remove('active'));

      $$('[data-filter-key]').forEach(c => c.classList.remove('active'));
      if (state.selectedType === 'transition' && state.selectedIndex >= 0) {
        const k = state.transitions[state.selectedIndex];
        const el = $(`[data-trans-key="${k}"]`); if (el) el.classList.add('active');
      }
      if (state.selectedType === 'clip' && state.items[state.selectedIndex]) {
        const k = state.items[state.selectedIndex].filter;
        const el = $(`[data-filter-key="${k}"]`); if (el) el.classList.add('active');
      }
    }

    function bindDropzone() {
      const dz = $('#dropzone');
      if (!dz) return;
      ['dragenter', 'dragover'].forEach(e => dz.addEventListener(e, x => { x.preventDefault(); dz.classList.add('drag'); }));
      ['dragleave', 'drop'].forEach(e => dz.addEventListener(e, x => { x.preventDefault(); dz.classList.remove('drag'); }));
      dz.addEventListener('drop', e => handleFiles([...e.dataTransfer.files]));
      $('#addImgBtn').onclick = () => $('#imgInput').click();
      $('#addAudioBtn').onclick = () => $('#audioInput').click();
    }

    function renderAssets() {
      const grid = $('#assetGrid');
      if (!grid) return;
      grid.innerHTML = state.items.map((x, i) => `
        <div class="asset-card" data-jump="${i}">
          <img src="${x.url}">
          <div class="name">${x.name}</div>
          <button class="btn-remove" data-del="${i}">×</button>
        </div>
      `).join('');

      $$('[data-jump]').forEach(el => {
        el.onclick = () => { seekToClip(+el.dataset.jump); };
      });

      $$('[data-del]').forEach(b => {
        b.onclick = (e) => { e.stopPropagation(); deleteClip(+b.dataset.del); };
      });
    }

    // ===================== File handling =====================
    function handleFiles(files) {
      let addedImg = 0;
      files.forEach(f => {
        if (f.type.startsWith('image/')) {
          const url = URL.createObjectURL(f);
          const img = new Image();
          img.onload = () => {
            state.items.push({
              id: Math.random().toString(36).substr(2, 9),
              name: f.name, url, img,
              duration: 3, filter: 'normal',
              kenburns: { type: 'zoom-in' }
            });
            if (state.items.length > 1) state.transitions.push('crossfade');
            renderSidebar(); renderTimeline(); drawFrame(state.currentTime);
          };
          img.src = url;
          addedImg++;
        } else if (f.type.startsWith('audio/')) {
          const url = URL.createObjectURL(f);
          audioEl = new Audio(url);
          audioEl.volume = state.audioSettings.volume;
          audioEl.onloadedmetadata = () => {
            state.audio = { file: f, url, name: f.name, duration: audioEl.duration };
            $('#audioTrackName').textContent = `${f.name} (${fmt(audioEl.duration)})`;
            if (state.tab === 'audio') renderSidebar();
            toast('Аудио добавлено');
          };
        }
      });
      if (addedImg) toast(addedImg + ' фото добавлено');
    }

    function removeAudio() {
      if (audioEl) { audioEl.pause(); audioEl = null; }
      state.audio = null;
      $('#audioTrackName').textContent = 'Аудиодорожка не добавлена';
      $('#audioProg').style.width = '0%';
      if (state.tab === 'audio') renderSidebar();
      toast('Аудио удалено');
    }

    function deleteClip(idx) {
      state.items.splice(idx, 1);
      if (state.transitions.length > 0) state.transitions.splice(Math.max(0, idx - 1), 1);
      if (state.selectedType === 'clip' && state.selectedIndex === idx) { state.selectedType = null; state.selectedIndex = -1; }
      renderSidebar(); renderTimeline(); renderInspector(); drawFrame(state.currentTime);
      toast('Кадр удалён');
    }

    function duplicateClip(idx) {
      const src = state.items[idx];
      const copy = { ...src, id: Math.random().toString(36).substr(2,9), kenburns: {...src.kenburns} };
      state.items.splice(idx + 1, 0, copy);
      state.transitions.splice(idx, 0, 'crossfade');
      renderSidebar(); renderTimeline(); drawFrame(state.currentTime);
      toast('Кадр продублирован');
    }

    function moveClip(from, to) {
      if (from === to || from < 0 || to < 0) return;
      const [it] = state.items.splice(from, 1);
      state.items.splice(to, 0, it);
      // rebuild transitions to match new count
      const need = Math.max(0, state.items.length - 1);
      while (state.transitions.length < need) state.transitions.push('crossfade');
      state.transitions.length = need;
      state.selectedType = 'clip'; state.selectedIndex = to;
      renderSidebar(); renderTimeline(); renderInspector(); drawFrame(state.currentTime);
    }

    // ===================== Timeline =====================
    function renderTimeline() {
      const track = $('#trackContainer');
      const playhead = `<div class="playhead" id="playhead"></div>`;
      if (!state.items.length) {
        track.innerHTML = `<div class="empty-state">Загрузите фотографии в левую панель, чтобы собрать ролик</div>${playhead}`;
        $('#totalTime').textContent = '00:00';
        $('#seekbar').max = 1;
        return;
      }

      let html = '';
      state.items.forEach((item, i) => {
        const isSel = state.selectedType === 'clip' && state.selectedIndex === i;
        const kbShort = { 'zoom-in':'Z+','zoom-out':'Z-','pan-left':'←','pan-right':'→','pan-up':'↑','pan-down':'↓','zoom-pan':'Z↗','none':'' }[item.kenburns.type] || '';
        html += `
          <div class="clip-node ${isSel ? 'selected' : ''}" data-clip-idx="${i}" draggable="true">
            <img src="${item.url}" style="filter: ${getCSSFilter(item.filter)}">
            <span class="dur">${item.duration.toFixed(1)}s</span>
            ${kbShort ? `<span class="kb-tag">${kbShort}</span>` : ''}
            <span class="badge">${item.name}</span>
            <div class="clip-prog"></div>
          </div>
        `;
        if (i < state.items.length - 1) {
          const transKey = state.transitions[i] || 'crossfade';
          const isTransSel = state.selectedType === 'transition' && state.selectedIndex === i;
          html += `
            <div class="trans-node ${isTransSel ? 'selected' : ''}" data-trans-idx="${i}" title="${transitionTypes[transKey]}">
              <span class="label">${transitionTypes[transKey]}</span>
              ${SVGs.zap}
            </div>
          `;
        }
      });
      track.innerHTML = html + playhead;


      $$('[data-clip-idx]').forEach(el => {
        const idx = +el.dataset.clipIdx;
        el.onclick = () => {
          state.selectedType = 'clip'; state.selectedIndex = idx;
          seekToClip(idx, false);
          renderTimeline(); renderInspector(); markActiveChips();
        };
        // drag reorder
        el.ondragstart = (e) => { state.dragFrom = idx; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; };
        el.ondragend = () => { el.classList.remove('dragging'); $$('.clip-node').forEach(n=>n.classList.remove('drag-over')); };
        el.ondragover = (e) => { e.preventDefault(); el.classList.add('drag-over'); };
        el.ondragleave = () => el.classList.remove('drag-over');
        el.ondrop = (e) => { e.preventDefault(); el.classList.remove('drag-over'); moveClip(state.dragFrom, idx); state.dragFrom = -1; };
      });


      $$('[data-trans-idx]').forEach(el => {
        el.onclick = () => {
          const idx = +el.dataset.transIdx;
          state.selectedType = 'transition'; state.selectedIndex = idx;
          // seek to the transition point
          let acc = 0; for (let i=0;i<=idx;i++) acc += state.items[i].duration;
          state.currentTime = Math.max(0, acc - state.transDur/2);
          if (audioEl) audioEl.currentTime = Math.min(state.currentTime, state.audio?.duration || 0);
          renderTimeline(); renderInspector(); drawFrame(state.currentTime); markActiveChips();
        };
      });

      const total = getTotalDuration();
      $('#totalTime').textContent = fmt(total);
      $('#seekbar').max = Math.max(total, 0.1);
      updatePlayhead();
    }

    // seek playhead to start of a clip
    function seekToClip(idx, select = true) {
      let acc = 0;
      for (let i = 0; i < idx; i++) acc += state.items[i].duration;
      state.currentTime = acc + 0.001;
      if (audioEl && state.audio) audioEl.currentTime = Math.min(state.currentTime, state.audio.duration);
      if (select) { state.selectedType = 'clip'; state.selectedIndex = idx; renderTimeline(); renderInspector(); markActiveChips(); }
      drawFrame(state.currentTime);
      // scroll clip into view
      const node = $(`[data-clip-idx="${idx}"]`);
      if (node) node.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    }

    // Live highlight of active clip + moving playhead
    function updateTimelineHighlight() {
      if (!state.items.length) return;
      const total = getTotalDuration();
      const t = Math.min(state.currentTime, total);
      let acc = 0, activeIdx = 0, localT = 0;
      for (let i = 0; i < state.items.length; i++) {
        if (t <= acc + state.items[i].duration || i === state.items.length - 1) { activeIdx = i; localT = t - acc; break; }
        acc += state.items[i].duration;
      }
      const nodes = $$('.clip-node');
      nodes.forEach((n, i) => {
        n.classList.toggle('playing', state.playing && i === activeIdx);
        const prog = n.querySelector('.clip-prog');
        if (prog) {
          if (i < activeIdx) prog.style.width = '100%';
          else if (i === activeIdx) prog.style.width = (Math.min(1, localT / state.items[i].duration) * 100) + '%';
          else prog.style.width = '0%';
        }
      });
      // active transition highlight

      $$('.trans-node').forEach(el => {
        const ti = +el.dataset.transIdx;
        const remain = state.items[ti].duration - (ti === activeIdx ? localT : (ti < activeIdx ? state.items[ti].duration : -1));
        const inTrans = (ti === activeIdx) && (state.items[ti].duration - localT) <= state.transDur && state.items[ti+1];
        el.classList.toggle('active-trans', state.playing && inTrans);
      });
    }

function updatePlayhead() {
      const ph = $('#playhead');
      if (!ph || !state.items.length) return;
      const track = $('#trackContainer');
      const total = getTotalDuration();
      if (total <= 0) { ph.style.display='none'; return; }
      const nodes = $$('.clip-node');
      if (!nodes.length) return;
      const t = Math.min(state.currentTime, total);
      let acc = 0, activeIdx = 0, localT = 0;
      for (let i = 0; i < state.items.length; i++) {
        if (t <= acc + state.items[i].duration || i === state.items.length - 1) { activeIdx = i; localT = t - acc; break; }
        acc += state.items[i].duration;
      }
      const node = nodes[activeIdx];
      if (!node) return;
      const trackRect = track.getBoundingClientRect();
      const nodeRect = node.getBoundingClientRect();
      const frac = Math.min(1, localT / state.items[activeIdx].duration);
      const x = (nodeRect.left - trackRect.left) + nodeRect.width * frac;
      ph.style.display = 'block';
      ph.style.left = x + 'px';

      // Авто-скролл: держим плейхед по центру видимой области монтажного стола
      const scrollContainer = $('#trackScroll');
      if (scrollContainer) {
        scrollContainer.scrollLeft = x - scrollContainer.clientWidth / 2;
      }
    }

    // ===================== Inspector =====================
    function renderInspector() {
      const box = $('#inspectorContent');
      if (state.selectedType === 'clip' && state.items[state.selectedIndex]) {
        const item = state.items[state.selectedIndex];
        box.innerHTML = `
          <div class="field"><label>Кадр: <b>${item.name}</b></label></div>
          <div class="field"><label>Длительность <b>${item.duration.toFixed(1)} с</b></label>
            <input id="clipDur" class="range-input" type="range" min="0.5" max="15" step="0.5" value="${item.duration}"></div>
          <div class="field"><label>Анимация Ken Burns</label>
            <select id="kenburnsSel" class="select" style="width:100%">
              ${Object.entries(kenBurnsTypes).map(([k,v])=>`<option value="${k}" ${item.kenburns.type===k?'selected':''}>${v}</option>`).join('')}
            </select></div>
          <div class="field"><label>Фильтр</label>
            <select id="clipFilter" class="select" style="width:100%">
              ${Object.entries(filters).map(([k,v])=>`<option value="${k}" ${item.filter===k?'selected':''}>${v}</option>`).join('')}
            </select></div>
          <div class="inspector-actions">
            <button id="jumpClip" class="btn-ghost" style="justify-content:center">⤓ К кадру</button>
            <button id="dupClip" class="btn-ghost" style="justify-content:center">Дублировать</button>
          </div>
          <div class="inspector-actions">
            <button id="delClip" class="btn-danger">Удалить кадр</button>
          </div>
        `;
        $('#clipDur').oninput = e => { item.duration = +e.target.value; renderTimeline(); drawFrame(state.currentTime); $('#clipDur').previousElementSibling.querySelector('b').textContent = item.duration.toFixed(1)+' с'; };
        $('#kenburnsSel').onchange = e => { item.kenburns.type = e.target.value; renderTimeline(); drawFrame(state.currentTime); };
        $('#clipFilter').onchange = e => { item.filter = e.target.value; renderTimeline(); drawFrame(state.currentTime); };
        $('#jumpClip').onclick = () => seekToClip(state.selectedIndex);
        $('#dupClip').onclick = () => duplicateClip(state.selectedIndex);
        $('#delClip').onclick = () => deleteClip(state.selectedIndex);
      } else if (state.selectedType === 'transition' && state.selectedIndex >= 0) {
        const transKey = state.transitions[state.selectedIndex];
        box.innerHTML = `
          <div class="field"><label>Переход между кадрами ${state.selectedIndex+1} → ${state.selectedIndex+2}</label>
            <select id="transSel" class="select" style="width:100%">
              ${Object.entries(transitionTypes).map(([k,v]) => `<option value="${k}" ${k===transKey?'selected':''}>${v}</option>`).join('')}
            </select></div>
          <div class="field"><label>Длительность перехода <b>${state.transDur.toFixed(1)} с</b></label>
            <input id="transDurInsp" type="range" min="0.2" max="2" step="0.1" value="${state.transDur}"></div>
          <div class="hint">Длительность применяется ко всем переходам проекта.</div>
        `;
        $('#transSel').onchange = e => { state.transitions[state.selectedIndex] = e.target.value; renderTimeline(); drawFrame(state.currentTime); };
        $('#transDurInsp').oninput = e => { state.transDur = +e.target.value; $('#transDurInsp').previousElementSibling.querySelector('b').textContent = state.transDur.toFixed(1)+' с'; drawFrame(state.currentTime); };
      } else {
        box.innerHTML = `<div class="empty-state">Выберите кадр или переход на таймлайне для настройки.</div>`;
      }
    }

    // ===================== Drawing =====================
    function drawImageTransformed(item, progress, alpha = 1, extra = {}) {
      if (!item || !item.img) return;
      const W = canvas.width, H = canvas.height;
      const im = item.img;
      let scale = Math.max(W / im.width, H / im.height);
      let baseDx = (W - im.width * scale) / 2;
      let baseDy = (H - im.height * scale) / 2;
      let offX = 0, offY = 0;

      const kb = item.kenburns.type;
      if (kb === 'zoom-in') scale *= (1 + 0.12 * progress);
      else if (kb === 'zoom-out') scale *= (1.12 - 0.12 * progress);
      else if (kb === 'pan-left') offX = -W * 0.06 * progress;
      else if (kb === 'pan-right') offX = W * 0.06 * progress;
      else if (kb === 'pan-up') offY = -H * 0.06 * progress;
      else if (kb === 'pan-down') offY = H * 0.06 * progress;
      else if (kb === 'zoom-pan') { scale *= (1 + 0.12 * progress); offX = W * 0.05 * progress; }

      // recompute base offsets after scale change so image stays centered
      baseDx = (W - im.width * scale) / 2;
      baseDy = (H - im.height * scale) / 2;

      // transition-driven extra transforms
      const tx = extra.tx || 0, ty = extra.ty || 0, sc = extra.scale || 1, rot = extra.rot || 0, blur = extra.blur || 0;

      ctx.save();
      ctx.globalAlpha = alpha;
      let filterStr = getCSSFilter(item.filter);
      if (blur > 0) filterStr = (filterStr === 'none' ? '' : filterStr + ' ') + `blur(${blur}px)`;
      ctx.filter = filterStr;
      if (sc !== 1 || rot !== 0) {
        ctx.translate(W/2, H/2);
        ctx.rotate(rot);
        ctx.scale(sc, sc);
        ctx.translate(-W/2, -H/2);
      }
      ctx.drawImage(im, baseDx + offX + tx, baseDy + offY + ty, im.width * scale, im.height * scale);
      ctx.restore();
    }

    function drawFrame(t) {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);
      if (!state.items.length) { updatePlayhead(); return; }

      const total = getTotalDuration();
      t = Math.max(0, Math.min(t, total));

      let cumulative = 0, activeIdx = 0, localTime = 0;
      for (let i = 0; i < state.items.length; i++) {
        if (t <= cumulative + state.items[i].duration || i === state.items.length - 1) {
          activeIdx = i; localTime = t - cumulative; break;
        }
        cumulative += state.items[i].duration;
      }

      const currentItem = state.items[activeIdx];
      const progress = localTime / currentItem.duration;
      const transDur = state.transDur;
      const nextItem = state.items[activeIdx + 1];

      if (nextItem && (currentItem.duration - localTime) <= transDur) {
        const tp = 1 - (currentItem.duration - localTime) / transDur; // 0..1
        const type = state.transitions[activeIdx] || 'crossfade';
        applyTransition(type, currentItem, nextItem, progress, tp, W, H);
      } else {
        drawImageTransformed(currentItem, progress);
      }

      drawTextOverlay(t, cumulative, currentItem, localTime, W, H);

      $('#currentTime').textContent = fmt(t);
      $('#seekbar').value = t;
      updatePlayhead();
    }

    function ease(p){ return p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; }

   function applyTransition(type, cur, nxt, progress, tp, W, H) {
      const e = ease(tp);
      switch(type) {
        case 'none':
          drawImageTransformed(tp < 1 ? cur : nxt, tp < 1 ? progress : 0); break;
        case 'crossfade':
          drawImageTransformed(cur, progress, 1 - e);
          drawImageTransformed(nxt, 0, e); break;
        case 'dipBlack':
          if (tp < 0.5) drawImageTransformed(cur, progress, 1 - tp*2);
          else drawImageTransformed(nxt, 0, (tp-0.5)*2); break;
        case 'dipWhite':
          if (tp < 0.5) { drawImageTransformed(cur, progress, 1 - tp*2); ctx.save(); ctx.globalAlpha = tp*2; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.restore(); }
          else { drawImageTransformed(nxt, 0, (tp-0.5)*2); ctx.save(); ctx.globalAlpha = 1-(tp-0.5)*2; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.restore(); }
          break;
        case 'flash':
          drawImageTransformed(cur, progress, 1 - e);
          drawImageTransformed(nxt, 0, e);
          ctx.save(); ctx.globalAlpha = Math.sin(tp*Math.PI)*0.85; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.restore();
          break;

        // Шторы (4 направления)
        case 'wipeL':
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath(); ctx.rect(0,0,W*e,H); ctx.clip(); drawImageTransformed(nxt,0); ctx.restore(); break;
        case 'wipeR':
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath(); ctx.rect(W*(1-e),0,W*e,H); ctx.clip(); drawImageTransformed(nxt,0); ctx.restore(); break;
        case 'wipeU':
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H*e); ctx.clip(); drawImageTransformed(nxt,0); ctx.restore(); break;
        case 'wipeD':
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath(); ctx.rect(0,H*(1-e),W,H*e); ctx.clip(); drawImageTransformed(nxt,0); ctx.restore(); break;

        // Сдвиг / Push (4 направления)
        case 'pushL':
          drawImageTransformed(cur, progress, 1, { tx: -W*e });
          drawImageTransformed(nxt, 0, 1, { tx: W*(1-e) }); break;
        case 'pushR':
          drawImageTransformed(cur, progress, 1, { tx: W*e });
          drawImageTransformed(nxt, 0, 1, { tx: -W*(1-e) }); break;
        case 'pushU':
          drawImageTransformed(cur, progress, 1, { ty: -H*e });
          drawImageTransformed(nxt, 0, 1, { ty: H*(1-e) }); break;
        case 'pushD':
          drawImageTransformed(cur, progress, 1, { ty: H*e });
          drawImageTransformed(nxt, 0, 1, { ty: -H*(1-e) }); break;

        // Наплыв / Slide (4 направления)
        case 'slideUp':
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath(); ctx.rect(0,H*(1-e),W,H*e); ctx.clip(); drawImageTransformed(nxt,0,1,{ ty: H*(1-e) }); ctx.restore(); break;
        case 'slideDown':
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H*e); ctx.clip(); drawImageTransformed(nxt,0,1,{ ty: -H*(1-e) }); ctx.restore(); break;
        case 'slideL':
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath(); ctx.rect(W*(1-e),0,W*e,H); ctx.clip(); drawImageTransformed(nxt,0,1,{ tx: W*(1-e) }); ctx.restore(); break;
        case 'slideR':
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath(); ctx.rect(0,0,W*e,H); ctx.clip(); drawImageTransformed(nxt,0,1,{ tx: -W*(1-e) }); ctx.restore(); break;

        // Раздвижение и Сведение
        case 'split':
          drawImageTransformed(nxt, 0);
          ctx.save(); ctx.beginPath(); ctx.rect(0,0,W/2*(1-e),H); ctx.clip(); drawImageTransformed(cur,progress); ctx.restore();
          ctx.save(); ctx.beginPath(); ctx.rect(W/2+W/2*e,0,W/2*(1-e),H); ctx.clip(); drawImageTransformed(cur,progress); ctx.restore(); break;
        case 'merge':
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath();
          ctx.rect(0, 0, W/2*e, H);
          ctx.rect(W - W/2*e, 0, W/2*e, H);
          ctx.clip(); drawImageTransformed(nxt, 0); ctx.restore(); break;

        // Круги
        case 'iris':
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath(); ctx.arc(W/2,H/2, Math.hypot(W,H)/2*e, 0, Math.PI*2); ctx.clip(); drawImageTransformed(nxt,0); ctx.restore(); break;
        case 'irisIn':
          drawImageTransformed(nxt, 0);
          ctx.save(); ctx.beginPath(); ctx.arc(W/2,H/2, Math.hypot(W,H)/2*(1-e), 0, Math.PI*2); ctx.clip(); drawImageTransformed(cur,progress); ctx.restore(); break;

        // Масштабирование (Zoom In / Zoom Out / Zoom Blur)
        case 'zoomIn':
          drawImageTransformed(cur, progress, 1 - e, { scale: 1 + e*0.6 });
          drawImageTransformed(nxt, 0, e); break;
        case 'zoomOut':
          drawImageTransformed(cur, progress, 1 - e, { scale: 1 - e*0.4 });
          drawImageTransformed(nxt, 0, e, { scale: 0.6 + e*0.4 }); break;
        case 'zoomBlur':
          drawImageTransformed(cur, progress, 1 - e, { scale: 1 + e*0.5, blur: e*12 });
          drawImageTransformed(nxt, 0, e, { blur: (1-e)*12 }); break;

        // Жалюзи (Горизонтальные и Вертикальные)
        case 'blinds': {
          drawImageTransformed(cur, progress);
          const strips = 8, sh = H/strips;
          ctx.save();
          for (let i=0;i<strips;i++){ ctx.beginPath(); ctx.rect(0, i*sh, W, sh*e); }
          ctx.clip(); drawImageTransformed(nxt,0); ctx.restore(); break;
        }
        case 'blindsV': {
          drawImageTransformed(cur, progress);
          const strips = 10, sw = W/strips;
          ctx.save();
          for (let i=0;i<strips;i++){ ctx.beginPath(); ctx.rect(i*sw, 0, sw*e, H); }
          ctx.clip(); drawImageTransformed(nxt,0); ctx.restore(); break;
        }

        // Диагонали (↘ и ↙)
        case 'diagonal': {
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath();
          const d = (W+H)*e;
          ctx.moveTo(0,0); ctx.lineTo(d,0); ctx.lineTo(0,d); ctx.closePath(); ctx.clip();
          drawImageTransformed(nxt,0); ctx.restore(); break;
        }
        case 'diagonalR': {
          drawImageTransformed(cur, progress);
          ctx.save(); ctx.beginPath();
          const d = (W+H)*e;
          ctx.moveTo(W,0); ctx.lineTo(W-d,0); ctx.lineTo(W,d); ctx.closePath(); ctx.clip();
          drawImageTransformed(nxt,0); ctx.restore(); break;
        }

        // Повороты (По часовой и Против часовой)
        case 'rotate':
          drawImageTransformed(cur, progress, 1 - e, { rot: e*0.4, scale: 1 - e*0.2 });
          drawImageTransformed(nxt, 0, e, { rot: (1-e)*-0.4, scale: 1 - (1-e)*0.2 }); break;
        case 'rotateCCW':
          drawImageTransformed(cur, progress, 1 - e, { rot: -e*0.4, scale: 1 - e*0.2 });
          drawImageTransformed(nxt, 0, e, { rot: (1-e)*0.4, scale: 1 - (1-e)*0.2 }); break;

        default:
          drawImageTransformed(cur, progress, 1 - e);
          drawImageTransformed(nxt, 0, e);
      }
    }

    function drawTextOverlay(globalT, clipStart, currentItem, localTime, W, H) {
      if (!state.text.title && !state.text.subtitle) return;
      // entrance animation: fade in over first 0.6s of the clip
      let alpha = 1;
      if (state.text.anim) {
        const introDur = 0.6;
        alpha = Math.min(1, localTime / introDur);
      }
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      const y = H * state.text.pos;
      if (state.text.bg) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        const boxH = H * 0.18;
        ctx.fillRect(W * 0.06, y - state.text.size, W * 0.88, boxH + state.text.size*0.4);
      }
      ctx.fillStyle = state.text.color;
      ctx.font = `bold ${state.text.size}px Inter, sans-serif`;
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
      ctx.fillText(state.text.title, W / 2, y);
      if (state.text.subtitle) {
        ctx.font = `${state.text.size * 0.5}px Inter, sans-serif`;
        ctx.fillText(state.text.subtitle, W / 2, y + state.text.size * 0.9);
      }
      ctx.restore();
    }

    // ===================== Playback (rAF based) =====================
    function loop(ts) {
      if (!state.playing) return;
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;
      state.currentTime += dt;

      const total = getTotalDuration();
      // audio fade handling
      if (audioEl && state.audio) {
        const { fadeIn, fadeOut, volume } = state.audioSettings;
        let v = volume;
        if (fadeIn > 0 && state.currentTime < fadeIn) v *= state.currentTime / fadeIn;
        if (fadeOut > 0 && total - state.currentTime < fadeOut) v *= Math.max(0,(total - state.currentTime) / fadeOut);
        audioEl.volume = Math.max(0, Math.min(1, v));
      }

      if (state.currentTime >= total) {
        state.currentTime = 0;
        stopPlayback();
        drawFrame(0);
        return;
      }
      drawFrame(state.currentTime);
      updateTimelineHighlight();
      updateAudioProgress();
      rafId = requestAnimationFrame(loop);
    }

    function updateAudioProgress() {
      if (!state.audio) { $('#audioProg').style.width='0%'; return; }
      const total = getTotalDuration();
      $('#audioProg').style.width = Math.min(100, (state.currentTime / total) * 100) + '%';
    }

    function startPlayback() {
      if (!state.items.length) return;
      state.playing = true;
      $('#playBtn').innerHTML = SVGs.pause;
      lastTs = 0;
      if (audioEl && state.audio) { audioEl.currentTime = Math.min(state.currentTime, state.audio.duration); audioEl.play().catch(()=>{}); }
      rafId = requestAnimationFrame(loop);
    }
    function stopPlayback() {
      state.playing = false;
      $('#playBtn').innerHTML = SVGs.play;
      if (rafId) cancelAnimationFrame(rafId);
      if (audioEl) audioEl.pause();
      updateTimelineHighlight();
    }
    function togglePlay() { state.playing ? stopPlayback() : startPlayback(); }

    // ===================== Controls =====================
    $('#playBtn').onclick = togglePlay;
    $('#prevBtn').onclick = () => {
      if (!state.items.length) return;
      let acc = 0, idx = 0;
      for (let i=0;i<state.items.length;i++){ if (state.currentTime <= acc + state.items[i].duration + 0.001){ idx=i; break;} acc += state.items[i].duration; }
      seekToClip(Math.max(0, idx - 1));
    };
    $('#nextBtn').onclick = () => {
      if (!state.items.length) return;
      let acc = 0, idx = 0;
      for (let i=0;i<state.items.length;i++){ if (state.currentTime <= acc + state.items[i].duration - 0.001){ idx=i; break;} acc += state.items[i].duration; idx=i; }
      seekToClip(Math.min(state.items.length - 1, idx + 1));
    };

    $('#seekbar').oninput = e => {
      state.currentTime = +e.target.value;
      if (audioEl && state.audio) audioEl.currentTime = Math.min(state.currentTime, state.audio.duration);
      drawFrame(state.currentTime);
      updateTimelineHighlight();
      updateAudioProgress();
    };

    $('#magicBtn').onclick = () => {
      if (state.items.length < 2) { toast('Нужно минимум 2 кадра'); return; }
      const keys = Object.keys(transitionTypes).filter(k => k !== 'none');
      state.transitions = state.items.slice(0, -1).map((_, i) => {
        let k; do { k = keys[Math.floor(Math.random()*keys.length)]; } while (i>0 && k===state.transitions[i-1]);
        return k;
      });
      renderTimeline(); drawFrame(state.currentTime);
      toast('Случайные переходы применены');
    };

    $('#shuffleBtn').onclick = () => {
      if (state.items.length < 2) return;
      for (let i = state.items.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [state.items[i],state.items[j]]=[state.items[j],state.items[i]]; }
      renderSidebar(); renderTimeline(); drawFrame(state.currentTime); toast('Кадры перемешаны');
    };
    $('#reverseBtn').onclick = () => {
      state.items.reverse(); state.transitions.reverse();
      renderSidebar(); renderTimeline(); drawFrame(state.currentTime); toast('Порядок обратный');
    };
    $('#clearBtn').onclick = () => {
      if (!state.items.length) return;
      if (confirm('Очистить весь монтажный стол?')) {
        state.items = []; state.transitions = []; state.selectedType=null; state.selectedIndex=-1;
        state.currentTime = 0; stopPlayback();
        renderSidebar(); renderTimeline(); renderInspector(); drawFrame(0); toast('Очищено');
      }
    };

    $('#setTotalDurBtn').onclick = () => {
      if (!state.items.length) return;
      const val = prompt('Желаемая общая длительность ролика в секундах:', '30');
      if (val && +val > 0) {
        const per = +val / state.items.length;
        state.items.forEach(x => x.duration = per);
        renderTimeline(); drawFrame(state.currentTime); toast('Длительности обновлены');
      }
    };
    $('#fitAudioBtn').onclick = () => {
      if (!state.audio) { toast('Сначала загрузите аудио'); return; }
      if (!state.items.length) return;
      const per = state.audio.duration / state.items.length;
      state.items.forEach(x => x.duration = per);
      renderTimeline(); drawFrame(state.currentTime); toast('Подогнано под аудио');
    };

    $('#audioBar').onclick = (e) => { $('#audioInput').click(); };


    $$('.tab').forEach(b => {
      b.onclick = () => {

        $$('.tab').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        state.tab = b.dataset.tab;
        renderSidebar();
      };
    });

    $('#aspectRatio').onchange = resizeCanvas;
    $('#quality').onchange = resizeCanvas;
    $('#imgInput').onchange = e => { handleFiles([...e.target.files]); e.target.value=''; };
    $('#audioInput').onchange = e => { handleFiles([...e.target.files]); e.target.value=''; };

    // Snapshot current frame
    $('#snapshotBtn').onclick = () => {
      if (!state.items.length) { toast('Нет кадров'); return; }
      drawFrame(state.currentTime);
      const a = document.createElement('a');
      a.download = 'clipforge-frame.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      toast('Кадр сохранён (PNG)');
    };

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      else if (e.code === 'ArrowLeft') { e.preventDefault(); state.currentTime = Math.max(0, state.currentTime - 1); if(audioEl&&state.audio)audioEl.currentTime=Math.min(state.currentTime,state.audio.duration); drawFrame(state.currentTime); updateTimelineHighlight(); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); state.currentTime = Math.min(getTotalDuration(), state.currentTime + 1); if(audioEl&&state.audio)audioEl.currentTime=Math.min(state.currentTime,state.audio.duration); drawFrame(state.currentTime); updateTimelineHighlight(); }
      else if ((e.code === 'Delete' || e.code === 'Backspace') && state.selectedType==='clip' && state.selectedIndex>=0) { e.preventDefault(); deleteClip(state.selectedIndex); }
    });

    window.addEventListener('resize', () => { updatePlayhead(); });

    // ===================== Export =====================
    async function exportVideo() {
      if (!state.items.length) { toast('Добавьте хотя бы одно фото'); return; }
      stopPlayback();
      $('#exportModal').classList.add('show');
      $('#downloadLink').style.display = 'none';
      $('#closeExport').style.display = 'none';

      const fps = 30;
      const stream = canvas.captureStream(fps);

      // try to mix audio into export
      let audioCtx, dest;
      try {
        if (state.audio && audioEl) {
          audioCtx = new (window.AudioContext||window.webkitAudioContext)();
          const srcNode = audioCtx.createMediaElementSource(audioEl);
          dest = audioCtx.createMediaStreamDestination();
          const gain = audioCtx.createGain();
          gain.gain.value = state.audioSettings.volume;
          srcNode.connect(gain); gain.connect(dest); gain.connect(audioCtx.destination);
          dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
        }
      } catch(err) { /* audio mixing may fail on reused element — ignore, export video-only */ }

      let recorder;
      try { recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' }); }
      catch { recorder = new MediaRecorder(stream, { mimeType: 'video/webm' }); }

      const chunks = [];
      recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
      const done = new Promise(r => recorder.onstop = r);

      recorder.start();
      const total = getTotalDuration();
      const totalFrames = Math.ceil(total * fps);
      if (audioEl && state.audio) { audioEl.currentTime = 0; audioEl.play().catch(()=>{}); }

      for (let f = 0; f < totalFrames; f++) {
        const t = f / fps;
        // audio fade during export
        if (audioEl && state.audio) {
          const { fadeIn, fadeOut, volume } = state.audioSettings;
          let v = volume;
          if (fadeIn>0 && t<fadeIn) v *= t/fadeIn;
          if (fadeOut>0 && total-t<fadeOut) v *= Math.max(0,(total-t)/fadeOut);
          audioEl.volume = Math.max(0,Math.min(1,v));
        }
        drawFrame(t);
        const pct = Math.round((f / totalFrames) * 100);
        $('#progressBar').style.width = pct + '%';
        $('#exportPercent').textContent = pct + '%';
        $('#exportStatus').textContent = `Рендеринг кадра ${f + 1} из ${totalFrames}`;
        await new Promise(r => setTimeout(r, 1000 / fps * 0.6));
      }

      recorder.stop();
      if (audioEl) audioEl.pause();
      await done;
      if (audioCtx) try { await audioCtx.close(); } catch{}

      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      $('#exportStatus').textContent = 'Готово! Видео успешно собрано.';
      $('#progressBar').style.width = '100%';
      $('#exportPercent').textContent = '100%';
      $('#downloadLink').href = url;
      $('#downloadLink').style.display = 'inline-flex';
      $('#closeExport').style.display = 'inline-flex';
    }

    $('#exportBtn').onclick = exportVideo;
    $('#closeExport').onclick = () => $('#exportModal').classList.remove('show');

    // ===================== Init =====================
    initStaticIcons();
    renderSidebar();
    renderTimeline();
    resizeCanvas();
  </script>
</body>
</html>
